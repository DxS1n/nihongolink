<\/b> (pulihnya martabat & hak sebagai manusia). <b>ソーシャル・インクルージョン<\/b> = merangkul semua orang dari isolasi. <b>ナショナルミニマム<\/b> = standar hidup minimum yang dijamin negara. <b>アドボカシー<\/b> = membela/menyuarakan hak.","<b>ユニバーサルデザイン<\/b>: dirancang agar <b>semua orang<\/b> mudah memakai (7 prinsip: adil, fleksibel, sederhana, info mudah dipahami, kesalahan tidak berbahaya, tenaga kecil, ukuran & ruang cukup). Beda dengan バリアフリー yang <b>menghilangkan<\/b> hambatan yang sudah ada.","<b>フランクル<\/b>: 3 nilai — 創造価値 (berkarya), 体験価値 (mengalami), <b>態度価値<\/b> (sikap saat hidup terbatas). <b>メイヤロフ<\/b> 『ケアの本質』: merawat = membantu orang itu tumbuh dan mewujudkan dirinya.","Sejarah: 1960-an akhir <b>IL運動<\/b> (Ed Roberts, menghormati keputusan sendiri) → 1971 deklarasi hak disabilitas intelektual → 1975 deklarasi hak penyandang disabilitas → 1981 国際障害者年 (完全参加と平等) → 1990 <b>ADA<\/b> (AS) → 2006 <b>障害者権利条約<\/b> (Jepang ratifikasi Januari 2014; 'Nothing about us without us'; 合理的配慮 pertama kali di perjanjian internasional).","UUD Jepang diumumkan 3 November 1946. <b>Pasal 13<\/b>: dihormati sebagai individu, hak mengejar kebahagiaan. <b>Pasal 14<\/b>: sama di depan hukum. <b>Pasal 25<\/b>: <b>生存権<\/b> — hidup sehat dan berbudaya minimum.","Kasus pengadilan Pasal 25: <b>朝日訴訟<\/b> (apakah standar 生活扶助 cukup untuk hidup minimum; disebut 人間裁判) · <b>堀木訴訟<\/b> (larangan menerima 障害福祉年金 + 児童扶養手当 bersamaan)."],"tip":"Pasangan tokoh–ide paling sering diuji: Bank-Mikkelsen = Denmark 1959 · Nirje = 8 prinsip · Wolfensberger = SRV · Ed Roberts = IL運動 · Frankl = 態度価値 · Mayeroff = ケアの本質.","tabs":[{"cap":"Tokoh & idenya","h":["Tokoh","Negara","Ide / karya"],"r":[["バンク-ミケルセン","Denmark","Bapak normalisasi; UU 1959"],["ニィリエ","Swedia","8 prinsip normalisasi"],["ヴォルフェンスベルガー","AS","Social Role Valorization"],["糸賀一雄","Jepang","『この子らを世の光に』, 発達保障"],["エド・ロバーツ","AS","自立生活運動 (IL運動), 1960-an"],["フランクル","Austria","創造価値・体験価値・態度価値"],["メイヤロフ","AS","『ケアの本質』"]]},{"cap":"Sejarah hak penyandang disabilitas","h":["Tahun","Peristiwa","Kata kunci"],"r":[["1960-an akhir","自立生活運動 (IL運動)","自己決定の尊重"],["1971","知的障害者の権利宣言 (PBB ke-26)","Hak setara dengan orang lain"],["1975","障害者の権利宣言 (PBB ke-30)","Hak sama dengan warga seusia"],["1981","国際障害者年","完全参加と平等"],["1990","ADA (AS)","Larangan diskriminasi kerja & pendidikan"],["2006","障害者の権利に関する条約","Jepang ratifikasi 2014.1; 合理的配慮"]]},{"cap":"Pasal UUD yang perlu dihafal","h":["Pasal","Isi"],"r":[["11条","Hak asasi abadi, tidak boleh dilanggar"],["13条","Dihormati sebagai individu; hak hidup, bebas, mengejar kebahagiaan"],["14条","Sama di depan hukum (ras, keyakinan, jenis kelamin, status sosial)"],["19条","Kebebasan berpikir & hati nurani"],["24条","Martabat individu & kesetaraan gender dalam keluarga"],["25条","生存権: hidup sehat & berbudaya minimum; kewajiban negara"]]}],"voc":[["尊厳","そんげん","martabat"],["人権","じんけん","hak asasi"],["自己決定","じこけってい","keputusan sendiri"],["全人間的復権","ぜんにんげんてきふっけん","pemulihan martabat seutuhnya"],["社会的包摂","しゃかいてきほうせつ","inklusi sosial"],["権利擁護","けんりようご","advokasi hak"],["幸福追求権","こうふくついきゅうけん","hak mengejar kebahagiaan"],["生存権","せいぞんけん","hak hidup layak"],["法の下の平等","ほうのもとのびょうどう","kesetaraan di depan hukum"],["批准","ひじゅん","ratifikasi"],["態度価値","たいどかち","nilai sikap"],["訴訟","そしょう","gugatan"]],"quiz":[["{{自立生活|じりつせいかつ}}の{{考|かんが}}え{{方|かた}}では、{{介助|かいじょ}}を{{受|う}}けていても{{自|みずか}}ら{{選択|せんたく}}し{{行動|こうどう}}していれば{{自立|じりつ}}しているとする。",1,"Menurut ide hidup mandiri, walau dibantu, kalau memilih sendiri itu mandiri.","Benar."],["バンク-ミケルセンは、ノーマライゼーションの8つの{{原理|げんり}}をまとめた。",0,"Bank-Mikkelsen merumuskan 8 prinsip normalisasi.","Salah. 8 prinsip = ニィリエ. Bank-Mikkelsen terkait UU Denmark 1959."],["ノーマライゼーションの{{原理|げんり}}が{{世界|せかい}}で{{初|はじ}}めて{{入|はい}}った{{法律|ほうりつ}}は、デンマークの1959{{年法|ねんほう}}である。",1,"UU pertama dengan prinsip normalisasi: UU Denmark 1959.","Benar."],["ソーシャルロール・バロリゼーションを{{提唱|ていしょう}}したのは、ヴォルフェンスベルガーである。",1,"Social Role Valorization diusulkan Wolfensberger.","Benar."],["{{自立生活運動|じりつせいかつうんどう}}(IL{{運動|うんどう}})は、エド・ロバーツらによって{{始|はじ}}められた。",1,"Gerakan hidup mandiri dimulai oleh Ed Roberts dkk.","Benar."],["リハビリテーションとは、{{身体機能|しんたいきのう}}の{{回復|かいふく}}だけを{{目指|めざ}}すものである。",0,"Rehabilitasi hanya bertujuan memulihkan fungsi tubuh.","Salah. Tujuannya 全人間的復権 — fisik, mental, sosial, vokasional."],["バリアフリーとは、{{最初|さいしょ}}からすべての{{人|ひと}}が{{使|つか}}いやすいようにデザインすることである。",0,"Barrier free = merancang dari awal agar semua orang mudah memakai.","Salah. Itu ユニバーサルデザイン. バリアフリー = menghilangkan hambatan."],["フランクルの{{態度価値|たいどかち}}とは、{{生命|せいめい}}が{{制限|せいげん}}される{{状況|じょうきょう}}においてどのような{{態度|たいど}}をとるかによって{{実現|じつげん}}される{{価値|かち}}である。",1,"Nilai sikap Frankl: nilai yang terwujud lewat sikap saat hidup terbatas.","Benar."],["{{日本|にほん}}は2014{{年|ねん}}に{{障害者|しょうがいしゃ}}の{{権利|けんり}}に{{関|かん}}する{{条約|じょうやく}}を{{批准|ひじゅん}}した。",1,"Jepang meratifikasi Konvensi Hak Penyandang Disabilitas tahun 2014.","Benar (Januari 2014)."],["{{国際障害者年|こくさいしょうがいしゃねん}}のテーマは「ノーマライゼーション」である。",0,"Tema Tahun Internasional Penyandang Disabilitas adalah normalisasi.","Salah. Temanya 完全参加と平等 (1981)."],["{{日本国憲法第|にほんこくけんぽうだい}}25{{条|じょう}}は、{{幸福追求権|こうふくついきゅうけん}}を{{定|さだ}}めている。",0,"Pasal 25 mengatur hak mengejar kebahagiaan.","Salah. 幸福追求権 = Pasal 13. Pasal 25 = 生存権."],["{{朝日訴訟|あさひそしょう}}は、{{生活扶助基準|せいかつふじょきじゅん}}が{{健康|けんこう}}で{{文化的|ぶんかてき}}な{{最低限度|さいていげんど}}の{{生活|せいかつ}}を{{維持|いじ}}できるかが{{争|あらそ}}われた{{裁判|さいばん}}である。",1,"Gugatan Asahi mempersoalkan apakah standar bantuan cukup untuk hidup minimum.","Benar."],["ナショナルミニマムとは、{{国|くに}}が{{国民|こくみん}}に{{保障|ほしょう}}する{{最低生活水準|さいていせいかつすいじゅん}}をいう。",1,"National minimum = standar hidup minimum yang dijamin negara.","Benar."]],"qj":{"i":"{{障害|しょうがい}}がある{{人|ひと}}も、ほかの{{人|ひと}}と{{同|おな}}じように{{普通|ふつう}}に{{暮|く}}らす{{権利|けんり}}があります。{{変|か}}えるべきなのは{{本人|ほんにん}}ではなく、{{社会|しゃかい}}のしくみです。","w":[["ノーマライゼーション","","{{障害|しょうがい}}のある{{人|ひと}}が{{地域|ちいき}}で{{普通|ふつう}}に{{暮|く}}らせるように、{{社会|しゃかい}}のしくみを{{変|か}}える{{考|かんが}}え{{方|かた}}。"],["自己決定","じこけってい","{{自分|じぶん}}のことを{{自分|じぶん}}で{{決|き}}めること。"]],"ti":"Penyandang disabilitas juga berhak hidup normal seperti orang lain. Yang harus diubah bukan orangnya, melainkan sistem masyarakatnya.","tw":["Gagasan mengubah sistem masyarakat agar penyandang disabilitas bisa hidup normal di lingkungannya.","Memutuskan sendiri hal-hal tentang diri sendiri."]}},"yougo":{"jp":"権利擁護","t":"Perlindungan hak (wali & dukungan kemandirian)","hal":"35–39","intro":"Dua sistem utama untuk orang yang kemampuan menilainya kurang: <b>成年後見制度<\/b> (UU Perdata, lewat pengadilan) dan <b>日常生活自立支援事業<\/b> (UU Kesejahteraan Sosial, lewat 社協). Bedakan keduanya.","pts":["成年後見制度 = <b>法定後見<\/b> (kemampuan sudah kurang) + <b>任意後見<\/b> (masih sehat, memilih wali untuk masa depan). Permohonan ke <b>家庭裁判所<\/b>.","Tiga tingkat 法定後見: <b>後見<\/b> (kemampuan menilai hampir selalu tidak ada) · <b>保佐<\/b> (sangat kurang) · <b>補助<\/b> (kurang). Persetujuan orang itu: tidak perlu untuk 後見・保佐, <b>perlu untuk 補助<\/b>.","Yang boleh mengajukan: orang itu sendiri, pasangan, kerabat sampai <b>4親等<\/b>, jaksa, <b>wali kota (市町村長)<\/b>. Wali boleh pengacara, ahli, bahkan badan hukum.","Tugas wali = tindakan hukum: <b>財産管理<\/b> (aset) dan <b>身上監護<\/b> (kontrak kaigo, masuk RS/panti). <b>Perawatan fisik (介護行為) tidak termasuk.<\/b>","Revisi 民法 diumumkan 24 Juni 2026: 後見 & 保佐 dihapus, <b>disatukan ke 補助<\/b>, bisa dipakai seperlunya (spot). Berlaku dalam 2 tahun 6 bulan.","任意後見: kontrak dibuat dengan <b>公正証書<\/b> di kantor notaris, didaftarkan ke 法務局. Saat kemampuan menurun → ajukan <b>任意後見監督人<\/b> ke 家庭裁判所.","Data 2025: permohonan terbanyak <b>後見開始<\/b> (29.233). Pemohon terbanyak <b>orang itu sendiri<\/b> (24,8%), disusul 市区町村長 (23,7%). Wali dari luar keluarga ±80%; terbanyak <b>司法書士<\/b>.","<b>日常生活自立支援事業<\/b>: pelaksana <b>社会福祉協議会<\/b> prefektur & 指定都市 (sebagian diserahkan ke 社協 kota). Untuk yang kemampuannya kurang <b>tetapi masih bisa memahami isi kontrak<\/b>.","Petugas: <b>専門員<\/b> (buat rencana dukungan; umumnya 社会福祉士/精神保健福祉士) dan <b>生活支援員<\/b> (bantu sesuai rencana). Isi: bantuan memakai layanan, kelola uang harian, simpan dokumen (tabungan ≤50 man yen). Biaya ±1.200 yen per kunjungan.","Keduanya tetap bisa dipakai saat <b>masuk RS atau panti<\/b>, dan bisa dipakai bersamaan.","Keberatan & keluhan: <b>審査請求<\/b> dalam <b>3 bulan<\/b> sejak tahu ada keputusan. Keluhan layanan kaigo → <b>国保連<\/b> (介護サービス苦情処理委員会). Keluhan layanan kesejahteraan → <b>運営適正化委員会<\/b> di 社協 prefektur."],"tip":"Jebakan klasik: wali (後見人) TIDAK melakukan perawatan fisik. Dan untuk 補助 perlu persetujuan orang itu.","tabs":[{"cap":"成年後見制度 vs 日常生活自立支援事業","h":["Hal","成年後見制度","日常生活自立支援事業"],"r":[["UU","民法","社会福祉法"],["Kementerian","法務省","厚生労働省"],["Lembaga","家庭裁判所","社協 prefektur & 指定都市"],["Sasaran","後見・保佐・補助","Kemampuan kurang tapi paham isi kontrak"],["Cara mulai","Permohonan ke pengadilan","Konsultasi & kontrak dengan 社協 kota"],["Cek kemampuan","Surat ahli/diagnosis dokter","契約締結判定ガイドライン; ragu → 契約締結審査会"],["Pembantu","後見人・保佐人・補助人・任意後見人","専門員・生活支援員"],["Isi bantuan","財産管理 + 身上監護","Bantuan layanan, uang harian, simpan dokumen"],["Biaya","Dari harta orang itu","Sebelum kontrak gratis; setelahnya bayar"]]},{"cap":"Tiga tingkat 法定後見","h":["","後見","保佐","補助"],"r":[["Kemampuan","Hampir selalu tidak ada","Sangat kurang","Kurang"],["Hak mewakili","Semua tindakan hukum soal harta","Tindakan tertentu yang ditetapkan pengadilan","Tindakan tertentu yang ditetapkan pengadilan"],["Persetujuan orang itu","Tidak perlu","Tidak perlu","Perlu"]]},{"cap":"Ke mana mengajukan keberatan","h":["Lembaga","Untuk"],"r":[["介護保険審査会","Keputusan 要介護認定, tunjangan, premi 介護保険"],["国民健康保険審査会","Keputusan soal 国保"],["都道府県知事","Keputusan wali kota (mis. 生活保護)"],["障害者介護給付費等不服審査会","Keputusan 障害支援区分 & layanan 総合支援法"],["介護サービス苦情処理委員会 (国保連)","Keluhan terhadap penyedia layanan kaigo"],["運営適正化委員会 (都道府県社協)","Keluhan layanan kesejahteraan"],["苦情解決責任者","Penanggung jawab keluhan di tiap fasilitas"]]}],"voc":[["成年後見制度","せいねんこうけんせいど","sistem perwalian dewasa"],["家庭裁判所","かていさいばんしょ","pengadilan keluarga"],["後見人","こうけんにん","wali"],["保佐","ほさ","pengampuan"],["補助","ほじょ","bantuan (tingkat ringan)"],["任意後見","にんいこうけん","perwalian sukarela"],["公正証書","こうせいしょうしょ","akta notaris"],["財産管理","ざいさんかんり","pengelolaan harta"],["身上監護","しんじょうかんご","pengurusan diri (kontrak hidup)"],["社会福祉協議会","しゃかいふくしきょうぎかい","dewan kesejahteraan sosial"],["生活支援員","せいかつしえんいん","pendamping hidup"],["苦情解決","くじょうかいけつ","penyelesaian keluhan"]],"quiz":[["{{成年後見制度|せいねんこうけんせいど}}の{{申立|もうした}}ては、{{家庭裁判所|かていさいばんしょ}}に{{対|たい}}して{{行|おこな}}う。",1,"Permohonan perwalian dewasa diajukan ke pengadilan keluarga.","Benar."],["{{補助開始|ほじょかいし}}の{{審判|しんぱん}}には、{{本人|ほんにん}}の{{同意|どうい}}が{{必要|ひつよう}}である。",1,"Untuk 補助 perlu persetujuan orang itu.","Benar. 後見・保佐 tidak perlu."],["{{成年後見人|せいねんこうけんにん}}の{{職務|しょくむ}}には、{{食事|しょくじ}}や{{入浴|にゅうよく}}などの{{介護行為|かいごこうい}}が{{含|ふく}}まれる。",0,"Tugas wali termasuk merawat makan & mandi.","Salah. 介護行為は含まれない; tugasnya tindakan hukum (harta & kontrak)."],["{{市町村長|しちょうそんちょう}}は、{{成年後見開始|せいねんこうけんかいし}}の{{審判|しんぱん}}を{{請求|せいきゅう}}することができる。",1,"Wali kota bisa mengajukan permohonan perwalian.","Benar."],["{{任意後見契約|にんいこうけんけいやく}}は、{{公正証書|こうせいしょうしょ}}によって{{締結|ていけつ}}する。",1,"Kontrak perwalian sukarela dibuat dengan akta notaris.","Benar."],["{{成年後見人等|せいねんこうけんにんとう}}には、{{親族|しんぞく}}しかなることができない。",0,"Hanya kerabat yang bisa jadi wali.","Salah. Profesional dan badan hukum juga bisa; ±80% wali bukan kerabat."],["2025{{年|ねん}}の{{成年後見人等|せいねんこうけんにんとう}}で{{最|もっと}}も{{多|おお}}いのは、{{弁護士|べんごし}}である。",0,"Wali terbanyak tahun 2025 adalah pengacara.","Salah. Terbanyak 司法書士 (28,0%)."],["{{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}}の{{実施主体|じっししゅたい}}は、{{都道府県|とどうふけん}}・{{指定都市社会福祉協議会|していとししゃかいふくしきょうぎかい}}である。",1,"Pelaksana program kemandirian hidup adalah 社協 prefektur & 指定都市.","Benar."],["{{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}}は、{{契約内容|けいやくないよう}}を{{判断|はんだん}}する{{能力|のうりょく}}がない{{人|ひと}}も{{利用|りよう}}できる。",0,"Program ini bisa dipakai orang yang sama sekali tidak bisa memahami kontrak.","Salah. Harus masih mampu memahami isi kontrak; kalau tidak → 成年後見制度."],["{{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}}の{{支援計画|しえんけいかく}}は、{{専門員|せんもんいん}}が{{作成|さくせい}}する。",1,"Rencana dukungan dibuat oleh 専門員.","Benar."],["{{施設|しせつ}}に{{入所|にゅうしょ}}すると、{{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}}は{{利用|りよう}}できなくなる。",0,"Setelah masuk panti, program ini tidak bisa dipakai.","Salah. Tetap bisa dipakai saat masuk RS/panti."],["{{審査請求|しんさせいきゅう}}は、{{処分|しょぶん}}があったことを{{知|し}}った{{日|ひ}}の{{翌日|よくじつ}}から3か{{月以内|げついない}}に{{行|おこな}}う。",1,"Permohonan peninjauan dalam 3 bulan sejak hari berikutnya mengetahui keputusan.","Benar."],["{{介護|かいご}}サービス{{事業者|じぎょうしゃ}}に{{対|たい}}する{{苦情|くじょう}}は、{{国民健康保険団体連合会|こくみんけんこうほけんだんたいれんごうかい}}で{{受|う}}け{{付|つ}}ける。",1,"Keluhan atas penyedia layanan kaigo diterima 国保連.","Benar (介護サービス苦情処理委員会)."]],"qj":{"i":"{{判断|はんだん}}する{{力|ちから}}が{{弱|よわ}}くなった{{人|ひと}}のために、お{{金|かね}}や{{契約|けいやく}}のことを{{手伝|てつだ}}う{{人|ひと}}がいます。{{体|からだ}}の{{介護|かいご}}はしません。","w":[["成年後見制度","せいねんこうけんせいど","{{判断能力|はんだんのうりょく}}が{{不十分|ふじゅうぶん}}な{{人|ひと}}の{{財産|ざいさん}}や{{契約|けいやく}}を{{守|まも}}るしくみ。{{家庭裁判所|かていさいばんしょ}}に{{申|もう}}し{{立|た}}てる。"],["身上監護","しんじょうかんご","{{施設|しせつ}}の{{入所|にゅうしょ}}{{契約|けいやく}}など、{{生活|せいかつ}}に{{関|かん}}する{{手続|てつづ}}きをすること。"]],"ti":"Untuk orang yang kemampuan menilainya melemah, ada orang yang membantu urusan uang dan kontrak. Mereka tidak melakukan perawatan fisik.","tw":["Sistem untuk melindungi harta dan kontrak orang yang kemampuan menilainya kurang. Diajukan ke pengadilan keluarga.","Mengurus prosedur terkait kehidupan, seperti kontrak masuk fasilitas."]}},"gyakutai":{"jp":"虐待","t":"Kekerasan & penelantaran","hal":"40–46","intro":"Ada 4 UU: lansia, disabilitas, anak, dan KDRT (DV). Hafalkan <b>tabel perbandingannya<\/b> — terutama siapa wajib lapor dan ke mana.","pts":["<b>高齢者虐待防止法<\/b> (2006): lansia = 65+. Pelaku: ① 養護者 (keluarga/pengasuh) ② 養介護施設従事者等 (staf fasilitas/layanan kaigo).","5 jenis kekerasan lansia & disabilitas: <b>身体的<\/b> · <b>心理的<\/b> · <b>性的<\/b> · <b>介護等放棄 (neglect)<\/b> · <b>経済的<\/b>. Anak hanya 4 jenis (tanpa ekonomi).","Lapor oleh 養護者: jika <b>nyawa/tubuh dalam bahaya besar → wajib<\/b> lapor ke 市町村; selain itu <b>usaha (努力義務)<\/b>. Staf fasilitas yang menemukan kekerasan oleh staf → <b>wajib<\/b> lapor.","Pelapor tidak melanggar kewajiban rahasia, dan staf tidak boleh dipecat karena melapor. 市町村 bisa minta bantuan <b>警察署長<\/b> saat 立入調査.","Data lansia 2024: oleh keluarga terbanyak <b>身体的 (64%)<\/b>; korban 76% wanita; pelaku terbanyak <b>息子<\/b> (39%); pelapor terbanyak <b>警察<\/b>. Oleh staf: terbanyak di <b>特養<\/b> (29%).","<b>障害者虐待防止法<\/b> (2012): pelaku ① 養護者 ② staf fasilitas disabilitas ③ <b>使用者<\/b> (pemberi kerja). Semua penemu <b>wajib<\/b> lapor. Kekerasan oleh pemberi kerja → lapor ke <b>市町村 atau 都道府県<\/b>.","Data disabilitas: oleh keluarga terbanyak 身体的 (66%), pelaku 母 & 父; oleh staf terbanyak di <b>共同生活援助<\/b> (group home); pemberi kerja → mayoritas lapor sendiri (51%).","<b>児童虐待防止法<\/b> (2000): anak di bawah 18. Laporan ke 児童相談所 223.691 kasus (2024); terbanyak <b>心理的虐待<\/b> (60%). Siapa pun yang menemukan → <b>wajib memberi tahu (通告)<\/b> 市町村/福祉事務所/児童相談所. Orang tua dilarang menghukum fisik.","<b>DV防止法<\/b> (2001): termasuk pasangan tanpa nikah resmi dan pacar yang tinggal serumah. Penemu kekerasan fisik → <b>usaha<\/b> lapor ke 配偶者暴力相談支援センター atau polisi. Pengadilan negeri bisa keluarkan <b>保護命令<\/b> (larangan mendekat, perintah keluar rumah)."],"tip":"Lansia: lapor wajib hanya bila bahaya besar bagi nyawa/tubuh. Disabilitas & anak: selalu wajib. DV: hanya usaha (努力義務).","tabs":[{"cap":"Perbandingan 4 UU kekerasan","h":["Hal","高齢者 (2006)","障害者 (2012)","児童 (2000)","DV (2001)"],"r":[["Sasaran","65+","身体・知的・精神 (+発達)","Anak <18","Korban kekerasan pasangan"],["Jenis","5 (ada 経済的)","5 (ada 経済的)","4 (tanpa 経済的)","Kekerasan fisik / ucapan merugikan"],["Penemu","Bahaya besar → wajib; lainnya usaha","Wajib","Wajib 通告","Usaha (hanya fisik)"],["Lapor ke","市町村 (boleh lewat 地域包括)","市町村 / 都道府県","児童相談所・市町村","配偶者暴力相談支援センター, polisi"],["Perlindungan","Panti singkat oleh 市町村","Fasilitas disabilitas oleh 市町村","一時保護 oleh 児童相談所","女性相談支援センター dll."],["Tindakan","Batasi kunjungan; 成年後見 oleh wali kota","Batasi kunjungan; 成年後見","Batasi kunjungan, larangan mendekat, cabut hak asuh","保護命令 pengadilan negeri"]]},{"cap":"Data kekerasan (tahun fiskal 2024)","h":["Kategori","Jenis terbanyak","Ciri lain"],"r":[["Lansia oleh keluarga","身体的 64%","Korban wanita 76%; pelaku 息子 39%; pelapor 警察 36%"],["Lansia oleh staf","身体的 51%","特養 29%, 有料老人ホーム 28%"],["Disabilitas oleh keluarga","身体的 66%","Korban wanita 64%; 精神障害 terbanyak"],["Disabilitas oleh staf","身体的 52%","Korban pria 66%; 知的障害; 共同生活援助 32%"],["Anak (児童相談所)","心理的 60%","223.691 kasus; jalur 警察 52%"],["DV","—","±12,8 man konsultasi; korban wanita 97%"]]}],"voc":[["虐待","ぎゃくたい","kekerasan/penganiayaan"],["養護者","ようごしゃ","pengasuh (keluarga)"],["身体的虐待","しんたいてきぎゃくたい","kekerasan fisik"],["心理的虐待","しんりてきぎゃくたい","kekerasan psikis"],["介護等放棄","かいごとうほうき","penelantaran (neglect)"],["経済的虐待","けいざいてきぎゃくたい","kekerasan ekonomi"],["通報義務","つうほうぎむ","kewajiban melapor"],["守秘義務","しゅひぎむ","kewajiban menjaga rahasia"],["立入調査","たちいりちょうさ","investigasi di tempat"],["使用者","しようしゃ","pemberi kerja"],["通告","つうこく","pemberitahuan resmi"],["保護命令","ほごめいれい","perintah perlindungan"]],"quiz":[["{{高齢者虐待防止法|こうれいしゃぎゃくたいぼうしほう}}でいう{{高齢者|こうれいしゃ}}とは、65{{歳以上|さいいじょう}}の{{者|しゃ}}をいう。",1,"Lansia menurut UU = 65+.","Benar."],["{{養護者|ようごしゃ}}による{{高齢者虐待|こうれいしゃぎゃくたい}}を{{発見|はっけん}}した{{者|もの}}は、どのような{{場合|ばあい}}でも{{市町村|しちょうそん}}への{{通報|つうほう}}が{{義務|ぎむ}}である。",0,"Penemu kekerasan oleh keluarga selalu wajib lapor.","Salah. Wajib hanya bila nyawa/tubuh dalam bahaya besar; selain itu 努力義務."],["{{養介護施設従事者等|ようかいごしせつじゅうじしゃとう}}は、{{施設内|しせつない}}での{{虐待|ぎゃくたい}}を{{受|う}}けたと{{思|おも}}われる{{高齢者|こうれいしゃ}}を{{発見|はっけん}}した{{場合|ばあい}}、{{市町村|しちょうそん}}に{{通報|つうほう}}しなければならない。",1,"Staf fasilitas wajib lapor bila menemukan kekerasan oleh staf.","Benar."],["{{虐待|ぎゃくたい}}の{{通報|つうほう}}をした{{施設職員|しせつしょくいん}}は、{{通報|つうほう}}を{{理由|りゆう}}に{{解雇|かいこ}}されることがある。",0,"Staf yang melapor bisa dipecat karena melapor.","Salah. Dilindungi: tidak boleh dipecat atau diperlakukan merugikan."],["{{養護者|ようごしゃ}}による{{高齢者虐待|こうれいしゃぎゃくたい}}で{{最|もっと}}も{{多|おお}}い{{種類|しゅるい}}は、{{心理的虐待|しんりてきぎゃくたい}}である。",0,"Jenis terbanyak oleh keluarga adalah psikis.","Salah. Terbanyak 身体的虐待 (64%)."],["{{養護者|ようごしゃ}}による{{高齢者虐待|こうれいしゃぎゃくたい}}の{{虐待者|ぎゃくたいしゃ}}の{{続柄|つづきがら}}で{{最|もっと}}も{{多|おお}}いのは、{{息子|むすこ}}である。",1,"Pelaku terbanyak adalah anak laki-laki.","Benar (39%)."],["{{児童虐待防止法|じどうぎゃくたいぼうしほう}}では、{{経済的虐待|けいざいてきぎゃくたい}}も{{虐待|ぎゃくたい}}の{{種類|しゅるい}}に{{含|ふく}}まれる。",0,"UU anak juga memasukkan kekerasan ekonomi.","Salah. Anak = 4 jenis, tanpa 経済的."],["{{児童相談所|じどうそうだんじょ}}の{{児童虐待相談|じどうぎゃくたいそうだん}}で{{最|もっと}}も{{多|おお}}いのは、{{心理的虐待|しんりてきぎゃくたい}}である。",1,"Konsultasi kekerasan anak terbanyak: psikis.","Benar (60%)."],["{{使用者|しようしゃ}}による{{障害者虐待|しょうがいしゃぎゃくたい}}を{{発見|はっけん}}した{{者|もの}}は、{{市町村|しちょうそん}}または{{都道府県|とどうふけん}}に{{通報|つうほう}}しなければならない。",1,"Kekerasan oleh pemberi kerja dilaporkan ke 市町村 atau 都道府県.","Benar."],["{{障害者福祉施設従事者等|しょうがいしゃふくししせつじゅうじしゃとう}}による{{虐待|ぎゃくたい}}が{{認|みと}}められた{{施設|しせつ}}で{{最|もっと}}も{{多|おお}}いのは、{{共同生活援助|きょうどうせいかつえんじょ}}である。",1,"Fasilitas dengan kekerasan oleh staf terbanyak: group home.","Benar (32%)."],["{{配偶者|はいぐうしゃ}}からの{{身体|しんたい}}に{{対|たい}}する{{暴力|ぼうりょく}}を{{発見|はっけん}}した{{者|もの}}には、{{通報義務|つうほうぎむ}}がある。",0,"Penemu kekerasan fisik pasangan wajib lapor.","Salah. Hanya 努力義務 (usaha) ke センター atau polisi."],["{{市町村|しちょうそん}}は、{{高齢者虐待|こうれいしゃぎゃくたい}}の{{立入調査|たちいりちょうさ}}の{{際|さい}}、{{必要|ひつよう}}に{{応|おう}}じて{{警察署長|けいさつしょちょう}}に{{援助|えんじょ}}を{{求|もと}}めることができる。",1,"市町村 bisa minta bantuan kepala polisi saat investigasi.","Benar."]],"qj":{"i":"{{虐待|ぎゃくたい}}は、たたくことだけではありません。どなる、{{放|ほう}}っておく、お{{金|かね}}を{{勝手|かって}}に{{使|つか}}うことも{{虐待|ぎゃくたい}}です。{{見|み}}つけた{{人|ひと}}は{{通報|つうほう}}します。","w":[["介護等放棄","かいごとうほうき","{{食事|しょくじ}}をあげない、{{長時間|ちょうじかん}}{{放置|ほうち}}するなど、{{必要|ひつよう}}な{{世話|せわ}}をしないこと。ネグレクト。"],["通報","つうほう","{{虐待|ぎゃくたい}}などを{{市町村|しちょうそん}}に{{知|し}}らせること。"]],"ti":"Kekerasan (abuse) bukan hanya memukul. Membentak, menelantarkan, dan memakai uang orang tanpa izin juga termasuk kekerasan. Orang yang menemukannya wajib melapor.","tw":["Tidak memberi perawatan yang dibutuhkan, misalnya tidak memberi makan atau membiarkan lama. Penelantaran (neglect).","Memberitahukan kekerasan dan sejenisnya kepada kota/desa."]}},"kansen":{"jp":"感染症","t":"Penyakit infeksi","hal":"180–181","intro":"Jalur penularan dan pencegahan di fasilitas — dipakai juga di bab 生活支援技術.","pts":["Virus tak bisa berkembang sendiri (masuk ke sel manusia); bakteri membelah diri.","Jalur: <b>空気感染<\/b> (inti percikan melayang; <b>結核<\/b>, campak) · <b>飛沫感染<\/b> (jatuh dalam 1 m; influenza) · <b>接触感染<\/b> (tangan, handuk; MRSA, pseudomonas) · 経口感染 (makanan; norovirus, O157) · 血液媒介 (tusukan jarum; hepatitis B, HIV).","Di fasilitas, tambahan di atas <b>標準予防策<\/b>: udara → dirawat di RS, staf pakai masker <b>N95<\/b> · percikan → masker, kamar sendiri atau jarak tempat tidur ≥<b>2 m<\/b> / tirai · kontak → sarung tangan, gaun, kamar sendiri.","<b>MRSA<\/b>: kebal antibiotik; menular lewat kontak; pembawa yang tidak sakit <b>tidak perlu<\/b> kamar isolasi.","<b>Legionella<\/b>: dari air bak mandi sirkulasi & pelembap udara; tidak menular antarmanusia; cegah dengan disinfeksi klorin rutin.","日和見感染症: infeksi kuman lemah pada orang dengan imun turun (pneumocystis, MRSA, kandida).","UU Infeksi: golongan 1–5 (1 = paling berbahaya, mis. Ebola); wajib lapor ke gubernur. Tuberkulosis = golongan 2; norovirus (gastroenteritis infeksius) = golongan 5."],"tip":"Tuberkulosis = udara → N95. Influenza = percikan → masker. MRSA = kontak → sarung tangan; pembawa sehat tak perlu diisolasi.","tabs":[{"cap":"Jalur penularan","h":["Jalur","Contoh","Pencegahan tambahan"],"r":[["空気感染","Tuberkulosis, campak","Rawat di RS, masker N95"],["飛沫感染","Influenza, rubela","Masker; kamar sendiri / jarak 2 m / tirai"],["接触感染","MRSA, pseudomonas","Sarung tangan, gaun; kamar sendiri bila menyebar"],["経口感染","Norovirus, O157","Kebersihan makanan & tangan"],["血液媒介感染","Hepatitis B, HIV","Sarung tangan & gaun saat kena darah"]]}],"voc":[["感染経路","かんせんけいろ","jalur penularan"],["空気感染","くうきかんせん","penularan udara"],["飛沫感染","ひまつかんせん","penularan percikan"],["接触感染","せっしょくかんせん","penularan kontak"],["標準予防策","ひょうじゅんよぼうさく","kewaspadaan standar"],["保菌者","ほきんしゃ","pembawa kuman"],["日和見感染","ひよりみかんせん","infeksi oportunis a dianggap menular. 1 perawatan 1 cuci tangan; sabun cair lebih baik dari sabun batang. Komite infeksi di fasilitas ±<b>tiap 3 bulan<\/b>.","<b>Pengikatan fisik dilarang<\/b> kecuali darurat dengan <b>3 syarat<\/b>: 切迫性 (bahaya mendesak) · 非代替性 (tak ada cara lain) · 一時性 (sementara). Diputuskan seluruh fasilitas, dicatat (cara, waktu, kondisi, alasan); komite tiap 3 bulan. Contoh pengikatan: mengikat badan, <b>mengelilingi kasur dengan pagar<\/b>, sarung tangan tipe mitten, baju terusan.","<b>ユニットケア<\/b>: staf tetap yang dikenal; kamar pribadi + ruang bersama; 1 unit ±<b>10 orang<\/b> (maks. 15); ada pemimpin unit tetap; malam minimal 1 staf per 2 unit.","Risiko: catat <b>ヒヤリハット<\/b> (hampir celaka). <b>Hukum Heinrich<\/b>: di balik 1 kecelakaan besar ada banyak kecelakaan kecil & ヒヤリハット. Bila terjadi kecelakaan → hubungi <b>市町村 dan keluarga<\/b>, catat.","Stres: coping <b>問題焦点型<\/b> (mengatasi sumber stres) vs <b>情動焦点型<\/b> (mengubah cara pikir/rasa). バーンアウト = lesu, lelah, mati rasa.","<b>Body mechanics<\/b>: bidang tumpu <b>lebar<\/b>, titik berat <b>rendah<\/b>, dekatkan pusat berat dengan pengguna, pakai otot besar, prinsip tuas, kecilkan gesekan. Cegah sakit pinggang: jangan memutar badan, tekuk lutut saat posisi rendah.","Bencana: <b>避難行動要支援者名簿<\/b> wajib dibuat 市町村長; rencana evakuasi individu → diusahakan. 福祉避難所 untuk yang perlu perhatian khusus. Latihan kebakaran ≥<b>2×/tahun<\/b>. <b>BCP<\/b> (rencana kelangsungan usaha) wajib dibuat fasilitas."],"tip":"Pagar mengelilingi kasur = pengikatan fisik. Tiga syarat: 切迫性・非代替性・一時性. Bidang tumpu diperlebar (bukan dipersempit).","tabs":[{"cap":"Tiga syarat pengikatan darurat","h":["Syarat","Arti"],"r":[["切迫性","Nyawa/tubuh pengguna atau orang lain dalam bahaya mendesak"],["非代替性","Tidak ada cara perawatan lain"],["一時性","Hanya sementara"]]},{"cap":"Body mechanics","h":["Prinsip","Cara"],"r":[["支持基底面積を広く","Kaki dibuka, bidang tumpu lebar"],["重心を低く","Tekuk lutut, turunkan pinggang"],["重心を近づける","Rapatkan tubuh ke pengguna"] ihan pemulihan fungsi","Salah karena ini hanya salah satu cara dalam rehabilitasi, bukan filosofinya."],["Hukum","{{就労移行支援|しゅうろういこうしえん}}","dukungan transisi kerja","Salah karena ini nama layanan 障害者総合支援法 untuk persiapan bekerja di perusahaan umum."],["Etika","{{全人間的復権|ぜんにんげんてきふっけん}}","pemulihan hak sebagai manusia seutuhnya","Benar karena rehabilitasi berarti kembali hidup bermartabat sebagai diri sendiri dalam masyarakat."],["Hukum","{{地域定着支援|ちいきていちゃくしえん}}","dukungan menetap di komunitas","Salah karena ini layanan konsultasi bagi orang yang tinggal sendiri setelah keluar dari rumah sakit atau fasilitas (kontak darurat 24 jam)."],["Hukum","{{特別支援教育|とくべつしえんきょういく}}","pendidikan kebutuhan khusus","Salah karena ini pendidikan untuk anak berkebutuhan khusus di sekolah. Bidangnya lain."]]},{"id":"P39-s01-01","y":39,"n":1,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["ノーマライゼーションの{{理念|りねん}}を{{提唱|ていしょう}}し、デンマークの1959{{年法|ねんほう}}に{{盛|も}}り{{込|こ}}んだ{{人物|じんぶつ}}として、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Pilih satu tokoh yang BENAR: yang mencetuskan gagasan normalisasi dan memasukkannya ke dalam undang-undang Denmark tahun 1959."],"o":["ニィリエ（Nirje, B.）","バンク‐ミケルセン（Bank-Mikkelsen, N.）","ヴォルフェンスベルガー（Wolfensberger, W.）","マズロー（Maslow, A.）","ロジャーズ（Rogers, C.）"],"oTr":["Nirje","Bank-Mikkelsen","Wolfensberger","Maslow","Rogers"],"a":1,"p":"Normalisasi: Bank-Mikkelsen (Denmark, UU 1959) = pencetus; Nirje (Swedia) = 8 prinsip; Wolfensberger (AS) = Social Role Valorization. Tiga nama ini sering ditukar di soal.","lawn":"","care":"Di shisetsu, normalisasi berarti ritme hidup pengguna dibuat seperti orang biasa: bangun, makan, dan mandi pada jam yang wajar, bukan menurut kenyamanan staf.","ox":[["Tokoh & konsep","","","Nirje (Swedia) merumuskan 8 prinsip normalisasi sehingga disebut \"bapak yang membesarkan\" normalisasi, tetapi bukan pencetus undang-undang Denmark 1959."],["Tokoh & konsep","","","Bank-Mikkelsen memperjuangkan agar penyandang disabilitas intelektual hidup \"senormal mungkin\" dan gagasan itu masuk ke UU Denmark 1959. Ia disebut \"bapak normalisasi\"."],["Tokoh & konsep","","","Wolfensberger mengembangkan normalisasi di Amerika Utara menjadi teori \"peran sosial yang dihargai\" (Social Role Valorization), bukan pencetus UU Denmark."],["Tokoh & konsep","","","Maslow dikenal dengan teori hierarki kebutuhan (5 tingkat), tidak berkaitan dengan normalisasi."],["Tokoh & konsep","","","Rogers adalah tokoh konseling berpusat pada klien (受容・共感・自己一致), bukan normalisasi."]]},{"id":"P39-s01-02","y":39,"n":2,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["Aさん（82{{歳|さい}}、{{女性|じょせい}}、{{要介護|ようかいご}}1）は{{一人暮|ひとりぐ}}らしで、{{訪問介護|ほうもんかいご}}を{{利用|りよう}}している。{{最近|さいきん}}、{{長男|ちょうなん}}から「{{一人|ひとり}}では{{心配|しんぱい}}なので{{施設|しせつ}}に{{入|はい}}ってほしい」と{{言|い}}われているが、Aさんは「{{住|す}}み{{慣|な}}れたこの{{家|いえ}}で{{暮|く}}らし{{続|つづ}}けたい」と{{訪問介護|ほうもんかいご}}{{員|いん}}に{{話|はな}}した。","{{訪問介護|ほうもんかいご}}{{員|いん}}の{{対応|たいおう}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Bu A (82 tahun, perempuan, tingkat perawatan 1) tinggal sendiri dan memakai layanan perawatan kunjungan. Akhir-akhir ini putra sulungnya berkata, \"Aku khawatir Ibu sendirian, tolong masuk panti saja,\" tetapi Bu A berkata kepada perawat kunjungan, \"Saya ingin terus tinggal di rumah yang sudah lama saya tempati ini.\"","Pilih satu tanggapan perawat kunjungan yang PALING tepat."],"o":["{{長男|ちょうなん}}の{{意見|いけん}}に{{従|したが}}うように、Aさんを{{説得|せっとく}}する。","{{家族|かぞく}}の{{問題|もんだい}}なので、{{聞|き}}かなかったことにする。","{{訪問介護|ほうもんかいご}}{{員|いん}}が{{長男|ちょうなん}}に{{直接|ちょくせつ}}{{電話|でんわ}}をして、Aさんの{{希望|きぼう}}を{{伝|つた}}える。","Aさんの{{思|おも}}いを{{受|う}}け{{止|と}}め、サービス{{提供責任者|ていきょうせきにんしゃ}}に{{報告|ほうこく}}する。","「{{施設|しせつ}}のほうが{{安全|あんぜん}}ですよ」と{{伝|つた}}える。"],"oTr":["Membujuk Bu A agar menuruti pendapat putranya.","Menganggap tidak pernah mendengarnya karena itu urusan keluarga.","Perawat kunjungan langsung menelepon putra sulung untuk menyampaikan keinginan Bu A.","Menerima perasaan Bu A, lalu melaporkannya kepada penanggung jawab layanan.","Mengatakan, \"Panti lebih aman, lho.\""],"a":3,"p":"Pola soal 自己決定: terima perasaan pengguna (受容) → jangan memutuskan atau membujuk → laporkan ke tim agar dibahas bersama. Pilihan yang \"membujuk\", \"mengabaikan\", atau \"bertindak sendiri\" hampir selalu salah.","lawn":"","care":"Catat kata-kata pengguna apa adanya, misalnya 「この家で暮らし続けたい」. Kutipan langsung membuat laporan ke tim jauh lebih kuat.","ox":[["Hak menentukan sendiri","","","Membujuk pengguna mengikuti keinginan keluarga mengabaikan hak menentukan sendiri (自己決定) milik Bu A."],["Hak menentukan sendiri","","","Keinginan pengguna tentang tempat tinggal adalah informasi penting untuk rencana perawatan dan tidak boleh diabaikan."],["Hak menentukan sendiri","","","Bertindak sendiri di luar tim melanggar alur kerja dan bisa memperburuk hubungan keluarga. Koordinasi dilakukan lewat サービス提供責任者 dan care manager."],["Hak menentukan sendiri","","","Perawat menerima keinginan pengguna dan meneruskannya lewat jalur tim (サービス提供責任者 → care manager) supaya keinginan itu bisa dibahas bersama keluarga."],["Hak menentukan sendiri","","","Perawat memaksakan nilainya sendiri dan tidak menghormati pilihan hidup pengguna."]]},{"id":"P39-s01-03","y":39,"n":3,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":true,"stem":["{{介護保険施設|かいごほけんしせつ}}{{等|とう}}で{{緊急|きんきゅう}}やむを{{得|え}}ず{{身体拘束|しんたいこうそく}}を{{行|おこな}}う{{場合|ばあい}}の3つの{{要件|ようけん}}として、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Pilih satu yang BENAR sebagai tiga syarat bila pengekangan fisik terpaksa dilakukan secara darurat di fasilitas asuransi perawatan dan sejenisnya."],"o":["{{切迫性|せっぱくせい}}・{{安全|あんぜん}}{{性|せい}}・{{継続|けいぞく}}{{性|せい}}","{{必要|ひつよう}}{{性|せい}}・{{効率性|こうりつせい}}・{{一時性|いちじせい}}","{{切迫性|せっぱくせい}}・{{非代替性|ひだいたいせい}}・{{一時性|いちじせい}}","{{非代替性|ひだいたいせい}}・{{家族|かぞく}}の{{同意|どうい}}・{{医師|いし}}の{{指示|しじ}}","{{安全|あんぜん}}{{性|せい}}・{{利便性|りべんせい}}・{{予防|よぼう}}{{性|せい}}"],"oTr":["mendesak, keamanan, berkelanjutan","perlu, efisien, sementara","mendesak, tidak ada alternatif, sementara","tidak ada alternatif, persetujuan keluarga, instruksi dokter","keamanan, kemudahan, pencegahan"],"a":2,"p":"Tiga syarat pengekangan darurat: 切迫性・非代替性・一時性. Ketiganya wajib, diputuskan tim (bukan satu staf), dicatat (waktu, keadaan, alasan), dan dijelaskan kepada pengguna/keluarga.","lawn":"Sejak April 2024 kewajiban \"langkah pengurangan pengekangan\" (komite, pedoman, pelatihan) berlaku untuk layanan kunjungan dan layanan rumah juga, tidak hanya panti.","care":"Mengikat dengan tali, memasang pagar tempat tidur di 4 sisi, memakai baju terusan (つなぎ), dan memberi obat penenang berlebihan semuanya termasuk 身体拘束.","ox":[["Hukum & etika","","","継続性 (terus-menerus) justru bertentangan dengan syarat 一時性 (sementara)."],["Hukum & etika","","","Efisiensi kerja staf tidak pernah menjadi alasan sah untuk mengekang pengguna."],["Hukum & etika","","","Ketiga syarat (切迫性: nyawa/tubuh dalam bahaya, 非代替性: tidak ada cara lain, 一時性: hanya sementara) harus terpenuhi semuanya. Selain itu wajib ada catatan dan keputusan tim."],["Hukum & etika","","","Persetujuan keluarga atau instruksi dokter saja tidak cukup. Yang dinilai adalah tiga syarat 切迫性・非代替性・一時性."],["Hukum & etika","","","Mengekang \"untuk mencegah\" jatuh tanpa bahaya yang mendesak tidak memenuhi syarat."]]},{"id":"P39-s01-04","y":39,"n":4,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":true,"stem":["「{{高齢者虐待|こうれいしゃぎゃくたい}}の{{防止|ぼうし}}、{{高齢者|こうれいしゃ}}の{{養護者|ようごしゃ}}に{{対|たい}}する{{支援|しえん}}{{等|とう}}に{{関|かん}}する{{法律|ほうりつ}}」（{{高齢者虐待防止法|こうれいしゃぎゃくたいぼうしほう}}）に{{関|かん}}する{{次|つぎ}}の{{記述|きじゅつ}}のうち、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Mana pernyataan yang BENAR tentang UU Pencegahan Kekerasan terhadap Lansia (高齢者虐待防止法)?"],"o":["{{養介護施設従事者等|ようかいごしせつじゅうじしゃとう}}は、{{業務|ぎょうむ}}に{{従事|じゅうじ}}する{{施設|しせつ}}で{{虐待|ぎゃくたい}}を{{受|う}}けたと{{思|おも}}われる{{高齢者|こうれいしゃ}}を{{発見|はっけん}}した{{場合|ばあい}}、{{市町村|しちょうそん}}に{{通報|つうほう}}しなければならない。","{{虐待|ぎゃくたい}}の{{種類|しゅるい}}は、{{身体|しんたい}}{{的虐待|てきぎゃくたい}}と{{心理的虐待|しんりてきぎゃくたい}}の2つである。","{{養介護施設従事者等|ようかいごしせつじゅうじしゃとう}}による{{虐待|ぎゃくたい}}を{{発見|はっけん}}した{{場合|ばあい}}は、{{都道府県|とどうふけん}}{{警察|けいさつ}}に{{通報|つうほう}}しなければならない。","{{通報|つうほう}}した{{職員|しょくいん}}の{{氏名|しめい}}は、{{施設長|しせつちょう}}に{{知|し}}らせなければならない。","{{経済的虐待|けいざいてきぎゃくたい}}とは、{{高齢者|こうれいしゃ}}を{{長時間|ちょうじかん}}{{放置|ほうち}}することをいう。"],"oTr":["Staf fasilitas yang menemukan lansia yang diduga mengalami kekerasan di fasilitas tempatnya bekerja wajib melapor ke 市町村.","Jenis kekerasan hanya dua: fisik dan psikologis.","Bila menemukan kekerasan oleh staf fasilitas, wajib melapor ke polisi prefektur.","Nama staf yang melapor harus diberitahukan kepada kepala fasilitas.","Kekerasan ekonomi adalah membiarkan lansia dalam waktu lama."],"a":0,"p":"UU Pencegahan Kekerasan Lansia: 5 jenis kekerasan; laporan ke 市町村; staf fasilitas WAJIB melapor kekerasan di fasilitasnya sendiri; identitas pelapor dirahasiakan; pelapor dilindungi dari perlakuan tidak adil.","lawn":"Sejak April 2024 semua penyedia layanan wajib punya komite pencegahan kekerasan, pedoman, pelatihan rutin, dan penanggung jawab.","care":"Bila melihat memar yang tidak wajar saat mandi, catat lokasi, ukuran, warna, dan tanggal, lalu laporkan ke atasan pada hari itu juga. Jangan menunggu \"kepastian\".","ox":[["Hukum","","","Untuk kekerasan di dalam fasilitas sendiri, staf wajib (義務) melapor ke 市町村, dan tidak boleh diperlakukan tidak adil karena melapor."],["Hukum","","","Ada 5 jenis: fisik, penelantaran (介護等放棄), psikologis, seksual, dan ekonomi."],["Hukum","","","Tujuan laporan adalah 市町村, bukan polisi."],["Hukum","","","市町村 wajib merahasiakan identitas pelapor."],["Hukum","","","Membiarkan lama adalah 介護等放棄 (penelantaran). Kekerasan ekonomi = memakai uang/harta lansia tanpa izin."]]},{"id":"P39-s01-05","y":39,"n":5,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["アドボカシー（advocacy）の{{説明|せつめい}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Pilih satu penjelasan yang PALING tepat tentang advokasi (advocacy)."],"o":["{{利用者|りようしゃ}}の{{生活|せいかつ}}を{{介護福祉職|かいごふくししょく}}が{{代わ|かわ}}りに{{決|き}}めることである。","{{利用者|りようしゃ}}の{{能力|のうりょく}}を{{引|ひ}}き{{出|だ}}し、{{自分|じぶん}}で{{問題|もんだい}}を{{解決|かいけつ}}できるようにすることである。","{{利用者|りようしゃ}}の{{情報|じょうほう}}を、{{本人|ほんにん}}の{{同意|どうい}}なく{{関係|かんけい}}{{機関|きかん}}に{{提供|ていきょう}}することである。","{{自分|じぶん}}の{{意思|いし}}や{{権利|けんり}}を{{主張|しゅちょう}}することが{{難|むずか}}しい{{人|ひと}}に{{代わ|かわ}}って、その{{意思|いし}}や{{権利|けんり}}を{{代弁|だいべん}}・{{擁護|ようご}}することである。","{{介護|かいご}}サービスの{{費用|ひよう}}を{{利用者|りようしゃ}}に{{代わ|かわ}}って{{支払|しはら}}うことである。"],"oTr":["Staf perawatan memutuskan kehidupan pengguna sebagai ganti dirinya.","Membangkitkan kemampuan pengguna agar bisa menyelesaikan masalahnya sendiri.","Memberikan informasi pengguna kepada lembaga terkait tanpa persetujuannya.","Menyuarakan dan membela kehendak serta hak orang yang sulit menyampaikannya sendiri.","Membayar biaya layanan perawatan atas nama pengguna."],"a":3,"p":"Pasangan yang sering keluar: アドボカシー = 代弁・権利擁護; エンパワメント = 力を引き出す; ストレングス = kekuatan/kelebihan pengguna; インフォームド・コンセント = penjelasan + persetujuan.","lawn":"","care":"Contoh advokasi di lapangan: pengguna afasia tidak bisa protes soal jadwal mandi, lalu perawat menyampaikan keluhan nonverbalnya di rapat tim.","ox":[["Konsep","","","Ini paternalisme, kebalikan dari advokasi yang menghormati keputusan pengguna."],["Konsep","","","Ini definisi エンパワメント (pemberdayaan). Konsepnya dekat tetapi berbeda."],["Konsep","","","Ini pelanggaran kerahasiaan, bukan advokasi."],["Konsep","","","Advokasi = 権利擁護・代弁: mewakili suara orang yang kesulitan menyatakan kehendak atau haknya."],["Konsep","","","Advokasi adalah pembelaan hak, bukan bantuan keuangan."]]},{"id":"P39-s01-06","y":39,"n":6,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["Bさん（78{{歳|さい}}、{{男性|だんせい}}）は、{{脳梗塞|のうこうそく}}の{{後遺症|こういしょう}}で{{右片麻痺|みぎかたまひ}}がある。リハビリテーションに{{意欲|いよく}}がなく、「どうせ{{何も|なにも}}できない」と{{話|はな}}している。{{以前|いぜん}}は{{大工|だいく}}として{{働|はたら}}き、{{木工|もっこう}}が{{得意|とくい}}だった。","Bさんへのエンパワメント（empowerment）の{{視点|してん}}に{{基|もと}}づく{{介護福祉職|かいごふくししょく}}の{{関|かん}}わりとして、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Pak B (78 tahun, laki-laki) mengalami kelumpuhan tubuh kanan akibat gejala sisa infark otak. Ia tidak bersemangat menjalani rehabilitasi dan berkata, \"Toh saya tidak bisa apa-apa.\" Dulu ia bekerja sebagai tukang kayu dan pandai membuat kerajinan kayu.","Pilih satu keterlibatan staf perawatan yang PALING tepat berdasarkan sudut pandang pemberdayaan (empowerment) untuk Pak B."],"o":["できないことをすべて{{介護福祉職|かいごふくししょく}}が{{代わ|かわ}}りに{{行|おこな}}う。","{{左手|ひだりて}}でできる{{簡単|かんたん}}な{{木工作業|もっこうさぎょう}}を{{一緒|いっしょ}}に{{考|かんが}}え、{{得意|とくい}}なことを{{生|い}}かせる{{場|ば}}をつくる。","リハビリテーションの{{必要|ひつよう}}{{性|せい}}を{{強|つよ}}く{{説得|せっとく}}する。","{{家族|かぞく}}に、{{本人|ほんにん}}の{{意欲|いよく}}を{{高|たか}}めるよう{{指導|しどう}}する。","{{本人|ほんにん}}が{{希望|きぼう}}するまで、{{何も|なにも}}{{働|はたら}}きかけない。"],"oTr":["Staf perawatan mengerjakan semua hal yang tidak bisa ia lakukan.","Bersama-sama memikirkan pekerjaan kayu sederhana yang bisa dilakukan dengan tangan kiri dan menciptakan kesempatan memakai keahliannya.","Membujuk keras tentang perlunya rehabilitasi.","Mengarahkan keluarga agar meningkatkan semangat Pak B.","Tidak melakukan pendekatan apa pun sampai ia sendiri ingin."],"a":1,"p":"Kata kunci kasus: masa lalu/keahlian pengguna (大工, 木工) hampir selalu menjadi petunjuk jawaban. Empowerment = memakai kekuatan pengguna untuk membangkitkan rasa \"aku bisa\".","lawn":"","care":"Tanyakan pengalaman kerja dan hobi saat asesmen awal. Informasi itu menjadi bahan untuk kegiatan yang bermakna bagi pengguna.","ox":[["Pemberdayaan","","","Mengambil alih semua hal membuat Pak B makin pasif dan kehilangan kemampuan yang tersisa."],["Pemberdayaan","","","Empowerment memakai kekuatan (ストレングス) pengguna, yaitu keahlian kayunya, untuk mengembalikan rasa mampu dan motivasi."],["Pemberdayaan","","","Membujuk keras tanpa membangkitkan motivasi dari dalam diri biasanya gagal dan merusak hubungan."],["Pemberdayaan","","","Melempar tanggung jawab motivasi ke keluarga bukan pendekatan pemberdayaan langsung kepada pengguna."],["Pemberdayaan","","","Membiarkan begitu saja bukan penghormatan diri, melainkan pengabaian peluang pemulihan."]]},{"id":"P39-s01-07","y":39,"n":7,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["{{成年後見制度|せいねんこうけんせいど}}に{{関|かん}}する{{次|つぎ}}の{{記述|きじゅつ}}のうち、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Mana pernyataan yang BENAR tentang sistem perwalian dewasa (成年後見制度)?"],"o":["{{法定後見制度|ほうていこうけんせいど}}は、{{後見|こうけん}}・{{保佐|ほさ}}・{{補助|ほじょ}}の3つの{{類型|るいけい}}に{{分か|わか}}れている。","{{任意後見制度|にんいこうけんせいど}}では、{{家庭裁判所|かていさいばんしょ}}が{{任意後見人|にんいこうけんにん}}を{{選|えら}}ぶ。","{{成年後見人|せいねんこうけんにん}}は、{{本人|ほんにん}}の{{食事介助|しょくじかいじょ}}や{{入浴介助|にゅうよくかいじょ}}を{{行|おこな}}う{{義務|ぎむ}}がある。","{{市町村長|しちょうそんちょう}}は、{{後見開始|こうけんかいし}}の{{審判|しんぱん}}を{{申|もう}}し{{立|た}}てることができない。","{{成年後見人|せいねんこうけんにん}}は、{{本人|ほんにん}}が{{日用品|にちようひん}}を{{購入|こうにゅう}}した{{契約|けいやく}}も{{取|と}}り{{消|け}}すことができる。"],"oTr":["Perwalian berdasarkan hukum terbagi tiga: 後見・保佐・補助.","Dalam perwalian sukarela, pengadilan keluarga memilih wali sukarela.","Wali dewasa wajib melakukan bantuan makan dan mandi untuk pengguna.","Kepala 市町村 tidak boleh mengajukan permohonan perwalian.","Wali dewasa juga bisa membatalkan kontrak pembelian barang kebutuhan sehari-hari."],"a":0,"p":"法定後見 (3 jenis, dipilih pengadilan) vs 任意後見 (kontrak sendiri, aktif setelah pengadilan menunjuk pengawas). Wali tidak melakukan perawatan fisik. Barang kebutuhan sehari-hari tidak bisa dibatalkan.","lawn":"","care":"Bila pengguna demensia sering tertipu penjualan mendadak, laporkan ke tim dan care manager. Bisa diarahkan ke 日常生活自立支援事業 (社会福祉協議会) atau perwalian.","ox":[["Hukum","","","Jenisnya ditentukan menurut tingkat kemampuan menilai: 後見 (hampir tidak ada) > 保佐 (sangat kurang) > 補助 (kurang)."],["Hukum","","","Wali sukarela dipilih sendiri oleh pengguna lewat kontrak notaris saat kemampuan menilainya masih cukup. Pengadilan memilih 任意後見監督人 (pengawas)."],["Hukum","","","Wali mengurus harta dan kontrak (身上保護・財産管理), bukan perawatan fisik."],["Hukum","","","Kepala 市町村 boleh mengajukan (市町村長申立て) bila tidak ada keluarga yang bisa mengajukan."],["Hukum","","","Pembelian barang kebutuhan sehari-hari dikecualikan dan tidak bisa dibatalkan, demi menghormati kehidupan pengguna."]]},{"id":"P39-s01-08","y":39,"n":8,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["{{介護福祉職|かいごふくししょく}}が{{利用者|りようしゃ}}のおむつ{{交換|こうかん}}を{{行|おこな}}う{{際|さい}}の{{対応|たいおう}}として、{{利用者|りようしゃ}}の{{尊厳|そんげん}}を{{守|まも}}る{{観点|かんてん}}から{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Saat staf perawatan mengganti popok pengguna, pilih satu tindakan yang PALING tepat dari sudut pandang menjaga martabat pengguna."],"o":["{{時間|じかん}}{{短縮|たんしゅく}}のため、{{声|こえ}}をかけずに{{手早|てばや}}く{{交換|こうかん}}する。","{{同室者|どうしつしゃ}}がいる{{場合|ばあい}}でも、カーテンは{{開け|あけ}}たままにする。","「またおしっこが{{出|だ}}ましたね」と{{大|おお}}きな{{声|こえ}}で{{伝|つた}}える。","{{利用者|りようしゃ}}の{{意向|いこう}}に{{関係|かんけい}}なく、{{決|き}}まった{{時間|じかん}}にだけ{{交換|こうかん}}する。","カーテンやスクリーンで{{周囲|しゅうい}}から{{見|み}}えないようにし、{{露出|ろしゅつ}}を{{最小限|さいしょうげん}}にして{{交換|こうかん}}する。"],"oTr":["Mengganti dengan cepat tanpa menyapa agar menghemat waktu.","Membiarkan tirai terbuka walaupun ada penghuni lain di kamar.","Mengatakan dengan suara keras, \"Ngompol lagi, ya.\"","Hanya mengganti pada jam yang ditentukan tanpa memedulikan keinginan pengguna.","Menutup dengan tirai atau sekat agar tidak terlihat dari sekitar dan mengganti dengan bagian tubuh yang terbuka seminimal mungkin."],"a":4,"p":"Bantuan ekskresi: sapa dulu, jaga privasi (tirai/handuk), minimalkan bagian tubuh terbuka, bicara pelan, sesuaikan dengan pola pengguna. Jawaban \"cepat tanpa sapa\" dan \"suara keras\" selalu salah.","lawn":"","care":"Tutupi bagian bawah tubuh dengan handuk mandi saat mengganti. Itu kecil, tetapi sangat berarti bagi rasa malu pengguna.","ox":[["Martabat & privasi","","","Menyentuh tubuh tanpa pemberitahuan menimbulkan rasa takut dan malu, serta tidak menghormati pengguna sebagai manusia."],["Martabat & privasi","","","Membuka tirai saat tubuh pengguna terbuka melanggar privasi."],["Martabat & privasi","","","Membicarakan ekskresi dengan suara keras di depan orang lain merendahkan martabat pengguna."],["Martabat & privasi","","","Popok basah yang dibiarkan mengganggu kenyamanan dan kulit. Waktu ganti sebaiknya disesuaikan dengan pola ekskresi pengguna."],["Martabat & privasi","","","Menjaga privasi (プライバシー) dan rasa malu (羞恥心) adalah dasar menghormati martabat saat bantuan ekskresi."]]},{"id":"P39-s01-09","y":39,"n":9,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["{{日本|にほん}}{{国憲法|こくけんぽう}}において、「すべて{{国民|こくみん}}は、{{個人|こじん}}として{{尊重|そんちょう}}される。{{生命|せいめい}}、{{自由|じゆう}}{{及|およ}}び{{幸福追求|こうふくついきゅう}}に{{対|たい}}する{{国民|こくみん}}の{{権利|けんり}}については（{{略|りゃく}}）{{最大|さいだい}}の{{尊重|そんちょう}}を{{必要|ひつよう}}とする」と{{規定|きてい}}している{{条文|じょうぶん}}として、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Dalam Konstitusi Jepang, pasal yang menyatakan \"Semua warga negara dihormati sebagai individu. Hak atas hidup, kebebasan, dan mengejar kebahagiaan (…) memerlukan penghormatan setinggi-tingginya\" adalah pasal berapa? Pilih satu yang BENAR."],"o":["{{第|だい}}9{{条|じょう}}","{{第|だい}}13{{条|じょう}}","{{第|だい}}21{{条|じょう}}","{{第|だい}}25{{条|じょう}}","{{第|だい}}27{{条|じょう}}"],"oTr":["Pasal 9","Pasal 13","Pasal 21","Pasal 25","Pasal 27"],"a":1,"p":"Dua pasal paling sering keluar: 第13条 = 個人の尊重・幸福追求権 (martabat, kehendak sendiri); 第25条 = 生存権 (hidup sehat dan berbudaya minimum, dasar kesejahteraan sosial).","lawn":"","care":"Ingat dengan kode: \"13 = Saya (個人)\", \"25 = Sejahtera (生存)\".","ox":[["Hukum","","","Pasal 9 mengatur penolakan perang (戦争の放棄)."],["Hukum","","","Pasal 13 = 個人の尊重・幸福追求権, menjadi dasar hukum \"martabat\" dan \"hak menentukan sendiri\" dalam perawatan."],["Hukum","","","Pasal 21 mengatur kebebasan berkumpul, berserikat, dan berekspresi."],["Hukum","","","Pasal 25 adalah hak hidup layak (生存権: 健康で文化的な最低限度の生活), dasar jaminan sosial, bukan kalimat dalam soal."],["Hukum","","","Pasal 27 mengatur hak dan kewajiban bekerja."]]},{"id":"P39-s01-10","y":39,"n":10,"s":"s01","subj":"人間の尊厳と自立","pred":1,"law":false,"stem":["Cさん（88{{歳|さい}}、{{女性|じょせい}}、{{要介護|ようかいご}}3）は、{{介護老人福祉施設|かいごろうじんふくししせつ}}に{{入所|にゅうしょ}}している。{{毎朝|まいあさ}}、{{自分|じぶん}}で{{選|えら}}んだ{{服|ふく}}に{{着替|きが}}えることを{{楽|たの}}しみにしているが、{{着替|きが}}えに30{{分ほど|ぷんほど}}かかる。{{職員|しょくいん}}の{{一人|ひとり}}が「{{時間|じかん}}がかかるので、{{職員|しょくいん}}が{{選|えら}}んで{{着|き}}せたほうがよい」と{{提案|ていあん}}した。","Cさんの{{自立支援|じりつしえん}}の{{観点|かんてん}}から、{{最|もっと}}も{{適切|てきせつ}}な{{対応|たいおう}}を1つ{{選|えら}}びなさい。"],"sTr":["Bu C (88 tahun, perempuan, tingkat perawatan 3) tinggal di panti perawatan lansia khusus. Setiap pagi ia senang berganti pakaian yang ia pilih sendiri, tetapi butuh sekitar 30 menit. Seorang staf mengusulkan, \"Karena lama, sebaiknya staf yang memilih dan memakaikan bajunya.\"","Dari sudut pandang dukungan kemandirian Bu C, pilih satu tanggapan yang PALING tepat."],"o":["{{提案|ていあん}}どおり、{{職員|しょくいん}}が{{服|ふく}}を{{選|えら}}んで{{着|き}}せる。","{{着替|きが}}えは{{週|しゅう}}に1{{回|かい}}だけにする。","Cさんが{{自分|じぶん}}で{{選|えら}}んで{{着替|きが}}えられるよう、{{時間|じかん}}に{{余裕|よゆう}}のある{{支援|しえん}}{{方法|ほうほう}}をチームで{{検討|けんとう}}する。","{{朝食|ちょうしょく}}の{{時間|じかん}}を{{他|ほか}}の{{利用者|りようしゃ}}と{{分け|わけ}}て、Cさんだけ{{遅|おそ}}らせる。","{{着替|きが}}えやすいように、{{全員|ぜんいん}}{{同|おな}}じ{{服装|ふくそう}}にする。"],"oTr":["Sesuai usulan, staf memilih dan memakaikan baju.","Berganti baju hanya sekali seminggu.","Membahas bersama tim cara bantuan dengan waktu yang cukup agar Bu C tetap bisa memilih dan berganti baju sendiri.","Memisahkan jam sarapan dan memundurkannya hanya untuk Bu C.","Memakaikan baju yang sama untuk semua orang agar mudah."],"a":2,"p":"Kemandirian (自立支援) = hormati kemampuan yang tersisa (残存機能) dan pilihan pengguna. Bila staf ingin mengambil alih demi efisiensi, jawabannya hampir selalu \"bahas cara bantuan bersama tim\".","lawn":"","care":"Ide praktis: biarkan pengguna memilih baju malam sebelumnya, lalu siapkan baju yang mudah dipakai (kancing besar, karet di pinggang).","ox":[["Dukungan kemandirian","","","Mengambil alih kegiatan yang masih bisa dan ingin dilakukan pengguna mengurangi kemampuan dan kesenangan hidupnya."],["Dukungan kemandirian","","","Mengurangi frekuensi demi kemudahan staf merugikan kebersihan dan kualitas hidup pengguna."],["Dukungan kemandirian","","","Kemandirian bukan \"cepat\", melainkan pengguna melakukan sendiri apa yang bisa dan ingin ia lakukan. Bantuan disesuaikan oleh tim, misalnya mulai lebih awal atau menyiapkan baju malam sebelumnya."],["Dukungan kemandirian","","","Kurang tepat. Mengubah jadwal sepihak tanpa membahas keinginan Bu C bukan inti masalah. Yang perlu ditinjau adalah cara mendukung proses berganti bajunya."],["Dukungan kemandirian","","","Menyeragamkan pakaian menghilangkan individualitas dan martabat pengguna."]]},{"id":"P39-s04-01","y":39,"n":31,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["「{{社会福祉士及|しゃかいふくししおよ}}び{{介護福祉士法|かいごふくししほう}}」に{{規定|きてい}}されている{{介護福祉士|かいごふくしし}}の{{義務|ぎむ}}{{等|とう}}として、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Pilih satu yang BENAR sebagai kewajiban perawat bersertifikasi (介護福祉士) yang diatur dalam UU Pekerja Sosial Bersertifikasi dan Perawat Bersertifikasi (社会福祉士及び介護福祉士法)."],"o":["{{介護福祉士|かいごふくしし}}でない{{者|もの}}は、{{介護福祉士|かいごふくしし}}という{{名称|めいしょう}}を{{使用|しよう}}してはならない。","{{介護福祉士|かいごふくしし}}の{{資格|しかく}}は、5{{年|ねん}}ごとに{{更新|こうしん}}しなければならない。","{{介護福祉士|かいごふくしし}}でなければ、{{介護|かいご}}{{業務|ぎょうむ}}を{{行|おこな}}ってはならない。","{{秘密保持義務|ひみつほじぎむ}}は、{{介護福祉士|かいごふくしし}}の{{業務|ぎょうむ}}を{{離|はな}}れた{{後は|あとは}}{{適用|てきよう}}されない。","{{医師|いし}}との{{連携|れんけい}}は、{{努力義務|どりょくぎむ}}とされていない。"],"oTr":["Orang yang bukan 介護福祉士 tidak boleh memakai sebutan 介護福祉士.","Sertifikasi 介護福祉士 harus diperbarui setiap 5 tahun.","Selain 介護福祉士 tidak boleh melakukan pekerjaan perawatan.","Kewajiban menjaga rahasia tidak berlaku setelah berhenti dari pekerjaan 介護福祉士.","Kerja sama dengan dokter tidak disebut sebagai kewajiban apa pun."],"a":0,"p":"Kewajiban 介護福祉士: 誠実義務 (第44条の2), 信用失墜行為の禁止 (第45条), 秘密保持義務 (第46条, berlaku seumur hidup), 連携 (第47条), 資質向上の責務 (第47条の2), 名称の使用制限 (第48条). 名称独占, bukan 業務独占.","lawn":"","care":"Pelanggaran kewajiban rahasia diancam pidana dan bisa berujung pencabutan pendaftaran. Hati-hati bercerita tentang pengguna, bahkan di luar jam kerja.","ox":[["Hukum (profesi)","","","介護福祉士 adalah 名称独占 (monopoli nama): yang dilindungi adalah sebutannya, bukan pekerjaannya."],["Hukum (profesi)","","","Tidak ada kewajiban pembaruan sertifikasi 介護福祉士."],["Hukum (profesi)","","","Ini 業務独占 (monopoli pekerjaan), seperti dokter atau perawat medis. Perawatan boleh dilakukan siapa pun."],["Hukum (profesi)","","","Kewajiban menjaga rahasia tetap berlaku setelah berhenti (第46条)."],["Hukum (profesi)","","","UU mewajibkan 介護福祉士 bekerja sama (連携) dengan tenaga terkait, termasuk tenaga medis, berdasarkan kondisi pengguna (第47条)."]]},{"id":"P39-s04-02","y":39,"n":32,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["ICF（International Classification of Functioning, Disability and Health：{{国際生活機能分類|こくさいせいかつきのうぶんるい}}）において、「{{趣味|しゅみ}}の{{園芸|えんげい}}サークルに{{通|かよ}}っている」ことが{{該当|がいとう}}する{{構成要素|こうせいようそ}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Dalam ICF (Klasifikasi Fungsi, Disabilitas, dan Kesehatan Internasional), \"rutin datang ke klub berkebun sebagai hobi\" termasuk komponen yang mana? Pilih satu yang PALING tepat."],"o":["{{参加|さんか}}","{{心身機能|しんしんきのう}}","{{身体構造|しんたいこうぞう}}","{{活動|かつどう}}","{{個人因子|こじんいんし}}"],"oTr":["partisipasi","fungsi tubuh dan mental","struktur tubuh","aktivitas","faktor personal"],"a":0,"p":"ICF: 健康状態 ↔ 生活機能 (心身機能・身体構造 / 活動 / 参加) ↔ 背景因子 (環境因子 / 個人因子). Kunci membedakan: 活動 = melakukan sesuatu sendiri; 参加 = peran di masyarakat atau kelompok.","lawn":"","care":"Saat menyusun rencana, tuliskan juga tujuan 参加 (misalnya \"datang lagi ke klub berkebun\"), bukan hanya tujuan 活動 (misalnya \"bisa berjalan 50 m\").","ox":[["ICF","","","参加 = keterlibatan dalam situasi kehidupan atau peran sosial, misalnya ikut klub, bekerja, atau kegiatan warga."],["ICF","","","心身機能 adalah fungsi fisiologis dan psikologis tubuh, misalnya kekuatan otot atau daya ingat."],["ICF","","","身体構造 adalah bagian anatomis tubuh, misalnya anggota gerak atau organ."],["ICF","","","活動 adalah pelaksanaan tugas atau tindakan oleh individu, misalnya berjalan, makan, atau menyiram tanaman sendiri."],["ICF","","","個人因子 adalah latar belakang individu, misalnya usia, jenis kelamin, gaya hidup, atau sifat."]]},{"id":"P39-s04-03","y":39,"n":33,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["ハインリッヒ（Heinrich, H.）の{{法則|ほうそく}}に{{関|かん}}する{{次|つぎ}}の{{記述|きじゅつ}}のうち、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Mana pernyataan yang BENAR tentang hukum Heinrich?"],"o":["ヒヤリハットは{{事故|じこ}}ではないので、{{報告|ほうこく}}する{{必要|ひつよう}}はない。","{{事故|じこ}}の{{原因|げんいん}}は、すべて{{個人|こじん}}の{{不注意|ふちゅうい}}である。","{{重大事故|じゅうだいじこ}}1{{件|けん}}に{{対|たい}}して、{{軽微|けいび}}な{{事故|じこ}}は300{{件|けん}}あるとする。","1{{件|けん}}の{{重大事故|じゅうだいじこ}}の{{背後|はいご}}には、29{{件|けん}}の{{軽微|けいび}}な{{事故|じこ}}と300{{件|けん}}のヒヤリハットがあるとする。","{{事故|じこ}}{{報告書|ほうこくしょ}}は、{{職員|しょくいん}}の{{責任|せきにん}}を{{追及|ついきゅう}}するために{{書|か}}く。"],"oTr":["ヒヤリハット bukan kecelakaan sehingga tidak perlu dilaporkan.","Penyebab kecelakaan semuanya adalah kelalaian individu.","Untuk 1 kecelakaan serius ada 300 kecelakaan ringan.","Di balik 1 kecelakaan serius ada 29 kecelakaan ringan dan 300 kejadian nyaris celaka (ヒヤリハット).","Laporan kecelakaan ditulis untuk menuntut tanggung jawab staf."],"a":3,"p":"Heinrich 1:29:300. ヒヤリハット (nyaris celaka) dilaporkan dan dianalisis → perbaiki sistem/lingkungan. Laporan = untuk pencegahan, bukan hukuman.","lawn":"","care":"Tulis ヒヤリハット sesegera mungkin dengan 5W1H. Laporan kecil hari ini bisa mencegah patah tulang besok.","ox":[["Manajemen risiko","","","Justru ヒヤリハット harus dilaporkan karena merupakan tanda awal kecelakaan."],["Manajemen risiko","","","Manajemen risiko melihat sistem, lingkungan, dan prosedur, bukan hanya menyalahkan individu."],["Manajemen risiko","","","Angkanya tertukar: 29 kecelakaan ringan dan 300 ヒヤリハット."],["Manajemen risiko","","","Rasio 1:29:300 menunjukkan bahwa mencegah kecelakaan besar dimulai dari mengumpulkan dan menganalisis ヒヤリハット."],["Manajemen risiko","","","Tujuannya mencegah kejadian berulang, bukan mencari siapa yang salah."]]},{"id":"P39-s04-04","y":39,"n":34,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["{{介護|かいご}}{{施設|しせつ}}における{{感染|かんせん}}{{対策|たいさく}}として、ノロウイルス（norovirus）による{{感染|かんせん}}{{性胃腸炎|せいいちょうえん}}の{{利用者|りようしゃ}}の{{嘔吐物|おうとぶつ}}を{{処理|しょり}}する{{方法|ほうほう}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Sebagai pengendalian infeksi di fasilitas perawatan, pilih satu cara yang PALING tepat untuk membersihkan muntahan pengguna yang terkena gastroenteritis menular akibat norovirus."],"o":["{{素手|すで}}で{{手早|てばや}}く{{拭|ふ}}き{{取|と}}る。","{{消毒用|しょうどくよう}}エタノールを{{噴霧|ふんむ}}して{{拭|ふ}}き{{取|と}}る。","{{換気|かんき}}をせず、{{窓|まど}}を{{閉め|しめ}}たまま{{処理|しょり}}する。","{{使|つか}}い{{捨|す}}て{{手袋|てぶくろ}}・マスク・エプロンを{{着用|ちゃくよう}}し、{{次亜塩素酸|じあえんそさん}}ナトリウム{{液|えき}}で{{消毒|しょうどく}}する。","{{処理|しょり}}に{{使|つか}}った{{布|ぬの}}は、{{洗|あら}}って{{再利用|さいりよう}}する。"],"oTr":["Mengelap dengan cepat memakai tangan kosong.","Menyemprot etanol disinfektan lalu mengelap.","Membersihkan dengan jendela tertutup tanpa ventilasi.","Memakai sarung tangan, masker, dan celemek sekali pakai, lalu mendisinfeksi dengan larutan natrium hipoklorit.","Kain yang dipakai dicuci lalu dipakai lagi."],"a":3,"p":"Norovirus: APD lengkap (手袋・マスク・エプロン), 次亜塩素酸ナトリウム (bukan alkohol), bersihkan dari luar ke dalam, buang dalam kantong tertutup, ventilasi, cuci tangan dengan sabun dan air mengalir setelahnya.","lawn":"","care":"Alkohol gel tidak cukup untuk norovirus. Setelah menangani muntahan, cuci tangan dengan sabun dan air mengalir.","ox":[["Pengendalian infeksi","","","Muntahan mengandung banyak virus; wajib memakai sarung tangan, masker, dan celemek sekali pakai."],["Pengendalian infeksi","","","Norovirus kurang mempan terhadap alkohol, dan menyemprot bisa membuat virus beterbangan."],["Pengendalian infeksi","","","Ventilasi diperlukan karena virus bisa beterbangan dari muntahan yang mengering."],["Pengendalian infeksi","","","Norovirus diinaktifkan dengan 次亜塩素酸ナトリウム (pemutih yang diencerkan). Bersihkan dari luar ke dalam dengan kain sekali pakai, lalu disinfeksi area."],["Pengendalian infeksi","","","Bahan yang dipakai dimasukkan ke kantong plastik, diberi larutan hipoklorit, ditutup rapat, lalu dibuang."]]},{"id":"P39-s04-05","y":39,"n":35,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["スタンダードプリコーション（standard precautions：{{標準予防策|ひょうじゅんよぼうさく}}）の{{考|かんが}}え{{方|かた}}として、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Pilih satu yang BENAR sebagai prinsip kewaspadaan standar (standard precautions)."],"o":["{{感染症|かんせんしょう}}と{{診断|しんだん}}された{{利用者|りようしゃ}}だけに{{行|おこな}}う。","{{手袋|てぶくろ}}を{{着用|ちゃくよう}}していれば、{{手洗|てあら}}いは{{不要|ふよう}}である。","{{汗|あせ}}を{{除|のぞ}}くすべての{{血液|けつえき}}・{{体液|たいえき}}・{{分泌物|ぶんぴつぶつ}}・{{排泄物|はいせつぶつ}}・{{傷|きず}}のある{{皮膚|ひふ}}・{{粘膜|ねんまく}}を、{{感染|かんせん}}の{{可能性|かのうせい}}があるものとして{{扱|あつか}}う。","{{汗|あせ}}は{{感染|かんせん}}の{{可能性|かのうせい}}が{{高|たか}}いので、{{必|かなら}}ず{{手袋|てぶくろ}}を{{着用|ちゃくよう}}して{{扱|あつか}}う。","{{利用者|りようしゃ}}ごとに{{手袋|てぶくろ}}を{{交換|こうかん}}する{{必要|ひつよう}}はない。"],"oTr":["Hanya dilakukan untuk pengguna yang didiagnosis penyakit menular.","Bila memakai sarung tangan, cuci tangan tidak perlu.","Memperlakukan semua darah, cairan tubuh, sekret, ekskreta (kecuali keringat), kulit luka, dan selaput lendir sebagai berpotensi menular.","Keringat sangat berpotensi menular sehingga wajib memakai sarung tangan.","Tidak perlu mengganti sarung tangan per pengguna."],"a":2,"p":"標準予防策: semua pengguna; darah, cairan tubuh, sekret, ekskreta (kecuali keringat), kulit luka, dan selaput lendir dianggap menular; cuci tangan + APD; ganti sarung tangan setiap pengguna.","lawn":"","care":"Prinsip \"satu perawatan, satu cuci tangan\" (一ケア一手洗い) adalah kebiasaan paling efektif untuk mencegah penularan antar pengguna.","ox":[["Pengendalian infeksi","","","Kewaspadaan standar berlaku untuk SEMUA pengguna, apa pun diagnosisnya."],["Pengendalian infeksi","","","Cuci tangan tetap wajib setelah melepas sarung tangan karena tangan bisa terkontaminasi."],["Pengendalian infeksi","","","Inilah definisi kewaspadaan standar: semua orang dianggap mungkin membawa kuman, sehingga penanganannya seragam."],["Pengendalian infeksi","","","Keringat justru dikecualikan dari cakupan kewaspadaan standar."],["Pengendalian infeksi","","","Sarung tangan diganti untuk setiap pengguna (一ケア一手洗い) agar kuman tidak berpindah."]]},{"id":"P39-s04-06","y":39,"n":36,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["{{介護福祉職|かいごふくししょく}}の{{腰痛予防|ようつうよぼう}}に{{関|かん}}する{{次|つぎ}}の{{記述|きじゅつ}}のうち、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Mana pernyataan yang PALING tepat tentang pencegahan sakit pinggang bagi staf perawatan?"],"o":["{{利用者|りようしゃ}}を{{持|も}}ち{{上|あ}}げるときは、{{膝|ひざ}}を{{伸|の}}ばしたまま{{腰|こし}}を{{曲|ま}}げる。","{{移乗|いじょう}}の{{際|さい}}は、{{利用者|りようしゃ}}との{{距離|きょり}}をできるだけ{{離|はな}}す。","{{原則|げんそく}}として{{人力|じんりき}}による{{抱え|かかえ}}{{上|あ}}げは{{行|おこな}}わず、{{福祉用具|ふくしようぐ}}の{{活用|かつよう}}を{{検討|けんとう}}する。","{{足|あし}}を{{閉|と}}じて、{{支持基底面|しじきていめん}}を{{狭|せま}}くする。","{{体|からだ}}をねじって、すばやく{{方向|ほうこう}}を{{変|か}}える。"],"oTr":["Saat mengangkat pengguna, membungkuk dengan lutut lurus.","Saat memindahkan, menjauhkan jarak dengan pengguna sejauh mungkin.","Pada prinsipnya tidak mengangkat dengan tenaga manusia, dan mempertimbangkan pemakaian alat bantu.","Merapatkan kaki dan mempersempit bidang tumpu.","Memuntir badan untuk berganti arah dengan cepat."],"a":2,"p":"Body mechanics: lebarkan bidang tumpu, rendahkan pusat gravitasi, dekatkan tubuh, pakai otot besar, jangan memuntir, tarik daripada angkat. Pedoman 2013: prinsipnya tanpa mengangkat dengan tenaga manusia (ノーリフティング).","lawn":"","care":"Gunakan スライディングボード atau スライディングシート untuk pindah posisi di tempat tidur. Sakit pinggang adalah alasan utama staf berhenti bekerja.","ox":[["Body mechanics & K3","","","Posisi ini membebani pinggang. Tekuk lutut dan rendahkan pusat gravitasi."],["Body mechanics & K3","","","Pusat gravitasi staf dan pengguna harus didekatkan agar beban lebih ringan."],["Body mechanics & K3","","","Pedoman pencegahan sakit pinggang di tempat kerja (厚生労働省, 2013) menyatakan prinsip tidak mengangkat pengguna dengan tenaga manusia dan memakai alat seperti lift atau papan geser."],["Body mechanics & K3","","","Bidang tumpu harus diperlebar (kaki dibuka) agar stabil."],["Body mechanics & K3","","","Memuntir badan adalah penyebab utama cedera pinggang; arahkan ujung kaki ke arah gerakan."]]},{"id":"P39-s04-07","y":39,"n":37,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["{{介護老人福祉施設|かいごろうじんふくししせつ}}（{{特別養護老人|とくべつようごろうじん}}ホーム）に{{新|あたら}}たに{{入所|にゅうしょ}}できる{{者|もの}}の{{要件|ようけん}}として、{{原則|げんそく}}として{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Pada prinsipnya, apa syarat orang yang bisa masuk baru ke panti perawatan lansia khusus (特別養護老人ホーム)? Pilih satu yang BENAR."],"o":["{{要支援|ようしえん}}2{{以上|いじょう}}","{{要介護|ようかいご}}1{{以上|いじょう}}","{{要介護|ようかいご}}3{{以上|いじょう}}","{{要介護|ようかいご}}5のみ","{{年齢|ねんれい}}や{{要介護|ようかいご}}{{度|ど}}にかかわらず、{{誰|だれ}}でも{{入所|にゅうしょ}}できる"],"oTr":["Kebutuhan dukungan 2 ke atas","Tingkat perawatan 1 ke atas","Tingkat perawatan 3 ke atas","Hanya tingkat perawatan 5","Siapa pun bisa masuk tanpa memandang usia atau tingkat perawatan"],"a":2,"p":"特養 (介護老人福祉施設) = prinsipnya 要介護3 ke atas (sejak 2015). 老健 (介護老人保健施設) = 要介護1 ke atas, tujuan rehabilitasi untuk pulang ke rumah. 介護医療院 = 要介護1 ke atas, kebutuhan medis jangka panjang.","lawn":"","care":"Bila keluarga bertanya \"kenapa tidak bisa masuk 特養?\", jelaskan syarat 要介護3 dan arahkan ke care manager untuk alternatif (老健, グループホーム, dsb.).","ox":[["Hukum (layanan)","","","Orang dengan 要支援 tidak bisa masuk 特養."],["Hukum (layanan)","","","Sejak April 2015 syaratnya dinaikkan menjadi 要介護3 ke atas (要介護1–2 hanya dalam keadaan khusus/特例入所)."],["Hukum (layanan)","","","Pada prinsipnya hanya 要介護3–5. 要介護1–2 bisa masuk lewat 特例入所 bila ada alasan khusus, misalnya demensia berat atau kekerasan."],["Hukum (layanan)","","","要介護3 dan 4 juga memenuhi syarat."],["Hukum (layanan)","","","Ada syarat sertifikasi; 特養 adalah fasilitas asuransi perawatan."]]},{"id":"P39-s04-08","y":39,"n":38,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["{{多職種連携|たしょくしゅれんけい}}において、{{利用者|りようしゃ}}の{{嚥下機能|えんげきのう}}の{{評価|ひょうか}}や{{言語訓練|げんごくんれん}}を{{主|おも}}に{{担当|たんとう}}する{{専門職|せんもんしょく}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。"],"sTr":["Dalam kerja sama antarprofesi, profesi mana yang PALING tepat sebagai penanggung jawab utama penilaian fungsi menelan dan latihan bahasa pengguna?"],"o":["{{理学療法士|りがくりょうほうし}}（PT）","{{言語聴覚士|げんごちょうかくし}}（ST）","{{作業療法|さぎょうりょうほう}}{{士|し}}（OT）","{{介護支援専門員|かいごしえんせんもんいん}}","{{管理栄養士|かんりえいようし}}"],"oTr":["Fisioterapis (PT)","Terapis wicara (ST)","Terapis okupasi (OT)","Manajer perawatan (care manager)","Ahli gizi terdaftar"],"a":1,"p":"PT = gerak dasar (起居・歩行); OT = aktivitas hidup sehari-hari dan aktivitas bermakna; ST = bicara, bahasa, pendengaran, menelan; 管理栄養士 = gizi dan bentuk makanan; 介護支援専門員 = care plan dan koordinasi.","lawn":"","care":"Bila pengguna sering tersedak saat minum, laporkan pengamatan spesifik (jenis makanan, posisi, frekuensi) agar ST dan perawat medis bisa menilai.","ox":[["Kerja sama antarprofesi","","","PT terutama menangani kemampuan gerak dasar, misalnya duduk, berdiri, dan berjalan."],["Kerja sama antarprofesi","","","ST menangani gangguan bicara, bahasa, pendengaran, dan menelan (嚥下)."],["Kerja sama antarprofesi","","","OT terutama menangani kegiatan hidup sehari-hari dan aktivitas yang bermakna, misalnya makan dengan alat bantu atau kegiatan kreatif."],["Kerja sama antarprofesi","","","Care manager menyusun care plan dan mengoordinasi layanan, bukan terapi menelan."],["Kerja sama antarprofesi","","","Kurang tepat. Ahli gizi menyesuaikan bentuk dan gizi makanan, tetapi penilaian fungsi menelan dan latihannya terutama dilakukan ST."]]},{"id":"P39-s04-09","y":39,"n":39,"s":"s04","subj":"介護の基本","pred":1,"law":false,"stem":["Gさん（30{{歳|さい}}、{{女性|じょせい}}）は、{{特別養護老人|とくべつようごろうじん}}ホームで{{働|はたら}}く{{介護福祉士|かいごふくしし}}である。{{最近|さいきん}}、{{夜勤|やきん}}が{{続|つづ}}き、「{{仕事|しごと}}に{{行く|いく}}のがつらい」「{{利用者|りようしゃ}}に{{優|やさ}}しくできない」と{{同僚|どうりょう}}に{{話|はな}}している。{{以前|いぜん}}は{{仕事|しごと}}{{熱心|ねっしん}}で、{{休日|きゅうじつ}}も{{研修|けんしゅう}}に{{参加|さんか}}していた。","Gさんの{{状態|じょうたい}}として、{{最|もっと}}も{{可能性|かのうせい}}が{{高|たか}}いものを1つ{{選|えら}}びなさい。"],"sTr":["Bu G (30 tahun, perempuan) adalah 介護福祉士 yang bekerja di panti perawatan lansia khusus. Belakangan ini ia terus mendapat giliran malam dan berkata kepada rekannya, \"Berat rasanya pergi kerja,\" dan \"Aku tidak bisa bersikap lembut kepada pengguna.\" Dulu ia sangat bersemangat bekerja dan bahkan ikut pelatihan di hari libur.","Pilih satu keadaan yang PALING mungkin dialami Bu G."],"o":["{{自己覚知|じこかくち}}","{{共依存|きょういぞん}}（co-dependency）","パーソナリティ{{障害|しょうがい}}","{{心的外傷後|しんてきがいしょうご}}ストレス{{障害|しょうがい}}（PTSD）","{{燃|も}}え{{尽|つ}}き{{症候群|しょうこうぐん}}（バーンアウト）"],"oTr":["Kesadaran diri","Kodependensi","Gangguan kepribadian","Gangguan stres pascatrauma (PTSD)","Sindrom burnout"],"a":4,"p":"Burnout (燃え尽き症候群): kelelahan emosional + 脱人格化 (bersikap dingin kepada pengguna) + rasa pencapaian menurun. Sering pada orang yang awalnya sangat bersemangat. Pencegahan: berbagi di tim, istirahat cukup, konsultasi, 1on1.","lawn":"","care":"Bila rekan berkata \"aku tidak bisa lembut lagi\", dengarkan dan sarankan bicara dengan atasan. Fasilitas juga wajib melakukan stress check tahunan (50 karyawan ke atas).","ox":[["Kesehatan mental staf","","","自己覚知 adalah proses mengenali diri, bukan keadaan kelelahan."],["Kesehatan mental staf","","","共依存 adalah hubungan saling bergantung yang tidak sehat antara dua orang, misalnya pasangan dengan masalah alkohol, bukan kelelahan akibat kerja."],["Kesehatan mental staf","","","Gangguan kepribadian adalah pola jangka panjang sejak lama, bukan perubahan setelah beban kerja meningkat."],["Kesehatan mental staf","","","PTSD muncul setelah peristiwa traumatis tertentu (bencana, kecelakaan, kekerasan) dengan gejala kilas balik dan menghindar. Kasus ini tidak menyebut peristiwa seperti itu."],["Kesehatan mental staf","","","Orang yang dulu sangat bersemangat, lalu kelelahan emosional, kehilangan empati kepada pengguna (脱人格化), dan merasa pencapaiannya turun adalah gambaran khas burnout."]]},{"id":"P39-s04-10","y":39,"n":40,"s":"s04","subj":"介護の基本","pred":1,"law":true,"stem":["{{介護|かいご}}サービス{{事業所|じぎょうしょ}}における{{業務|ぎょうむ}}{{継続|けいぞく}}{{計画|けいかく}}（BCP）に{{関|かん}}する{{次|つぎ}}の{{記述|きじゅつ}}のうち、{{正|ただ}}しいものを1つ{{選|えら}}びなさい。"],"sTr":["Mana pernyataan yang BENAR tentang rencana kelangsungan usaha (BCP) di kantor layanan perawatan?"],"o":["BCPの{{策定|さくてい}}は、{{介護保険施設|かいごほけんしせつ}}だけに{{求|もと}}められている。","BCPは、{{感染症|かんせんしょう}}と{{自然災害|しぜんさいがい}}の{{両方|りょうほう}}について{{策定|さくてい}}する。","BCPは{{一度|いちど}}{{作成|さくせい}}すれば、{{見直|みなお}}す{{必要|ひつよう}}はない。","BCPの{{目的|もくてき}}は、{{災害時|さいがいじ}}にすべてのサービスを{{中止|ちゅうし}}することである。","BCPの{{研修|けんしゅう}}や{{訓練|くんれん}}は、{{管理者|かんりしゃ}}だけが{{受|う}}ければよい。"],"oTr":["Penyusunan BCP hanya diwajibkan bagi fasilitas asuransi perawatan (panti).","BCP disusun untuk penyakit menular dan bencana alam.","Setelah dibuat sekali, BCP tidak perlu ditinjau ulang.","Tujuan BCP adalah menghentikan semua layanan saat bencana.","Pelatihan dan simulasi BCP cukup diikuti manajer saja."],"a":1,"p":"BCP wajib untuk semua penyedia sejak April 2024 (masa transisi berakhir): penyakit menular + bencana alam, pelatihan dan simulasi rutin, tinjauan berkala. Tanpa BCP ada pemotongan tarif (業務継続計画未策定減算).","lawn":"Kewajiban BCP berlaku penuh sejak 1 April 2024 dan disertai 減算 bagi penyedia yang belum menyusunnya.","care":"Ketahui peranmu di BCP fasilitas: siapa yang dihubungi, di mana persediaan air, makanan, dan obat, serta urutan layanan yang harus dilanjutkan.","ox":[["Hukum (manajemen layanan)","","","Semua penyedia layanan asuransi perawatan, termasuk layanan kunjungan dan harian, wajib menyusun BCP."],["Hukum (manajemen layanan)","","","Sejak April 2024 semua penyedia wajib menyusun BCP untuk 感染症 dan 自然災害, melakukan pelatihan dan simulasi rutin, serta meninjaunya secara berkala."],["Hukum (manajemen layanan)","","","BCP wajib ditinjau secara berkala dan diperbarui."],["Hukum (manajemen layanan)","","","Tujuannya justru melanjutkan layanan penting (atau memulihkannya secepat mungkin) walaupun terjadi bencana."],["Hukum (manajemen layanan)","","","Pelatihan dan simulasi dilakukan untuk seluruh staf."]]}],"VDB":[["s01","尊厳","そんげん","martabat","{{利用者|りようしゃ}}の{{尊厳|そんげん}}を{{守|まも}}る{{介護|かいご}}が{{大切|たいせつ}}だ。","Perawatan yang menjaga martabat pengguna itu penting."],["s01","自立支援","じりつしえん","dukungan kemandirian","{{自立支援|じりつしえん}}のため、できることは{{本人|ほんにん}}にしてもらう。","Demi kemandirian, hal yang bisa dilakukan sendiri diserahkan kepada pengguna."],["s01","自己決定","じこけってい","menentukan sendiri (hak memilih)","{{本人|ほんにん}}の{{自己決定|じこけってい}}を{{尊重|そんちょう}}する。","Menghormati keputusan yang dibuat pengguna sendiri."],["s01","権利擁護","けんりようご","perlindungan/advokasi hak","{{権利擁護|けんりようご}}のために{{成年後見制度|せいねんこうけんせいど}}を{{利用|りよう}}する。","Memakai sistem perwalian dewasa untuk melindungi hak."],["s01","身体拘束","しんたいこうそく","pengekangan fisik","{{身体拘束|しんたいこうそく}}は{{原則|げんそく}}として{{禁止|きんし}}されている。","Pada prinsipnya pengekangan fisik dilarang."],["s01","虐待","ぎゃくたい","kekerasan, penganiayaan","{{虐待|ぎゃくたい}}を{{発見|はっけん}}したら{{市町村|しちょうそん}}に{{通報|つうほう}}する。","Jika menemukan kekerasan, laporkan ke kantor kota/desa."],["s01","生活の質","せいかつのしつ","kualitas hidup (QOL)","{{生活|せいかつ}}の{{質|しつ}}を{{高|たか}}める{{支援|しえん}}を{{考|かんが}}える。","Memikirkan bantuan yang meningkatkan kualitas hidup."],["s01","個人の尊重","こじんのそんちょう","penghormatan terhadap individu","{{憲法|けんぽう}}13{{条|じょう}}は{{個人|こじん}}の{{尊重|そんちょう}}を{{定|さだ}}めている。","Pasal 13 konstitusi mengatur penghormatan terhadap individu."],["s04","介護福祉士","かいごふくしし","kaigo fukushishi (careworker bersertifikat negara)","{{介護福祉士|かいごふくしし}}は{{名称独占|めいしょうどくせん}}の{{資格|しかく}}だ。","Kaigo fukushishi adalah kualifikasi dengan monopoli gelar."],["s04","秘密保持義務","ひみつほじぎむ","kewajiban menjaga rahasia","{{秘密保持義務|ひみつほじぎむ}}は{{退職後|たいしょくご}}も{{続|つづ}}く。","Kewajiban menjaga rahasia tetap berlaku setelah berhenti kerja."],["s04","多職種連携","たしょくしゅれんけい","kerja sama lintas profesi","{{多職種連携|たしょくしゅれんけい}}で{{利用者|りようしゃ}}を{{支|ささ}}える。","Mendukung pengguna lewat kerja sama lintas profesi."],["s04","個別ケア","こべつけあ","perawatan individual","{{一人|ひとり}}ひとりに{{合|あ}}わせた{{個別|こべつ}}ケアを{{行|おこな}}う。","Memberikan perawatan yang disesuaikan untuk tiap orang."],["s04","感染予防","かんせんよぼう","pencegahan infeksi","{{感染予防|かんせんよぼう}}の{{基本|きほん}}は{{手洗|てあら}}いだ。","Dasar pencegahan infeksi adalah cuci tangan."],["s04","事故防止","じこぼうし","pencegahan kecelakaan","{{事故防止|じこぼうし}}のため、ヒヤリ・ハットを{{報告|ほうこく}}する。","Untuk mencegah kecelakaan, laporkan kejadian nyaris celaka."],["s04","残存機能","ざんそんきのう","kemampuan yang masih tersisa","{{残存機能|ざんそんきのう}} <script>/* ===== Ekosistem terpadu: login VIP, demo, splash, switcher NihongoLink ⇄ Kaigo VIP ===== */
window.NLU=(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},r:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const U={pend:null,frameKey:null};
U.demo=()=>LS.g('nl_demo','')==='1';
U.logged=()=>!!(window.FB&&FB.user)||U.demo();
U.name=()=>{const u=window.FB&&FB.user;return u?(u.displayName||u.email||'').split(' ')[0]:''};
/* ---------- tema ---------- */
U.dark=()=>LS.g('nl_theme','light')==='dark';
U.theme=d=>{LS.s('nl_theme',d?'dark':'light');LS.s('klv-theme',d?'dark':'light');document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.classList.toggle('nlu-dark',d);
 document.querySelectorAll('#thm [data-th]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.th==='dark')===d));try{const w=$('#kvf')&&$('#kvf').contentWindow;w&&w.KLVAPI&&w.KLVAPI.theme(d)}catch(e){}};
/* ---------- splash ---------- */
U.splash=(go)=>{const el=document.createElement('div');el.id='nlsplash';el.innerHTML=`<div class="sp-in"><div class="sp-logos"><span class="sp-l"><img src="${NL_LOGO}" alt="NihongoLink"></span><span class="sp-x">×</span><span class="sp-l"><img src="${KLV_LOGO}" alt="Kaigo Link"></span></div><small>VIP Learning · 日本語 &amp; 介護</small><div class="sp-bar"><i></i></div></div>`;
 document.body.appendChild(el);setTimeout(()=>{go&&go();el.classList.add('out');setTimeout(()=>el.remove(),450)},1500)};
U.enter=prog=>{U.pend=null;sessionStorage.removeItem('nlu_pend');U.splash(()=>{location.hash=prog==='k'?'kaigovip':'beranda'})};
/* ---------- modal login ---------- */
U.openLogin=(prog)=>{U.pend=prog||'n';sessionStorage.setItem('nlu_pend',U.pend);if(U.logged()){U.enter(U.pend);return}
 let m=$('#nlm');if(!m){m=document.createElement('div');m.id='nlm';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-labelledby','nlmt');document.body.appendChild(m)}
 const ready=window.FB&&FB.ready&&FB.login&&!FB.failed;
 m.innerHTML=`<div class="lm-box"><button class="lm-x" id="lmx" aria-label="Tutup">✕</button><div class="lm-logos"><span><img src="${NL_LOGO}" alt="NihongoLink"></span><span><img src="${KLV_LOGO}" alt="Kaigo Link"></span></div>

const KGUIDE=[
['Apa itu hiragana dan katakana?',`Bahasa Jepang memakai 3 jenis huruf sekaligus:
• <b>Hiragana</b> (ひらがな): huruf dasar untuk kata asli Jepang, partikel (は, を, に), dan akhiran kata kerja. Bentuknya bulat dan lembut.
• <b>Katakana</b> (カタカナ): untuk kata serapan dari bahasa asing (テレビ = televisi), nama orang asing (インドネシア), dan bunyi tiruan. Bentuknya tegas dan bersudut.
• <b>Kanji</b> (漢字): huruf dari China yang punya arti.
Satu huruf hiragana/katakana = satu bunyi (suku kata). Jadi kalau sudah hafal 46 huruf, kamu sudah bisa membaca semua bunyi bahasa Jepang.`],
['Cara membaca tabel',`Tabel disusun per baris. Baris pertama adalah 5 vokal: <b>a i u e o</b>.
Baris berikutnya = konsonan + vokal: か (ka) き (ki) く (ku) け (ke) こ (ko), begitu seterusnya.
Ada beberapa bunyi yang <b>tidak mengikuti pola</b>, hafalkan khusus:
• し = <b>shi</b> (bukan si) · ち = <b>chi</b> (bukan ti) · つ = <b>tsu</b> (bukan tu)
• ふ = <b>fu</b> (antara f dan h) · ん = <b>n</b> (satu-satunya huruf tanpa vokal)
• を = dibaca <b>o</b>, hanya dipakai sebagai partikel.`],
['Aturan dasar menulis',`1. Dari <b>atas ke bawah</b>.
2. Dari <b>kiri ke kanan</b>.
3. Garis <b>datar biasanya lebih dulu</b> daripada garis tegak yang memotongnya (contoh: き, た).
4. Tenten ゛ dan maru ゜ selalu ditulis <b>paling akhir</b>.
5. Perhatikan cara mengakhiri coretan:
• <b>とめ (tome)</b> = berhenti tegas.
• <b>はね (hane)</b> = diakhiri kait kecil (contoh: ujung kiri い).
• <b>はらい (harai)</b> = disapu tipis sampai hilang (contoh: ujung あ).

async function kvg(c){
  if(cache.has(c))return cache.get(c);

    const r=await fetch(url(c));if(!r.ok)throw new Error('notfound');

    if(!paths.length)throw new Error('empty');
    const nums=[...doc.querySelectorAll('text')].map(t=>{const m=/matrix\(1 0 0 1 ([\d.]+) ([\d.]+)\)/.exec(t.getAttribute('transform')||'');return m?{n:+t.textContent,x:+m[1],y:+m[2]}:null}).filter(Boolean);
    return {d:paths.map(p=>p.d),nums};
