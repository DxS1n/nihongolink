(()=>{const KR=/[一-鿿々〆ヶ]+/g,HI=/[ぁ-ゖ]/,DG=/[0-9０-９]/;

const NOF='.face,.kgrid,.kk,.som,.wbtn,[data-so],.nofuri,.kj,.qcard.nofuri,input,textarea,script,style,svg,rt,ruby,.logo,.lvp,.tabs,.chips';
const seg=(run,hira,prevDigit)=>{const D=window.FURI_D||{},out=[];let k=0;
 if(prevDigit&&NUMC[run[0]]){out.push([run[0],NUMC[run[0]]]);k=1}
 const rest=run.slice(k);if(!rest)return out;
 if(hira&&D[rest+hira]!=null){out.push([rest,D[rest+hira]]);return out}
 if(D[rest]!=null){out.push([rest,D[rest]]);return out}
 let i=0;while(i<rest.length){let f=false;for(let L=rest.length-i;L>=1;L--){const pc=rest.substr(i,L),last=i+L===rest.length,k2=last&&hira?pc+hira:null;
  if((L>=2||rest.length===1)&&(D[pc]!=null||(k2&&D[k2]!=null))){out.push([pc,k2&&D[k2]!=null?D[k2]:D[pc]]);i+=L;f=true;break}}
  if(!f){out.push([rest[i],null]);i++}}
 return out};
const annotate=node=>{const t=node.nodeValue;if(!t||!KR.test(t))return;KR.lastIndex=0;const fr=document.createDocumentFragment();let i=0,m,any=false;
 while((m=KR.exec(t))){const s=m.index,e=s+m[0].length;if(s>i)fr.appendChild(document.createTextNode(t.slice(i,s)));const nx=t[e]||'',pd=s>0&&DG.test(t[s-1]);
  for(const [txt,rd] of seg(m[0],HI.test(nx)?nx:'',pd)){if(rd){const r=document.createElement('ruby');r.appendChild(document.createTextNode(txt));const rt=document.createElement('rt');rt.textContent=rd;r.appendChild(rt);fr.appendChild(r);any=true}else fr.appendChild(document.createTextNode(txt))}
  i=e}
 if(!any)return;if(i<t.length)fr.appendChild(document.createTextNode(t.slice(i)));node.parentNode.replaceChild(fr,node)};
const walk=root=>{if(!root)return;if(root.nodeType===3){const p=root.parentElement;if(p&&!p.closest(NOF))annotate(root);return}if(root.nodeType!==1||root.closest&&root.closest(NOF))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{KR.lastIndex=0;if(!KR.test(n.nodeValue))return 2;const p=n.parentElement;return p&&!p.closest(NOF)?1:2}});const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(annotate)};
NL.furiWalk=walk;
let q=new Set(),sch=false;const flush=()=>{sch=false;const a=[...q];q.clear();a.forEach(n=>{if(n.isConnected)walk(n)})};
const start=()=>{const m=document.getElementById('main');if(!m)return;walk(m);new MutationObserver(ms=>{ms.forEach(x=>x.addedNodes.forEach(n=>q.add(n)));if(!sch){sch=true;requestAnimationFrame(flush)}}).observe(m,{childList:true,subtree:true});

<script>const EMBED={"N5":{"lv":"N5","jp":"えぬご","cefr":"≈ A1","stats":[["±100","kanji"],["±800","kosakata"],["±80 pola","bunpou"],["3–4 bulan","lama belajar"]],"fokus":"Hiragana, katakana, kalimat です/ます, partikel dasar, bentuk て. Bisa membaca kalimat pendek tentang kehidupan sehari-hari.","tips":[["Pakai, jangan hanya hafal","Setiap pola bunpou baru wajib kamu pakai dalam 3 kalimat tentang hidupmu sendiri. Kalimat milikmu jauh lebih mudah diingat daripada contoh buku."],["Pengulangan berjarak (SRS)","Ulangi kosakata dan kanji tepat sebelum lupa: besok, 3 hari, 7 hari, 2 minggu. Pakai Anki atau tombol \"Sudah hafal\" di bagian kanji."],["Ingat aktif, bukan baca ulang","Tutup jawabannya lalu coba ingat. Usaha mengingat itulah yang menguatkan memori, bukan membaca berkali-kali."],["Kanji lewat kata","Belajar 食 bersama 食べます dan 食堂. Satu kanji, dua kata, satu kalimat. Bacaan on dan kun akan menempel dengan sendirinya."],["Shadowing setiap hari","Dengarkan audio pendek, tirukan dengan jeda setengah detik. Melatih telinga untuk choukai dan mulut untuk kaiwa sekaligus."],["Buku salah","Tulis setiap soal yang salah beserta alasannya. Sebelum ujian, buku inilah yang paling berharga, bukan buku teks."]],"weeks":[["Hiragana & katakana","Baca lancar 2×46 huruf, salam dasar."],["です & kata tunjuk","は/です/か, これ・この・ここ, の."],["Partikel & ます","を・に・で・へ・と, bentuk ます dan lampau."],["Ada & angka","あります/います, posisi, jam, harga."],["Kata sifat","い dan な, すき/じょうず, kalimat sifat lampau."],["Bentuk て (1)","てください, ています, てから."],["Bentuk て (2)","てもいい, てはいけない, ないでください, たり, から."],["Banding & tryout","より/いちばん, まえに/あとで, 2× tryout penuh."]],"sched":[["0–10","Ulang kartu SRS","Kanji dan kosakata yang jatuh tempo hari ini."],["10–25","1 pola bunpou baru","Baca rumus, tutup contoh, buat 3 kalimat sendiri."],["25–35","Shadowing","Audio 1–2 menit, ulangi 3 kali."],["35–50","10 soal latihan","Kerjakan dengan timer, catat yang salah di buku salah."],["50–60","Bicara 1 menit","Rekam dirimu memakai pola hari ini, dengarkan lagi."]],"g":[{"c":"Dasar","p":"～は～です","a":"A adalah B (kalimat sopan)","f":"N1 は N2 です","ex":"わたしは がくせいです。","rd":"watashi wa gakusei desu.","id":"Saya pelajar.","n":"Partikel は dibaca \"wa\", bukan \"ha\". Minna bab 1","x":"Pola ini dipakai untuk memperkenalkan diri atau menjelaskan \"A adalah B\". Ini pola pertama yang wajib kamu kuasai.\n▶ Cara pakai\n• Tulis topik (yang dibicarakan), lalu tempel 「は」 (dibaca wa, bukan ha).\n• Tulis keterangannya, lalu tutup dengan 「です」 (de-su) supaya sopan.\n• Kalau topiknya sudah jelas, boleh dihilangkan: 「がくせいです」 (ga-ku-se-i de-su) = \"(Saya) pelajar.\"\n▶ Contoh lain\n• 「わたしは アンディです。」 (wa-ta-shi wa a-n-di de-su) = Saya Andi.\n• 「やまださんは せんせいです。」 (ya-ma-da-sa-n wa se-n-se-i de-su) = Pak Yamada adalah guru.\n▶ Hati-hati\n• です hanya untuk kata benda dan kata sifat. Jangan ditempel ke kata kerja: ✗ たべますです.","m":"は = \"nah, soal ...\" (penunjuk topik), です = titik sopan di ujung. Topik は, isi です.","rs":"wa-ta-shi wa ga-ku-se-i de-su.","pr":"~ wa ~ de-su"},{"c":"Dasar","p":"～じゃありません","a":"bukan","f":"N じゃありません / ではありません","ex":"これは わたしの ほんじゃありません。","rd":"kore wa watashi no hon ja arimasen.","id":"Ini bukan buku saya.","n":"ではありません lebih formal; keduanya benar di soal. Minna bab 1","x":"Ini bentuk \"bukan\" dari です. Dipakai untuk membantah atau menjelaskan bahwa sesuatu bukan seperti itu.\n▶ Cara pakai\n• Ganti 「です」 dengan 「じゃありません」 (ja-a-ri-ma-se-n).\n• Dalam tulisan atau situasi formal, pakai 「ではありません」 (de-wa a-ri-ma-se-n). Artinya sama.\n▶ Contoh lain\n• 「わたしは せんせいじゃありません。」 (wa-ta-shi wa se-n-se-i ja-a-ri-ma-se-n) = Saya bukan guru.\n• 「いいえ、にほんじんじゃありません。」 (i-i-e, ni-ho-n-ji-n ja-a-ri-ma-se-n) = Tidak, (saya) bukan orang Jepang.\n▶ Hati-hati\n• Untuk masa lalu, tambahkan でした: 「じゃありませんでした」 = dulu bukan.\n• Jangan tulis ✗ じゃないです dalam soal formal; pilih じゃありません.","m":"じゃ ありません = \"jangan anggap begitu, bukan!\" Ujungnya ありません = tidak ada.","rs":"ko-re wa wa-ta-shi-no ho-n ja-a-ri-ma-se-n.","pr":"~ ja-a-ri-ma-se-n"},{"c":"Dasar","p":"～ですか","a":"kalimat tanya","f":"Kalimat + か","ex":"あなたは にほんじんですか。","rd":"anata wa nihonjin desu ka.","id":"Apakah Anda orang Jepang?","n":"Tidak perlu tanda tanya; か sudah membuat kalimat tanya. Minna bab 1","x":"Cara paling mudah membuat pertanyaan: tempel 「か」 (ka) di akhir kalimat sopan.\n▶ Cara pakai\n• Buat kalimat biasa dengan です atau ます.\n• Tambahkan 「か」 di akhir, dan naikkan nada suara.\n• Tanda tanya (？) tidak wajib, karena か sudah berarti pertanyaan.\n▶ Cara menjawab\n• Setuju: 「はい、そうです。」 (ha-i, so-u de-su) = Ya, benar.\n• Tidak: 「いいえ、ちがいます。」 (i-i-e, chi-ga-i-ma-su) = Bukan.\n▶ Contoh lain\n• 「これは ペンですか。」 (ko-re wa pe-n de-su-ka) = Apakah ini pena?\n▶ Hati-hati\n• Kalau ada kata tanya (なん, だれ, どこ), jangan jawab はい atau いいえ. Langsung jawab isinya.","m":"か = tanda tanya Jepang. Tinggal tempel か di belakang, nada naik.","rs":"a-na-ta wa ni-ho-n-ji-n de-su-ka.","pr":"~ de-su-ka"},{"c":"Partikel","p":"～の","a":"milik / keterangan benda","f":"N1 の N2","ex":"これは にほんごの ほんです。","rd":"kore wa nihongo no hon desu.","id":"Ini buku bahasa Jepang.","n":"Urutan terbalik dari bahasa Indonesia: \"buku bahasa Jepang\" = にほんご の ほん. Minna bab 1","x":"「の」 (no) menghubungkan dua kata benda. Kata benda yang di depan menjelaskan kata benda yang di belakang.\n▶ Cara pakai\n• Urutannya kebalikan bahasa Indonesia: [penjelas] の [benda utama].\n• \"Buku saya\" = 「わたしの ほん」 (wa-ta-shi no ho-n).\n• の bisa berarti milik, asal, bahan, atau jenis.\n▶ Contoh lain\n• 「にほんの くるま」 (ni-ho-n no ku-ru-ma) = mobil (buatan) Jepang.\n• 「IMCの しゃいん」 (IMC no sha-i-n) = karyawan IMC.\n• Kalau bendanya sudah jelas, boleh dihilangkan: 「これは わたしのです」 = Ini punya saya.\n▶ Hati-hati\n• Jangan dibalik: ✗ ほんの わたし.","m":"の = \"punya\". Yang punya di depan, barangnya di belakang: わたし の ほん.","rs":"ko-re wa ni-ho-n-go-no ho-n de-su.","pr":"~ no"},{"c":"Partikel","p":"～も","a":"juga","f":"N も","ex":"わたしも がくせいです。","rd":"watashi mo gakusei desu.","id":"Saya juga pelajar.","n":"も menggantikan は/が/を, jangan ditulis はも. Minna bab 1","x":"「も」 (mo) artinya \"juga\". Dipakai saat keterangan yang sama berlaku untuk hal lain.\n▶ Cara pakai\n• Ganti は dengan も: 「わたしは がくせいです」 → 「わたしも がくせいです」 (wa-ta-shi mo ga-ku-se-i de-su) = Saya juga pelajar.\n• も juga menggantikan が dan を.\n▶ Contoh lain\n• 「リンさんも いしゃです。」 (ri-n-sa-n mo i-sha de-su) = Lin juga dokter.\n• 「コーヒーも のみます。」 (ko-o-hi-i mo no-mi-ma-su) = Saya juga minum kopi.\n▶ Hati-hati\n• Jangan ditumpuk: ✗ はも, ✗ をも.\n• Dalam kalimat negatif, も bisa berarti \"pun tidak\": 「なにも たべません」 = tidak makan apa pun.","m":"も = \"mo juga\". Ganti は/が/を dengan も, jangan ditumpuk.","rs":"wa-ta-shi-mo ga-ku-se-i de-su.","pr":"~ mo"},{"c":"Dasar","p":"これ・それ・あれ・どれ","a":"ini / itu / itu (jauh) / yang mana","f":"これ は N です","ex":"それは なんですか。","rd":"sore wa nan desu ka.","id":"Itu apa?","n":"これ berdiri sendiri; tidak boleh langsung diikuti kata benda. Minna bab 2","x":"Kata tunjuk untuk benda. Keempatnya berdiri sendiri seperti kata benda.\n▶ Cara pakai\n• 「これ」 (ko-re): benda dekat saya.\n• 「それ」 (so-re): benda dekat kamu.\n• 「あれ」 (a-re): benda jauh dari kita berdua.\n• 「どれ」 (do-re): yang mana? (dari 3 pilihan atau lebih)\n▶ Contoh lain\n• 「これは なんですか。」 (ko-re wa na-n de-su-ka) = Ini apa?\n• 「あれは わたしの かさです。」 (a-re wa wa-ta-shi no ka-sa de-su) = Itu payung saya.\n▶ Hati-hati\n• これ tidak boleh langsung diikuti kata benda: ✗ これ ほん. Kalau mau, pakai この ほん.","m":"こ = dekat saya, そ = dekat kamu, あ = jauh dua-duanya, ど = tanya. Satu pola untuk semua kata tunjuk.","rs":"so-re wa na-n de-su-ka.","pr":"ko-re / so-re / a-re / do-re"}],"k":[{"k":"一","on":"イチ","kun":"ひと(つ)","m":"satu","w":"一つ","wr":"ひとつ","wm":"satu buah","c":"Angka & uang"},{"k":"七","on":"シチ","kun":"なな","m":"tujuh","w":"七時","wr":"しちじ","wm":"jam tujuh","c":"Angka & uang"},{"k":"万","on":"マン","kun":"-","m":"sepuluh ribu","w":"一万円","wr":"いちまんえん","wm":"10.000 yen","c":"Angka & uang"},{"k":"三","on":"サン","kun":"みっ(つ)","m":"tiga","w":"三月","wr":"さんがつ","wm":"Maret","c":"Angka & uang"},{"k":"上","on":"ジョウ","kun":"うえ","m":"atas","w":"上手","wr":"じょうず","wm":"pandai","c":"Arah & posisi"},{"k":"下","on":"カ・ゲ","kun":"した","m":"bawah","w":"下手","wr":"へた","wm":"tidak pandai","c":"Arah & posisi"},{"k":"中","on":"チュウ","kun":"なか","m":"tengah, dalam","w":"中国","wr":"ちゅうごく","wm":"Tiongkok","c":"Arah & posisi"},{"k":"九","on":"キュウ・ク","kun":"ここの(つ)","m":"sembilan","w":"九時","wr":"くじ","wm":"jam sembilan","c":"Angka & uang"},{"k":"二","on":"ニ","kun":"ふた(つ)","m":"dua","w":"二人","wr":"ふたり","wm":"dua orang","c":"Angka & uang"},{"k":"五","on":"ゴ","kun":"いつ(つ)","m":"lima","w":"五分","wr":"ごふん","wm":"lima menit","c":"Angka & uang"},{"k":"人","on":"ジン・ニン","kun":"ひと","m":"orang","w":"日本人","wr":"にほんじん","wm":"orang Jepang","c":"Orang & tubuh"},{"k":"今","on":"コン","kun":"いま","m":"sekarang","w":"今日","wr":"きょう","wm":"hari ini","c":"Hari & waktu"}],"v":{"Salam & ungkapan":[["おはようございます","","selamat pagi"],["こんにちは","","selamat siang"],["こんばんは","","selamat malam"],["ありがとうございます","","terima kasih"],["すみません","","maaf / permisi"],["いただきます","","(sebelum makan)"]],"Waktu":[["きょう","今日","hari ini"],["あした","明日","besok"],["きのう","昨日","kemarin"],["まいにち","毎日","setiap hari"],["あさ","朝","pagi"],["ひる","昼","siang"]]},"q":{"JLPT N5":[{"s":"Kosakata · bacaan kanji","q":"あしたは 雨です。","c":"Bagaimana cara membaca 雨?","o":["あめ","ゆき","かさ","くも"],"e":"雨 = あめ (hujan). ゆき = salju (雪), くも = awan (雲).","oe":["Benar. 雨 = あめ (hujan).","ゆき = salju, kanjinya 雪.","かさ = payung (傘), bukan cara baca 雨.","くも = awan (雲)."]},{"s":"Kosakata · bacaan kanji","q":"毎日 にほんごを べんきょうします。","c":"Cara baca 毎日?","o":["まいにち","まいび","まいひ","めいにち"],"e":"毎日 = まいにち. Ingat juga 毎週 まいしゅう, 毎年 まいとし.","oe":["Benar. 毎日 = まいにち (setiap hari). 日 dibaca にち.","日 di sini tidak dibaca び.","Bukan ひ; ひ dipakai sendiri (日 = hari) atau di 日曜日 (にちようび) tidak.","毎 dibaca まい, bukan めい."]},{"s":"Kosakata · penulisan","q":"この くるまは あたらしいです。","c":"Kanji untuk くるま?","o":["車","東","重","軍"],"e":"車 = くるま. 東 ひがし (timur), 重 berat, 軍 militer. Bentuknya mirip, perhatikan detail.","oe":["Benar. 車 = くるま (mobil).","東 = ひがし (timur). Bentuknya mirip 車 ditambah garis.","重 = おもい (berat).","軍 = ぐん (tentara). Ada atap di atas 車."]}],"Mendengarkan N5":[{"s":"Tugas (transkrip)","q":"女：すみません、ジュースを 2本と パンを 1つ ください。\n男：はい。ジュースは 1本 120円、パンは 150円です。","c":"Berapa yang harus dibayar perempuan itu?","o":["390円","270円","240円","420円"],"e":"2 × 120 + 150 = 390 yen.","oe":["Benar. Jus 120×2 = 240, ditambah roti 150 = 390 yen.","270 = satu jus + roti; padahal jusnya 2 botol.","240 = harga jus saja, roti belum dihitung.","420 = salah hitung (misalnya roti dihitung 2)."]},{"s":"Poin (transkrip)","q":"男：あした、何時に 会いましょうか。\n女：10時は どうですか。\n男：10時は ちょっと…。11時は どうですか。\n女：いいですよ。","c":"Jam berapa mereka bertemu besok?","o":["11時","10時","10時半","12時"],"e":"10時は ちょっと… = menolak halus. Disepakati jam 11.","oe":["Benar. Jam 10 ditolak (ちょっと…), lalu sepakat jam 11.","Jam 10 diusulkan tetapi ditolak.","10:30 tidak disebut.","Jam 12 tidak disebut."]},{"s":"Ungkapan (transkrip)","q":"Anda masuk ke rumah teman.","c":"Apa yang Anda katakan?","o":["おじゃまします","いってきます","ただいま","いただきます"],"e":"Masuk rumah orang lain: おじゃまします.","oe":["Benar. Saat masuk rumah orang: おじゃまします.","いってきます = saat pergi dari rumah sendiri.","ただいま = saat pulang ke rumah sendiri.","いただきます = sebelum makan."]}],"JFT-Basic":[{"s":"Huruf & kosakata","q":"入口","c":"Cara membacanya?","o":["いりぐち","でぐち","まどぐち","ひじょうぐち"],"e":"入口 いりぐち = pintu masuk. 出口 = pintu keluar, 窓口 = loket.","oe":["Benar. 入口 = いりぐち (pintu masuk).","でぐち = 出口 (pintu keluar).","まどぐち = 窓口 (loket).","ひじょうぐち = 非常口 (pintu darurat)."]},{"s":"Huruf & kosakata","q":"禁煙","c":"Arti papan ini?","o":["Dilarang merokok","Boleh merokok","Tempat merokok","Dilarang masuk"],"e":"禁 = larangan, 煙 = asap. 禁煙 きんえん.","oe":["Benar. 禁 = larang, 煙 = asap/rokok.","Kebalikannya; boleh merokok tidak ditulis 禁.","Tempat merokok = 喫煙所.","Dilarang masuk = 立入禁止."]},{"s":"Huruf & kosakata","q":"無料","c":"Arti tulisan ini?","o":["Gratis","Mahal","Diskon","Tutup"],"e":"無料 むりょう = gratis. 料金 = tarif.","oe":["Benar. 無料 = gratis (無 = tidak ada, 料 = biaya).","Mahal = 高い.","Diskon = 割引.","Tutup = 休み / 閉店."]}],"JLPT N5 · Paket 2":[{"s":"Bacaan kanji","q":"まいあさ 七時に おきます。","c":"Bagaimana cara membaca 七時?","o":["しちじ","なのじ","ななじ","しつじ"],"e":"七時 = しちじ (jam 7). Untuk jam, 7 dibaca しち: しちじ. ななじ juga terdengar dalam percakapan, tapi bacaan baku di JLPT adalah しちじ.","oe":["Benar. 七時 = しちじ.","なの dipakai untuk tanggal 7 (なのか), bukan jam.","Untuk jam, 7 dibaca しち, bukan なな.","しつじ = kata lain (pelayan rumah)."]},{"s":"Bacaan kanji","q":"この 山は とても 高いです。","c":"Bagaimana cara membaca 高い?","o":["たかい","ひくい","ながい","おおきい"],"e":"高い = たかい (tinggi / mahal). ひくい = 低い (rendah).","oe":["Benar. 高い = たかい (tinggi/mahal).","ひくい = 低い (rendah).","ながい = 長い (panjang).","おおきい = 大きい (besar)."]},{"s":"Bacaan kanji","q":"きのう 友だちと 映画を みました。","c":"Bagaimana cara membaca 友だち?","o":["ともだち","ゆうだち","ともたち","とまだち"],"e":"友だち = ともだち (teman).","oe":["Benar. 友だち = ともだち.","ゆうだち = 夕立 (hujan sore).","Tidak ada perubahan bunyi ke たち tanpa tenten.","Bacaan salah."]}],"J.TEST setara N5 (level F–E)":[{"s":"Tata bahasa & kosakata","q":"A「すみません、いま なんじですか。」\nB「（　）です。」","o":["三時","三日","三人","三つ"],"e":"Pertanyaan jam → 三時 (jam tiga).","oe":["Benar. Menanyakan jam → 三時 (jam tiga).","三日 = tanggal 3 / tiga hari.","三人 = tiga orang.","三つ = tiga buah."]},{"s":"Tata bahasa & kosakata","q":"わたしは にほんごが すこし（　）。","o":["わかります","あります","います","します"],"e":"〜が わかります = mengerti ...; untuk bahasa memakai が わかります.","oe":["Benar. 日本語が わかります = mengerti bahasa Jepang.","あります = ada (benda).","います = ada (makhluk hidup).","します = melakukan; perlu を."]},{"s":"Tata bahasa & kosakata","q":"この りんごは 一つ（　）ですか。","o":["いくら","いくつ","どこ","だれ"],"e":"Menanyakan harga: いくら. いくつ = berapa buah.","oe":["Benar. いくら = berapa harganya.","いくつ = berapa buah (jumlah).","どこ = di mana.","だれ = siapa."]}]},"mn":{"start":1,"b":[{"t":"Perkenalan","p":"は・です, じゃありません, か, も, の, ～さい","q":[{"q":"わたし（　）マイク・ミラーです。","o":["は","を","に","の"],"e":"は menandai topik kalimat dan dibaca \"wa\".","rm":"wa-ta-shi (  ) ma-i-ku / mi-ra-a de-su.","orm Berakhiran る, tapi bunyi sebelumnya -a, -u, atau -o? (わかる, のる, とる)","Golongan 1"],["4","Berakhiran る dan bunyi sebelumnya -i atau -e? (みる, たべる)","Golongan 2 (cek dulu daftar \"si penyamar\" di bawah)"]]},{"c":"Contoh tiap golongan","h":["Golongan","Kata kerja","Romaji","Arti"],"r":[["1","かく","kaku","menulis"],["1","のむ","nomu","minum"],["1","かう","kau","membeli"],["1","まつ","matsu","menunggu"],["1","わかる","wakaru","mengerti"],["2","たべる","taberu","makan"],["2","みる","miru","melihat"],["2","おきる","okiru","bangun"],["2","ねる","neru","tidur"],["3","する","suru","melakukan"],["3","くる","kuru","datang"],["3","べんきょうする","benkyou suru","belajar"]]},{"c":"\"Si penyamar\": kelihatan golongan 2, ternyata golongan 1","h":["Kata kerja","Romaji","Arti","Bentuk ます (bukti golongan 1)"],"r":[["かえる (帰る)","kaeru","pulang","かえります"],["はいる (入る)","hairu","masuk","はいります"],["はしる (走る)","hashiru","berlari","はしります"],["しる (知る)","shiru","mengetahui","しります"],["きる (切る)","kiru","memotong","きります"],["いる (要る)","iru","perlu","いります"]]}],"n":"Hati-hati dengan kata yang bunyinya sama: きる (着る, memakai baju) itu golongan 2 → きます, tapi きる (切る, memotong) golongan 1 → きります. Begitu juga いる (ada) golongan 2, tapi いる (perlu) golongan 1."},{"t":"2. Rumus tangga あいうえお (kunci semua perubahan)","x":"Ini trik paling penting untuk golongan 1. Huruf terakhir kata kerja golongan 1 cukup \"naik-turun tangga\" di barisnya, dan setiap anak tangga dipakai untuk bentuk yang berbeda.\nContoh かく: huruf terakhirnya く, ada di baris か・き・く・け・こ. Mau bentuk ない? Turun ke か → かかない. Mau bentuk ます? Ke き → かきます. Gampang, kan?","rm":["あ → ない (tidak)","い → ます (sopan)","う → bentuk kamus","え → ば (kalau), potensial, perintah (dipelajari di N4)","お → う (ayo, dipelajari di N4)"],"tb":[{"c":"Satu kata kerja, lima anak tangga","h":["Anak tangga","かく","のむ","はなす","かう","Untuk bentuk"],"keep":true,"r":[["あ","かか","のま","はなさ","かわ ⚠","ない"],["い","かき","のみ","はなし","かい","ます"],["う","かく","のむ","はなす","かう","kamus"],["え","かけ","のめ","はなせ","かえ","ば・bisa・perintah"],["お","かこ","のも","はなそ","かお","ayo (〜う)"]]}],"n":"Kata kerja berakhiran う (かう, つかう, あう) di anak tangga あ berubah jadi わ, bukan あ: かわない, bukan かあない.\nGolongan 2 tidak perlu tangga: cukup buang る lalu tempel akhirannya (たべ + ない, たべ + ます)."}],"mx":[{"id":"n5-1-pv","t":"Simulasi JLPT N5 · Paket 1 (contoh)","k":"jlpt","sec":[{"n":"言語知識（文字・語彙）","id":"Kosakata","m":3,"c":"g","p":[{"h":"もんだい1","i":"＿＿＿の ことばは ひらがなで どう かきますか。","ii":"Cara baca kata bergaris bawah","q":[{"q":"わたしの [[学校]]は えきの ちかくに あります。","o":["がっこう","がこう","がっこ","かっこう"],"e":"学校 = がっこう (ada っ kecil dan vokal panjang う).","oe":["Benar. 学校 = がっこう (ada っ kecil dan う panjang).","Kurang っ kecil.","Kurang う panjang di akhir.","か tanpa tenten; yang benar が."]},{"q":"[[毎朝]] パンを たべます。","o":["まいあさ","まいにち","まいばん","めいあさ"],"e":"毎朝 = まいあさ (setiap pagi). 毎日 = まいにち, 毎晩 = まいばん.","oe":["Benar. 毎朝 = まいあさ (setiap pagi).","まいにち = 毎日 (setiap hari).","まいばん = 毎晩 (setiap malam).","毎 dibaca まい, bukan めい."]}],"nf":1}]},{"n":"言語知識（文法）・読解","id":"Tata bahasa & membaca","m":3,"c":"g","p":[{"h":"もんだい1","i":"（　）に 何を 入れますか。","ii":"Bentuk tata bahasa yang tepat","q":[{"q":"わたし（　）インドネシアじんです。","o":["は","を","に","で"],"e":"Penanda topik: は (dibaca wa).","oe":["Benar. Penanda topik は.","を = objek.","に = tujuan/waktu.","で = tempat/alat."]},{"q":"としょかんで ほん（　）かります。","o":["を","が","へ","と"],"e":"Objek langsung kata kerja かりる → を.","oe":["Benar. Objek kata kerja かりる: を.","が = subjek.","へ = arah.","と = bersama."]}]}]},{"n":"聴解","id":"Mendengarkan","m":3,"c":"l","p":[{"h":"もんだい1","i":"しつもんを 聞いて ください。それから 話を 聞いて、正しい こたえを えらんで ください。","ii":"Pahami tugas: apa yang harus dilakukan","q":[{"i":"スーパーで 女の 人と 男の 人が 話して います。男の 人は 何を かいますか。","d":[["女","スーパーへ 行きますか。じゃあ、ぎゅうにゅうを おねがいします。"],["男","パンは？"],["女","パンは まだ ありますから、いいです。あ、たまごも かって ください。"],["男","ぎゅうにゅうと たまごですね。"]],"q":"男の 人は 何を かいますか。","o":["@milk-egg:🥛🥚","@bread-egg:🍞🥚","@milk-bread:🥛🍞","@milk:🥛"],"e":"Susu dan telur. Roti masih ada.","oe":["Benar. Susu dan telur.","Roti masih ada, tidak perlu dibeli.","Roti tidak perlu.","Telur juga diminta."]},{"i":"バスのりばで 学生と 女の 人が 話して います。学生は 何ばんの バスに のりますか。","d":[["男","すみません、びょういんへ 行く バスは 3ばんですか。"],["女","いいえ、3ばんは えきへ 行きます。びょういんは 5ばんか 8ばんです。"],["男","そうですか。"],["女","でも、8ばんは きょうは ありませんよ。"]],"q":"学生は 何ばんの バスに のりますか。","o":["5ばん","3ばん","8ばん","1ばん"],"e":"Ke rumah sakit: no. 5 atau 8, tapi no. 8 tidak ada hari ini.","oe":["Benar. Ke rumah sakit no. 5 (no. 8 tidak ada hari ini).","No. 3 ke stasiun.","No. 8 tidak beroperasi hari ini.","Tidak disebut."]}],"l":1,"t":"課題理解","c":"l"}]}],"pv":1,"min":10},{"id":"n5-1","t":"Simulasi JLPT N5 · Paket 1","k":"jlpt","lock":1,"n":67,"mins":90},{"id":"n5-2","t":"Simulasi JLPT N5 · Paket 2","k":"jlpt","lock":1,"n":67,"mins":90},{"id":"jft-1","t":"Simulasi JFT-Basic · Paket 1","k":"jft","lock":1,"n":50,"mins":60},{"id":"jft-2","t":"Simulasi JFT-Basic · Paket 2","k":"jft","lock":1,"n":50,"mins":60}],"preview":true,"cnt":{"g":34,"k":80,"v":84,"q":91}},"N4":{"lv":"N4","jp":"えぬよん","cefr":"≈ A2","stats":[["±300","kanji"],["±1.500","kosakata"],["±130","pola bunpou"],["+5–6 bulan","setelah N5"]],"fokus":"Semua perubahan bentuk kata kerja (potensial, pasif, kausatif, bentuk maksud, bentuk ば), memberi-menerima, dugaan (そう・よう・らしい), dan dasar keigo. Target umum untuk Tokutei Ginou bersama JFT-Basic.","tips":[["Kuasai tabel bentuk dulu","80% kesalahan soal N4 berasal dari salah mengubah bentuk kata kerja. Latih tabel di bawah sampai bisa tanpa berpikir."],["Pisahkan pola yang mirip","そう (kelihatannya) vs そう (katanya), ために vs ように, ば vs たら vs と vs なら. Buat tabel perbandingan sendiri."],["Pasangan transitif-intransitif","開く/開ける, 消える/消す. Hafalkan berpasangan, karena soal ています vs てあります bergantung pada ini."],["Baca teks pendek setiap hari","Bacaan N4 berupa memo, email, dan pengumuman. Latih cari informasi: siapa, kapan, di mana, harus apa."],["Dengarkan percakapan kantor","Choukai N4 banyak situasi kerja dan toko. Dengarkan NHK Easy Japanese, lalu shadowing."],["Satu bab Minna II per 3 hari","Hari 1 kosakata dan pola, hari 2 latihan, hari 3 soal per bab di halaman ini."]],"weeks":[["Bab 26–30","んです, potensial, ながら, ています/てあります, ておきます"],["Bab 31–34","Bentuk maksud, つもり, でしょう/かもしれない, perintah, とおりに"],["Bab 35–38","Bentuk ば, なら, ように, pasif, のは/のが/のを"],["Bab 39–42","Sebab て/ので, か/かどうか, memberi-menerima sopan, ために"],["Bab 43–46","そう (kelihatannya), すぎる, やすい/にくい, 場合, ところ"],["Bab 47–50","そう (katanya), よう, kausatif, sonkeigo, kenjougo"],["Ulang & kanji","Ulangi semua pola yang salah, kejar 300 kanji"],["Tryout","2 kali tryout penuh dengan timer, analisis kesalahan"]],"g":[{"c":"Bentuk kata kerja","p":"Bentuk potensial","a":"bisa","f":"Gol I: く→ける / Gol II: る→られる / する→できる / くる→こられる","ex":"私は漢字が少し読めます。","rd":"わたしは かんじが すこし よめます。","id":"Saya bisa sedikit membaca kanji.","n":"Objek biasanya memakai が. Minna bab 27.","x":"Bentuk potensial berarti \"bisa\" atau \"mampu\". Dipakai untuk kemampuan (bisa berenang) atau kemungkinan (di sini bisa parkir).\n▶ Cara membuat\n• Golongan 1: bunyi u jadi e + る: 書く → 書ける, 話す → 話せる, 買う → 買える.\n• Golongan 2: buang る + られる: 食べる → 食べられる.\n• する → できる, 来る → 来られる.\n▶ Cara pakai\n• Objek biasanya pindah dari を ke が: 「日本語が 話せます」.\n• Hasilnya kata kerja golongan 2 baru: 書けます, 書けない, 書けた.\n▶ Contoh lain\n• 「漢字が 少し 読めます。」 = Saya bisa membaca sedikit kanji.\n▶ Hati-hati\n• 食べれる / 見れる (tanpa ら) sering terdengar di percakapan, tapi di ujian pakai 食べられる.","m":"Potensial = naik ke baris え: かく → かける. Gol II: tambah られる."},{"c":"Bentuk kata kerja","p":"見えます・聞こえます","a":"terlihat / terdengar (alami)","f":"N が 見えます / 聞こえます","ex":"窓から海が見えます。","rd":"まどから うみが みえます。","id":"Dari jendela terlihat laut.","n":"見られます = bisa melihat karena ada kesempatan. Bab 27.","x":"見えます dan 聞こえます berarti sesuatu terlihat atau terdengar dengan sendirinya, tanpa kita berusaha.\n▶ Cara pakai\n• [tempat] から [benda] が 見えます / 聞こえます.\n• 「窓から 山が 見えます」 = Dari jendela terlihat gunung.\n▶ Bedakan dengan potensial\n• 見えます: masuk ke mata dengan sendirinya.\n• 見られます: bisa melihat karena ada kesempatan: 「この映画は ネットで 見られます」.\n▶ Contoh lain\n• 「となりの 部屋から 音楽が 聞こえます。」 = Dari kamar sebelah terdengar musik.\n▶ Hati-hati\n• Bendanya memakai が, bukan を.","m":"見える・聞こえる = terjadi sendiri, mata dan telinga yang \"menangkap\". Benda pakai が."},{"c":"Penjelasan","p":"～んです","a":"menjelaskan / menanyakan alasan","f":"Bentuk biasa + んです (N/Adj な + なんです)","ex":"どうしたんですか。—頭が痛いんです。","rd":"どうしたんですか。—あたまが いたいんです。","id":"Kenapa? —Kepala saya sakit.","n":"Jangan berlebihan, bisa terdengar menuntut. Bab 26.","x":"「〜んです」 dipakai saat menjelaskan latar belakang atau menanyakan alasan dengan rasa ingin tahu.\n▶ Cara pakai\n• Bentuk biasa + んです: 行く → 行くんです, 高い → 高いんです.\n• Kata benda dan sifat な: + なんです: 病気なんです.\n▶ Fungsi\n• Bertanya penuh perhatian: 「どうしたんですか」 = Ada apa?\n• Menjelaskan alasan: 「頭が 痛いんです」 = (Soalnya) kepala saya sakit.\n• Pembuka minta tolong: 「日本語が わからないんですが、…」.\n▶ Hati-hati\n• Jangan dipakai terus-menerus untuk informasi biasa; terdengar seperti selalu membela diri.","m":"んです = \"nah, begini ceritanya\". Penjelasan atau tanya alasan dengan rasa ingin tahu."},{"c":"Permintaan","p":"～ていただけませんか","a":"bisakah Anda … (sangat sopan)","f":"V-て いただけませんか","ex":"日本語を教えていただけませんか。","rd":"にほんごを おしえて いただけませんか。","id":"Bisakah Anda mengajari saya bahasa Jepang?","n":"Lebih sopan dari ～てください. Bab 26.","x":"Cara meminta tolong yang sangat sopan: \"Bisakah Anda ...?\" Cocok untuk atasan, guru, atau orang yang belum dikenal.\n▶ Cara pakai\n• Bentuk て + いただけませんか.\n• 「もう一度 説明して いただけませんか」 = Bisakah Anda menjelaskan sekali lagi?\n▶ Tingkat kesopanan\n• 〜てください (sopan biasa)\n• 〜てくださいませんか (lebih halus)\n• 〜ていただけませんか (paling halus di N4)\n▶ Contoh lain\n• 「この 書類を 見て いただけませんか。」 = Bisakah Anda melihat dokumen ini?\n▶ Hati-hati\n• Diawali 「すみませんが」 supaya lebih sopan.","m":"ていただけませんか = \"bisakah saya menerima bantuan Anda?\" Paling sopan untuk minta tolong."},{"c":"Permintaan","p":"～たらいいですか","a":"sebaiknya bagaimana","f":"Kata tanya + V-たら いいですか","ex":"どこで切符を買ったらいいですか。","rd":"どこで きっぷを かったら いいですか。","id":"Sebaiknya beli tiket di mana?","n":"Bab 26.","x":"Dipakai untuk meminta saran: \"sebaiknya saya ... bagaimana / apa / di mana?\"\n▶ Cara pakai\n• Kata tanya + bentuk たら + いいですか.\n• 「どう したら いいですか」 = Sebaiknya bagaimana?\n• 「どこで 買ったら いいですか」 = Sebaiknya beli di mana?\n▶ Contoh lain\n• 「だれに 聞いたら いいですか。」 = Sebaiknya saya bertanya kepada siapa?\n• 「日本語が 上手に なりたいんですが、どう したら いいですか。」\n▶ Cara menjawab\n• Biasanya pakai 〜たら いいですよ atau 〜た ほうが いいですよ.\n▶ Hati-hati\n• Wajib ada kata tanya (どう, どこ, だれ, なに).","m":"Kata tanya + たら いいですか = \"kalau saya ..., oke nggak?\" → minta saran."},{"c":"Waktu & urutan","p":"～ながら","a":"sambil","f":"V-ます + ながら","ex":"歌を歌いながら、料理を作ります。","rd":"うたを うたいながら、りょうりを つくります。","id":"Memasak sambil bernyanyi.","n":"Kegiatan utama di belakang. Bab 28.","x":"「〜ながら」 berarti \"sambil\": dua kegiatan dilakukan bersamaan oleh orang yang sama.\n▶ Cara pakai\n• Bentuk ます tanpa ます + ながら: 聞きます → 聞きながら.\n• Kegiatan utama di belakang: 「音楽を 聞きながら 勉強します」 = Belajar sambil mendengarkan musik.\n▶ Arti lain: jangka panjang\n• 「働きながら 学校に 通って います」 = Sekolah sambil bekerja.\n▶ Contoh lain\n• 「歩きながら スマホを 見ないで ください。」 = Tolong jangan melihat HP sambil berjalan.\n▶ Hati-hati\n• Pelakunya harus sama. Untuk dua orang yang berbeda, pakai 〜ている あいだに.","m":"ながら = \"sambil\". Yang utama di belakang (makan sambil nonton TV → nonton sampingan)."}],"k":[{"k":"不","on":"フ","kun":"-","m":"tidak","w":"不便","wr":"ふべん","wm":"tidak praktis"},{"k":"世","on":"セ","kun":"よ","m":"dunia","w":"世話","wr":"せわ","wm":"mengurus"},{"k":"主","on":"シュ","kun":"ぬし","m":"utama","w":"主人","wr":"しゅじん","wm":"suami"},{"k":"事","on":"ジ","kun":"こと","m":"hal","w":"食事","wr":"しょくじ","wm":"makan"},{"k":"京","on":"キョウ","kun":"-","m":"ibu kota","w":"東京","wr":"とうきょう","wm":"Tokyo"},{"k":"仕","on":"シ","kun":"つか(える)","m":"melayani","w":"仕事","wr":"しごと","wm":"pekerjaan"},{"k":"代","on":"ダイ","kun":"か(わる)","m":"ganti, biaya","w":"電気代","wr":"でんきだい","wm":"biaya listrik"},{"k":"以","on":"イ","kun":"-","m":"sejak, dengan","w":"以上","wr":"いじょう","wm":"… ke atas"},{"k":"会","on":"カイ","kun":"あ(う)","m":"bertemu","w":"会います","wr":"あいます","wm":"bertemu","c":"Tempat & benda"},{"k":"住","on":"ジュウ","kun":"す(む)","m":"tinggal","w":"住所","wr":"じゅうしょ","wm":"alamat"},{"k":"体","on":"タイ","kun":"からだ","m":"badan","w":"体","wr":"からだ","wm":"badan"},{"k":"作","on":"サク","kun":"つく(る)","m":"membuat","w":"作文","wr":"さくぶん","wm":"karangan"}],"v":{"Pasangan 自・他 (intransitif/transitif)":[["あく / あける","開く / 開ける","terbuka / membuka"],["しまる / しめる","閉まる / 閉める","tertutup / menutup"],["つく / つける","つく / つける","menyala / menyalakan"],["きえる / けす","消える / 消す","padam / mematikan"],["はじまる / はじめる","始まる / 始める","dimulai / memulai"],["とまる / とめる","止まる / 止める","berhenti / menghentikan"]],"Kerja & kantor":[["しゅっちょう","出張","dinas luar"],["かいぎ","会議","rapat"],["しりょう","資料","dokumen, bahan"],["ざんぎょう","残業","lembur"],["きゅうりょう","給料","gaji"],["ぶちょう","部長","kepala bagian"]]},"q":{"Mendengarkan (transkrip)":[{"s":"Tugas (課題理解)","q":"男：すみません、この荷物を送りたいんですが。\n女：はい、では、この紙に住所と名前を書いてください。それから、あちらの窓口でお金を払ってください。","c":"Apa yang pertama harus dilakukan pria itu?","o":["Menulis alamat dan nama di kertas","Membayar di loket","Menimbang barang","Menelepon penerima"],"e":"Urutannya: tulis dulu (書いてください), baru bayar (それから).","oe":["Benar. Pertama diminta menulis alamat dan nama, lalu (それから) membayar.","Membayar dilakukan setelah menulis (それから).","Menimbang barang tidak disebut.","Menelepon penerima tidak disebut."]},{"s":"Poin (ポイント理解)","q":"女：田中さん、どうして昨日会社を休んだんですか。\n男：子どもが熱を出したんです。私は元気ですよ。","c":"Mengapa Tanaka tidak masuk kerja?","o":["Anaknya demam","Dia sendiri sakit","Ada urusan di bank","Kesiangan"],"e":"子どもが熱を出した. 私は元気 = dia sendiri sehat.","oe":["Benar. 子どもが 熱を 出した = anaknya demam.","Ia berkata 私は元気です (saya sehat).","Bank tidak disebut.","Kesiangan tidak disebut."]},{"s":"Ungkapan (発話表現)","q":"Anda ingin meminjam pena teman.","c":"Apa yang Anda katakan?","o":["ペンを貸してもらえませんか","ペンを貸してあげましょうか","ペンを借りてください","ペンをどうぞ"],"e":"Meminjam: 貸してもらえませんか.","oe":["Benar. 貸してもらえませんか = bolehkah saya dipinjami.","貸してあげましょうか = menawarkan meminjamkan (arah terbalik).","借りてください = menyuruh teman meminjam; arah salah.","どうぞ = mempersilakan; dipakai oleh pemilik pena."]}],"Kosakata":[{"s":"Bacaan kanji","q":"この 部屋は とても 明るいです。","c":"Cara baca 部屋?","o":["へや","ぶや","へいや","ぶおく"],"e":"部屋 = へや (bacaan khusus).","oe":["Benar. 部屋 = へや (bacaan khusus).","部 dibaca ぶ di kata lain (部長), tapi 部屋 khusus へや.","へいや = 平野 (dataran).","Bacaan tidak ada."]},{"s":"Bacaan kanji","q":"来週、大阪へ 出張します。","c":"Cara baca 出張?","o":["しゅっちょう","しゅつちょう","でちょう","しゅっぱり"],"e":"出張 = しゅっちょう, dinas luar kota.","oe":["Benar. 出張 = しゅっちょう; つ berubah jadi っ kecil.","Tanpa っ kecil; bacaan tidak alami.","出 di sini bukan で.","張 dibaca ちょう, bukan ぱり."]},{"s":"Bacaan kanji","q":"この 荷物は 重いです。","c":"Cara baca 重い?","o":["おもい","かるい","おおい","あつい"],"e":"重い = berat. 軽い (かるい) = ringan.","oe":["Benar. 重い = おもい (berat).","かるい = 軽い (ringan), lawan katanya.","おおい = 多い (banyak).","あつい = 暑い/熱い (panas)."]}],"Tata bahasa":[{"s":"Bentuk","q":"日本語が 話せる（　）なりました。","c":"","o":["ように","ために","そうに","ことに"],"e":"Perubahan kemampuan: ～ように なりました.","oe":["Benar. Bentuk potensial + ように なる = menjadi bisa.","ために untuk tujuan, tidak dipakai dengan なる.","そうに なる = hampir (terjadi); bentuk salah setelah bentuk kamus.","ことに なる = diputuskan; tidak cocok untuk kemampuan."]},{"s":"Bentuk","q":"雨が 降り（　）です。傘を 持って 行きましょう。","c":"","o":["そう","よう","らしい","みたい"],"e":"V-ます + そう = kelihatannya akan.","oe":["Benar. ます-stem + そう = kelihatannya akan (dari melihat langit).","よう setelah ます-stem tidak gramatikal; harus 降る ようです.","らしい setelah ます-stem tidak gramatikal.","みたい setelah ます-stem tidak gramatikal."]},{"s":"Pasif","q":"(Saya dipanggil oleh guru)\nわたしは 先生に 名前を（　）。","c":"","o":["呼ばれました","呼ばせました","呼びました","呼べました"],"e":"Pasif: 呼ぶ → 呼ばれる.","oe":["Benar. Pasif: 呼ばれる = dipanggil.","Kausatif: menyuruh guru memanggil; arti salah.","Aktif: saya memanggil; terbalik.","Potensial: bisa memanggil."]}],"Membaca":[{"s":"Memo","q":"山田さんへ\n明日の 会議は 10時からです。資料は 会議の 前に コピーして おいて ください。会議室は 3階に 変わりました。\n田中","c":"Apa yang harus dilakukan Yamada sebelum rapat?","o":["Memfotokopi dokumen","Pergi ke lantai 1","Menelepon Tanaka","Memesan ruang rapat"],"e":"コピーして おいて ください = tolong fotokopi dulu.","oe":["Benar. Memo: 資料は 会議の 前に コピーして おいて.","Ruang rapat lantai 3, bukan 1.","Menelepon Tanaka tidak diminta.","Memesan ruang tidak disebut."]},{"s":"Memo","q":"(memo yang sama)\nRapat diadakan di mana?","c":"","o":["Ruang rapat lantai 3","Ruang rapat lantai 10","Kantor Tanaka","Belum ditentukan"],"e":"会議室は 3階に 変わりました = ruang rapat pindah ke lantai 3.","oe":["Benar. 会議室は 3階に 変わりました.","10 adalah jam rapat, bukan lantai.","Kantor Tanaka tidak disebut.","Sudah ditentukan: lantai 3."]},{"s":"Teks pendek","q":"わたしは 去年 日本へ 来ました。初めは 日本語が わからなくて、困りました。でも、会社の 人が 親切に 教えて くれたので、今は 仕事の 話が 少し できるように なりました。","c":"Sekarang orang ini …","o":["bisa sedikit bicara soal pekerjaan","masih tidak bisa sama sekali","mengajar bahasa Jepang","sudah pulang ke negaranya"],"e":"できるように なりました = sudah jadi bisa.","oe":["Benar. 仕事の 話が 少し できる ように なりました.","Sekarang sudah bisa sedikit.","Ia diajari, bukan mengajar.","Ia masih di Jepang."]}],"JLPT N4 · Paket 2":[{"s":"Bacaan kanji","q":"来週から 新しい 仕事を 始めます。","c":"Bagaimana cara membaca 仕事?","o":["しごと","しこと","じごと","しごど"],"e":"仕事 = しごと (pekerjaan).","oe":["Benar. 仕事 = しごと.","Tanpa tenten; yang benar ご.","し tidak berubah jadi じ.","と tidak berubah jadi ど."]},{"s":"Bacaan kanji","q":"駅の 近くに 大きい 病院が あります。","c":"Bagaimana cara membaca 病院?","o":["びょういん","びよういん","びょうき","へいいん"],"e":"病院 = びょういん (rumah sakit). びよういん (美容院) = salon kecantikan, beda arti!","oe":["Benar. 病院 = びょういん (rumah sakit).","びよういん = 美容院 (salon).","びょうき = 病気 (sakit).","Bacaan tidak ada."]},{"s":"Bacaan kanji","q":"この 道を まっすぐ 行って ください。","c":"Bagaimana cara membaca 道?","o":["みち","まち","どう","かど"],"e":"道 = みち (jalan). まち = 町 (kota).","oe":["Benar. 道 = みち (jalan).","まち = 町 (kota).","どう = on-yomi 道 dalam kata majemuk (柔道).","かど = 角 (sudut)."]}],"J.TEST setara N4 (level E–D)":[{"s":"Tata bahasa & kosakata","q":"先生が 書いた 本を（　）ことが ありますか。","o":["読んだ","読む","読んで","読み"],"e":"Pengalaman: bentuk た + ことが ある.","oe":["Benar. 〜た ことが ある = pernah.","Bentuk kamus + ことが ある = kadang-kadang; tidak cocok untuk pengalaman.","Bentuk て tidak dipakai di sini.","Bentuk ます-stem tidak dipakai."]},{"s":"Tata bahasa & kosakata","q":"明日は 早く 起き（　）なりません。","o":["なければ","なくては","ないと","なくても"],"e":"〜なければ なりません = harus.","oe":["Benar. 〜なければ なりません = harus.","〜なくては + いけません lebih umum; dengan なりません kurang standar di soal ini.","〜ないと tidak dipasangkan dengan なりません.","〜なくても = tidak perlu; arti terbalik."]},{"s":"Tata bahasa & kosakata","q":"窓が（　）いますから、閉めて ください。","o":["開いて","開けて","開いた","開けた"],"e":"Keadaan jendela terbuka: intransitif 開く + ている.","oe":["Benar. 開いて いる = (jendela) dalam keadaan terbuka.","開けて いる = sedang membuka.","Bentuk た + います tidak gramatikal.","Bentuk た + います tidak gramatikal."]}]},"ch":[{"t":"課題理解","i":"会社で女の人と男の人が話しています。男の人はこのあとまず何をしますか。","d":[["女","鈴木さん、午後の会議の準備、お願いできますか。"],["男","はい。資料のコピーですか。"],["女","コピーはもう終わりました。会議室の机を並べてもらえますか。それから、お茶の用意もお願いします。"],["男","わかりました。すぐ行きます。"]],"q":"男の人はこのあとまず何をしますか。","o":["会議室の机を並べる","資料をコピーする","お茶を用意する","会議に出る"],"e":"Fotokopi sudah selesai. Pertama menata meja, それから baru teh."},{"t":"課題理解","i":"病院で受付の人と男の人が話しています。男の人はこのあと何をしますか。","d":[["受付","初めてですか。では、保険証を見せてください。それから、この紙に名前と住所を書いて、お待ちください。"],["男","保険証、今日は忘れてしまったんですが…。"],["受付","そうですか。じゃ、次に来るときに持ってきてください。今日は紙だけ書いてください。"]],"q":"男の人はこのあと何をしますか。","o":["紙に名前と住所を書く","保険証を取りに帰る","保険証を見せる","すぐ診察を受ける"],"e":"Kartu asuransi dibawa lain kali. Hari ini cukup isi kertas (紙だけ書いて)."}],"exam":[[["Kosakata",25],["Tata bahasa & membaca",55],["Mendengarkan",35]],90,"45"],"conj":[["Kata kerja","Gol.","ます","て","た","ない","Kamus","Potensial","Maksud","ば","Pasif","Kausatif","Perintah"],["書く (menulis)","I","書きます","書いて","書いた","書かない","書く","書ける","書こう","書けば","書かれる","書かせる","書け"],["飲む (minum)","I","飲みます","飲んで","飲んだ","飲まない","飲む","飲める","飲もう","飲めば","飲まれる","飲ませる","飲め"],["待つ (menunggu)","I","待ちます","待って","待った","待たない","待つ","待てる","待とう","待てば","待たれる","待たせる","待て"]],"mn":{"start":26,"b":[{"t":"Alasan & permintaan sopan","p":"～んです, ～ていただけませんか, ～たらいいですか","q":[{"q":"A「どうしたんですか。」\nB「おなかが 痛い（　）。」","o":["んです","ます","でした","ません"],"e":"Menjelaskan alasan: ～んです."},{"q":"A「あした パーティーに 来ませんか。」\nB「すみません、用事が ある（　）。」","o":["んです","です","ます","でしょう"],"e":"Menolak dengan menjelaskan alasan: ～んです."},{"q":"すみませんが、この 漢字の 読み方を 教えて（　）。","o":["いただけませんか","いただきませんか","あげませんか","おきませんか"],"e":"Permintaan sangat sopan: ～ていただけませんか."},{"q":"A「ゴミは どこに 出し（　）いいですか。」","o":["たら","ても","ては","て"],"e":"Minta saran: ～たら いいですか."},{"q":"A「日本語が 上手ですね。どこで 勉強した（　）か。」","o":["んです","ます","でした","でしょう"],"e":"Bertanya karena penasaran: ～んですか."},{"q":"「ゴミを 出す」 artinya …","o":["membuang sampah di tempat penampungan","membeli sampah","membakar sampah","memungut sampah"],"e":"ゴミを 出す = mengeluarkan sampah sesuai jadwal."},{"q":"A「どうして 遅れたんですか。」\nB「バスが 来なかった（　）。」","o":["んです","ことです","ようです","そうです"],"e":"Menjelaskan alasan sendiri: ～んです."},{"q":"Cara baca 「運動会」?","o":["うんどうかい","うんどうえ","うんとうかい","うんどかい"],"e":"運動会 = pesta olahraga sekolah."}]}]},"bk":[{"t":"1. Ingat lagi: rumus tangga あいうえお","x":"Di N4 kamu akan bertemu banyak bentuk baru: bisa, ayo, kalau, perintah, di-, dan menyuruh. Tenang, hampir semuanya tetap pakai rumus tangga yang sama. Cukup tahu bentuk itu \"tinggal\" di anak tangga mana.","rm":["あ → ない, pasif (〜れる), kausatif (〜せる)","い → ます","う → kamus","え → potensial (〜る), ば, perintah","お → maksud (〜う)"],"tb":[{"c":"Peta tangga untuk かく (menulis)","h":["Anak tangga","Huruf","Bentuk","Arti"],"keep":true,"r":[["あ","かか","かかない / かかれる / かかせる","tidak / ditulis / menyuruh menulis"],["い","かき","かきます","menulis (sopan)"],["う","かく","かく","menulis"],["え","かけ","かける / かけば / かけ！","bisa menulis / kalau menulis / tulis!"],["お","かこ","かこう","ayo menulis"]]}],"n":"Golongan 2 tetap paling gampang: buang る, lalu tempel akhirannya (たべ + られる / れば / ろ / よう / させる)."},{"t":"2. Bentuk potensial: \"bisa\"","x":"Dipakai untuk bilang kamu bisa atau mampu melakukan sesuatu, atau sesuatu bisa dilakukan di suatu tempat.\nSetelah berubah, hasilnya menjadi kata kerja golongan 2 baru. Jadi 書ける bisa diubah lagi jadi 書けます, 書けない, 書けた.","fn":["Kemampuan: 日本語が話せます (saya bisa bahasa Jepang)","Kemungkinan: ここで Wi-Fi が使えます (di sini bisa pakai Wi-Fi)"],"rm":["Golongan 1: naik ke anak tangga え + る","Golongan 2: buang る + られる","する → できる, 来る → 来られる (こられる)","Objek biasanya pindah dari を ke が"],"tb":[{"c":"Cara membuat bentuk potensial","h":["Kata kerja","Gol","Caranya","Hasil"],"r":[["書く (menulis)","1","く → け + る","書ける (kakeru)"],["飲む (minum)","1","む → め + る","飲める (nomeru)"],["話す (bicara)","1","す → せ + る","話せる (hanaseru)"],["買う (membeli)","1","う → え + る","買える (kaeru)"],["食べる (makan)","2","る → られる","食べられる (taberareru)"],["見る (melihat)","2","る → られる","見られる (mirareru)"],["する (melakukan)","3","hafalan","できる (dekiru)"],["来る (datang)","3","hafalan","来られる (korareru)"]]}],"ex":[["わたしは 漢字が 書けます。","watashi wa kanji ga kakemasu.","Saya bisa menulis kanji."],["あした 来られますか。","ashita koraremasu ka.","Besok bisa datang?"]],"n":"Dalam obrolan, orang Jepang sering bilang 食べれる atau 見れる (ら dibuang). Boleh dipahami, tapi di ujian pakai bentuk baku 食べられる."}],"kaiwa":[["Menelepon izin sakit","Menghubungi atasan sebelum jam kerja.",[["A","もしもし、<u>アンディ</u>です。おはようございます。","moshimoshi, andi desu. ohayou gozaimasu.","Halo, ini Andi. Selamat pagi."],["B","ああ、アンディさん。どうしたんですか。","aa, andi-san. doushita n desu ka.","Oh, Andi. Ada apa?"],["A","実は、<u>熱が38度</u>あるんです。","jitsu wa, netsu ga sanjuuhachi-do aru n desu.","Sebenarnya, saya demam 38 derajat."],["A","申し訳ありませんが、今日は休ませていただけませんか。","moushiwake arimasen ga, kyou wa yasumasete itadakemasen ka.","Mohon maaf, bolehkah saya izin libur hari ini?"],["B","わかりました。病院に行ったほうがいいですよ。","wakarimashita. byouin ni itta hou ga ii desu yo.","Baik. Sebaiknya pergi ke rumah sakit."],["A","はい、そうします。ご迷惑をおかけして、すみません。","hai, sou shimasu. gomeiwaku o okake shite, sumimasen.","Baik, akan saya lakukan. Maaf merepotkan."]]]],"mx":[{"id":"n4-1-pv","t":"Simulasi JLPT N4 · Paket 1 (contoh)","k":"jlpt","sec":[{"n":"言語知識（文字・語彙）","id":"Kosakata","m":3,"c":"g","p":[{"h":"もんだい1","i":"＿＿＿の ことばは ひらがなで どう かきますか。","ii":"Cara baca kata bergaris bawah","q":[{"q":"この [[町]]は とても しずかです。","o":["まち","むら","ちょう","しま"],"e":"町 = まち (kota kecil).","oe":["Benar. 町 = まち (kota kecil).","むら = 村 (desa).","ちょう = on-yomi (町長), tidak dipakai sendiri di sini.","しま = 島 (pulau)."]},{"q":"[[急]]に 雨が ふって きました。","o":["きゅう","きょう","いそ","きゅ"],"e":"急に = きゅうに (tiba-tiba).","oe":["Benar. 急に = きゅうに (tiba-tiba).","きょう = 今日/強; bukan bacaan 急.","いそ = dari 急ぐ (いそぐ); 急に tidak dibaca いそに.","Kurang う panjang."]}],"nf":1}]},{"n":"言語知識（文法）・読解","id":"Tata bahasa & membaca","m":3,"c":"g","p":[{"h":"もんだい1","i":"（　）に 何を 入れますか。","ii":"Bentuk tata bahasa yang tepat","q":[{"q":"この 本は 漢字が おおくて、わたし（　）は むずかしいです。","o":["に","で","が","を"],"e":"Bagi saya: わたしには.","oe":["Benar. わたしには = bagi saya.","で tidak cocok.","が tidak cocok sebelum は.","を tidak cocok."]},{"q":"先生に 作文を なおして（　）。","o":["もらいました","あげました","くれました","やりました"],"e":"Menerima bantuan dari guru: 〜て もらう.","oe":["Benar. 〜て もらう = dibantu guru.","Memberi ke guru; arah salah.","くれる butuh guru sebagai subjek (先生が).","やる = memberi ke bawahan."]}]}]},{"n":"聴解","id":"Mendengarkan","m":3,"c":"l","p":[{"h":"もんだい1","i":"しつもんを 聞いて ください。それから 話を 聞いて、正しい こたえを えらんで ください。","ii":"Pahami tugas: apa yang harus dilakukan","q":[{"i":"会社で 男の 人と 女の 人が 話して います。女の 人は このあと 何を しますか。","d":[["男","山下さん、あしたの 会議の 準備は できましたか。"],["女","はい、資料は コピーしました。いすも ならべました。"],["男","プロジェクターは？"],["女","あ、まだです。すぐ 準備します。"]],"q":"女の 人は このあと 何を しますか。","o":["プロジェクターを 準備する","資料を コピーする","いすを ならべる","会議室を よやくする"],"e":"Proyektor belum disiapkan.","oe":["Benar. Proyektor belum siap.","Sudah difotokopi.","Sudah ditata.","Tidak disebut."]},{"i":"女の 人と 男の 人が 話して います。男の 人は 何を 買って 行きますか。","d":[["女","きょう、うちで 鍋パーティーを するから、来る とき 何か 買って きて。"],["男","じゃあ、ビールを 買って 行くよ。"],["女","ビールは 田中さんが 持って くるって。やさいが ちょっと 足りないんだけど。"],["男","わかった。"]],"q":"男の 人は 何を 買って 行きますか。","o":["@veg:🥬🥕","@beer:🍺","@meat:🥩","@cake:🍰"],"e":"Bir dibawa Tanaka; yang kurang sayur.","oe":["Benar. Sayuran kurang.","Bir dibawa Tanaka.","Tidak disebut.","Tidak disebut."]}],"l":1,"t":"課題理解","c":"l"}]}],"pv":1,"min":10},{"id":"n4-1","t":"Simulasi JLPT N4 · Paket 1","k":"jlpt","lock":1,"n":85,"mins":115},{"id":"n4-2","t":"Simulasi JLPT N4 · Paket 2","k":"jlpt","lock":1,"n":85,"mins":115},{"id":"jft-1","t":"Simulasi JFT-Basic · Paket 1","k":"jft","lock":1,"n":50,"mins":60},{"id":"jft-2","t":"Simulasi JFT-Basic · Paket 2","k":"jft","lock":1,"n":50,"mins":60}],"preview":true,"cnt":{"g":67,"k":167,"v":90,"q":75}},"N3":{"lv":"N3","jp":"えぬさん","cefr":"≈ B1","stats":[["±650","kanji"],["±3.700","kosakata"],["±180","pola bunpou"],["+8–10 bulan","setelah N4"]],"fokus":"Jembatan dari bahasa buku ke bahasa asli: pola dugaan (はず・わけ・に違いない), sebab-akibat (おかげで・せいで), sudut pandang (にとって・によって), dan membaca teks yang lebih panjang. Skor membaca kini dinilai terpisah.","tips":[["Membaca adalah kunci","Mulai N3, membaca dinilai terpisah (minimal 19/60). Baca satu artikel pendek per hari, misalnya NHK News Web Easy."],["Kelompokkan pola yang mirip","はず / わけ / に違いない, おかげで / せいで, ことにする / ことになる. Buat tabel perbedaannya sendiri."],["Kosakata lewat kata majemuk","Soal N3 memakai kata seperti 確認, 報告, 担当. Pelajari kanji lewat kata, bukan kanji tunggal."],["Kata keterangan","Soal konteks sering memakai うっかり, すっかり, そろそろ, わざわざ. Hafalkan dengan contoh kalimat."],["Choukai: tangkap intinya","Ada soal inti cerita (概要理解). Latih merangkum audio 1 menit dalam satu kalimat bahasa Indonesia."],["Satu buku seri","Nihongo Sou Matome N3 (ada di Drive Anda): 6 minggu per buku, 1–2 halaman per hari."]],"weeks":[["Waktu & proses","うちに, 最中に, とたん, 次第, たびに, 一方だ, につれて"],["Sebab & dugaan","おかげで, せいで, はず, に違いない, わけだ, ような気がする"],["Syarat & penekanan","たとえ～ても, さえ～ば, ばかり, こそ, ほど～ない"],["Sudut pandang","について, に対して, にとって, によって, として, をもとに"],["Tindakan & keadaan","ことにする/なる, ふり, まま, っぱなし, かけ, きる"],["Kontras & kutipan","くせに, わりに, ながらも, というより, っけ, んだって"],["Membaca intensif","2 bacaan per hari, catat kosakata baru"],["Tryout","2 kali tryout penuh, analisis per bagian"]],"g":[{"c":"Waktu & proses","p":"～うちに","a":"selagi / sebelum keadaan berubah","f":"V-る・V-ている・V-ない / Adj / N の + うちに","ex":"若いうちに、いろいろな国へ行きたい。","rd":"わかい うちに、いろいろな くにへ いきたい。","id":"Selagi muda, saya ingin pergi ke banyak negara.","n":"Sering: 忘れないうちに, 暗くならないうちに.","x":"「うちに」 berarti melakukan sesuatu selagi keadaan masih ada, karena nanti akan sulit.\n▶ Cara pakai\n• Bentuk kamus / ている / ない / kata sifat / N の + うちに.\n• 「若い うちに、いろいろな 経験を したい」 = Selagi muda, ingin punya banyak pengalaman.\n▶ Dengan bentuk ない\n• Artinya \"sebelum ... terjadi\": 「暗く ならない うちに 帰ろう」 = Ayo pulang sebelum gelap.\n▶ Arti lain\n• Tanpa sadar, selama ...: 「話して いる うちに、仲良く なった」.\n▶ Hati-hati\n• Bedanya dengan まえに: うちに menekankan \"mumpung masih bisa\".","m":"うち = \"di dalam\" waktu: selagi masih di dalam keadaan itu, cepat lakukan."},{"c":"Waktu & proses","p":"～最中に","a":"tepat di tengah-tengah","f":"V-ている / N の + さいちゅうに","ex":"会議の最中に、電話が鳴った。","rd":"かいぎの さいちゅうに、でんわが なった。","id":"Di tengah rapat, telepon berbunyi.","n":"Biasanya ada gangguan yang terjadi.","x":"「最中に」 berarti tepat di tengah-tengah kegiatan, lalu terjadi sesuatu yang mengganggu.\n▶ Cara pakai\n• Bentuk ている / N の + 最中に.\n• 「会議の 最中に 電話が 鳴った」 = Di tengah rapat, telepon berbunyi.\n▶ Contoh lain\n• 「食事を して いる 最中に、地震が あった。」\n▶ Bedanya\n• 〜ている あいだに: netral, selama.\n• 〜最中に: tepat di puncak kegiatan, dengan kesan \"pas lagi sibuk-sibuknya\".\n▶ Hati-hati\n• Kalimat belakang biasanya kejadian tak terduga.","m":"最中 = 最 (paling) + 中 (tengah): tepat di tengah-tengah, lalu ada gangguan."},{"c":"Waktu & proses","p":"～たとたん(に)","a":"begitu … langsung (tak terduga)","f":"V-た + とたん","ex":"窓を開けたとたん、強い風が入ってきた。","rd":"まどを あけた とたん、つよい かぜが はいって きた。","id":"Begitu jendela dibuka, angin kencang masuk.","n":"Kalimat belakang bukan kehendak pembicara.","x":"「たとたん」 berarti \"begitu A, langsung B (tak terduga)\".\n▶ Cara pakai\n• Bentuk た + とたん(に).\n• 「立ち上がった とたん、めまいが した」 = Begitu berdiri, langsung pusing.\n▶ Contoh lain\n• 「家を 出た とたん、雨が 降り出した。」 = Begitu keluar rumah, hujan turun.\n▶ Hati-hati\n• B adalah kejadian di luar kendali, mengejutkan.\n• Tidak boleh B berupa kehendak: ✗ 家に 着いた とたん、電話しよう. Pakai 〜たら すぐ.","m":"とたん = \"tan!\" bunyi kaget. Begitu A, \"tan!\" langsung B tak terduga."},{"c":"Waktu & proses","p":"～次第","a":"segera setelah","f":"V-ます + しだい","ex":"家に着き次第、連絡します。","rd":"いえに つき しだい、れんらくします。","id":"Begitu sampai rumah, saya kabari.","n":"Juga: N 次第 = tergantung N (努力次第).","x":"「次第」 setelah ます-stem berarti \"segera setelah ... selesai\". Gaya formal, sering di bisnis.\n▶ Cara pakai\n• ます-stem + 次第: 「わかり次第、ご連絡します」 = Segera setelah tahu, akan saya kabari.\n▶ Contoh lain\n• 「準備が でき次第、出発します。」 = Begitu siap, kita berangkat.\n▶ Ciri\n• Kalimat belakang berupa rencana, janji, atau permintaan.\n▶ Hati-hati\n• Tidak dipakai untuk kejadian lampau: ✗ 着き次第、電話しました.\n• Setelah kata benda, 次第 berarti \"tergantung\" (pola N2).","m":"次第 = \"urutan berikutnya\": selesai A, langsung urutan B (gaya bisnis)."},{"c":"Waktu & proses","p":"～たびに","a":"setiap kali","f":"V-る / N の + たびに","ex":"この歌を聞くたびに、国を思い出す。","rd":"この うたを きく たびに、くにを おもいだす。","id":"Setiap mendengar lagu ini, saya teringat kampung halaman.","n":"","x":"「たびに」 berarti \"setiap kali A, (pasti) B\".\n▶ Cara pakai\n• Bentuk kamus / N の + たびに.\n• 「この 歌を 聞く たびに、ふるさとを 思い出す」 = Setiap mendengar lagu ini, teringat kampung halaman.\n▶ Contoh lain\n• 「旅行の たびに、お土産を 買って くる。」\n▶ Bedanya\n• 〜と / 〜たら: hubungan sebab-akibat umum.\n• 〜たびに: menekankan pengulangan, setiap kali.\n▶ Hati-hati\n• Kalimat belakang biasanya kejadian yang selalu sama.","m":"たび = \"tabi\" perjalanan: setiap kali pergi ke sana, pasti B."},{"c":"Waktu & proses","p":"～てからでないと","a":"kalau belum … tidak bisa","f":"V-て + からでないと + negatif","ex":"店長に聞いてからでないと、決められません。","rd":"てんちょうに きいて からでないと、きめられません。","id":"Kalau belum tanya manajer, saya tidak bisa memutuskan.","n":"","x":"「てからでないと」 berarti \"kalau belum A, (B) tidak bisa\".\n▶ Cara pakai\n• Bentuk て + からでないと + kalimat negatif/sulit.\n• 「手を 洗ってから でないと、利用者の 食事介助は できません」.\n▶ Contoh lain\n• 「実物を 見てから でないと、決められない。」 = Belum bisa memutuskan sebelum melihat barangnya.\n▶ Variasi\n• 〜てからでなければ (lebih formal).\n▶ Hati-hati\n• Kalimat belakang selalu negatif atau bernuansa \"tidak bisa\".","m":"てからでないと = \"kalau bukan setelah A\" → B belum bisa."}],"k":[{"k":"与","on":"ヨ","kun":"あた(える)","m":"memberi","w":"給与","wr":"きゅうよ","wm":"gaji"},{"k":"両","on":"リョウ","kun":"-","m":"kedua","w":"両親","wr":"りょうしん","wm":"orang tua"},{"k":"乗","on":"ジョウ","kun":"の(る)","m":"naik","w":"乗り物","wr":"のりもの","wm":"kendaraan"},{"k":"予","on":"ヨ","kun":"-","m":"sebelumnya","w":"予定","wr":"よてい","wm":"rencana"},{"k":"争","on":"ソウ","kun":"あらそ(う)","m":"bersaing","w":"戦争","wr":"せんそう","wm":"perang"},{"k":"互","on":"ゴ","kun":"たが(い)","m":"saling","w":"お互い","wr":"おたがい","wm":"satu sama lain"},{"k":"亡","on":"ボウ","kun":"な(くなる)","m":"mati, hilang","w":"亡くなる","wr":"なくなる","wm":"meninggal"},{"k":"交","on":"コウ","kun":"まじ(わる)、か(わす)","m":"bertukar, bersilang","w":"交通","wr":"こうつう","wm":"lalu lintas"},{"k":"他","on":"タ","kun":"ほか","m":"lain","w":"他人","wr":"たにん","wm":"orang lain"},{"k":"付","on":"フ","kun":"つ(ける)","m":"menempel","w":"受付","wr":"うけつけ","wm":"resepsionis"},{"k":"件","on":"ケン","kun":"-","m":"perkara","w":"事件","wr":"じけん","wm":"kejadian, kasus"},{"k":"任","on":"ニン","kun":"まか(せる)","m":"tugas, menyerahkan","w":"責任","wr":"せきにん","wm":"tanggung jawab"}],"v":{"Kerja":[["めんせつ","面接","wawancara kerja"],["りれきしょ","履歴書","daftar riwayat hidup"],["しめきり","締め切り","tenggat waktu"],["たんとう","担当","penanggung jawab"],["しじ","指示","instruksi"],["ほうこく・れんらく・そうだん","報告・連絡・相談","\"Hourensou\": lapor, kabari, konsultasi"]],"Kehidupan & administrasi":[["てつづき","手続き","prosedur"],["ざいりゅうカード","在留カード","kartu izin tinggal"],["しやくしょ","市役所","kantor wali kota"],["ほけん","保険","asuransi"],["ねんきん","年金","dana pensiun"],["けいやく","契約","kontrak"]]},"q":{"Mendengarkan (transkrip)":[{"s":"Tugas (課題理解)","q":"女：課長、明日の会議の資料、何部コピーしましょうか。\n男：出席者は10人だけど、念のため2部多めにお願い。それから、会議室のプロジェクターも確認しておいてくれる？","c":"Berapa rangkap dokumen yang harus difotokopi?","o":["12","10", i ず.\nPaling sering muncul sebagai 〜ずに (tanpa): sama artinya dengan 〜ないで.","rm":["ない → ず","ない → ずに (tanpa)","する → せず (bukan しず!)","来る → 来ず (こず)"],"tb":[{"c":"Dari ない ke ず","h":["Kata kerja","Bentuk ない","Bentuk ず","Contoh"],"r":[["書く","書かない","書かず","名前を書かずに出した (menyerahkan tanpa menulis nama)"],["食べる","食べない","食べず","朝ご飯を食べずに来た (datang tanpa sarapan)"],["する","しない","せず ⚠","連絡せずに休んだ (libur tanpa kabar)"],["来る","来ない","来ず","彼は来ずに終わった (dia tidak datang sampai selesai)"]]}],"n":"Kamu juga akan bertemu ぬ, bentuk kuno yang artinya sama: 知らぬ間に = tanpa sadar, 見知らぬ人 = orang tak dikenal."}],"kaiwa":[["Melapor kejadian nyaris celaka","ヒヤリハット: melapor ke senior dengan jelas.",[["A","<u>佐藤さん</u>、ちょっと報告したいことがあるんですが。","さとうさん、ちょっとほうこくしたいことがあるんですが。","Sato-san, ada yang ingin saya laporkan."],["B","はい、どうしたの？","はい、どうしたの？","Ya, ada apa?"],["A","さっき、<u>鈴木さん</u>が車いすから立ち上がろうとして、転びそうになったんです。","さっき、すずきさんがくるまいすからたちあがろうとして、ころびそうになったんです。","Tadi, Bu Suzuki mencoba berdiri dari kursi roda dan hampir jatuh."],["B","えっ、けがは？","えっ、けがは？","Hah, ada luka?"],["A","すぐに支えたので、けがはありませんでした。","すぐにささえたので、けがはありませんでした。","Langsung saya tahan, jadi tidak ada luka."],["B","よかった。じゃ、ヒヤリハットの報告書に書いておいてね。","よかった。じゃ、ヒヤリハットのほうこくしょにかいておいてね。","Syukurlah. Tolong tulis di laporan nyaris celaka ya."],["A","わかりました。ブレーキがかかっていなかったことも書いておきます。","わかりました。ブレーキがかかっていなかったこともかいておきます。","Baik. Saya juga tulis bahwa remnya tidak terkunci."]]]],"mx":[],"preview":true,"cnt":{"g":75,"k":370,"v":54,"q":74}},"N2":{"lv":"N2","jp":"えぬに","cefr":"≈ B2","stats":[["±1.000","kanji"],["±6.000","kosakata"],["±200","pola bunpou"],["+10–12 bulan","setelah N3"]],"fokus":"Bahasa tulis dan formal: berita, email kantor, esai opini. Pola sebab-akibat yang halus (ものだから・からこそ・あまり), penilaian (べきだ・ざるを得ない・かねない), dan keigo bisnis. Syarat banyak lowongan kerja kantoran di Jepang.","tips":[["Kecepatan membaca","Bagian bahasa dan membaca hanya 105 menit untuk semua soal. Latih membaca 1 artikel berita per hari dengan timer."],["Kosakata lewat berita","Kata seperti 対策, 傾向, 削減 ntoh lain\n• 「入浴介助の 際に、体の 様子を 観察する。」\n▶ Hati-hati\n• Banyak di pengumuman, manual, dan surat.","m":"際 = \"tepi, momen\" (際どい = mepet). Versi formal 時."},{"c":"Waktu & proses","p":"～かと思うと","a":"baru saja … langsung","f":"V-た + かと おもうと","ex":"空が暗くなったかと思うと、急に雨が降り出した。","rd":"そらが くらく なったかと おもうと、きゅうに あめが ふりだした。","id":"Baru saja langit gelap, tiba-tiba hujan turun.","n":"Untuk orang lain/kejadian, bukan diri sendiri.","x":"「かと思うと」 berarti \"baru saja A, langsung B\" (perubahan cepat yang mengejutkan).\n▶ Cara pakai\n• V-た + かと 思うと / かと 思ったら.\n• 「晴れたかと 思うと、また 雨が 降り出した」.\n▶ Hati-hati\n• Tidak dipakai untuk diri sendiri: ✗ わたしは 帰ったかと思うと.\n• Mirip たとたん, tapi untuk mengamati orang/benda lain.","m":"かと思うと = \"baru saja kupikir A, eh sudah B\"."},{"c":"Waktu & proses","p":"～て以来","a":"sejak","f":"V-て + いらい","ex":"日本に来て以来、一度も国に帰っていない。","rd":"にほんに きて いらい、いちども くにに かえって いない。","id":"Sejak datang ke Jepang, saya belum sekali pun pulang.","n":"","x":"「て以来」 berarti \"sejak A (sampai sekarang terus)\".\n▶ Cara pakai\n• V-て + 以来: 「日本に 来て 以来、ずっと 介護の 仕事を して いる」.\n• N + 以来: 「卒業 以来」.\n▶ Hati-hati\n• Kalimat belakang menunjukkan keadaan yang berlanjut, bukan kejadian sekali.","m":"以来 = 以 (sejak) + 来 (datang): sejak itu sampai sekarang."},{"c":"Waktu & proses","p":"～に先立って","a":"sebelum (resmi)","f":"N / V-る + に さきだって","ex":"開会に先立って、社長があいさつした。","rd":"かいかいに さきだって、しゃちょうが あいさつした。","id":"Sebelum pembukaan, direktur memberi sambutan.","n":"","x":"「に先立って」 berarti \"sebelum (sebagai persiapan)\" untuk acara penting.\n▶ Cara pakai\n• N / V-る + に先立って.\n• 「開会に 先立って、社長が あいさつした」.\n▶ Bentuk lain\n• に先立ち (lebih formal), に先立つ + N.\n▶ Hati-hati\n• Untuk acara resmi, bukan kegiatan sehari-hari.","m":"先立つ = \"berdiri lebih dulu\" (先 = depan) sebelum acara resmi."},{"c":"Waktu & proses","p":"～をきっかけに","a":"berawal dari","f":"N + を きっかけに","ex":"留学をきっかけに、料理を始めた。","rd":"りゅうがくを きっかけに、りょうりを はじめた。","id":"Berawal dari kuliah di luar negeri, saya mulai memasak.","n":"","x":"「をきっかけに」 berarti \"berawal dari / dipicu oleh\".\n▶ :["Benar. Penulis ingin cara kerja dipilih sesuai jenis pekerjaan.","Penulis tidak menyuruh semua bekerja dari rumah.","Tidak semua kembali ke kantor.","Jam kerja tidak dibahas."]}],"JLPT N2 · Paket 2":[{"s":"Bacaan kanji","q":"新しい 制度の 導入が 検討されて いる。","c":"Bagaimana cara membaca 導入?","o":["どうにゅう","どうじゅう","みちにゅう","しどうにゅう"],"e":"導入 = どうにゅう (pengenalan, penerapan).","oe":["Benar. 導入 = どうにゅう.","入 dibaca にゅう, bukan じゅう.","Kun-yomi salah.","し berlebih."]},{"s":"Bacaan kanji","q":"高齢者の 介護に 携わる 仕事を して いる。","c":"Bagaimana cara membaca 携わる?","o":["たずさわる","かかわる","ささわる","まじわる"],"e":"携わる = たずさわる (terlibat dalam pekerjaan).","oe":["Benar. 携わる = たずさわる (terlibat).","かかわる = 関わる.","Bacaan tidak ada.","まじわる = 交わる."]},{"s":"Bacaan kanji","q":"事故の 原因を 詳しく 調べる。","c":"Bagaimana cara membaca 詳しく?","o":["くわしく","したしく","あやしく","くやしく"],"e":"詳しい = くわしい (rinci).","oe":["Benar. 詳しく = くわしく.","したしく = 親しく.","あやしく = 怪しく.","くやしく = 悔しく."]}],"J.TEST setara N2 (level C–B)":[{"s":"Tata bahasa & kosakata","q":"子どもの 将来を 思えば（　）、厳しく 叱る こともある。","o":["こそ","さえ","しか","まで"],"e":"〜ばこそ = justru karena ...: 思えばこそ.","oe":["Benar. 〜ばこそ = justru karena.","さえ dengan ば = asalkan; arti berbeda.","しか butuh negatif.","まで tidak cocok."]},{"s":"Tata bahasa & kosakata","q":"いくら 頼まれても、できない ものは できない。引き受ける（　）。","o":["わけにはいかない","わけがない","わけではない","わけだ"],"e":"Tidak bisa begitu saja menerima (alasan prinsip) → わけにはいかない.","oe":["Benar. わけにはいかない = tidak bisa begitu saja.","わけがない = tidak mungkin.","わけではない = bukan berarti.","わけだ = pantas saja."]},{"s":"Tata bahasa & kosakata","q":"試験に 合格（　）、毎日 3時間 勉強して いる。","o":["すべく","しまい","させる","したまま"],"e":"Supaya lulus (formal) → すべく.","oe":["Benar. すべく = untuk (tujuan, formal).","しまい tidak gramatikal di sini.","させる tidak cocok.","したまま = dalam keadaan."]}]},"ch":[{"t":"課題理解","i":"会社で女の人と男の人が話しています。男の人はこのあと何をしますか。","d":[["女","吉田さん、来週のプレゼンの資料、見せてもらったけど、内容はいいと思う。ただ、グラフが多すぎて、ポイントが伝わりにくいかな。"],["男","そうですか。じゃあ、グラフを減らします。"],["女","減らすっていうより、一番伝えたいデータを一つ選んで、大きく見せたらどう？あと、最後のまとめのページは今のままでいいよ。"],["男","わかりました。じゃあ、そこを直してから、もう一度見ていただけますか。"]],"q":"男の人はこのあと何をしますか。","o":["伝えたいデータを選んでグラフを大きくする","グラフを全部削除する","まとめのページを書き直す","プレゼンの練習をする"],"e":"減らすっていうより = bukan sekadar mengurangi, tapi pilih satu data dan tampilkan besar."},{"t":"課題理解","i":"大学で事務の人と学生が話しています。学生はこのあと何をしなければなりませんか。","d":[["学生","奨学金の申請をしたいんですが。"],["事務","申請書と成績証明書が必要です。それから、推薦状も要りますね。"],["学生","成績証明書は持ってきました。推薦状は先生にお願いしてあって、明日いただける予定です。"],["事務","では、申請書はこちらで書いていってください。推薦状は締め切りの金曜日までに出してもらえれば大丈夫です。"]],"q":"学生はこのあと何をしなければなりませんか。","o":["ここで申請書を書く","成績証明書を取りに行く","先生に推薦状をお願いする","金曜日にもう一度来て申請書を書く"],"e":"こちらで書いていって = tulis di sini sebelum pergi."}],"exam":[[["Kosakata, tata bahasa & membaca",105],["Mendengarkan",50]],90,"13"],"bk":[{"t":"1. Gaya tulisan である: membaca artikel tanpa kaget","x":"Bacaan N2 seperti artikel, opini, dan laporan memakai gaya tulis. Tidak ada です・ます, dan beberapa sambungan berubah wajah. Isinya sama saja, hanya \"bajunya\" lebih formal.\nKalau kamu hafal padanannya, membaca jadi jauh lebih cepat.","tb":[{"c":"Gaya ngobrol → gaya tulisan","h":["Ngobrol","Tulisan","Contoh"],"r":[["〜です / 〜だ","〜である","重要である (adalah penting)"],["〜ではありません","〜ではない","簡単ではない"],["〜でした","〜であった","問題であった"],["〜て、 (lalu)","ます-stem、","調べて、→ 調べ、"],["〜ていて、","〜ており、","増えており、"],["〜なくて / 〜ないで","〜ず、","わからず、"],["〜くて、","〜く、","高く、"],["〜けど","〜が","便利だが、高い"],["〜から / 〜ので","〜ため","雨のため中止"],["でも、","しかし、","しかし、問題もある"],["〜なければならない","〜ねばならない","守らねばならない"]]}],"ex":[["人口が減っており、対策が必要である。","じんこうがへっており、たいさくがひつようである。","Populasi menurun, sehingga dibutuhkan langkah penanganan."]],"rm":["です → である","て、→ ます-stem、","ない → ず、","から・ので → ため, けど → が","なければ → ねば"]},{"t":"2. Bentuk khusus: ざる, まい, べき, べく","x":"Pola N2 masih menyimpan \"fosil\" dari bahasa Jepang kuno. Bentuknya sedikit aneh, tapi aturannya sederhana. Yang paling sering menjebak adalah perubahan する.","tb":[{"c":"Rumus dan contoh","h":["Pola","Artinya","Rumus","行く","食べる","する"],"r":[["〜ざるを得ない","terpaksa","ない → ざる","行かざる","食べざる","せざる ⚠"],["〜まい","tidak akan","kamus + まい","行くまい","食べまい / 食べるまい","するまい / すまい"],["〜べきだ","seharusnya","kamus + べき","行くべき","食べるべき","するべき / すべき"],["〜べく","supaya","kamus + べく","行くべく","食べるべく","するべく / すべく"]]}],"ex":[["上司の命令なので、やらざるを得ない。","じょうしのめいれいなので、やらざるをえない。","Karena perintah atasan, terpaksa harus dilakukan."],["二度と遅刻するまい。","にどとちこくするまい。","Saya tidak akan terlambat lagi."]],"n":"Hafalan wajib: する → せざる, すべき, すまい. Ini jebakan favorit di soal.","rm":["ざる = ない → ざる (する → せざる)","まい / べき / べく = kamus + まい / べき / べく","する → すまい, すべき, すべく"]}],"kaiwa":[["Wawancara kerja","Menjawab pertanyaan pewawancara dengan sopan.",[["B","本日はお越しいただき、ありがとうございます。まず、志望動機をお聞かせください。","ほんじつはおこしいただき、ありがとうございます。まず、しぼうどうきをおきかせください。","Terima kasih sudah datang. Pertama, tolong sampaikan motivasi Anda melamar."],["A","はい。<u>祖母の介護</u>をした経験から、お年寄りの生活を支える仕事がしたいと考えるようになりました。","はい。そぼのかいごをしたけいけんから、おとしよりのせいかつをささえるしごとがしたいとかんがえるようになりました。","Ya. Dari pengalaman merawat nenek, saya jadi ingin bekerja menopang kehidupan lansia."],["B","日本語での記録業務は大丈夫ですか。","にほんごでのきろくぎょうむはだいじょうぶですか。","Untuk pekerjaan pencatatan dalam bahasa Jepang, apakah tidak masalah?"],["A","専門用語はまだ勉強中ですが、毎日<u>単語帳</u>を作って覚えるようにしております。","せんもんようごはまだべんきょうちゅうですが、まいにちたんごちょうをつくっておぼえるようにしております。","Istilah teknisnya masih saya pelajari, tapi setiap hari saya membuat buku kosakata untuk menghafalnya."],["B","夜勤もありますが、対応できますか。","やきんもありますが、たいおうできますか。","Ada juga shift malam, apakah bisa?"],["A","はい、問題ございません。","はい、もんだいございません。","Ya, tidak ada masalah."]]]],"mx":[],"preview":true,"cnt":{"g":101,"k":368,"v":52,"q":71}},"N1":{"lv":"N1","jp":"えぬいち","cefr":"≈ C1","stats":[["±2.000","kanji"],["±10.000","kosakata"],["±220","pola bunpou"],["+12–18 bulan","setelah N2"]],"fokus":"Teks abstrak dan opini, bahasa tulis formal, pola klasik (や否や・ゆえに・べく), ungkapan perasaan yang kuat (禁じ得ない・極まりない), idiom, dan kosakata akademik. Bacaan panjang dengan waktu ketat.","tips":[["Baca dalam jumlah besar","N1 menuntut kecepatan membaca teks abstrak. Targetkan 1 editorial koran (社説) atau esai per hari."],["Pelajari nuansa, bukan arti","や否や / なり / が早いか artinya mirip, bedanya di pemakaian. Catat contoh asli untuk setiap pola."],["Kosakata akademik","Kata seperti 懸念, 是正, 妥協 jarang dipakai lisan tapi sering di soal. Buat kartu SRS dari bacaan sendiri."],["Idiom dan onomatope","Soal kosakata N1 sering memakai idiom (顔が広い, 気が置けない). Pahami arti sebenarnya, banyak yang menjebak."],["Choukai panjang","Latih mendengarkan diskusi 3–4 menit: podcast berita, ceramah, debat. Catat poin setiap pembicara."],["Tryout lebih awal","Mulai tryout penuh 3 bulan sebelum ujian. Manajemen waktu bagian bahasa & membaca (110 menit) adalah kunci."]],"weeks":[["Waktu","や否や, が早いか, なり, そばから, を皮切りに"],["Batas & lingkup","に至るまで, をもって, ともなると, を限りに"],["Sebab","ゆえに, とあって, ばこそ, ではあるまいし"],["Penilaian","までもない, に足る, に堪えない, てやまない"],["Perasaan kuat","を禁じ得ない, 極まりない, の至り, ずにはおかない"],["Kontras","とはいえ, といえども, ものを, をよそに"],["Penekanan","はおろか, すら, たりとも, にもまして"],["Tujuan & cara","べく, んがため, かたがた, がてら"],["Kesan & kecenderungan","ずくめ, まみれ, きらいがある, といったらない"],["Kosakata akademik","100 kata abstrak + idiom"],["Membaca intensif","Editorial dan esai panjang setiap hari"],["Tryout","3 kali tryout penuh dengan timer"]],"g":[{"c":"Waktu","p":"～や否や","a":"begitu … langsung","f":"V-る + やいなや","ex":"ベルが鳴るや否や、生徒たちは教室を飛び出した。","rd":"","id":"Begitu bel berbunyi, para murid langsung berlarian keluar kelas.","n":"Bahasa tulis.","x":"「や否や」 berarti \"begitu A, seketika B\".\n▶ Cara pakai\n• V-る + や否や (atau や saja).\n• 「ベルが 鳴る や否や、生徒は 教室を 飛び出した」.\n▶ Hati-hati\n• Gaya tulisan. Kalimat belakang kejadian nyata (bukan kehendak).","m":"や否や = \"ya atau tidak?\" belum sempat dijawab, B sudah terjadi."},{"c":"Waktu","p":"～が早いか","a":"begitu … (secepat kilat)","f":"V-る / V-た + が はやいか","ex":"彼は家に着くが早いか、ベッドに倒れ込んだ。","rd":"","id":"Begitu sampai rumah, dia langsung menjatuhkan diri ke kasur.","n":"","x":"「が早いか」 berarti \"begitu A, langsung B\" (sangat cepat).\n▶ Cara pakai\n• V-る / V-た + が早いか.\n• 「家に 着くが 早いか、ベッドに 倒れ込んだ」.\n▶ Hati-hati\n• Mirip や否や; tidak untuk diri dengan kehendak.","m":"が早いか = \"mana yang lebih cepat?\" A dan B hampir bersamaan."},{"c":"Waktu","p":"～なり","a":"begitu … lalu (tak terduga)","f":"V-る + なり","ex":"母は私の顔を見るなり、泣き出した。","rd":"","id":"Begitu melihat wajah saya, ibu langsung menangis.","n":"Subjek orang ketiga.","x":"「なり」 berarti \"begitu A, (orang itu) langsung B\" yang tidak biasa.\n▶ Cara pakai\n• V-る + なり.\n• 「彼は 部屋に 入る なり、泣き出した」.\n▶ Hati-hati\n• Subjek A dan B sama, orang ketiga.","m":"なり = \"begitu jadi A\", lalu tingkah tak terduga. Subjeknya orang lain."},{"c":"Waktu","p":"～そばから","a":"setiap kali … langsung (berulang)","f":"V-る / V-た + そばから","ex":"覚えたそばから忘れてしまう。","rd":"","id":"Setiap kali hafal, langsung lupa lagi.","n":"","x":"「そばから」 berarti \"baru saja A, langsung B (berulang, menjengkelkan)\".\n▶ Cara pakai\n• V-る / V-た + そばから.\n• 「覚える そばから 忘れて しまう」.\n▶ Hati-hati\n• Untuk hal yang terulang terus.","m":"そばから = \"di sampingnya langsung\": baru dibereskan, sudah berantakan lagi."},{"c":"Waktu","p":"～を皮切りに","a":"dimulai dari","f":"N + を かわきりに","ex":"東京公演を皮切りに、全国ツアーが始まる。","rd":"","id":"Dimulai dari pertunjukan di Tokyo, tur nasional dimulai.","n":"","x":"「を皮切りに」 berarti \"dimulai dari A, lalu berturut-turut\".\n▶ Cara pakai\n• N + を 皮切りに.\n• 「東京を 皮切りに、全国で 公演する」.\n▶ Hati-hati\n• Untuk kegiatan yang berkembang luas.","m":"皮切り = \"potongan kulit pertama\": pembuka rangkaian acara."},{"c":"Batas & lingkup","p":"～に至るまで","a":"sampai ke (bahkan)","f":"N + に いたるまで","ex":"服装から言葉遣いに至るまで、厳しく注意された。","rd":"","id":"Mulai dari pakaian sampai cara bicara, semuanya ditegur keras.","n":"","x":"「に至るまで」 berarti \"sampai ke (hal yang paling detail/jauh)\".\n▶ Cara pakai\n• N + に 至るまで.\n• 「食事から 服装に 至るまで、細かく 決められて いる」.\n▶ Hati-hati\n• Menekankan cakupan yang luas.","m":"至る = \"sampai\" (至 = tiba): mencakup sampai ujung paling kecil."}],"k":[{"k":"丁","on":"チョウ、テイ","kun":"-","m":"blok, lembar; sopan","w":"丁寧","wr":"ていねい","wm":"sopan, teliti"},{"k":"丑","on":"チュウ","kun":"うし","m":"kerbau (shio)","w":"丑年","wr":"うしどし","wm":"tahun kerbau"},{"k":"且","on":"-","kun":"か(つ)","m":"lagi pula","w":"且つ","w <script>(()=>{

<div class="card goal"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="60" cy="60" r="52" fill="none" stroke="${pct>=1?'var(--grn)':'var(--red)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><b>${t}<small>/ ${S.goal} poin</small></b></div><div><h3>Target harian</h3><p class="mut" style="font-size:15px">${pct>=1?'Target tercapai! Lanjutkan kalau masih semangat.':'Tinggal '+(S.goal-t)+' poin lagi.'}</p><div class="bar">${[30,50,100].map(g=>`<button class="chip" aria-pressed="${S.goal===g}" data-goal="${g}">${g}</button>`).join('')}</div></div></div></div>

const KGUIDE=[
['Apa itu hiragana dan katakana?',`Bahasa Jepang memakai 3 jenis huruf sekaligus:
• <b>Hiragana</b> (ひらがな): huruf dasar untuk kata asli Jepang, partikel (は, を, に), dan akhiran kata kerja. Bentuknya bulat dan lembut.
• <b>Katakana</b> (カタカナ): untuk kata serapan dari bahasa asing (テレビ = televisi), nama orang asing (インドネシア), dan bunyi tiruan. Bentuknya tegas dan bersudut.
• <b>Kanji</b> (漢字): huruf dari China yang punya arti.
Satu huruf hiragana/katakana = satu bunyi (suku kata). Jadi kalau sudah hafal 46 huruf, kamu sudah bisa membaca semua bunyi bahasa Jepang.`],
['Cara membaca tabel',`Tabel disusun per baris. Baris pertama adalah 5 vokal: <b>a i u e o</b>.
Baris berikutnya = konsonan + vokal: か (ka) き (ki) く (ku) け (ke) こ (ko), begitu seterusnya.
Ada beberapa bunyi yang <b>tidak mengikuti pola</b>, hafalkan khusus:
• し = <b>shi</b> (bukan si) · ち = <b>chi</b> (bukan ti) · つ = <b>tsu</b> (bukan tu)
• ふ = <b>fu</b> (antara f dan h) · ん = <b>n</b> (satu-satunya huruf tanpa vokal)
• を = dibaca <b>o</b>, hanya dipakai sebagai partikel.`],
['Aturan dasar menulis',`1. Dari <b>atas ke bawah</b>.
2. Dari <b>kiri ke kanan</b>.
3. Garis <b>datar biasanya lebih dulu</b> daripada garis tegak yang memotongnya (contoh: き, た).
4. Tenten ゛ dan maru ゜ selalu ditulis <b>paling akhir</b>.
5. Perhatikan cara mengakhiri coretan:
• <b>とめ (tome)</b> = berhenti tegas.
• <b>はね (hane)</b> = diakhiri kait kecil (contoh: ujung kiri い).
• <b>はらい (harai)</b> = disapu tipis sampai hilang (contoh: ujung あ).

async function kvg(c){
  if(cache.has(c))return cache.get(c);

    const r=await fetch(url(c));if(!r.ok)throw new Error('notfound');

    if(!paths.length)throw new Error('empty');
    const nums=[...doc.querySelectorAll('text')].map(t=>{const m=/matrix\(1 0 0 1 ([\d.]+) ([\d.]+)\)/.exec(t.getAttribute('transform')||'');return m?{n:+t.textContent,x:+m[1],y:+m[2]}:null}).filter(Boolean);
    return {d:paths.map(p=>p.d),nums};
  })();
  cache.set(c,p);p.catch(()=>cache.delete(c));return p;
}

// === Email admin diatur di Firestore → Rules (bukan di sini). Halaman admin: tambahkan #admin di akhir alamat. ===
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp, arrayUnion, collection, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = initializeFirestore(fbApp, { experimentalForceLongPolling: true });
const T = (p, ms = 15000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout: koneksi database terlalu lama")), ms))]);

const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
const inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Twitter|Snapchat/i.test(navigator.userAgent || "");
const errMap = { "auth/popup-closed-by-user": "Jendela login ditutup sebelum selesai.", "auth/network-request-failed": "Koneksi internet bermasalah. Coba lagi.", "auth/unauthorized-domain": "Domain ini belum didaftarkan di Firebase (Authentication → Settings → Authorized domains).", "permission-denied": "Akses ditolak." };

async function login() {
  try { return await signInWithPopup(auth, provider); }
  catch (e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider); throw e; }
}
async function ensureProfile(user) {
  const ref = doc(db, "users", user.uid), snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { name: user.displayName || "", email: user.email, photoURL: user.photoURL || "", brands: ["landing"], createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
    return (await getDoc(ref)).data();
  }
  await updateDoc(ref, { lastLogin: serverTimestamp(), brands: arrayUnion("landing") });
  return snap.data();
}
const adm = {
  async isAdmin() { try { await getDocs(query(collection(db, "payments"), where("x", "==", "cek"))); return true; } catch { return false; } },
  async programs() { const s = await getDocs(collection(db, "programs")); return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id < b.id ? -1 : 1); },
  async find(email) { const s = await getDocs(query(collection(db, "users"), where("email", "==", email))); return s.empty ? null : { id: s.docs[0].id, ...s.docs[0].data() }; },
  async grant(uid, email, pid, date, note) {
    const until = Timestamp.fromDate(new Date(date + "T23:59:59")), by = auth.currentUser.email;
    await updateDoc(doc(db, "users", uid), { [`access.${pid}`]: { until, activatedAt: serverTimestamp(), note, by } });
    await setDoc(doc(collection(db, "payments")), { uid, email, program: pid, until, note, by, at: serverTimestamp() });
    return until;
  },
  revoke(uid, pid) { return updateDoc(doc(db, "users", uid), { [`access.${pid}`]: deleteField() }); },
  saveProgram(id, name) { return setDoc(doc(db, "programs", id), { brand: id.startsWith("kaigo") ? "kaigolink" : "nihongolink", name }, { merge: true }); },
  async devices(uid) {
    const d = await getDocs(collection(db, "users", uid, "devices"));
    const l = await getDocs(collection(db, "users", uid, "deviceLog"));
    const week = Date.now() - 7 * 864e5;
    // Catatan lama (id acak dari Firestore) mencatat setiap login, jadi tidak dihitung. Catatan baru: 1 dokumen per browser.
    const isNew = x => x.id.includes("-") || !/[A-Z]/.test(x.id);
    const recentList = l.docs.filter(x => isNew(x) && x.data().at && x.data().at.toMillis() > week).map(x => ({ label: x.data().label, at: x.data().at }));
    return { list: d.docs.map(x => ({ id: x.id, ...x.data() })), recent: recentList.length, recentList };
  },
  async clearDevices(uid) {
    const d = await getDocs(collection(db, "users", uid, "devices"));
    for (const x of d.docs) await deleteDoc(doc(db, "users", uid, "devices", x.id));
    return d.size;
  },
  async contents(progs) {
    const out = [];
    for (const p of progs) {
      try {
        const s = await getDocs(collection(db, "content", p, "items"));
        s.docs.forEach(d => { const x = d.data(); out.push({ prog: p, key: d.id, size: (x.data || "").length, at: x.updatedAt, by: x.by }); });
      } catch (e) { console.error(e); }
    }
    return out;
  },
  async upload(obj) {
    let n = 0; const names = [];
    for (const prog of Object.keys(obj)) for (const key of Object.keys(obj[prog])) {
      await setDoc(doc(db, "content", prog, "items", key), { data: typeof obj[prog][key] === "string" ? obj[prog][key] : JSON.stringify(obj[prog][key]), updatedAt: serverTimestamp(), by: auth.currentUser.email }); n++; names.push(prog + "/" + key);
    }
    return { n, names };
  }
};
// ===== Batas perangkat: 1 akun maksimal MAX_DEV perangkat aktif =====
const MAX_DEV = 2;
let devId = null; try { devId = localStorage.getItem("lk_dev"); } catch {}
if (!devId) { devId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); try { localStorage.setItem("lk_dev", devId); } catch {} }
const regKey = uid => "lk_reg_" + uid;
function deviceLabel() {
  const ua = navigator.userAgent || "";
  const os = /iPhone|iPad|iPod/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "Perangkat lain";
  const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
  return `${os} · ${br}`;
}
async function logDevice(user) {
  const lk = "lk_log_" + user.uid;
  let done = false; try { done = localStorage.getItem(lk) === devId; } catch {}
  if (done) return;
  try { await setDoc(doc(db, "users", user.uid, "deviceLog", devId), { label: deviceLabel(), at: serverTimestamp() }); } catch (e) { /* sudah tercatat sebelumnya */ }
  try { localStorage.setItem(lk, devId); } catch {}
}
async function registerDevice(user) {
  const ref = doc(db, "users", user.uid, "devices", devId);
  const snap = await getDoc(ref);
  let registered = false; try { registered = localStorage.getItem(regKey(user.uid)) === devId; } catch {}
  if (!snap.exists() && registered) return false;           // perangkat ini sudah dikeluarkan oleh perangkat lain
  if (!snap.exists()) {
    await setDoc(ref, { label: deviceLabel(), createdAt: serverTimestamp(), lastSeen: serverTimestamp() });
    await logDevice(user);
    try { localStorage.setItem(regKey(user.uid), devId); } catch {}
  } else {
    await updateDoc(ref, { lastSeen: serverTimestamp() });
  }
  const all = await getDocs(collection(db, "users", user.uid, "devices"));
  const others = all.docs.filter(d => d.id !== devId)
    .map(d => ({ id: d.id, t: (d.data().lastSeen && d.data().lastSeen.toMillis) ? d.data().lastSeen.toMillis() : 0 }))
    .sort((a, b) => b.t - a.t);
  for (const d of others.slice(MAX_DEV - 1)) await deleteDoc(doc(db, "users", user.uid, "devices", d.id));
  return true;
}
async function checkDevice() {
  const u = auth.currentUser; if (!u) return true;
  try {
    const s = await T(getDoc(doc(db, "users", u.uid, "devices", devId)), 10000);
    if (s.exists()) return true;
    await kicked(); return false;
  } catch { return true; }
}
async function kicked() {
  const u = auth.currentUser;
  if (u) { try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  FB.kickedMsg = true;
  await signOut(auth);
  toast("Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.");
}
async function logoutAll() {
  const u = auth.currentUser;
  if (u) { try { await deleteDoc(doc(db, "users", u.uid, "devices", devId)); } catch {} try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  return signOut(auth);
}
setInterval(() => { if (auth.currentUser && !document.hidden) checkDevice(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && auth.currentUser) checkDevice(); });

async function content(prog, key) { const s = await T(getDoc(doc(db, "content", prog, "items", key)), 20000); return s.exists() ? s.data().data : null; }
async function pay(plan) {
  const fn = httpsCallable(getFunctions(fbApp, "asia-southeast1"), "createPayment");
  const r = await fn({ plan });
  location.href = r.data.redirect_url;
}
async function refresh() {
  const u = auth.currentUser; if (!u) return;
  const s = await getDoc(doc(db, "users", u.uid)); FB.access = (s.exists() && s.data().access) || {};
  for (const k in PAID) delete PAID[k];
  updNav(); route();
}
Object.assign(window.FB, { checkDevice, login, logout: logoutAll, err: e => errMap[e && e.code] || "Login gagal. Coba lagi.", inApp, adm, content, pay, refresh });

getRedirectResult(auth).catch(() => {});
// Kembali dari halaman pembayaran Midtrans: ?order_id=...&transaction_status=...
const qs = new URLSearchParams(location.search);
if (qs.get("order_id")) {
  const ok = ["settlement", "capture"].includes(qs.get("transaction_status"));
  history.replaceState(null, "", location.pathname + "#masuk");
  setTimeout(() => toast(ok ? "Pembayaran diterima! Paket aktif dalam beberapa detik." : "Pembayaran belum selesai. Kamu bisa coba lagi dari menu Harga."), 600);
  if (ok) { [4000, 10000, 20000].forEach(t => setTimeout(() => refresh().catch(() => {}), t)); }
}
onAuthStateChanged(auth, async user => {
  let profile = null;
  if (user) {
    try { profile = await T(ensureProfile(user)); } catch (e) { console.error(e); }
    try { if (!(await T(registerDevice(user)))) { await kicked(); return; } } catch (e) { console.error(e); }
  }
  for (const k in PAID) delete PAID[k];
  FB.ready = true; FB.failed = false; FB.user = user; FB.access = (profile && profile.access) || {};
  updNav();
  try { window.NL && NL.sync && NL.sync(); } catch (e) { console.error(e); }
  const r = (location.hash || "#home").slice(1);
  if (["masuk", "nihongo", "kaigo", "admin"].includes(r)) route();
});
