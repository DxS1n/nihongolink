/* ===== Tema terpadu ala Kaigo Link VIP ===== */
body.nlm{--fb:"Poppins","Noto Sans JP",system-ui,sans-serif;--fh:"Poppins","Noto Sans JP",system-ui,sans-serif;
--bg:light-dark(#F9F9F6,#0D1424);--card:light-dark(#FFFFFF,#16203A);--ink:light-dark(#14213D,#E7EEE9);--mut:light-dark(#5B6478,#A6B0C6);

--gold:light-dark(#B88A00,#F2C94C);--sun:#F2B705;--grn:light-dark(#4A7C59,#86C49A);--red:light-dark(#C8473D,#FF8A80);--blue:light-dark(#2B5B84,#8DB8DE);
--sh:0 1px 2px rgba(20,33,61,.05);background:var(--bg)}
body.nlm.kmode{--navy:light-dark(#4A7C59,#9CC4A6);--navyf:#4A7C59}
html[data-theme=dark] body.nlm{color-scheme:dark}
html[data-theme=light] body.nlm{color-scheme:light}
body.nlm .wm,body.nlm .gc::before{display:none}
/* header */
body.nlm header.top{position:sticky;top:0;margin:0;width:100%;max-width:none;border-radius:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0;border-bottom:1px solid var(--line);box-shadow:none;color:var(--ink);z-index:50}
body.nlm header.top .wrap{max-width:1180px;min-height:0;padding-block:10px;gap:10px}
body.nlm .tb2{padding-block:0 10px!important;gap:10px}
body.nlm .brand2{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
body.nlm .brand2 .bl{display:grid;place-items:center;border-radius:16px;background:#fff;border:1px solid var(--line);padding:4px 8px;flex:none}
body.nlm .brand2 .bl img{height:58px;width:auto;max-width:none;display:block}
body.nlm .brand2 b{display:block;font:800 17px/1.1 var(--fh)}

body.nlm .brand2 small{align-self:center;display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:linear-gradient(90deg,#F2B705,#FFD84D);color:#3B2A00}

body.nlm .msw button{border:0;background:none;border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px}

body.nlm .msw button[aria-pressed=true][data-mode=n]{background:#2B5B84;color:#fff}

body.nlm .chips,body.nlm .stx{margin-left:0;gap:6px;flex-wrap:nowrap;display:flex;align-items:center}

body.nlm .pill{height:40px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}

const SD={"日": ["M30 18L30 92", "M30 18L80 18L80 92", "M30 54L80 54", "M30 92L80 92"], "月": ["M42 14C42 60 36 84 22 98", "M42 14L88 14L88 92Q88 98 76 96", "M42 42L88 42", "M42 68L88 68"], "山": ["M54 14L54 82", "M24 44L24 90L86 90", "M86 44L86 90"], "川": ["M28 18C28 50 24 78 12 96", "M56 14L56 94", "M84 18L84 94"], "人": ["M52 18C50 50 36 80 16 96", "M50 52C60 74 72 88 94 98"], "水": ["M54 14L54 86Q54 96 40 92", "M16 50L40 44C34 68 24 82 10 92", "M72 34C70 52 62 70 46 86", "M56 52C66 72 80 86 98 94"], "大": ["M14 44L96 44", "M54 14C54 50 40 80 14 98", "M54 46C62 70 78 88 98 98"], "木": ["M14 46L96 46", "M54 14L54 98", "M52 48C46 70 32 84 12 94", "M56 48C62 70 76 84 98 94"], "口": ["M26 28L26 86", "M26 28L84 28L84 86", "M26 86L84 86"], "田": ["M28 22L28 90", "M28 22L82 22L82 90", "M54 22L54 90", "M28 56L82 56", "M28 90L82 90"], "町": ["M14 28L14 88", "M14 28L46 28L46 88", "M30 28L30 88", "M14 58L46 58", "M14 88L46 88", "M58 36L100 36", "M80 36L80 94Q80 102 68 98"], "力": ["M14 42L84 42C84 66 78 86 54 98", "M50 14C50 60 40 84 20 98"], "子": ["M24 24L74 24L44 50", "M54 30L54 90Q54 100 42 96", "M14 60L96 60"]};
let soT=0;
const strokes=ch=>SD[ch]?Promise.resolve(SD[ch]):fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${ch.codePointAt(0).toString(16).padStart(5,'0')}.svg`).then(r=>r.ok?r.text():Promise.reject()).then(t=>[...new DOMParser().parseFromString(t,'image/svg+xml').querySelectorAll('path')].map(p=>p.getAttribute('d'))).catch(()=>null);
const GR='';
function so(ch){const box=$('#so');if(!box)return;const tk=++soT;box.innerHTML='<p class="mu">Memuat…</p>';
strokes(ch).then(S=>{if(tk!==soT||!$('#so'))return;
if(!S||!S.length){box.innerHTML='<p class="mu">Urutan goresan kanji ini belum tersedia di versi ini. Gunakan tombol "Urutan goresan ↗" di atas.</p>';return}
box.innerHTML=`<svg class="sv" viewBox="0 0 109 109">${GR}${S.map(d=>`<path d="${d}" pathLength="1"/>`).join('')}</svg><div class="row" style="justify-content:center"><button class="btn pri" id="pl">▶ Putar ulang</button></div><p class="mu" style="text-align:center">${S.length} goresan. Ikuti urutan 1, 2, 3 … berikut:</p><div class="st">${S.map((d,i)=>`<svg viewBox="0 0 109 109">${GR}${S.slice(0,i).map(p=>`<path class="g" d="${p}"/>`).join('')}<path class="h" d="${d}"/><text x="4" y="22">${i+1}</text></svg>`).join('')}</div>`;
const ps=[...box.querySelectorAll('.sv path')].slice(0);const P=ps.filter(p=>p.hasAttribute('pathLength'));
const play=()=>{P.forEach(p=>{p.style.transition='none';p.style.strokeDasharray='1 2';p.style.strokeDashoffset=1});void box.offsetWidth;P.forEach((p,i)=>{p.style.transition=`stroke-dashoffset .6s ease ${i*.75}s`;p.style.strokeDashoffset=0})};
$('#pl').onclick=play;play()})}
const mb=$('#mb'),nv=$('#nv'),nbd=$('#nbd');
const setM=o=>{nv.classList.toggle('open',o);nbd.classList.toggle('on',o);mb.classList.toggle('open',o);mb.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''};
mb.onclick=()=>setM(!nv.classList.contains('open'));nbd.onclick=$('#nx').onclick=()=>setM(false);
addEventListener('keydown',e=>{if(e.key==='Escape')setM(false)});
nv.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setM(false)));
$('#nf').innerHTML=`<b>NihongoLink</b>${soc('n')}<b>KaigoLink</b>${soc('k')}`;
route();
</script>
<script>
/* ===== Penghubung login Firebase (diisi oleh modul di bawah) ===== */
window.NL={user:null,access:{},failed:false,_r:null,onChange:null};
NL.ready=new Promise(r=>NL._r=r);
NL.sync=()=>{const F=window.FB||{};NL.user=F.user||null;NL.access=F.access||{};NL.failed=!!F.failed&&!F.user;NL.kickedMsg=!!F.kickedMsg;
 ['content','logout','checkDevice','login','err','inApp'].forEach(k=>{if(F[k]!==undefined)NL[k]=F[k]});
 try{NL.acct&&NL.acct();NL.wm&&NL.wm()}catch(e){console.error(e)}
 if(NL._r){NL._r();NL._r=null;return}NL.onChange&&NL.onChange()};
NL.parse=v=>{let o=typeof v==='string'?JSON.parse(v):v;if(typeof o==='string')o=JSON.parse(o);if(!o||!Array.isArray(o.g))throw new Error('format materi tidak dikenali, unggah ulang file materi');return o};
NL.has=p=>{const a=NL.access||{},now=Date.now(),pre=p==='n'?'nihongo':'kaigo';return Object.keys(a).some(k=>k.startsWith(pre)&&a[k]&&a[k].until&&a[k].until.toDate&&a[k].until.toDate().getTime()>now)};
NL.esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


/* ===== Penjelasan lisan (suara) ===== */
NL.tts={on:null,q:[],v:{}};
NL.pickVoices=()=>{try{const vs=speechSynthesis.getVoices();const f=l=>vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l)&&/google|natural|online|premium|enhanced/i.test(v.name))||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l));NL.tts.v={id:f('id'),ja:f('ja')}}catch(e){}};
if('speechSynthesis' in window){NL.pickVoices();speechSynthesis.onvoiceschanged=NL.pickVoices}
NL.split=t=>{const out=[];const re=/[぀-ヿ㐀-鿿０-ｚ々〜～ー・、。！？「」『』（）]+/g;let last=0,m;
 t=String(t||'').replace(/<[^>]+>/g,'');
 while((m=re.exec(t))){if(m.index>last)out.push({t:t.slice(last,m.index),l:'id'});out.push({t:m[0],l:'ja'});last=m.index+m[0].length}
 if(last<t.length)out.push({t:t.slice(last),l:'id'});
 return out.map(p=>({l:p.l,t:NL.clean(p.l,p.t)})).filter(p=>p.t&&/[\p{L}\p{N}]/u.test(p.t))};
NL.clean=(l,t)=>l==='ja'?String(t).replace(/[～〜「」『』（）—]/g,' ').trim():String(t).replace(/\s*\/\s*/g,' atau ').replace(/\s*=\s*/g,', artinya ').replace(/[~|→]/g,', ').replace(/\bV-/g,'kata kerja ').replace(/\bN(\d?)\b/g,'kata benda ').trim();
NL.stopSay=()=>{try{speechSynthesis.cancel()}catch(e){}if(NL.tts.au){NL.tts.au.pause();NL.tts.au=null}const b=NL.tts.on;NL.tts.on=null;if(b){b.classList.remove('on');const c=b.closest('.gc');if(c)c.classList.remove('speaking')}};
NL.say=(btn,parts,audio)=>{if(NL.tts.on===btn){NL.stopSay();return}NL.stopSay();
 const c=btn.closest('.gc');btn.classList.add('on');if(c)c.classList.add('speaking');NL.tts.on=btn;
 if(audio){const a=new Audio(audio);NL.tts.au=a;a.onended=a.onerror=()=>{if(NL.tts.on===btn)NL.stopSay()};a.play().catch(()=>NL.stopSay());return}
 if(!('speechSynthesis' in window)){NL.stopSay();alert('Browser ini belum mendukung suara. Coba buka di Chrome.');return}
 if(!NL.tts.v.ja&&!NL.tts.v.id)NL.pickVoices();
 const segs=parts.flatMap(p=>p.l?[{l:p.l,t:NL.clean(p.l,p.t),p:p.p}]:NL.split(p.t)).filter(p=>p.t);
 segs.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);const v=NL.tts.v[p.l];u.lang=p.l==='ja'?'ja-JP':'id-ID';if(v)u.voice=v;u.rate=p.l==='ja'?.85:1;if(p.p)u.pitch=p.p;
  if(i===segs.length-1)u.onend=()=>{if(NL.tts.on===btn)NL.stopSay()};speechSynthesis.speak(u)});
 if(!segs.length)NL.stopSay()};
addEventListener('hashchange',()=>NL.stopSay());

/* ===== Ketik huruf Jepang (IME) di kotak cari ===== */
(()=>{let comp=false;document.addEventListener('compositionstart',()=>comp=true,true);
 document.addEventListener('input',e=>{if((e.isComposing||comp)&&e.target.matches&&e.target.matches('input[type=search]'))e.stopImmediatePropagation()},true);
 document.addEventListener('compositionend',e=>{comp=false;const t=e.target;if(t.matches&&t.matches('input[type=search]'))setTimeout(()=>t.dispatchEvent(new Event('input')),0)},true)})();

/* ===== Furigana (tombol ふりがな) ===== */
(()=>{const KR=/[一-鿿々〆ヶ]+/g,HI=/[ぁ-ゖ]/,DG=/[0-9０-９]/;
const NUMC={'時':'じ','円':'えん','年':'ねん','月':'がつ','回':'かい','歳':'さい','階':'かい','番':'ばん','号':'ごう','度':'ど','枚':'まい','台':'だい','冊':'さつ','件':'けん','万':'まん','千':'せん','百':'ひゃく','名':'めい'};
const NOF='.face,.kgrid,.kk,.som,.wbtn,[data-so],.nofuri,.kj,.qcard.nofuri,input,textarea,script,style,svg,rt,ruby,.logo,.lvp,.tabs,.chips';
const seg=(run,hira,prevDigit)=>{const D=window.FURI_D||{},out=[];let k=0;
 if(prevDigit&&NUMC[run[0]]){out.push([run[0],NUMC[run[0]]]);k=1}
 const rest=run.slice(k);if(!rest)return out;
 if(hira&&D[rest+hira]!=null){out.push([rest,D[rest+hira]]);return out}
 if(D[rest]!=null){out.push([rest,D[rest]]);return out}
 let i=0;while(i<rest.length){let f=false;for(let L=rest.length-i;L>=1;L--){const pc=rest.substr(i,L),last=i+L===rest.length,k2=last&&hira?pc+hira:null;
  if((L>=2||rest.length===1)&&(D[pc]!=null||(k2&&D[k2]!=null))){out.push([pc,k2&&D[k2]!=null?D[k2]:D[pc]]);i+=L;f=true;break}}
  if(!f){out.push([rest[i],null]);i++}}
 return out};
const annotate=node=>{const t=node.nodeValue;if(!t||!KR.test(t))return;KR.lastIndex=0;const fr=document.createDocumentFragment();let i=0,m,any=false;
 while((m=KR.exec(t))){const s=m.index,e=s+m[0].length;if(s>i)fr.appendChild(document.createTextNode(t.slice(i,s)));const nx=t[e]||'',pd=s>0&&DG.test(t[s-1]);
  for(const [txt,rd] of seg(m[0],HI.test(nx)?nx:'',pd)){if(rd){const r=document.createElement('ruby');r.appendChild(document.createTextNode(txt));const rt=document.createElement('rt');rt.textContent=rd;r.appendChild(rt);fr.appendChild(r);any=true}else fr.appendChild(document.createTextNode(txt))}
  i=e}
 if(!any)return;if(i<t.length)fr.appendChild(document.createTextNode(t.slice(i)));node.parentNode.replaceChild(fr,node)};
const walk=root=>{if(!root)return;if(root.nodeType===3){const p=root.parentElement;if(p&&!p.closest(NOF))annotate(root);return}if(root.nodeType!==1||root.closest&&root.closest(NOF))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{KR.lastIndex=0;if(!KR.test(n.nodeValue))return 2;const p=n.parentElement;return p&&!p.closest(NOF)?1:2}});const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(annotate)};
NL.furiWalk=walk;
let q=new Set(),sch=false;const flush=()=>{sch=false;const a=[...q];q.clear();a.forEach(n=>{if(n.isConnected)walk(n)})};
const start=()=>{const m=document.getElementById('main');if(!m)return;walk(m);new MutationObserver(ms=>{ms.forEach(x=>x.addedNodes.forEach(n=>q.add(n)));if(!sch){sch=true;requestAnimationFrame(flush)}}).observe(m,{childList:true,subtree:true});
 const pv=()=>{const e=document.getElementById('pvbar');if(e)walk(e)};pv();
 const b=document.getElementById('furi');let on=false;try{on=localStorage.getItem('nl_furi')==='1'}catch(e){}
 const set=v=>{on=v;document.body.classList.toggle('furi',v);if(b){b.setAttribute('aria-pressed',String(v));b.textContent=v?'ふりがな ✓':'ふりがな'}try{localStorage.setItem('nl_furi',v?'1':'0')}catch(e){}try{window.NLU&&NLU.furi(v)}catch(e){}};set(on);
 if(b)b.onclick=()=>set(!on)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();
/* ===== Motion seperti landing ===== */
NL.motion=()=>{const m=document.getElementById('main');if(!m)return;
 const h=m.querySelector('h1');if(h&&!h.dataset.hl){h.dataset.hl=1;const w=h.childNodes;for(const n of w){if(n.nodeType===3&&/N[1-5]/.test(n.nodeValue)){const t=n.nodeValue,i=t.search(/N[1-5]/),sp=document.createElement('span');sp.className='hlm';sp.textContent=t.substr(i,2);const rest=document.createTextNode(t.slice(i+2));n.nodeValue=t.slice(0,i);n.after(sp,rest);break}}}
 const els=[...m.querySelectorAll('.card,.gc,.vc,.act,.next,.stampwrap,.bab,.qcard,.route,.sotop')].filter(e=>!e.dataset.rv).slice(0,160);
 if(!els.length)return;const io=NL._io||(NL._io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');NL._io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'}):null);
 els.forEach((e,i)=>{e.dataset.rv=1;e.style.setProperty('--d',(i%8)*0.06+'s');e.classList.add('rv');if(io)io.observe(e);else e.classList.add('in')});
 setTimeout(()=>els.forEach(e=>e.classList.add('in')),2500)};
document.addEventListener('click',e=>{if(e.target.closest('.subtabs button,[data-c],[data-m],.lvp button,.sta'))setTimeout(NL.motion,0)});
(()=>{const b=document.createElement('div');b.id='nlbar';document.addEventListener('DOMContentLoaded',()=>document.body.prepend(b));
 addEventListener('scroll',()=>{const d=document.documentElement,mx=d.scrollHeight-innerHeight;b.style.width=(mx>0?scrollY/mx*100:0)+'%'},{passive:true})})();
NL.loginView=()=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=NL.failed?`<div class="card gate"><p class="lg">Login belum tersedia</p><p class="mut">Sistem login sedang bermasalah. Muat ulang halaman, atau kembali ke <a href="#home">situs NihongoLink</a>.</p></div>`:
  `<div class="card gate"><p class="lg">Masuk ke NihongoLink</p><p class="mut">Masuk dengan akun Google untuk mencoba preview materi N5–N1. Materi lengkap terbuka dengan paket NihongoLink.</p>${NL.kickedMsg?'<p class="mut" style="color:var(--red)">Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.</p>':''}${NL.inApp?`<p class="mut" style="border:2px dashed var(--gold);border-radius:14px;padding:10px;text-align:left"><b>Buka di Chrome atau Safari dulu.</b> Google tidak mengizinkan login dari browser Instagram/Facebook. Ketuk menu ⋯ lalu pilih "Buka di browser".</p>`:''}<button class="btn" id="nlg" style="margin-top:8px">Masuk dengan Google</button><p class="mut" id="nle"></p><p><a href="#home">← Kembali ke situs</a></p></div>`;
  const b=document.getElementById('nlg');if(b)b.onclick=async()=>{document.getElementById('nle').textContent='';try{await NL.login()}catch(e){document.getElementById('nle').textContent=NL.err?NL.err(e):'Login gagal.'}}};
NL.pvBar=d=>{const m=document.getElementById('main');if(!m)return;let e=document.getElementById('pvbar');
 if(!d||!d.preview){if(e)e.remove();return}
 if(!e){e=document.createElement('div');e.id='pvbar';m.parentNode.insertBefore(e,m)}
 const c=d.cnt||{};e.innerHTML=`<div><b>Mode preview ${NL.esc(d.lv)}</b><span>${d.empty?'Materi lengkap level ini belum diunggah.':`Contoh sebagian materi. Versi lengkap: ${c.g||'–'} pola bunpou, ${c.k||'–'} kanji, ${c.v||'–'} kosakata, ${c.q||'–'} soal.`}</span></div><a class="btn" href="#home" onclick="event.preventDefault();NLU.buy()">Buka semua materi</a>`};
NL.lockedView=d=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=`<div class="card gate"><div style="font-size:44px">🔒</div><p class="lg">Materi ${NL.esc(d.lv)}</p><p class="mut">${d.empty?'Materi level ini belum diunggah oleh admin.':d.error?'Materi belum bisa dimuat. Periksa koneksi lalu coba lagi.'+(d.msg?'<br><small style="opacity:.7">Detail: '+NL.esc(d.msg)+'</small>':''):d.kicked?'Akunmu baru saja dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan. Masuk lagi untuk melanjutkan.':'Level '+NL.esc(d.lv)+' terbuka dengan paket NihongoLink.'}</p>
  <div class="bar" style="justify-content:center">${d.empty||d.error||d.kicked?'<button class="btn" onclick="location.reload()">Coba lagi</button>':'<a class="btn" href="#home" onclick="event.preventDefault();NLU.buy()">Lihat paket</a>'}${d.lv!=='N5'?'<button class="btn o" id="ton5">Belajar N5</button>':'<a class="btn o" href="#home">Ke situs</a>'}</div></div>`;
  const b=document.getElementById('ton5');if(b)b.onclick=()=>{try{const S=JSON.parse(localStorage.getItem('nl_app_v1'))||{};S.lv='N5';localStorage.setItem('nl_app_v1',JSON.stringify(S))}catch(e){}location.hash='beranda';location.reload()}};
NL.wm=()=>{const el=document.getElementById('nlwm'),u=NL.user;if(!el)return;const on=!!u&&NL.has('n');el.classList.toggle('on',on);if(!on)return;
  const dark=matchMedia('(prefers-color-scheme: dark)').matches,c=dark?'rgba(255,255,255,.07)':'rgba(40,40,80,.08)',t=NL.esc((u.displayName?u.displayName+' · ':'')+u.email);
  el.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180"><text x="150" y="95" text-anchor="middle" transform="rotate(-24 150 90)" fill="${c}" font-family="sans-serif" font-size="13" font-weight="600">${t}</text></svg>`)}")`};

<script>const EMBED={"N5":{"lv":"N5","jp":"えぬご","cefr":"≈ A1","stats":[["±100","kanji"],["±800","kosakata"],["±80 pola","bunpou"],["3–4 bulan","lama belajar"]],"fokus":"Hiragana, katakana, kalimat です/ます, partikel dasar, bentuk て. Bisa membaca kalimat pendek tentang kehidupan sehari-hari.","tips":[["Pakai, jangan hanya hafal","Setiap pola bunpou baru wajib kamu pakai dalam 3 kalimat tentang hidupmu sendiri. Kalimat milikmu jauh lebih mudah diingat daripada contoh buku."],["Pengulangan berjarak (SRS)","Ulangi kosakata dan kanji tepat sebelum lupa: besok, 3 hari, 7 hari, 2 minggu. Pakai Anki atau tombol \"Sudah hafal\" di bagian kanji."],["Ingat aktif, bukan baca ulang","Tutup jawabannya lalu coba ingat. Usaha mengingat itulah yang menguatkan memori, bukan membaca berkali-kali."],["Kanji lewat kata","Belajar 食 bersama 食べます dan 食堂. Satu kanji, dua kata, satu kalimat. Bacaan on dan kun akan menempel dengan sendirinya."],["Shadowing setiap hari","Dengarkan audio pendek, tirukan dengan jeda setengah detik. Melatih telinga untuk choukai dan mulut untuk kaiwa sekaligus."],["Buku salah","Tulis setiap soal yang salah beserta alasannya. Sebelum ujian, buku inilah yang paling berharga, bukan buku teks."]],"weeks":[["Hiragana & katakana","Baca lancar 2×46 huruf, salam dasar."],["です & kata tunjuk","は/です/か, これ・この・ここ, の."],["Partikel & ます","を・に・で・へ・と, bentuk ます dan lampau."],["Ada & angka","あります/います, posisi, jam, harga."],["Kata sifat","い dan な, すき/じょうず, kalimat sifat lampau."],["Bentuk て (1)","てください, ています, てから."],["Bentuk て (2)","てもいい, てはいけない, ないでください, たり, から."],["Banding & tryout","より/いちばん, まえに/あとで, 2× tryout penuh."]],"sched":[["0–10","Ulang kartu SRS","Kanji dan kosakata yang jatuh tempo hari ini."],["10–25","1 pola bunpou baru","Baca rumus, tutup contoh, buat 3 kalimat sendiri."],["25–35","Shadowing","Audio 1–2 menit, ulangi 3 kali."],["35–50","10 soal latihan","Kerjakan dengan timer, catat yang salah di buku salah."],["50–60","Bicara 1 menit","Rekam dirimu memakai pola hari ini, dengarkan lagi."]],"g":[{"c":"Dasar","p":"～は～です","a":"A adalah B (kalimat sopan)","f":"N1 は N2 です","ex":"わたしは がくせいです。","rd":"watashi wa gakusei desu.","id":"Saya pelajar.","n":"Partikel は dibaca \"wa\", bukan \"ha\". Minna bab 1","x":"Pola ini dipakai untuk memperkenalkan diri atau menjelaskan \"A adalah B\". Ini pola pertama yang wajib kamu kuasai.\n▶ Cara pakai\n• Tulis topik (yang dibicarakan), lalu tempel 「は」 (dibaca wa, bukan ha).\n• Tulis keterangannya, lalu tutup dengan 「です」 (de-su) supaya sopan.\n• Kalau topiknya sudah jelas, boleh dihilangkan: 「がくせいです」 (ga-ku-se-i de-su) = \"(Saya) pelajar.\"\n▶ Contoh lain\n• 「わたしは アンディです。」 (wa-ta-shi wa a-n-di de-su) = Saya Andi.\n• 「やまださんは せんせいです。」 (ya-ma-da-sa-n wa se-n-se-i de-su) = Pak Yamada adalah guru.\n▶ Hati-hati\n• です hanya untuk kata benda dan kata sifat. Jangan ditempel ke kata kerja: ✗ たべますです.","m":"は = \"nah, soal ...\" (penunjuk topik), です = titik sopan di ujung. Topik は, isi です.","rs":"wa-ta-shi wa ga-ku-se-i de-su.","pr":"~ wa ~ de-su"},{"c":"Dasar","p":"～じゃありません","a":"bukan","f":"N じゃありません / ではありません","ex":"これは わたしの ほんじゃありません。","rd":"kore wa watashi no hon ja arimasen.","id":"Ini bukan buku saya.","n":"ではありません lebih formal; keduanya benar di soal. Minna bab 1","x":"Ini bentuk \"bukan\" dari です. Dipakai untuk membantah atau menjelaskan bahwa sesuatu bukan seperti itu.\n▶ Cara pakai\n• Ganti 「です」 dengan 「じゃありません」 (ja-a-ri-ma-se-n).\n• Dalam tulisan atau situasi formal, pakai 「ではありません」 (de-wa a-ri-ma-se-n). Artinya sama.\n▶ Contoh lain\n• 「わたしは せんせいじゃありません。」 (wa-ta-shi wa se-n-se-i ja-a-ri-ma-se-n) = Saya bukan guru.\n• 「いいえ、にほんじんじゃありません。」 (i-i-e, ni-ho-n-ji-n ja-a-ri-ma-se-n) = Tidak, (saya) bukan orang Jepang.\n▶ Hati-hati\n• Untuk masa lalu, tambahkan でした: 「じゃありませんでした」 = dulu bukan.\n• Jangan tulis ✗ じゃないです dalam soal formal; pilih じゃありません.","m":"じゃ ありません = \"jangan anggap begitu, bukan!\" Ujungnya ありません = tidak ada.","rs":"ko-re wa wa-ta-shi-no ho-n ja-a-ri-ma-se-n.","pr":"~ ja-a-ri-ma-se-n"},{"c":"Dasar","p":"～ですか","a":"kalimat tanya","f":"Kalimat + か","ex":"あなたは にほんじんですか。","rd":"anata wa nihonjin desu ka.","id":"Apakah Anda orang Jepang?","n":"Tidak perlu tanda tanya; か sudah membuat kalimat tanya. Minna bab 1","x":"Cara paling mudah membuat pertanyaan: tempel 「か」 (ka) di akhir kalimat sopan.\n▶ Cara pakai\n• Buat kalimat biasa dengan です atau ます.\n• Tambahkan 「か」 di akhir, dan naikkan nada suara.\n• Tanda tanya (？) tidak wajib, karena か sudah berarti pertanyaan.\n▶ Cara menjawab\n• Setuju: 「はい、そうです。」 (ha-i, so-u de-su) = Ya, benar.\n• Tidak: 「いいえ、ちがいます。」 (i-i-e, chi-ga-i-ma-su) = Bukan.\n▶ Contoh lain\n• 「これは ペンですか。」 (ko-re wa pe-n de-su-ka) = Apakah ini pena?\n▶ Hati-hati\n• Kalau ada kata tanya (なん, だれ, どこ), jangan jawab はい atau いいえ. Langsung jawab isinya.","m":"か = tanda tanya Jepang. Tinggal tempel か di belakang, nada naik.","rs":"a-na-ta wa ni-ho-n-ji-n de-su-ka.","pr":"~ de-su-ka"},{"c":"Partikel","p":"～の","a":"milik / keterangan benda","f":"N1 の N2","ex":"これは にほんごの ほんです。","rd":"kore wa nihongo no hon desu.","id":"Ini buku bahasa Jepang.","n":"Urutan terbalik dari bahasa Indonesia: \"buku bahasa Jepang\" = にほんご の ほん. Minna bab 1","x":"「の」 (no) menghubungkan dua kata benda. Kata benda yang di depan menjelaskan kata benda yang di belakang.\n▶ Cara pakai\n• Urutannya kebalikan bahasa Indonesia: [penjelas] の [benda utama].\n• \"Buku saya\" = 「わたしの ほん」 (wa-ta-shi no ho-n).\n• の bisa berarti milik, asal, bahan, atau jenis.\n▶ Contoh lain\n• 「にほんの くるま」 (ni-ho-n no ku-ru-ma) = mobil (buatan) Jepang.\n• 「IMCの しゃいん」 (IMC no sha-i-n) = karyawan IMC.\n• Kalau bendanya sudah jelas, boleh dihilangkan: 「これは わたしのです」 = Ini punya saya.\n▶ Hati-hati\n• Jangan dibalik: ✗ ほんの わたし.","m":"の = \"punya\". Yang punya di depan, barangnya di belakang: わたし の ほん.","rs":"ko-re wa ni-ho-n-go-no ho-n de-su.","pr":"~ no"},{"c":"Partikel","p":"～も","a":"juga","f":"N も","ex":"わたしも がくせいです。","rd":"watashi mo gakusei desu.","id":"Saya juga pelajar.","n":"も menggantikan は/が/を, jangan ditulis はも. Minna bab 1","x":"「も」 (mo) artinya \"juga\". Dipakai saat keterangan yang sama berlaku untuk hal lain.\n▶ Cara pakai\n• Ganti は dengan も: 「わたしは がくせいです」 → 「わたしも がくせいです」 (wa-ta-shi mo ga-ku-se-i de-su) = Saya juga pelajar.\n• も juga menggantikan が dan を.\n▶ Contoh lain\n• 「リンさんも いしゃです。」 (ri-n-sa-n mo i-sha de-su) = Lin juga dokter.\n• 「コーヒーも のみます。」 (ko-o-hi-i mo no-mi-ma-su) = Saya juga minum kopi.\n▶ Hati-hati\n• Jangan ditumpuk: ✗ はも, ✗ をも.\n• Dalam kalimat negatif, も bisa berarti \"pun tidak\": 「なにも たべません」 = tidak makan apa pun.","m":"も = \"mo juga\". Ganti は/が/を dengan も, jangan ditumpuk.","rs":"wa-ta-shi-mo ga-ku-se-i de-su.","pr":"~ mo"},{"c":"Dasar","p":"これ・それ・あれ・どれ","a":"ini / itu / itu (jauh) / yang mana","f":"これ は N です","ex":"それは なんですか。","rd":"sore wa nan desu ka.","id":"Itu apa?","n":"これ berdiri sendiri; tidak boleh langsung diikuti kata benda. Minna bab 2","x":"Kata tunjuk untuk benda. Keempatnya berdiri sendiri seperti kata benda.\n▶ Cara pakai\n• 「これ」 (ko-re): benda dekat saya.\n• 「それ」 (so-re): benda dekat kamu.\n• 「あれ」 (a-re): benda jauh dari kita berdua.\n• 「どれ」 (do-re): yang mana? (dari 3 pilihan atau lebih)\n▶ Contoh lain\n• 「これは なんですか。」 (ko-re wa na-n de-su-ka) = Ini apa?\n• 「あれは わたしの かさです。」 (a-re wa wa-ta-shi no ka-sa de-su) = Itu payung saya.\n▶ Hati-hati\n• これ tidak boleh langsung diikuti kata benda: ✗ これ ほん. Kalau mau, pakai この ほん.","m":"こ = dekat saya, そ = dekat kamu, あ = jauh dua-duanya, ど = tanya. Satu pola untuk semua kata tunjuk.","rs":"so-re wa na-n de-su-ka.","pr":"ko-re / so-re / a-re / do-re"}],"k":[{"k":"一","on":"イチ","kun":"ひと(つ)","m":"satu","w":"一つ","wr":"ひとつ","wm":"satu buah","c":"Angka & uang"},{"k":"七","on":"シチ","kun":"なな","m":"tujuh","w":"七時","wr":"しちじ","wm":"jam tujuh","c":"Angka & uang"},{"k":"万","on":"マン","kun":"-","m":"sepuluh ribu","w":"一万円","wr":"いちまんえん","wm":"10.000 yen","c":"Angka & uang"},{"k":"三","on":"サン","kun":"みっ(つ)","m":"tiga","w":"三月","wr":"さんがつ","wm":"Maret","c":"Angka & uang"},{"k":"上","on":"ジョウ","kun":"うえ","m":"atas","w":"上手","wr":"じょうず","wm":"pandai","c":"Arah & posisi"},{"k":"下","on":"カ・ゲ","kun":"した","m":"bawah","w":"下手","wr":"へた","wm":"tidak pandai","c":"Arah & posisi"},{"k":"中","on":"チュウ","kun":"なか","m":"tengah, dalam","w":"中国","wr":"ちゅうごく","wm":"Tiongkok","c":"Arah & posisi"},{"k":"九","on":"キュウ・ク","kun":"ここの(つ)","m":"sembilan","w":"九時","wr":"くじ","wm":"jam sembilan","c":"Angka & uang"},{"k":"二","on":"ニ","kun":"ふた(つ)","m":"dua","w":"二人","wr":"ふたり","wm":"dua orang","c":"Angka & uang"},{"k":"五","on":"ゴ","kun":"いつ(つ)","m":"lima","w":"五分","wr":"ごふん","wm":"lima menit","c":"Angka & uang"},{"k":"人","on":"ジン・ニン","kun":"ひと","m":"orang","w":"日本人","wr":"にほんじん","wm":"orang Jepang","c":"Orang & tubuh"},{"k":"今","on":"コン","kun":"いま","m":"sekarang","w":"今日","wr":"きょう","wm":"hari ini","c":"Hari & waktu"}],"v":{"Salam & ungkapan":[["おはようございます","","selamat pagi"],["こんにちは","","selamat siang"],["こんばんは","","selamat malam"],["ありがとうございます","","terima kasih"],["すみません","","maaf / permisi"],["いただきます","","(sebelum makan)"]],"Waktu":[["きょう","今日","hari ini"],["あした","明日","besok"],["きのう","昨日","kemarin"],["まいにち","毎日","setiap hari"],["あさ","朝","pagi"],["ひる","昼","siang"]]},"q":{"JLPT N5":[{"s":"Kosakata · bacaan kanji","q":"あしたは 雨です。","c":"Bagaimana cara membaca 雨?","o":["あめ","ゆき","かさ","くも"],"e":"雨 = あめ (hujan). ゆき = salju (雪), くも = awan (雲).","oe":["Benar. 雨 = あめ (hujan).","ゆき = salju, kanjinya 雪.","かさ = payung (傘), bukan cara baca 雨.","くも = awan (雲)."]},{"s":"Kosakata · bacaan kanji","q":"毎日 にほんごを べんきょうします。","c":"Cara baca 毎日?","o":["まいにち","まいび","まいひ","めいにち"],"e":"毎日 = まいにち. Ingat juga 毎週 まいしゅう, 毎年 まいとし.","oe":["Benar. 毎日 = まいにち (setiap hari). 日 dibaca にち.","日 di sini tidak dibaca び.","Bukan ひ; ひ dipakai sendiri (日 = hari) atau di 日曜日 (にちようび) tidak.","毎 dibaca まい, bukan めい."]},{"s":"Kosakata · penulisan","q":"この くるまは あたらしいです。","c":"Kanji untuk くるま?","o":["車","東","重","軍"],"e":"車 = くるま. 東 ひがし (timur), 重 berat, 軍 militer. Bentuknya mirip, perhatikan detail.","oe":["Benar. 車 = くるま (mobil).","東 = ひがし (timur). Bentuknya mirip 車 ditambah garis.","重 = おもい (berat).","軍 = ぐん (tentara). Ada atap di atas 車."]}],"Mendengarkan N5":[{"s":"Tugas (transkrip)","q":"女：すみません、ジュースを 2本と パンを 1つ ください。\n男：はい。ジュースは 1本 120円、パンは 150円です。","c":"Berapa yang harus dibayar perempuan itu?","o":["390円","270円","240円","420円"],"e":"2 × 120 + 150 = 390 yen.","oe":["Benar. Jus 120×2 = 240, ditambah roti 150 = 390 yen.","270 = satu jus + roti; padahal jusnya 2 botol.","240 = harga jus saja, roti belum dihitung.","420 = salah hitung (misalnya roti dihitung 2)."]},{"s":"Poin (transkrip)","q":"男：あした、何時に 会いましょうか。\n女：10時は どうですか。\n男：10時は ちょっと…。11時は どうですか。\n女：いいですよ。","c":"Jam berapa mereka bertemu besok?","o":["11時","10時","10時半","12時"],"e":"10時は ちょっと… = menolak halus. Disepakati jam 11.","oe":["Benar. Jam 10 ditolak (ちょっと…), lalu sepakat jam 11.","Jam 10 diusulkan tetapi ditolak.","10:30 tidak disebut.","Jam 12 tidak disebut."]},{"s":"Ungkapan (transkrip)","q":"Anda masuk ke rumah teman.","c":"Apa yang Anda katakan?","o":["おじゃまします","いってきます","ただいま","いただきます"],"e":"Masuk rumah orang lain: おじゃまします.","oe":["Benar. Saat masuk rumah orang: おじゃまします.","いってきます = saat pergi dari rumah sendiri.","ただいま = saat pulang ke rumah sendiri.","いただきます = sebelum makan."]}],"JFT-Basic":[{"s":"Huruf & kosakata","q":"入口","c":"Cara membacanya?","o":["いりぐち","でぐち","まどぐち","ひじょうぐち"],"e":"入口 いりぐち = pintu masuk. 出口 = pintu keluar, 窓口 = loket.","oe":["Benar. 入口 = いりぐち (pintu masuk).","でぐち = 出口 (pintu keluar).","まどぐち = 窓口 (loket).","ひじょうぐち = 非常口 (pintu darurat)."]},{"s":"Huruf & kosakata","q":"禁煙","c":"Arti papan ini?","o":["Dilarang merokok","Boleh merokok","Tempat merokok","Dilarang masuk"],"e":"禁 = larangan, 煙 = asap. 禁煙 きんえん.","oe":["Benar. 禁 = larang, 煙 = asap/rokok.","Kebalikannya; boleh merokok tidak ditulis 禁.","Tempat merokok = 喫煙所.","Dilarang masuk = 立入禁止."]},{"s":"Huruf & kosakata","q":"無料","c":"Arti tulisan ini?","o":["Gratis","Mahal","Diskon","Tutup"],"e":"無料 むりょう = gratis. 料金 = tarif.","oe":["Benar. 無料 = gratis (無 = tidak ada, 料 = biaya).","Mahal = 高い.","Diskon = 割引.","Tutup = 休み / 閉店."]}],"JLPT N5 · Paket 2":[{"s":"Bacaan kanji","q":"まいあさ 七時に おきます。","c":"Bagaimana cara membaca 七時?","o":["しちじ","なのじ","ななじ","しつじ"],"e":"七時 = しちじ (jam 7). Untuk jam, 7 dibaca しち: しちじ. ななじ juga terdengar dalam percakapan, tapi bacaan baku di JLPT adalah しちじ.","oe":["Benar. 七時 = しちじ.","なの dipakai untuk tanggal 7 (なのか), bukan jam.","Untuk jam, 7 dibaca しち, bukan なな.","しつじ = kata lain (pelayan rumah)."]},{"s":"Bacaan kanji","q":"この 山は とても 高いです。","c":"Bagaimana cara membaca 高い?","o":["たかい","ひくい","ながい","おおきい"],"e":"高い = たかい (tinggi / mahal). ひくい = 低い (rendah).","oe":["Benar. 高い = たかい (tinggi/mahal).","ひくい = 低い (rendah).","ながい = 長い (panjang).","おおきい = 大きい (besar)."]},{"s":"Bacaan kanji","q":"きのう 友だちと 映画を みました。","c":"Bagaimana cara membaca 友だち?","o":["ともだち","ゆうだち","ともたち","とまだち"],"e":"友だち = ともだち (teman).","oe":["Benar. 友だち = ともだち.","ゆうだち = 夕立 (hujan sore).","Tidak ada perubahan bunyi ke たち tanpa tenten.","Bacaan salah."]}],"J.TEST setara N5 (level F–E)":[{"s":"Tata bahasa & kosakata","q":"A「すみません、いま なんじですか。」\nB「（　）です。」","o":["三時","三日","三人","三つ"],"e":"Pertanyaan jam → 三時 (jam tiga).","oe":["Benar. Menanyakan jam → 三時 (jam tiga).","三日 = tanggal 3 / tiga hari.","三人 = tiga orang.","三つ = tiga buah."]},{"s":"Tata bahasa & kosakata","q":"わたしは にほんごが すこし（　）。","o":["わかります","あります","います","します"],"e":"〜が わかります = mengerti ...; untuk bahasa memakai が わかります.","oe":["Benar. 日本語が わかります = mengerti bahasa Jepang.","あります = ada (benda).","います = ada (makhluk hidup).","します = melakukan; perlu を."]},{"s":"Tata bahasa & kosakata","q":"この りんごは 一つ（　）ですか。","o":["いくら","いくつ","どこ","だれ"],"e":"Menanyakan harga: いくら. いくつ = berapa buah.","oe":["Benar. いくら = berapa harganya.","いくつ = berapa buah (jumlah).","どこ = di mana.","だれ = siapa."]}],"Harian · 漢字読み (Bacaan kanji)":[{"s":"Bacaan kanji","q":"まいあさ 七時に おきます。","c":"Bagaimana cara membaca 七時?","o":["しちじ","ななじ","しじ","なのじ"],"e":"七時 = しちじ (jam 7).","oe":["Benar.","Untuk jam, baku しちじ.","Tidak ada bacaan しじ untuk ja ,"t":"課題理解","c":"l"}]}],"pv":1,"min":10},{"id":"jft-1-pv","t":"Simulasi JFT-Basic · Paket 1 (contoh)","k":"jft","min":10,"sec":[{"n":"文字と語彙","id":"Huruf & kosakata","m":0,"c":"g","p":[{"h":"語の意味","i":"","ii":"Lihat gambar, pilih kata yang tepat","q":[{"q":"えを 見て、正しい ことばを えらんで ください。","o":["わらいます","なきます","おこります","ねむります"],"e":"Gambar orang tertawa = わらいます.","img":"@laugh:😆","oe":["Benar. Wajah tertawa = わらいます.","なきます = menangis.","おこります = marah.","ねむります = tidur."]},{"q":"えを 見て、正しい ことばを えらんで ください。","o":["せんたくします","そうじします","りょうりします","かいものします"],"e":"Mesin cuci & baju = せんたく (mencuci pakaian).","img":"@laundry:🧺👕","oe":["Benar. Keranjang & baju = mencuci pakaian.","そうじ = membersihkan ruangan.","りょうり = memasak.","かいもの = berbelanja."]}],"c":"g"}]},{"n":"会話と表現","id":"Percakapan & ungkapan","m":0,"c":"g","p":[{"h":"文法","i":"","ii":"Tata bahasa","q":[{"q":"A「この ペン、つかっても いいですか。」B「ええ、（　）。」","o":["どうぞ","どうも","どうして","どちら"],"e":"Memberi izin: どうぞ.","oe":["Benar. どうぞ = silakan.","どうも = terima kasih.","どうして = mengapa.","どちら = yang mana."]},{"q":"あした しごとが ありますから、こんばんは はやく（　）。","o":["ねる つもりです","ねた ことが あります","ねて しまいました","ねて いました"],"e":"Rencana: 〜つもりです.","oe":["Benar. Rencana malam ini: つもり.","Pengalaman; tidak cocok dengan こんばん.","Sudah terlanjur; tidak cocok.","Lampau; tidak cocok."]}],"c":"g"}]},{"n":"聴解","id":"Mendengarkan","m":0,"c":"l","p":[{"h":"会話","i":"","ii":"Percakapan","q":[{"i":"男の 人と 女の 人が 話して います。","d":[["男","しゅうまつ、何を しましたか。"],["女","ともだちと いっしょに やまへ 行って、しゃしんを たくさん とりました。"],["男","いいですね。"]],"q":"女の 人は しゅうまつ 何を しましたか。","o":["@mountain-photo:⛰️📷","@sea:🏖️","@movie:🎬","@cook:🍳"],"e":"Ke gunung dan mengambil foto.","oe":["Benar. Gunung dan foto.","Tidak disebut.","Tidak disebut.","Tidak disebut."]},{"i":"女の 人と 男の 人が 話して います。","d":[["女","いっしょに ひるごはんを たべませんか。"],["男","すみません。いま いそがしいので、あとで たべます。"]],"q":"男の 人は どうしますか。","o":["あとで ひるごはんを たべる","いま いっしょに たべる","ひるごはんを たべない","いえで たべる"],"e":"Sibuk sekarang, makan nanti.","oe":["Benar. Makan nanti.","Sibuk sekarang.","Ia tetap makan.","Tidak disebut."]}],"c":"l","l":1,"t":"ポイント理解"}]},{"n":"読解","id":"Membaca","m":0,"c":"r","p":[{"h":"内容の理解","i":"","ii":"Memahami isi teks","q":[{"ps":"リンさんへ\nきょうは かぜで しごとを やすみます。すみません。あしたの あさの しごとを かわって もらえませんか。あとで でんわします。\nマリア","q":"マリアさんは リンさんに 何を たのみましたか。","o":["あしたの あさの しごとを かわる こと","びょういんへ いっしょに 行く こと","くすりを かって くる こと","でんわを かける こと"],"e":"Minta Lin menggantikan kerja besok pagi.","oe":["Benar. Menggantikan kerja besok pagi.","Tidak disebut.","Tidak disebut.","Maria yang akan menelepon."]},{"ps":"まちの おしらせ\n6月10日（日）に こうえんで おまつりが あります。じかんは 10時から 16時までです。あめの 日は 6月17日（日）に なります。","q":"あめが ふったら、おまつりは いつですか。","o":["6月17日","6月10日","6月11日","ありません"],"e":"Jika hujan diundur ke 17 Juni.","oe":["Benar. 17 Juni.","Jadwal jika cerah.","Tidak disebut.","Ada tanggal pengganti."]}],"c":"r"}]}],"pv":1},{"id":"n5-1","t":"Simulasi JLPT N5 · Paket 1","k":"jlpt","lock":1,"n":67,"mins":90},{"id":"n5-2","t":"Simulasi JLPT N5 · Paket 2","k":"jlpt","lock":1,"n":67,"mins":90},{"id":"jft-1","t":"Simulasi JFT-Basic · Paket 1","k":"jft","lock":1,"n":50,"mins":60},{"id":"jft-2","t":"Simulasi JFT-Basic · Paket 2","k":"jft","lock":1,"n":50,"mins":60}],"preview":true,"cnt":{"g":34,"k":80,"v":84,"q":164}},"N4":{"lv":"N4","jp":"えぬよん","cefr":"≈ A2","stats":[["±300","kanji"],["±1.500","kosakata"],["±130","pola bunpou"],["+5–6 bulan","setelah N5"]],"fokus":"Semua perubahan bentuk kata kerja (potensial, pasif, kausatif, bentuk maksud, bentuk ば), memberi-menerima, dugaan (そう・よう・らしい), dan dasar keigo. Target umum untuk Tokutei Ginou bersama JFT-Basic.","tips":[["Kuasai tabel bentuk dulu","80% kesalahan soal N4 berasal dari salah mengubah bentuk kata kerja. Latih tabel di bawah sampai bisa tanpa berpikir."],["Pisahkan pola yang mirip","そう (kelihatannya) vs そう (katanya), ために vs ように, ば vs たら vs と vs なら. Buat tabel perbandingan sendiri."],["Pasangan transitif-intransitif","開く/開ける, 消える/消す. Hafalkan berpasangan, karena soal ています vs てあります bergantung pada ini."],["Baca teks pendek setiap hari","Bacaan N4 berupa memo, email, dan pengumuman. Latih cari informasi: siapa, kapan, di mana, harus apa."],["Dengarkan percakapan kantor","Choukai N4 banyak situasi kerja dan toko. Dengarkan NHK Easy Japanese, lalu shadowing."],["Satu bab Minna II per 3 hari","Hari 1 kosakata dan pola, hari 2 latihan, hari 3 soal per bab di halaman ini."]],"weeks":[["Bab 26–30","んです, potensial, ながら, ています/てあります, ておきます"],["Bab 31–34","Bentuk maksud, つもり, でしょう/かもしれない, perintah, とおりに"],["Bab 35–38","Bentuk ば, なら, ように, pasif, のは/のが/のを"],["Bab 39–42","Sebab て/ので, か/かどうか, memberi-menerima sopan, ために"],["Bab 43–46","そう (kelihatannya), すぎる, やすい/にくい, 場合, ところ"],["Bab 47–50","そう (katanya), よう, kausatif, sonkeigo, kenjougo"],["Ulang & kanji","Ulangi semua pola yang salah, kejar 300 kanji"],["Tryout","2 kali tryout penuh dengan timer, analisis kesalahan"]],"g":[{"c":"Bentuk kata kerja","p":"Bentuk potensial","a":"bisa","f":"Gol I: く→ける / Gol II: る→られる / する→できる / くる→こられる","ex":"私は漢字が少し読めます。","rd":"わたしは かんじが すこし よめます。","id":"Saya bisa sedikit membaca kanji.","n":"Objek biasanya memakai が. Minna bab 27.","x":"Bentuk potensial berarti \"bisa\" atau \"mampu\". Dipakai untuk kemampuan (bisa berenang) atau kemungkinan (di sini bisa parkir).\n▶ Cara membuat\n• Golongan 1: bunyi u jadi e + る: 書く → 書ける, 話す → 話せる, 買う → 買える.\n• Golongan 2: buang る + られる: 食べる → 食べられる.\n• する → できる, 来る → 来られる.\n▶ Cara pakai\n• Objek biasanya pindah dari を ke が: 「日本語が 話せます」.\n• Hasilnya kata kerja golongan 2 baru: 書けます, 書けない, 書けた.\n▶ Contoh lain\n• 「漢字が 少し 読めます。」 = Saya bisa membaca sedikit kanji.\n▶ Hati-hati\n• 食べれる / 見れる (tanpa ら) sering terdengar di percakapan, tapi di ujian pakai 食べられる.","m":"Potensial = naik ke baris え: かく → かける. Gol II: tambah られる."},{"c":"Bentuk kata kerja","p":"見えます・聞こえます","a":"terlihat / terdengar (alami)","f":"N が 見えます / 聞こえます","ex":"窓から海が見えます。","rd":"まどから うみが みえます。","id":"Dari jendela terlihat laut.","n":"見られます = bisa melihat karena ada kesempatan. Bab 27.","x":"見えます dan 聞こえます berarti sesuatu terlihat atau terdengar dengan sendirinya, tanpa kita berusaha.\n▶ Cara pakai\n• [tempat] から [benda] が 見えます / 聞こえます.\n• 「窓から 山が 見えます」 = Dari jendela terlihat gunung.\n▶ Bedakan dengan potensial\n• 見えます: masuk ke mata dengan sendirinya.\n• 見られます: bisa melihat karena ada kesempatan: 「この映画は ネットで 見られます」.\n▶ Contoh lain\n• 「となりの 部屋から 音楽が 聞こえます。」 = Dari kamar sebelah terdengar musik.\n▶ Hati-hati\n• Bendanya memakai が, bukan を.","m":"見える・聞こえる = terjadi sendiri, mata dan telinga yang \"menangkap\". Benda pakai が."},{"c":"Penjelasan","p":"～んです","a":"menjelaskan / menanyakan alasan","f":"Bentuk biasa + んです (N/Adj な + なんです)","ex":"どうしたんですか。—頭が痛いんです。","rd":"どうしたんですか。—あたまが いたいんです。","id":"Kenapa? —Kepala saya sakit.","n":"Jangan berlebihan, bisa terdengar menuntut. Bab 26.","x":"「〜んです」 dipakai saat menjelaskan latar belakang atau menanyakan alasan dengan rasa ingin tahu.\n▶ Cara pakai\n• Bentuk biasa + んです: 行く → 行くんです, 高い → 高いんです.\n• Kata benda dan sifat な: + なんです: 病気なんです.\n▶ Fungsi\n• Bertanya penuh perhatian: 「どうしたんですか」 = Ada apa?\n• Menjelaskan alasan: 「頭が 痛いんです」 = (Soalnya) kepala saya sakit.\n• Pembuka minta tolong: 「日本語が わからないんですが、…」.\n▶ Hati-hati\n• Jangan dipakai terus-menerus untuk informasi biasa; terdengar seperti selalu membela diri.","m":"んです = \"nah, begini ceritanya\". Penjelasan atau tanya alasan dengan rasa ingin tahu."},{"c":"Permintaan","p":"～ていただけませんか","a":"bisakah Anda … (sangat sopan)","f":"V-て いただけませんか","ex":"日本語を教えていただけませんか。","rd":"にほんごを おしえて いただけませんか。","id":"Bisakah Anda mengajari saya bahasa Jepang?","n":"Lebih sopan dari ～てください. Bab 26.","x":"Cara meminta tolong yang sangat sopan: \"Bisakah Anda ...?\" Cocok untuk atasan, guru, atau orang yang belum dikenal.\n▶ Cara pakai\n• Bentuk て + いただけませんか.\n• 「もう一度 説明して いただけませんか」 = Bisakah Anda menjelaskan sekali lagi?\n▶ Tingkat kesopanan\n• 〜てください (sopan biasa)\n• 〜てくださいませんか (lebih halus)\n• 〜ていただけませんか (paling halus di N4)\n▶ Contoh lain\n• 「この 書類を 見て いただけませんか。」 = Bisakah Anda melihat dokumen ini?\n▶ Hati-hati\n• Diawali 「すみませんが」 supaya lebih sopan.","m":"ていただけませんか = \"bisakah saya menerima bantuan Anda?\" Paling sopan untuk minta tolong."},{"c":"Permintaan","p":"～たらいいですか","a":"sebaiknya bagaimana","f":"Kata tanya + V-たら いいですか","ex":"どこで切符を買ったらいいですか。","rd":"どこで きっぷを かったら いいですか。","id":"Sebaiknya beli tiket di mana?","n":"Bab 26.","x":"Dipakai untuk meminta saran: \"sebaiknya saya ... bagaimana / apa / di mana?\"\n▶ Cara pakai\n• Kata tanya + bentuk たら + いいですか.\n• 「どう したら いいですか」 = Sebaiknya bagaimana?\n• 「どこで 買ったら いいですか」 = Sebaiknya beli di mana?\n▶ Contoh lain\n• 「だれに 聞いたら いいですか。」 = Sebaiknya saya bertanya kepada siapa?\n• 「日本語が 上手に なりたいんですが、どう したら いいですか。」\n▶ Cara menjawab\n• Biasanya pakai 〜たら いいですよ atau 〜た ほうが いいですよ.\n▶ Hati-hati\n• Wajib ada kata tanya (どう, どこ, だれ, なに).","m":"Kata tanya + たら いいですか = \"kalau saya ..., oke nggak?\" → minta saran."},{"c":"Waktu & urutan","p":"～ながら","a":"sambil","f":"V-ます + ながら","ex":"歌を歌いながら、料理を作ります。","rd":"うたを うたいながら、りょうりを つくります。","id":"Memasak sambil bernyanyi.","n":"Kegiatan utama di belakang. Bab 28.","x":"「〜ながら」 berarti \"sambil\": dua kegiatan dilakukan bersamaan oleh orang yang sama.\n▶ Cara pakai\n• Bentuk ます tanpa ます + ながら: 聞きます → 聞きながら.\n• Kegiatan utama di belakang: 「音楽を 聞きながら 勉強します」 = Belajar sambil mendengarkan musik.\n▶ Arti lain: jangka panjang\n• 「働きながら 学校に 通って います」 = Sekolah sambil bekerja.\n▶ Contoh lain\n• 「歩きながら スマホを 見ないで ください。」 = Tolong jangan melihat HP sambil berjalan.\n▶ Hati-hati\n• Pelakunya harus sama. Untuk dua orang yang berbeda, pakai 〜ている あいだに.","m":"ながら = \"sambil\". Yang utama di belakang (makan sambil nonton TV → nonton sampingan)."}],"k":[{"k":"不","on":"フ","kun":"-","m":"tidak","w":"不便","wr":"ふべん","wm":"tidak praktis"},{"k":"世","on":"セ","kun":"よ","m":"dunia","w":"世話","wr":"せわ","wm":"mengurus"},{"k":"主","on":"シュ","kun":"ぬし","m":"utama","w":"主人","wr":"しゅじん","wm":"suami"},{"k":"事","on":"ジ","kun":"こと","m":"hal","w":"食事","wr":"しょくじ","wm":"makan"},{"k":"京","on":"キョウ","kun":"-","m":"ibu kota","w":"東京","wr":"とうきょう","wm":"Tokyo"},{"k":"仕","on":"シ", b-akibat (おかげで・せいで), sudut pandang (にとって・によって), dan membaca teks yang lebih panjang. Skor membaca kini dinilai terpisah.","tips":[["Membaca adalah kunci","Mulai N3, membaca dinilai terpisah (minimal 19/60). Baca satu artikel pendek per hari, misalnya NHK News Web Easy."],["Kelompokkan pola yang mirip","はず / わけ / に違いない, おかげで / せいで, ことにする / ことになる. Buat tabel perbedaannya sendiri."],["Kosakata lewat kata majemuk","Soal N3 memakai kata seperti 確認, 報告, 担当. Pelajari kanji lewat kata, bukan kanji tunggal."],["Kata keterangan","Soal konteks sering memakai うっかり, すっかり, そろそろ, わざわざ. Hafalkan dengan contoh kalimat."],["Choukai: tangkap intinya","Ada soal inti cerita (概要理解). Latih merangkum audio 1 menit dalam satu kalimat bahasa Indonesia."],["Satu buku seri","Nihongo Sou Matome N3 (ada di Drive Anda): 6 minggu per buku, 1–2 halaman per hari."]],"weeks":[["Waktu & proses","うちに, 最中に, とたん, 次第, たびに, 一方だ, につれて"],["Sebab & dugaan","おかげで, せいで, はず, に違いない, わけだ, ような気がする"],["Syarat & penekanan","たとえ～ても, さえ～ば, ばかり, こそ, ほど～ない"],["Sudut pandang","について, に対して, にとって, によって, として, をもとに"],["Tindakan & keadaan","ことにする/なる, ふり, まま, っぱなし, かけ, きる"],["Kontras & kutipan","くせに, わりに, ながらも, というより, っけ, んだって"],["Membaca intensif","2 bacaan per hari, catat kosakata baru"],["Tryout","2 kali tryout penuh, analisis per bagian"]],"g":[{"c":"Waktu & proses","p":"～うちに","a":"selagi / sebelum keadaan berubah","f":"V-る・V-ている・V-ない / Adj / N の + うちに","ex":"若いうちに、いろいろな国へ行きたい。","rd":"わかい うちに、いろいろな くにへ いきたい。","id":"Selagi muda, saya ingin pergi ke banyak negara.","n":"Sering: 忘れないうちに, 暗くならないうちに.","x":"「うちに」 berarti melakukan sesuatu selagi keadaan masih ada, karena nanti akan sulit.\n▶ Cara pakai\n• Bentuk kamus / ている / ない / kata sifat / N の + うちに.\n• 「若い うちに、いろいろな 経験を したい」 = Selagi muda, ingin punya banyak pengalaman.\n▶ Dengan bentuk ない\n• Artinya \"sebelum ... terjadi\": 「暗く ならない うちに 帰ろう」 = Ayo pulang sebelum gelap.\n▶ Arti lain\n• Tanpa sadar, selama ...: 「話して いる うちに、仲良く なった」.\n▶ Hati-hati\n• Bedanya dengan まえに: うちに menekankan \"mumpung masih bisa\".","m":"うち = \"di dalam\" waktu: selagi masih di dalam keadaan itu, cepat lakukan."},{"c":"Waktu & proses","p":"～最中に","a":"tepat di tengah-tengah","f":"V-ている / N の + さいちゅうに","ex":"会議の最中に、電話が鳴った。","rd":"かいぎの さいちゅうに、でんわが なった。","id":"Di tengah rapat, telepon berbunyi.","n":"Biasanya ada gangguan yang terjadi.","x":"「最中に」 berarti tepat di tengah-tengah kegiatan, lalu terjadi sesuatu yang mengganggu.\n▶ Cara pakai\n• Bentuk ている / N の + 最中に.\n• 「会議の 最中に 電話が 鳴った」 = Di tengah rapat, telepon berbunyi.\n▶ Contoh lain\n• 「食事を して いる 最中に、地震が あった。」\n▶ Bedanya\n• 〜ている あいだに: netral, selama.\n• 〜最中に: tepat di puncak kegiatan, dengan kesan \"pas lagi sibuk-sibuknya\".\n▶ Hati-hati\n• Kalimat belakang biasanya kejadian tak terduga.","m":"最中 = 最 (paling) + 中 (tengah): tepat di tengah-tengah, lalu ada gangguan."},{"c":"Waktu & proses","p":"～たとたん(に)","a":"begitu … langsung (tak terduga)","f":"V-た + とたん","ex":"窓を開けたとたん、強い風が入ってきた。","rd":"まどを あけた とたん、つよい かぜが はいって きた。","id":"Begitu jendela dibuka, angin kencang masuk.","n":"Kalimat belakang bukan kehendak pembicara.","x":"「たとたん」 berarti \"begitu A, langsung B (tak terduga)\".\n▶ Cara pakai\n• Bentuk た + とたん(に).\n• 「立ち上がった とたん、めまいが した」 = Begitu berdiri, langsung pusing.\n▶ Contoh lain\n• 「家を 出た とたん、雨が 降り出した。」 = Begitu keluar rumah, hujan turun.\n▶ Hati-hati\n• B adalah kejadian di luar kendali, mengejutkan.\n• Tidak boleh B berupa kehendak: ✗ 家に 着いた とたん、電話しよう. Pakai 〜たら すぐ.","m":"とたん = \"tan!\" bunyi kaget. Begitu A, \"tan!\" langsung B tak terduga."},{"c":"Waktu & proses","p":"～次第","a":"segera setelah","f":"V-ます + しだい","ex":"家に着き次第、連絡します。","rd":"いえに つき しだい、れんらくします。","id":"Begitu sampai rumah, saya kabari.","n":"Juga: N 次第 = tergantung N (努力次第).","x":"「次第」 setelah ます-stem berarti \"segera setelah ... selesai\". Gaya formal, sering di bisnis.\n▶ Cara pakai\n• ます-stem + 次第: 「わかり次第、ご連絡します」 = Segera setelah tahu, akan saya kabari.\n▶ Contoh lain\n• 「準備が でき次第、出発します。」 = Begitu siap, kita berangkat.\n▶ Ciri\n• Kalimat belakang berupa rencana, janji, atau permintaan.\n▶ Hati-hati\n• Tidak dipakai untuk kejadian lampau: ✗ 着き次第、電話しました.\n• Setelah kata benda, 次第 berarti \"tergantung\" (pola N2).","m":"次第 = \"urutan berikutnya\": selesai A, langsung urutan B (gaya bisnis)."},{"c":"Waktu & proses","p":"～たびに","a":"setiap kali","f":"V-る / N の + たびに","ex":"この歌を聞くたびに、国を思い出す。","rd":"この うたを きく たびに、くにを おもいだす。","id":"Setiap mendengar lagu ini, saya teringat kampung halaman.","n":"","x":"「たびに」 berarti \"setiap kali A, (pasti) B\".\n▶ Cara pakai\n• Bentuk kamus / N の + たびに.\n• 「この 歌を 聞く たびに、ふるさとを 思い出す」 = Setiap mendengar lagu ini, teringat kampung halaman.\n▶ Contoh lain\n• 「旅行の たびに、お土産を 買って くる。」\n▶ Bedanya\n• 〜と / 〜たら: hubungan sebab-akibat umum.\n• 〜たびに: menekankan pengulangan, setiap kali.\n▶ Hati-hati\n• Kalimat belakang biasanya kejadian yang selalu sama.","m":"たび = \"tabi\" perjalanan: setiap kali pergi ke sana, pasti B."},{"c":"Waktu & proses","p":"～てからでないと","a":"kalau belum … tidak bisa","f":"V-て + からでないと + negatif","ex":"店長に聞いてからでないと、決められません。","rd":"てんちょうに きいて からでないと、きめられません。","id":"Kalau belum tanya manajer, saya tidak bisa memutuskan.","n":"","x":"「てからでないと」 berarti \"kalau belum A, (B) tidak bisa\".\n▶ Cara pakai\n• Bentuk て + からでないと + kalimat negatif/sulit.\n• 「手を 洗ってから でないと、利用者の 食事介助は できません」.\n▶ Contoh lain\n• 「実物を 見てから でないと、決められない。」 = Belum bisa memutuskan sebelum melihat barangnya.\n▶ Variasi\n• 〜てからでなければ (lebih formal).\n▶ Hati-hati\n• Kalimat belakang selalu negatif atau bernuansa \"tidak bisa\".","m":"てからでないと = \"kalau bukan setelah A\" → B belum bisa."}],"k":[{"k":"与","on":"ヨ","kun":"あた(える)","m":"memberi","w":"給与","wr":"きゅうよ","wm":"gaji"},{"k":"両","on":"リョウ","kun":"-","m":"kedua","w":"両親","wr":"りょうしん","wm":"orang tua"},{"k":"乗","on":"ジョウ","kun":"の(る)","m":"naik","w":"乗り物","wr":"のりもの","wm":"kendaraan"},{"k":"予","on":"ヨ","kun":"-","m":"sebelumnya","w":"予定","wr":"よてい","wm":"rencana"},{"k":"争","on":"ソウ","kun":"あらそ(う)","m":"bersaing","w":"戦争","wr":"せんそう","wm":"perang"},{"k":"互","on": ering muncul sebagai 〜ずに (tanpa): sama artinya dengan 〜ないで.","rm":["ない → ず","ない → ずに (tanpa)","する → せず (bukan しず!)","来る → 来ず (こず)"],"tb":[{"c":"Dari ない ke ず","h":["Kata kerja","Bentuk ない","Bentuk ず","Contoh"],"r":[["書く","書かない","書かず","名前を書かずに出した (menyerahkan tanpa menulis nama)"],["食べる","食べない","食べず","朝ご飯を食べずに来た (datang tanpa sarapan)"],["する","しない","せず ⚠","連絡せずに休んだ (libur tanpa kabar)"],["来る","来ない","来ず","彼は来ずに終わった (dia tidak datang sampai selesai)"]]}],"n":"Kamu juga akan bertemu ぬ, bentuk kuno yang artinya sama: 知らぬ間に = tanpa sadar, 見知らぬ人 = orang tak dikenal."}],"kaiwa":[["Melapor kejadian nyaris celaka","ヒヤリハット: melapor ke senior dengan jelas.",[["A","<u>佐藤さん</u>、ちょっと報告したいことがあるんですが。","さとうさん、ちょっとほうこくしたいことがあるんですが。","Sato-san, ada yang ingin saya laporkan."],["B","はい、どうしたの？","はい、どうしたの？","Ya, ada apa?"],["A","さっき、<u>鈴木さん</u>が車いすから立ち上がろうとして、転びそうになったんです。","さっき、すずきさんがくるまいすからたちあがろうとして、ころびそうになったんです。","Tadi, Bu Suzuki mencoba berdiri dari kursi roda dan hampir jatuh."],["B","えっ、けがは？","えっ、けがは？","Hah, ada luka?"],["A","すぐに支えたので、けがはありませんでした。","すぐにささえたので、けがはありませんでした。","Langsung saya tahan, jadi tidak ada luka."],["B","よかった。じゃ、ヒヤリハットの報告書に書いておいてね。","よかった。じゃ、ヒヤリハットのほうこくしょにかいておいてね。","Syukurlah. Tolong tulis di laporan nyaris celaka ya."],["A","わかりました。ブレーキがかかっていなかったことも書いておきます。","わかりました。ブレーキがかかっていなかったこともかいておきます。","Baik. Saya juga tulis bahwa remnya tidak terkunci."]]]],"mx":[{"id":"n3-1-pv","t":"Simulasi JLPT N3 · Paket 1 (contoh)","k":"jlpt","sec":[{"n":"言語知識（文字・語彙）","id":"Kosakata","m":3,"c":"g","p":[{"h":"問題1","i":"＿＿＿の言葉の読み方として最もよいものを選びなさい。","ii":"Cara baca kata bergaris bawah","q":[{"q":"この地域は、冬になると[[積雪]]が多い。","o":["せきせつ","しゃくせつ","せきゆき","つみゆき"],"e":"積雪 = せきせつ (salju yang menumpuk).","oe":["Benar. 積 (セキ) + 雪 (セツ) = せきせつ.","しゃく bukan bacaan 積 (しゃく = 借/尺).","Campuran on-kun yang tidak dipakai; 雪 di sini on-yomi せつ.","Kun-yomi 積む+雪 tidak dipakai untuk kata ini."]},{"q":"駅前に新しいビルが[[完成]]した。","o":["かんせい","かんぜい","かいせい","がんせい"],"e":"完成 = かんせい (selesai dibangun).","oe":["Benar. 完 (カン) + 成 (セイ).","成 tidak bersuara keruh di sini; かんぜい = 関税 (bea cukai).","かいせい = 改正/快晴, beda kanji.","完 dibaca かん, bukan がん."]}],"nf":1}]},{"n":"言語知識（文法）・読解","id":"Tata bahasa & membaca","m":3,"c":"g","p":[{"h":"問題1","i":"次の文の（　）に入れるのに最もよいものを選びなさい。","ii":"Bentuk tata bahasa yang tepat","q":[{"q":"雨が降っている（　）、試合は予定どおり行われた。","o":["にもかかわらず","によって","に対して","について"],"e":"にもかかわらず = walaupun/meskipun.","oe":["Benar. Hujan tetapi pertandingan tetap jalan → にもかかわらず (walaupun).","によって = karena/oleh; makna sebab, tidak cocok dengan \"tetap\".","に対して = terhadap; tidak menghubungkan sebab-akibat.","について = tentang; topik, bukan pertentangan."]},{"q":"この仕事は、経験がない人（　）できる簡単なものだ。","o":["でも","しか","こそ","ほど"],"e":"Nでも = bahkan N pun.","oe":["Benar. 経験がない人でもできる = bahkan orang tanpa pengalaman pun bisa.","しか harus diikuti bentuk negatif (しかできない).","こそ = justru (menekankan), tidak cocok.","ほど = sampai taraf; tidak gramatikal di sini."]}]}]},{"n":"聴解","id":"Mendengarkan","m":3,"c":"l","p":[{"h":"問題1","i":"まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","ii":"Pahami tugas: apa yang harus dilakukan","q":[{"i":"会社で女の人と男の人が話しています。男の人はこのあとまず何をしますか。","d":[["女","田中さん、来週の出張の準備、進んでる？"],["男","はい、ホテルはもう予約しました。新幹線のチケットはこれから買います。"],["女","あ、チケットは総務の人がまとめて買ってくれるから、申請書を出すだけでいいよ。"],["男","そうなんですか。じゃあ、すぐ申請書を書きます。"],["女","うん。それと、お客さんに渡す資料、明日までに見せてね。"]],"q":"男の人はこのあとまず何をしますか。","o":["申請書を書く","新幹線のチケットを買う","ホテルを予約する","資料を見せる"],"e":"Pertama: menulis formulir permohonan.","oe":["Benar. \"じゃあ、すぐ申請書を書きます\" = yang dilakukan segera.","Tiket dibelikan bagian umum (総務); ia tidak perlu membeli.","Hotel sudah dipesan.","Bahan ditunjukkan besok, bukan sekarang."]},{"i":"大学で男の学生と女の学生が話しています。女の学生は何を持っていきますか。","d":[["男","明日のゼミの発表、パソコン持っていく？"],["女","うん、そのつもり。"],["男","教室のパソコンが使えるらしいよ。USBにデータを入れておけば大丈夫だって。"],["女","そう。じゃあ、パソコンはやめて、USBにする。資料も印刷したほうがいいかな。"],["男","先生が、資料は配らなくていいって言ってたよ。"]],"q":"女の学生は何を持っていきますか。","o":["USBだけ","パソコンとUSB","USBと印刷した資料","パソコンと印刷した資料"],"e":"Hanya USB.","oe":["Benar. Laptop batal, bahan cetak tidak perlu → hanya USB.","Laptop dibatalkan (パソコンはやめて).","Bahan cetak tidak perlu dibagikan.","Keduanya tidak dibawa."]}],"l":1,"t":"課題理解","c":"l"}]}],"pv":1,"min":10},{"id":"n3-1","t":"Simulasi JLPT N3 · Paket 1","k":"jlpt","lock":1,"n":102,"mins":140},{"id":"n3-2","t":"Simulasi JLPT N3 · Paket 2","k":"jlpt","lock":1,"n":102,"mins":140}],"preview":true,"cnt":{"g":75,"k":370,"v":54,"q":128}},"N2":{"lv":"N2","jp":"えぬに","cefr":"≈ B2","stats":[["±1.000","kanji"],["±6.000","kosakata"],["±200","pola bunpou"],["+10–12 bulan","setelah N3"]],"fokus":"Bahasa tulis dan formal: berita, email kantor, esai opini. Pola sebab-akibat yang halus (ものだから・からこそ・あまり), penilaian (べきだ・ざるを得ない・かねない), dan keigo bisnis. Syarat banyak lowongan kerja kantoran di Jepang.","tips":[["Kecepatan membaca","Bagian bahasa dan membaca hanya 105 menit untuk semua soal. Latih membaca 1 artikel berita per hari dengan timer."],["Kosakata lewat berita","Kata seperti 対策, 傾向, 削減 muncul terus di berita. Baca NHK News lalu catat 5 kata baru per hari."],["Bedakan nuansa","ものの vs のに vs にもかかわらず; かねない vs おそれがある. Soal N2 menguji nuansa, bukan sekadar arti."],["Kata kerja majemuk","取り消す, 見直す, 引き受ける. Hafalkan sebagai satu kata dengan contoh."],["Keigo bisnis","Email dan percakapan kantor muncul di membaca dan mendengarkan. Hafalkan ungkapan baku."],["Shin Kanzen Master / Sou Matome N2","Pilih satu seri dan selesaikan. Di Drive Anda ada Bunpou N2, Kosakata N2, dan Kanji N2."]],"weeks":[["Waktu & proses","うえで, 際に, かと思うと, て以来, をきっかけに"],["Sebab","ものだから, からこそ, あまり, ばかりに, 以上"],["Penilaian","べきだ, ざるを得ない, ずにはいられない, ものだ, ことだ"],["Kemungkinan","おそれがある, かねない, かねる, 得る, にすぎない"],["Kontras","ものの, にもかかわらず, 反面, 一方で, どころか"],["Syarat & lingkup","ない限り, 次第で, を問わず, に基づいて, に応じて"],["Perasaan & penekanan","てならない, てたまらない, ことか, ものか, だけあって"],["Keigo bisnis","させていただく, お～願います, につき, email baku"],["Membaca berita","2 artikel per hari, ringkas dalam 3 kalimat"],["Tryout","2 kali tryout penuh dengan timer ketat"]],"g":[{"c":"Waktu & proses","p":"～うえで","a":"setelah (sebagai dasar)","f":"V-た / N の + うえで","ex":"両親と相談したうえで、決めます。","rd":"りょうしんと そうだん した うえで、きめます。","id":"Saya akan memutuskan setelah berdiskusi dengan orang tua.","n":"V-る うえで = dalam hal ….","x":"「うえで」 punya dua arti: \"setelah (lalu)\" dan \"dalam hal\".\n▶ Arti 1: setelah A, baru B\n• V-た / N の + うえで: 「よく 考えた うえで、決めます」 = Saya putuskan setelah berpikir matang.\n▶ Arti 2: dalam hal / untuk\n• V-る + うえで: 「日本で 働く うえで、敬語は 大切だ」.\n▶ Hati-hati\n• Arti 1 menekankan langkah A harus dilakukan dulu.","m":"上 = \"di atas\" dasar A, baru bangun keputusan B."},{"c":"Waktu & proses","p":"～際(に)","a":"pada saat (formal)","f":"V-る / V-た / N の + さいに","ex":"お降りの際は、お忘れ物のないようご注意ください。","rd":"おおりの さいは、おわすれものの ない よう ごちゅうい ください。","id":"Saat turun, mohon pastikan tidak ada barang tertinggal.","n":"Sering di pengumuman.","x":"「際(に)」 berarti \"saat / ketika\", versi formal dari とき.\n▶ Cara pakai\n• V-る / V-た / N の + 際(に).\n• 「お帰りの 際は、忘れ物に ご注意ください」.\n▶ Contoh lain\n• 「入浴介助の 際に、体の 様子を 観察する。」\n▶ Hati-hati\n• Banyak di pengumuman, manual, dan surat.","m":"際 = \"tepi, momen\" (際どい = mepet). Versi formal 時."},{"c":"Waktu & proses","p":"～かと思うと","a":"baru saja … langsung","f":"V-た + かと おもうと","ex":"空が暗くなったかと思うと、急に雨が降り出した。","rd":"そらが くらく なったかと おもうと、きゅうに あめが ふりだした。","id":"Baru saja langit gelap, tiba-tiba hujan turun.","n":"Untuk orang lain/kejadian, bukan diri sendiri.","x":"「かと思うと」 berarti \"baru saja A, langsung B\" (perubahan cepat yang mengejutkan).\n▶ Cara pakai\n• V-た + かと 思うと / かと 思ったら.\n• 「晴れたかと 思うと、また 雨が 降り出した」.\n▶ Hati-hati\n• Tidak dipakai untuk diri sendiri: ✗ わたしは 帰ったかと思うと.\n• Mirip たとたん, tapi untuk mengamati orang/benda lain.","m":"かと思うと = \"baru saja kupikir A, eh sudah B\"."},{"c":"Waktu & proses","p":"～て以来","a":"sejak","f":"V-て + いらい","ex":"日本に来て以来、一度も国に帰っていない。","rd":"にほんに きて いらい、いちども くにに かえって いない。","id":"Sejak datang ke Jepang, saya belum sekali pun pulang.","n":"","x":"「て以来」 berarti \"sejak A (sampai sekarang terus)\".\n▶ Cara pakai\n• V-て + 以来: 「日本に 来て 以来、ずっと 介護の 仕事を して いる」.\n• N + 以来: 「卒業 以来」.\n▶ Hati-hati\n• Kalimat belakang menunjukkan keadaan yang berlanjut, bukan kejadian sekali.","m":"以来 = 以 (sejak) + 来 (datang): sejak itu sampai sekarang."},{"c":"Waktu & proses","p":"～に先立って","a":"sebelum (resmi)","f":"N / V-る + に さきだって","ex":"開会に先立って、社長があいさつした。","rd":"かいかいに さきだって、しゃちょうが あいさつした。","id":"Sebelum pembukaan, direktur memberi sambutan.","n":"","x":"「に先立って」 berarti \"sebelum (sebagai persiapan)\" untuk acara penting.\n▶ Cara pakai\n• N / V-る + に先立って.\n• 「開会に 先立って、社長が あいさつした」.\n▶ Bentuk lain\n• に先立ち (lebih formal), に先立つ + N.\n▶ Hati-hati\n• Untuk acara resmi, bukan kegiatan sehari-hari.","m":"先立つ = \"berdiri lebih dulu\" (先 = depan) sebelum acara resmi."},{"c":"Waktu & proses","p":"～をきっかけに","a":"berawal dari","f":"N + を きっかけに","ex":"留学をきっかけに、料理を始めた。","rd":"りゅうがくを きっかけに、りょうりを はじめた。","id":"Berawal dari kuliah di luar negeri, saya mulai memasak.","n":"","x":"「をきっかけに」 berarti \"berawal dari / dipicu oleh\".\n▶ Cara pakai\n• N + を きっかけに (して).\n• 「祖母の 入院を きっかけに、介護に 興味を 持った」.\n▶ Variasi\n• をきっかけとして, がきっかけで.\n▶ Hati-hati\n• A adalah peristiwa yang memicu perubahan B.","m":"きっかけ = \"pemicu\": kejadian kecil yang menyalakan perubahan."}],"k":[{"k":"並","on":"ヘイ","kun":"なら(ぶ)、なみ","m":"berjajar, biasa","w":"並ぶ","wr":"ならぶ","wm":"berbaris"},{"k":"丸","on":"ガン","kun":"まる(い)","m":"bulat","w":"丸い","wr":"まるい","wm":"bundar"},{"k":"久","on":"キュウ、ク","kun":"ひさ(しい)","m":"lama","w":"久しぶり","wr":"ひさしぶり","wm":"lama tak jumpa"},{"k":"乱","on":"ラン","kun":"みだ(れる)","m":"kacau","w":"混乱","wr":"こんらん","wm":"kekacauan"},{"k":"乳","on":"ニュウ","kun":"ちち","m":"susu","w":"牛乳","wr":"ぎゅうにゅう","wm":"susu sapi"},{"k":"乾","on":"カン","kun":"かわ(く)","m":"kering","w":"乾く","wr":"かわく","wm":"mengering"},{"k":"了","on":"リョウ","kun":"-","m":"selesai","w":"終了","wr":"しゅうりょう","wm":"berakhir"},{"k":"介","on":"カイ","kun":"-","m":"perantara","w":"紹介","wr":"しょうかい","wm":"perkenalan"},{"k":"仏","on":"ブツ","kun":"ほとけ","m":"Buddha; Prancis","w":"仏教","wr":"ぶっきょう","wm":"agama Buddha"},{"k":"令","on":"レイ","kun":"-","m":"perintah","w":"命 an dan menanyakan keperluan.","Mengulang kata 'sibuk'; tidak sopan dan tidak menjawab.","恐縮 tidak dijawab dengan menyangkal.","Meminta waktu balik; tidak cocok."]}],"Kosakata":[{"s":"Bacaan kanji","q":"新しい 取引先と 契約を 結んだ。","c":"Cara baca 契約?","o":["けいやく","けやく","けいあく","きやく"],"e":"契約 = kontrak.","oe":["Benar. 契約 = けいやく (kontrak).","Kurang い.","約 dibaca やく, bukan あく.","契 dibaca けい, bukan き."]},{"s":"Bacaan kanji","q":"その 件は 社内で 検討します。","c":"Cara baca 検討?","o":["けんとう","けんど","けいとう","けんたう"],"e":"検討 = mempertimbangkan.","oe":["Benar. 検討 = けんとう (pertimbangan).","Kurang う, dan とう bukan ど.","検 dibaca けん, bukan けい.","Bacaan tidak ada."]},{"s":"Bacaan kanji","q":"まず 現状を 把握する ことが 大切だ。","c":"Cara baca 把握?","o":["はあく","はおく","ばあく","ひあく"],"e":"把握 = memahami situasi.","oe":["Benar. 把握 = はあく (memahami/menguasai).","握 dibaca あく, bukan おく.","把 tanpa tenten.","Bacaan tidak ada."]}],"Tata bahasa":[{"s":"","q":"両親と 相談した（　）、決めます。","c":"","o":["うえで","あまり","ものの","ばかりに"],"e":"Setelah (sebagai dasar): V-た うえで.","oe":["Benar. 〜たうえで = setelah (lalu).","あまり = saking; tidak cocok.","ものの = walaupun.","ばかりに = hanya karena (buruk)."]},{"s":"","q":"約束した（　）、守らなければ ならない。","c":"","o":["以上","反面","ものの","どころか"],"e":"Karena sudah: 以上.","oe":["Benar. 以上 = karena sudah ..., harus.","反面 = di sisi lain.","ものの = walaupun; kalimat belakang bukan kewajiban.","どころか = jangankan."]},{"s":"","q":"緊張の（　）、何も 話せなかった。","c":"","o":["あまり","うえで","ばかり","かぎり"],"e":"Karena terlalu: N の あまり.","oe":["Benar. 緊張のあまり = saking gugup.","うえで tidak dipakai dengan perasaan.","ばかり tidak cocok dengan の di sini.","かぎり = selama; tidak cocok."]}],"Membaca":[{"s":"Email bisnis","q":"件名：打ち合わせ日程の変更について\n株式会社ABC 田中様\nいつもお世話になっております。NLシステムの佐藤です。\n来週15日（火）に予定しておりました打ち合わせですが、弊社の都合により、17日（木）の同じ時間に変更させていただけないでしょうか。\nご都合が悪い場合は、ご希望の日時をお知らせください。\nお手数をおかけしますが、よろしくお願いいたします。","c":"Apa tujuan email ini?","o":["Meminta jadwal rapat dipindah ke tanggal 17","Membatalkan rapat","Mengundang rapat baru","Meminta maaf karena terlambat"],"e":"変更させていただけないでしょうか = meminta t-black leading-[2]\"><ruby>${w[0]}<rt>${w[1]}<\/rt><\/ruby><\/p><p class=\"tr text-sm opacity-85 leading-snug\">${w[2]}<\/p><\/div>`).join('')};drawVoc(false);\n const vm=$('#vocMore');if(vm)vm.onclick=()=>{drawVoc(true);vm.remove()};\n v.querySelectorAll('[data-sim]').forEach(h=>{const k=h.dataset.sim;SIM[k](h,ui=>{markDone(ui,true);mark(s,'sim',k,10,'Simulasi selesai · +10 XP')},!!P(s).sim[k])});\n v.querySelectorAll('details[data-ch]').forEach(dt=>dt.addEventListener('toggle',()=>{if(!dt.open)return;const id=dt.dataset.ch,b=dt.querySelector('[data-body]');if(!b.innerHTML){b.innerHTML=chHtml(id);b.querySelector('[data-drillgo]').onclick=()=>drill(b.querySelector('[data-drill]'),id)}if(mark(s,'ch',id,5,'Bab dibaca · +5 XP')){const c=dt.querySelector('[data-chk]');c.textContent='✓';c.className='shrink-0 grid place-items-center w-8 h-8 rounded-full border-2 bg-sage border-sage text-white'}}));\n v.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth'}));\n renderMiniQuiz(s);applyToggles();animRings(v)}\n\n/* ---------- QUIZ data (soal asli + pembahasan Kaigo Link) ---------- */\nconst Q=[\n {src:'第36回 問題24',subj:'こころとからだのしくみ',\n  stem:'{{食物|しょくもつ}}が{{入|はい}}り{{誤嚥|ごえん}}が{{生|しょう}}じる{{部位|ぶい}}として、{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。',\n  tr:'Bagian tubuh tempat makanan masuk sehingga terjadi aspirasi (誤嚥, salah telan), yang tepat adalah? Pilih 1.',\n  o:[['{{扁桃|へんとう}}','Amandel (tonsil)'],['{{食道|しょくどう}}','Kerongkongan (esofagus)'],['{{耳管|じかん}}','Saluran Eustachius'],['{{気管|きかん}}','Trakea (batang tenggorok)'],['{{咽頭|いんとう}}','Faring (tekak)']],a:3,\n  point:'誤嚥 = makanan, minuman, atau air liur yang seharusnya masuk ke kerongkongan justru masuk ke trakea (jalan napas). Kuncinya: \"masuk ke tempat yang salah\" selalu berarti trakea.',\n  ex:[['Medis','Amandel adalah jaringan limfa di dinding samping tenggorokan yang berfungsi sebagai pertahanan tubuh. Makanan lewat di sampingnya, tetapi tidak \"masuk\" ke amandel, jadi ini bukan lokasi aspirasi.'],\n      ['Medis','Kerongkongan adalah jalur NORMAL makanan dari faring ke lambung. Kalau makanan masuk ke sini, menelannya berhasil. Isi lambung yang naik lagi (refluks) memang bisa memicu aspirasi, tetapi lokasi aspirasinya tetap trakea.'],\n      ['Medis','Saluran Eustachius menghubungkan telinga tengah dengan bagian atas faring untuk menyamakan tekanan telinga. Tidak dilewati makanan.'],\n      ['Medis','Benar. Saat menelan, epiglotis seharusnya menutup pintu trakea. Jika terlambat menutup (refleks melemah pada lansia), makanan masuk ke trakea, inilah 誤嚥, yang bisa berlanjut menjadi 誤嚥性肺炎 (pneumonia aspirasi). Pada lansia sering tanpa batuk (silent aspiration), jadi perhatikan suara serak atau demam setelah makan.'],\n      ['Medis','Faring adalah persimpangan jalan udara dan jalan makanan, dan makanan memang melewatinya pada fase faring. Sisa makanan yang tertinggal di faring bisa menjadi penyebab aspirasi berikutnya, tetapi tempat makanan \"salah masuk\" adalah trakea, bukan faring.']],\n  care:'Di tempat kerja: posisi duduk tegak, dagu sedikit ditarik (顎を引く), suapan kecil, beri kekentalan (とろみ) pada minuman, pastikan sudah ditelan sebelum suapan berikutnya.'},\n {src:'第38回 問題85',subj:'{{認知症|にんちしょう}}の{{理解|りかい}}',\n  stem:'{{次|つぎ}}のうち、レビー{{小体型認知症|しょうたいがたにんちしょう}}（dementia with Lewy bodies）の{{症状|しょうじょう}}として、{{最|もっと}}も{{適切|てきせつ}}なものを1つ{{選|えら}}びなさい。',\n  tr:'Manakah gejala demensia tipe badan Lewy (DLB) yang PALING tepat? Pilih 1.',\n  o:[['ノンレム{{睡眠行動障害|すいみんこうどうしょうがい}}による{{大声|おおごえ}}','Berteriak karena gangguan perilaku tidur non-REM'],['{{自律神経症状|じりつしんけいしょうじょう}}による{{起立性低血圧|きりつせいていけつあつ}}（orthostatic hypotension）','Hipotensi ortostatik karena gejala saraf otonom'],['{{聴覚認知機能|ちょうかくにんちきのう}}の{{障害|しょうがい}}による{{幻聴|げんちょう}}','Halusinasi suara karena gangguan kognisi pendengaran'],['{{側頭葉|そくとうよう}}の{{萎縮|いしゅく}}による{{意味性失語|いみせいしつご}}','Afasia semantik karena atrofi lobus temporal'],['{{嚥下機能|えんげきのう}}の{{促進|そくしん}}による{{食欲増加|しょくよくぞうか}}','Nafsu makan naik karena fungsi menelan meningkat']],a:1,\n  point:'Ciri khas DLB: halusinasi VISUAL (幻視), kemampuan kognitif naik-turun, parkinsonisme, gangguan perilaku tidur REM, gejala saraf otonom (hipotensi ortostatik, sembelit), dan sangat sensitif terhadap obat.',\n  ex:[['Medis','Jebakan kata. Yang khas pada DLB adalah gangguan perilaku tidur REM (レム睡眠行動障害): saat tidur REM otot seharusnya \"lumpuh\", tetapi orang dengan DLB bergerak atau berteriak mengikuti mimpinya. Gejala ini bisa muncul bertahun-tahun sebelum demensia. Bukan non-REM.'],\n      ['Medis','Benar. DLB merusak saraf otonom sehingga tekanan darah turun saat berdiri (pusing, pingsan, jatuh), juga sembelit dan gangguan buang air kecil. Perawatan: bangun bertahap, duduk dulu di tepi tempat tidur (端座位), awasi saat berdiri untuk mencegah jatuh.'],\n      ['Medis · Etika','Halusinasi pada DLB terutama visual dan sangat nyata (\"ada anak kecil di kamar\"). Halusinasi suara (幻聴) lebih khas pada skizofrenia. Etika perawatan: jangan membantah dengan keras; terima rasa takutnya, periksa pencahayaan dan benda yang bisa terlihat seperti orang.'],\n      ['Medis','Atrofi lobus temporal dengan afasia semantik (lupa arti kata, \"apa itu jam?\") adalah ciri demensia frontotemporal tipe semantik (前頭側頭型認知症). DLB lebih berkaitan dengan gangguan lobus oksipital, pusat penglihatan.'],\n      ['Medis','Kebalikannya. Parkinsonisme pada DLB membuat fungsi menelan MENURUN (嚥下障害), sehingga risiko pneumonia aspirasi naik. Tidak ada tipe demensia yang khas ditandai \"fungsi menelan meningkat\".']],\n  care:'Di tempat kerja: laporkan bila ada reaksi berlebihan setelah obat baru (薬剤過敏性), cegah jatuh saat berdiri, dan jaga lingkungan tetap terang untuk mengurangi halusinasi visual.'}\n];\nlet qi=0,qScore=0,answered=false;\nconst tagCol={'Medis':'bg-sky2-50 text-sky2 dark:bg-[#14273D]','Hukum':'bg-sun-50 text-sun-600 dark:bg-[#2E2810]','Etika':'bg-sage-50 text-sage dark:bg-night'};\nfunction drawQ(){\n  answered=false;\n  $('#qBar').style.width=(qi/Q.length*100)+'%';$('#qCount').textContent=Math.min(qi+1,Q.length)+'/'+Q.length;\n  if(qi>=Q.length){$('#qBar').style.width='100%';\n    $('#quiz').innerHTML=`<div class=\"pop rounded-3xl p-8 text-center bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\"><p class=\"text-sm font-bold text-sage\">Sesi selesai<\/p><p class=\"text-6xl font-black mt-2\">${qScore}/${Q.length}<\/p><p class=\"mt-2 opacity-80\">+${qScore*20} XP. Ulangi besok untuk menguatkan ingatan.<\/p><button id=\"qAgain\" class=\"mt-5 h-11 px-6 rounded-2xl bg-sun text-[#3B2A00] font-extrabold shadow-[0_4px_0_#B88A00]\">Ulangi sesi<\/button><\/div>`;\n    $('#qAgain').onclick=()=>{qi=0;qScore=0;drawQ()};return}\n  const q=Q[qi];\n  $('#quiz').innerHTML=`<div class=\"rounded-3xl p-5 sm:p-7 bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\">\n    <div class=\"flex flex-wrap gap-2 items-center text-xs font-bold\"><span class=\"px-2.5 py-1 rounded-full bg-sage-50 dark:bg-night text-sage dark:text-sage-300 jp\">${q.src}<\/span><span class=\"px-2.5 py-1 rounded-full bg-sky2-50 dark:bg-[#14273D] text-sky2 jp\">${rb(q.subj)}<\/span><\/div>\n    <p class=\"jp mt-4 text-lg sm:text-xl font-bold leading-[2.2]\">${rb(q.stem)}<\/p>\n    <p class=\"tr mt-2 text-[15px] rounded-xl bg-sky2-50 dark:bg-[#14273D] px-3 py-2\">${q.tr}<\/p>\n    <div class=\"mt-5 flex flex-col gap-2.5\" id=\"opts\">${q.o.map((o,i)=>`<button data-i=\"${i}\" class=\"opt text-left flex gap-3 items-start p-3 sm:p-4 rounded-2xl border-2 border-sage-100 dark:border-night-line hover:border-sky2 transition\"><span class=\"num shrink-0 grid place-items-center w-8 h-8 rounded-full border-2 border-current font-black\">${i+1}<\/span><span><span class=\"jp block text-[17px] font-bold leading-[2]\">${rb(o[0])}<\/span><span class=\"tr block text-sm opacity-75\">${o[1]}<\/span><\/span><\/button>`).join('')}<\/div>\n    <div id=\"exp\"><\/div><\/div>`;\n  $$('#opts .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));\n}\nfunction pick(i){\n  if(answered)return;answered=true;const q=Q[qi],ok=i===q.a;if(ok){qScore++;addXP(20,'+20 XP · Tepat!')}\n  $$('#opts .opt').forEach((b,k)=>{b.disabled=true;b.classList.remove('hover:border-sky2');\n    if(k===q.a)b.className+=' !border-sage bg-sage-50 dark:bg-[#1E2C24]';else if(k===i)b.className+=' !border-sun bg-sun-50 dark:bg-[#2E2810] shake';else b.className+=' opacity-60'});\n  $('#exp').innerHTML=`<div class=\"pop mt-6 rounded-2xl p-4 ${ok?'bg-sage text-white':'bg-sun text-[#3B2A00]'}\"><p class=\"font-black text-lg\">${ok?'Tepat sekali!':'Belum tepat'} · Jawaban: ${q.a+1}<\/p><p class=\"text-[15px] mt-1\">${q.point}<\/p><\/div>\n   <h3 class=\"mt-6 font-extrabold text-lg\">Pembahasan kelima opsi<\/h3>\n   <ol class=\"mt-3 flex flex-col gap-3\">${q.ex.map((e,k)=>{const good=k===q.a;return `<li class=\"rounded-2xl p-4 border-l-4 ${good?'border-sage bg-sage-50 dark:bg-[#1E2C24]':'border-[#C8333A] bg-ivory dark:bg-night'}\">\n     <div class=\"flex flex-wrap items-center gap-2\"><span class=\"grid place-items-center w-7 h-7 rounded-full text-sm font-black text-white ${good?'bg-sage':'bg-[#C8333A]'}\">${good?'✓':'✗'}<\/span><b class=\"jp\">${k+1}. ${rb(q.o[k][0])}<\/b>${e[0].split(' · ').map(t=>`<span class=\"text-[11px] font-extrabold px-2 py-0.5 rounded-full ${tagCol[t]}\">${t}<\/span>`).join('')}<\/div>\n     <p class=\"tr text-sm opacity-75 mt-1\">${q.o[k][1]}<\/p><p class=\"mt-2 text-[15px] leading-relaxed\">${e[1]}<\/p><\/li>`}).join('')}<\/ol>\n   <div class=\"mt-4 rounded-2xl p-4 bg-sky2-50 dark:bg-[#14273D] text-[15px]\"><b>Aplikasi di lapangan.<\/b> ${q.care}<\/div>\n   <p class=\"text-xs opacity-60 mt-3\">${q.pred?`<span class=\"jp\">${q.src}<\/span>: soal orisinal Kaigo Link (latihan prediksi), bukan soal resmi 試験センター. Pembahasan disusun Kaigo Link.`:`Teks soal: <span class=\"jp\">${q.src}<\/span>, 公益財団法人 社会福祉振興・試験センター. Pembahasan disusun Kaigo Link, bukan dari 試験センター.`}<\/p>\n   <button id=\"next\" class=\"mt-5 w-full h-12 rounded-2xl bg-sun text-[#3B2A00] font-extrabold text-lg shadow-[0_4px_0_#B88A00] active:translate-y-0.5 active:shadow-none\">${qi+1<Q.length?'Soal berikutnya':'Lihat hasil'}<\/button>`;\n  $('#next').onclick=()=>{qi++;drawQ();window.scrollTo({top:0,behavior:'smooth'})};\n  $('#exp').scrollIntoView({behavior:'smooth',block:'start'});\n}\n\n\n/* ---------- BANK SOAL 過去問 ---------- */\nconst KQ=(()=>{const base=KLV.KQ;const out=base.map(q=>({...q,src:q.pred?`Latihan Prediksi 第39回 · No.${q.n}`:`第${q.y}回 問題${q.n}`,ex:{p:q.p,law:q.lawn,care:q.care,o:q.ox}}));\n const ext=[[Q[0],36,24,'s08'],[Q[1],38,85,'s10']].map(([q,y,n,s])=>({id:y+'-'+n,y,n,s,subj:plain(q.subj),law:false,stem:[q.stem],sTr:[q.tr],o:q.o.map(o=>o[0]),oTr:q.o.map(o=>o[1]),a:q.a,src:q.src,ex:{p:q.point,care:q.care,o:q.ex.map((e,k)=>[e[0],'','',e[1]])}}));return out.concat(ext).filter(q=>!KLV.PV||KLV.FREE.includes(q.s))})();\nconst YEARS=[['all','Semua'],[26,'第26回 · 2014'],[27,'第27回 · 2015'],[28,'第28回 · 2016'],['new','第36・38回'],[39,'Prediksi 第39回']];\nlet WR={};try{WR=JSON.parse(store.get('klv-wrong','{}'))||{}}catch(e){WR={}}\nlet BK={year:'all',subj:'all',mode:'latihan',wrong:false},RUN=null;\nconst saveWR=()=>store.set('klv-wrong',JSON.stringify(WR));\nfunction kqFilter(){return KQ.filter(q=>(BK.year==='all'||(BK.year==='new'?(q.y>=36&&!q.pred):q.y===BK.year))&&(BK.subj==='all'||q.s===BK.subj)&&(!BK.wrong||WR[q.id]))}\nfunction kqSubjDone(s){return Object.keys(P(s).k||{}).filter(id=>KQ.some(q=>q.id===id&&q.s===s)).length}\nfunction recordKQ(q,ok){if(ok){delete WR[q.id];const p=P(q.s);p.k=p.k||{};if(!p.k[q.id]){p.k[q.id]=1;save()}}else WR[q.id]=1;saveWR()}\nconst lawBadge=q=>q.law?`<div class=\"mt-3 rounded-2xl p-3 border-2 border-sun bg-sun-50 dark:bg-[#2E2810] text-[14px]\"><p class=\"font-extrabold text-sun-600\">Catatan Hukum: Soal ini disesuaikan dengan regulasi terbaru per April 2026<\/p>${q.ex.law?`<p class=\"mt-1\">${q.ex.law}<\/p>`:''}<\/div>`:'';\nfunction renderBank(){const v=$('#v-soal');RUN=null;clearInterval(bkTimer);\n const subs=[...new Set(KQ.map(q=>q.s))];const n=kqFilter().length,wn=Object.keys(WR).length;\n const tot=KQ.length,done=KQ.filter(q=>(P(q.s).k||{})[q.id]).length;\n v.innerHTML=`<div class=\"max-w-4xl mx-auto\"><div class=\"flex items-end justify-between flex-wrap gap-3\"><div><h2 class=\"text-2xl font-extrabold\">Bank Soal <span class=\"jp\">過去問<\/span><\/h2><p class=\"text-sm opacity-75\">Soal asli ujian nasional. Baca teks Jepangnya dulu, lalu buka terjemahan per kalimat bila perlu.<\/p><\/div><div class=\"flex flex-wrap gap-2\" data-toggles><\/div><\/div>\n <div class=\"mt-4 grid gap-2 sm:gap-3 grid-cols-3\"><div class=\"rounded-2xl p-3 sm:p-4 bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\"><p class=\"text-xs font-bold opacity-70\">Dikuasai<\/p><p class=\"text-2xl font-black\">${done}/${tot}<\/p><\/div><div class=\"rounded-2xl p-4 bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\"><p class=\"text-xs font-bold opacity-70\">Pernah salah<\/p><p class=\"text-2xl font-black text-[#C8333A]\">${wn}<\/p><\/div><div class=\"rounded-2xl p-4 bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\"><p class=\"text-xs font-bold opacity-70\">XP per jawaban benar<\/p><p class=\"text-2xl font-black text-sky2\">+10<\/p><\/div><\/div>\n <div class=\"mt-4 rounded-3xl p-4 sm:p-5 bg-white dark:bg-night-card border border-sage-100 dark:border-night-line\">\n  <p class=\"text-sm font-extrabold\">Tahun ujian<\/p><div class=\"mt-2 flex flex-wrap gap-2\" data-f=\"year\">${YEARS.map(([k,l])=>`<button data-v=\"${k}\" class=\"h-10 px-4 rounded-full text-sm font-extrabold border-2 jp ${String(BK.year)===String(k)?'bg-sage text-white border-sage':'border-sage-100 dark:border-night-line'}\">${l}<\/button>`).join('')}<\/div>\n  <p class=\"text-sm font-extrabold mt-4\">Bidang<\/p><div class=\"mt-2 flex flex-wrap gap-2\" data-f=\"subj\"><button data-v=\"all\" class=\"h-10 px-4 r
