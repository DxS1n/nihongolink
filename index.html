<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NihongoLink & KaigoLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--bg2:#f3e6c9;--card:#fffdf8;--tx:#1b2442;--mu:#6b6455;--bd:#e8dbbd;--r:#12337a;--r2:#0c2560;--g:#8a6528;--gold:#c99a45;--gold2:#a8792c;--ink:#141c36;--a:var(--r);--sh:0 18px 40px -22px rgba(18,51,122,.45);--fh:"Quicksand","Noto Sans JP",system-ui,sans-serif;--fb:"Plus Jakarta Sans","Noto Sans JP",system-ui,sans-serif;--fw:"Caveat",cursive;--note1:#ffe59a;--note2:#d6ecff;--note3:#e7e1ff;--note4:#ffdfc9;--ona:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--bg2:#18223f;--card:#18223f;--tx:#f4ead3;--mu:#b6ab93;--bd:#2f3b63;--r:#86a6f2;--r2:#6c8ee6;--g:#e0bb72;--gold:#e0bb72;--gold2:#c49a4b;--ink:#0a1024;--sh:0 18px 40px -22px #000;--ona:#0f1730}}
*{box-sizing:border-box}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--fb);line-height:1.6;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;background:radial-gradient(40vw 40vw at 85% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 70%),radial-gradient(45vw 45vw at 0% 35%,color-mix(in srgb,var(--r) 12%,transparent),transparent 70%),radial-gradient(40vw 40vw at 100% 90%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%)}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.01em;line-height:1.15}
a{color:var(--r)}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.mu{color:var(--mu);font-size:14px}
.hand{font-family:var(--fw);font-weight:700}
/* ---------- header ---------- */
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--r));z-index:70}
header{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;margin:10px auto 0;max-width:1080px;width:calc(100% - 20px);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
header .brand{text-decoration:none;margin-right:auto}
header b{font-family:var(--fh);font-size:17px;color:var(--r);white-space:nowrap}header b i{font-style:normal;color:var(--gold)}
.hn{display:none;gap:4px}.hn button{font:inherit;font-size:15px;font-weight:600;color:var(--tx);background:none;border:none;padding:8px 12px;border-radius:999px;cursor:pointer}.hn button:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
header .hm{display:none}
@media(min-width:760px){.hn{display:flex}header .hm{display:inline-flex}#mb{display:none!important}}
#mb{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-content:center;gap:5px;cursor:pointer;padding:0}
#mb span{display:block;width:18px;height:2px;background:var(--r);border-radius:2px;transition:.3s}
#mb.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}#mb.open span:nth-child(2){opacity:0}#mb.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
nav#nv{position:fixed;top:0;right:0;bottom:0;width:min(290px,84vw);background:var(--card);z-index:80;display:flex;flex-direction:column;gap:6px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 30px -12px #0006;border-left:3px solid var(--gold)}
nav#nv.open{transform:none}
nav#nv button{font:inherit;text-align:left;border-radius:14px;padding:12px 14px;font-size:16px;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
nav#nv button.on{background:var(--r);border-color:var(--r);color:var(--ona)}
.nh{display:flex;justify-content:space-between;align-items:center;font-family:var(--fh);font-weight:700;color:var(--r);font-size:19px;margin-bottom:8px}.nh #nx{cursor:pointer;padding:4px 8px;color:var(--mu)}
.nf{margin-top:auto;text-align:center;padding-top:18px}.nf b{display:block;font-size:13px;color:var(--mu);margin-top:8px}
#nbd{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .3s;z-index:75}#nbd.on{opacity:1;pointer-events:auto}
/* ---------- buttons ---------- */
.btn,.chip,.tab{font:inherit;font-weight:700;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;transition:transform .15s,box-shadow .15s,background .2s}
.btn{box-shadow:0 3px 0 var(--bd)}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--ona);box-shadow:0 4px 0 color-mix(in srgb,var(--a) 60%,#000)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b2442;box-shadow:0 4px 0 var(--gold2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--a) 60%,#000)}
.btn.big3{padding:15px 26px;font-size:17px;border-radius:18px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip.on,.tab.on{background:var(--a);border-color:var(--a);color:var(--ona)}
.chip:hover,.tab:hover{transform:translateY(-2px)}
/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:10px 16px 60px}main.tool{max-width:780px;padding-top:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;gap:14px;margin-top:18px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.grid.f4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.grid.f5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid.plans{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:stretch}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:var(--sh);position:relative}
.card h3{margin:0 0 6px;font-size:19px}.card p{margin:0 0 10px;color:var(--mu);font-size:14.5px}
.grid>.card{display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}.grid>.card .btn{margin-top:auto;align-self:flex-start}
.grid>.card:hover{transform:translateY(-6px) rotate(-.4deg)}
.sec{padding:70px 0 10px;text-align:center;scroll-margin-top:90px}.sec .card,.sec details{text-align:left}
.sec h2{font-size:clamp(28px,5vw,42px);margin:8px 0 8px;color:var(--tx)}
.sec .lead,.lead{color:var(--mu);max-width:560px;margin:0 auto 20px;font-size:16.5px}
.kick{display:inline-block;font-family:var(--fb);font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ona);background:var(--a);padding:6px 14px;border-radius:8px;transform:rotate(-2deg);box-shadow:0 3px 0 color-mix(in srgb,var(--a) 60%,#000)}
.kick.g{background:var(--gold);color:#1b2442;box-shadow:0 3px 0 var(--gold2)}
.tag{display:inline-block;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:999px;padding:3px 11px;margin-bottom:8px;align-self:flex-start}
/* ---------- announcement ---------- */
.ann{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:13.5px;font-weight:700;background:var(--r);color:var(--ona);border-radius:999px;padding:9px 16px;margin:14px auto 0;max-width:620px;text-decoration:none;cursor:pointer}
.ann .hand{color:var(--gold);font-size:20px;line-height:1}
/* ---------- hero ---------- */
.hero3{text-align:center;padding:46px 0 10px;position:relative}
.hero3 h1{font-size:clamp(38px,8.5vw,72px);margin:18px auto 14px;max-width:880px;color:var(--tx);font-weight:700}
.mk{position:relative;white-space:nowrap;color:var(--r);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--gold) 55%,transparent) 62%,color-mix(in srgb,var(--gold) 55%,transparent) 92%,transparent 92%) no-repeat 0 0/0% 100%;animation:mk 1.1s .5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes mk{to{background-size:100% 100%}}
.hero3 .lead{font-size:17.5px;max-width:600px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;margin-top:10px}
.hw{position:absolute;left:calc(50% + 240px);top:-22px;font-family:var(--fw);font-size:24px;font-weight:700;color:var(--gold2);transform:rotate(-6deg);line-height:1;text-align:left;display:none}
.hw svg{position:absolute;left:-46px;top:30px;width:44px;height:40px;transform:scaleY(-1)}
@media(min-width:900px){.hw{display:block}}
.hwm{font-family:var(--fw);font-size:22px;font-weight:700;color:var(--gold2);margin-top:14px}
@media(min-width:900px){.hwm{display:none}}
/* demo window */
.demo{margin:46px auto 0;max-width:900px;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 40px 80px -40px rgba(18,51,122,.55);overflow:hidden;text-align:left;position:relative}
.dtop{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:14px}
.dtop i{width:11px;height:11px;border-radius:50%;background:#f17b6b;display:inline-block}.dtop i:nth-child(2){background:#f4c35b}.dtop i:nth-child(3){background:#69c67c}
.dtop span{margin-left:8px;font-family:var(--fh);color:var(--r)}.dtop .pill{margin-left:auto;font-size:12px;background:color-mix(in srgb,var(--gold) 25%,transparent);border-radius:999px;padding:3px 10px;color:var(--tx)}
.dbody{display:grid;grid-template-columns:110px 1fr;min-height:330px}
.dside{border-right:1px solid var(--bd);padding:14px 8px;display:flex;flex-direction:column;gap:6px}
.dside b{font-size:13px;padding:9px 10px;border-radius:12px;color:var(--mu);transition:.3s;font-weight:700}.dside b.on{background:var(--r);color:var(--ona)}
.dstage{position:relative;padding:22px;display:grid;place-items:center}
.dpane{position:absolute;inset:22px;display:grid;place-items:center;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .5s,transform .5s}.dpane.on{opacity:1;transform:none}
.dfc{width:min(280px,100%);aspect-ratio:1.45;perspective:900px}
.dfc .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}.dfc.flip .in{transform:rotateY(180deg)}
.dfc .f,.dfc .b{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;align-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--tx);box-shadow:6px 6px 0 var(--tx);background:var(--card)}
.dfc .f b{font-size:64px;font-family:"Noto Sans JP",sans-serif}.dfc .f small,.dfc .b small{color:var(--mu)}
.dfc .b{transform:rotateY(180deg);background:var(--note1);color:#1b2442}.dfc .b b{font-size:30px;font-family:"Noto Sans JP",sans-serif}
.dq{width:min(360px,100%)}.dq h4{margin:0 0 12px;font-size:18px;font-family:"Noto Sans JP",sans-serif}
.dq div{border:1.5px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;font-family:"Noto Sans JP",sans-serif;display:flex;gap:10px;align-items:center;transition:.4s;background:var(--card)}
.dq div i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--r) 12%,transparent);color:var(--r)}
.dq div.ok{border-color:#4caf6d;background:color-mix(in srgb,#4caf6d 14%,var(--card))}.dq div.ok i{background:#4caf6d;color:#fff}
.dk{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.dk svg{width:170px;height:170px;background:var(--bg);border:2px dashed var(--bd);border-radius:18px}
.dk path{fill:none;stroke:var(--tx);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.dk p{margin:0;font-size:15px}.dk p b{font-size:28px;font-family:"Noto Sans JP",sans-serif;display:block;color:var(--r)}
@media(max-width:560px){.dbody{grid-template-columns:1fr}.dside{flex-direction:row;border-right:none;border-bottom:1px solid var(--bd);justify-content:center}.dstage{min-height:300px}}
/* marquee */
.marq{margin-top:56px;padding:20px 0;border-top:1.5px dashed var(--bd);border-bottom:1.5px dashed var(--bd);overflow:hidden;text-align:center}
.marq .hand{font-size:28px;color:var(--tx);margin:0 0 10px}
.track{display:flex;gap:12px;width:max-content;animation:mq 40s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track span{white-space:nowrap;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 14px;font-family:"Noto Sans JP",sans-serif;font-size:15px}
.track span small{color:var(--mu);margin-left:6px;font-family:var(--fb)}
@keyframes mq{to{transform:translateX(-50%)}}
/* psst + sticky notes */
.psst{display:grid;gap:30px;align-items:center;text-align:left}
@media(min-width:820px){.psst{grid-template-columns:.9fr 1.1fr}}
.psst .hand{font-size:30px;color:var(--gold2)}
.psst h2{margin-top:0}
.psst .lead{margin-left:0}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{position:relative;padding:30px 18px 26px;min-height:150px;font-family:var(--fw);font-size:22px;font-weight:700;line-height:1.2;color:#2b2a33;box-shadow:0 14px 22px -14px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.note:nth-child(1){background:var(--note1);transform:rotate(-2.5deg)}.note:nth-child(2){background:var(--note2);transform:rotate(1.8deg)}.note:nth-child(3){background:var(--note3);transform:rotate(1.2deg)}.note:nth-child(4){background:var(--note4);transform:rotate(-1.6deg)}
.note:hover{transform:rotate(0) scale(1.04)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--gold) 55%,#fff);opacity:.85}
.note:nth-child(even)::before{background:color-mix(in srgb,var(--r) 35%,#fff)}
/* circled word */
.circ{position:relative;display:inline-block;white-space:nowrap}
.circ svg{position:absolute;left:-8%;top:-14%;width:116%;height:130%;overflow:visible;pointer-events:none}
.circ path{fill:none;stroke:var(--gold);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s .3s cubic-bezier(.6,0,.2,1)}
.in .circ path,.circ.in path{stroke-dashoffset:0}
/* bento */
.bento{display:grid;gap:18px;margin-top:30px;text-align:left}
@media(min-width:860px){.bento{grid-template-columns:1.25fr .9fr .9fr;grid-template-rows:auto auto}.b1{grid-column:1/3}.b2{grid-column:3;grid-row:1/3}}
.bx{position:relative;border-radius:22px;padding:24px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bx:hover{transform:translateY(-6px)}
.bx::after{content:"";position:absolute;top:-9px;right:30px;width:80px;height:22px;transform:rotate(3deg);background:color-mix(in srgb,var(--gold) 55%,#fff);opacity:.8}
.bx .n{font-family:var(--fw);font-size:24px;font-weight:700;color:var(--gold2)}
.bx h3{font-size:24px;margin:2px 0 8px}.bx p{color:var(--mu);margin:0 0 16px}
.b1{border-top:5px solid var(--gold);background-image:repeating-linear-gradient(transparent 0 35px,color-mix(in srgb,var(--bd) 70%,transparent) 35px 36px)}
.lvl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.lvl span{display:grid;place-items:center;border-radius:14px;border:2px solid var(--tx);background:var(--card);font-weight:800;box-shadow:4px 4px 0 var(--tx);font-family:var(--fh)}
.lvl span:nth-child(1){width:56px;height:56px}.lvl span:nth-child(2){width:62px;height:66px}.lvl span:nth-child(3){width:68px;height:76px}.lvl span:nth-child(4){width:74px;height:86px}.lvl span:nth-child(5){width:80px;height:96px;background:var(--gold);color:#1b2442}
@media(max-width:560px){.lvl{gap:7px}.lvl span:nth-child(1){width:44px;height:44px}.lvl span:nth-child(2){width:48px;height:52px}.lvl span:nth-child(3){width:52px;height:60px}.lvl span:nth-child(4){width:56px;height:68px}.lvl span:nth-child(5){width:60px;height:76px}.lvl em{flex-basis:100%;margin:6px 0 0}}
.lvl em{font-family:var(--fw);font-style:normal;font-size:22px;color:var(--gold2);margin-left:6px}
.b2{background:var(--ink);color:#f4ead3;border-color:var(--ink);display:flex;flex-direction:column}
.b2 h3{color:#fff}.b2 p{color:#c9c1ad}.b2 .n{color:var(--gold)}
.b2 svg{width:100%;max-width:230px;margin:auto;display:block;background:color-mix(in srgb,#fff 6%,transparent);border-radius:20px;border:1.5px dashed #ffffff33}
.b2 path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.b2 .bt{margin-top:16px;align-self:flex-start}
.b3{border-top:5px solid #5aa9e6}.b4{border-top:5px solid #4caf6d}
.mfc{width:170px;height:110px;margin:6px 0 4px;perspective:700px;cursor:pointer}
.mfc .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d;animation:flp 5s 1.5s infinite}
@keyframes flp{0%,40%{transform:none}50%,90%{transform:rotateY(180deg)}100%{transform:none}}
.mfc .f,.mfc .b{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;border:2px solid var(--tx);box-shadow:5px 5px 0 var(--tx);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);font-family:"Noto Sans JP",sans-serif;font-size:30px;font-weight:700}
.mfc .b{transform:rotateY(180deg);background:var(--note2);color:#1b2442;font-size:17px;text-align:center;line-height:1.3}
.mq div{border:1.5px solid var(--bd);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;display:flex;gap:8px;align-items:center;background:var(--card)}
.mq div.ok{border-color:#4caf6d;background:color-mix(in srgb,#4caf6d 14%,var(--card))}
.mq div b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#4caf6d;color:#fff}
.mq div i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px 14px;box-shadow:var(--sh)}
.num{font-family:var(--fh);font-size:40px;font-weight:700;color:var(--r);line-height:1.05}
.stat p{margin:4px 0 0;color:var(--mu);font-size:14px}
/* steps */
.step{font-family:var(--fw);font-size:40px;font-weight:700;color:var(--gold2);line-height:1}
/* cmp table */
.cmp{width:100%;border-collapse:collapse;font-size:15px}.cmp th,.cmp td{padding:13px 10px;border-bottom:1px dashed var(--bd);text-align:center}.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-family:var(--fh);font-size:15px}.cmp th:last-child{color:var(--ona);background:var(--r);border-radius:12px 12px 0 0}
.cmp td:last-child{background:color-mix(in srgb,var(--r) 8%,transparent)}
.cmp .y{color:#3c9b5d;font-weight:800;font-size:18px}.cmp .n{color:var(--mu)}.tw{overflow-x:auto}
/* countdown */
.cdw{display:flex;gap:10px;justify-content:center;margin:16px 0}.cdw div{background:var(--r);color:var(--ona);border-radius:16px;padding:12px 14px;min-width:70px;text-align:center;font-size:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--r) 60%,#000)}.cdw b{display:block;font-size:28px;font-family:var(--fh)}
/* plans */
.plan{text-align:left}.plan.pop{border:2.5px solid var(--gold);transform:scale(1.02)}
.plan .price{font-family:var(--fh);font-size:32px;font-weight:700;color:var(--r)}.plan .price small{font-size:13px;font-weight:500;color:var(--mu);font-family:var(--fb)}
.plan ul{list-style:none;padding:0;margin:12px 0;color:var(--tx);font-size:14.5px}.plan li{padding:4px 0 4px 24px;position:relative}.plan li::before{content:"✓";position:absolute;left:0;color:var(--gold2);font-weight:800}
.rib{position:absolute;top:-14px;right:16px;background:var(--gold);color:#1b2442;font-family:var(--fw);font-size:20px;font-weight:700;border-radius:10px;padding:2px 14px;transform:rotate(3deg);box-shadow:0 3px 0 var(--gold2)}
.pay{max-width:540px;margin:22px auto 0;text-align:left}.pay ol{margin:8px 0 12px;padding-left:20px;color:var(--mu);font-size:14.5px}.pay ol li{padding:3px 0}
.pay .bk{background:var(--bg);border:2px dashed var(--gold);border-radius:16px;padding:14px;margin:10px 0;text-align:center}.pay .no{font-family:var(--fh);font-size:26px;font-weight:700;letter-spacing:.05em;color:var(--r)}
/* faq */
details{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 18px;margin:10px auto;max-width:760px;box-shadow:0 8px 20px -16px rgba(0,0,0,.4)}
summary{cursor:pointer;font-weight:700;font-family:var(--fh);font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--gold2);transition:transform .3s}details[open] summary::after{transform:rotate(45deg)}
details p{margin:10px 0 0;color:var(--mu)}
/* band */
.band{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:30px;padding:56px 22px;text-align:center;margin-top:70px}
.band::before,.band::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(30px);opacity:.55;animation:glow 9s ease-in-out infinite alternate}
.band::before{background:radial-gradient(circle,#c99a45,transparent 65%);left:-120px;top:-160px}.band::after{background:radial-gradient(circle,#3c63c9,transparent 65%);right:-120px;bottom:-180px;animation-delay:-4s}
@keyframes glow{to{transform:translate(60px,40px) scale(1.15)}}
.band>*{position:relative;z-index:1}.band h2{color:#fff;font-size:clamp(28px,5vw,44px);margin:0 0 10px}.band p{color:#d9d1bd}
.band .btn{box-shadow:0 4px 0 #0008}
/* brand cards */
.hl{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px 18px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--sh);width:250px;max-width:100%}
.hl .pc img,.pl img{width:210px;height:140px;max-width:100%;object-fit:contain;background:#fff;border-radius:16px;padding:8px}
.pl{display:flex;flex-direction:column;align-items:center;margin:6px 0 10px}.pl img{width:180px;height:120px}
.lgl{display:flex;justify-content:center;transition:transform .2s}.lgl:hover{transform:scale(1.04)}
.soc{display:flex;gap:10px;justify-content:center;margin-top:12px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);background:var(--card);color:var(--r);transition:transform .15s,background .2s}
.ic svg{width:20px;height:20px}.ic:hover{transform:translateY(-3px) scale(1.1);background:var(--gold);color:#1d2540}
/* tools (kotoba/kanji/quiz) */
.fc{text-align:center;padding:38px 16px;cursor:pointer;min-height:180px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--gold) 14%,var(--card)));border:2px solid var(--tx);box-shadow:6px 6px 0 var(--tx);animation:pop .35s ease}
.fc .big{font-size:48px}.fc .sm{color:var(--mu)}
@keyframes pop{from{transform:scale(.94);opacity:.5}}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:9px 0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s,background .2s}
.opt:hover{transform:translateX(3px)}
.opt.ok{border-color:#4caf6d;background:color-mix(in srgb,#4caf6d 16%,var(--card));animation:pulse .45s}
.opt.no{border-color:#d9534f;background:color-mix(in srgb,#d9534f 14%,var(--card));animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{height:8px;background:var(--bd);border-radius:9px;margin-bottom:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--r));border-radius:9px;transition:width .4s}
canvas{width:100%;max-width:340px;aspect-ratio:1;border:2px solid var(--bd);border-radius:18px;background:var(--card);touch-action:none;display:block;margin:auto}
.kg{display:flex;gap:8px;flex-wrap:wrap}.kg .chip{font-size:22px;padding:4px 14px}
.sv{width:210px;max-width:100%;display:block;margin:6px auto;background:var(--bg);border:1px solid var(--bd);border-radius:14px}
.sv path,.st path{fill:none;stroke-linecap:round;stroke-linejoin:round}.sv path{stroke:var(--tx);stroke-width:5}
.st{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.st svg{width:58px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.st .g{stroke:var(--mu);stroke-width:5;opacity:.45}.st .h{stroke:var(--r);stroke-width:7}.st text{font-size:20px;fill:var(--r);font-weight:700}
.gate{text-align:center;max-width:470px;margin:14px auto}.gate .btn{margin:6px}
.lock{font-size:40px;text-align:center}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;margin:6px 0;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);-webkit-text-fill-color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mu);-webkit-text-fill-color:var(--mu)}
/* footer, toast */
#ft{text-align:center;color:var(--mu);font-size:13px;padding:20px 14px 40px}#ft .fr{display:inline-block;margin:6px 16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--r);color:var(--ona);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
.wm{position:fixed;inset:0;z-index:60;pointer-events:none;background-repeat:repeat;display:none}.wm.on{display:block}
@media print{.wm.on{display:block!important}}
/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.note.rv.in:nth-child(1){transform:rotate(-2.5deg)}.note.rv.in:nth-child(2){transform:rotate(1.8deg)}.note.rv.in:nth-child(3){transform:rotate(1.2deg)}.note.rv.in:nth-child(4){transform:rotate(-1.6deg)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important;transition:none!important}.mk{background-size:100% 100%}.circ path{stroke-dashoffset:0}}
.note.rv.in:hover,.note:hover{transform:rotate(0) scale(1.04)}
.bx.rv.in:hover{transform:translateY(-6px)}

if(!S||!S.length){box.innerHTML='<p class="mu">Urutan goresan kanji ini belum tersedia di versi ini. Gunakan tombol "Urutan goresan ↗" di atas.</p>';return}

<script type="module">
// === Firebase: isi dari Firebase console → Project settings → Your apps → Web app (firebaseConfig) ===
const firebaseConfig = {
  apiKey: "AIzaSyCwybJW2-YuHgoXe0v24pZ-qBPQnd0X30E",
  authDomain: "nihongolinku.firebaseapp.com",
  projectId: "nihongolinku",
  storageBucket: "nihongolinku.firebasestorage.app",
  messagingSenderId: "678792923912",
  appId: "1:678792923912:web:9595de63e963dda468babd",
  measurementId: "G-HKQH0LHLLL"
};
// === Email admin diatur di Firestore → Rules (bukan di sini). Halaman admin: tambahkan #admin di akhir alamat. ===
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp, arrayUnion, collection, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = initializeFirestore(fbApp, { experimentalForceLongPolling: true });
const T = (p, ms = 15000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout: koneksi database terlalu lama")), ms))]);

const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
const inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Twitter|Snapchat/i.test(navigator.userAgent || "");
const errMap = { "auth/popup-closed-by-user": "Jendela login ditutup sebelum selesai.", "auth/network-request-failed": "Koneksi internet bermasalah. Coba lagi.", "auth/unauthorized-domain": "Domain ini belum didaftarkan di Firebase (Authentication → Settings → Authorized domains).", "permission-denied": "Akses ditolak." };

async function login() {
  try { return await signInWithPopup(auth, provider); }
  catch (e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider); throw e; }
}
async function ensureProfile(user) {
  const ref = doc(db, "users", user.uid), snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { name: user.displayName || "", email: user.email, photoURL: user.photoURL || "", brands: ["landing"], createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
    return (await getDoc(ref)).data();
  }
  await updateDoc(ref, { lastLogin: serverTimestamp(), brands: arrayUnion("landing") });
  return snap.data();
}
const adm = {
  async isAdmin() { try { await getDocs(query(collection(db, "payments"), where("x", "==", "cek"))); return true; } catch { return false; } },
  async programs() { const s = await getDocs(collection(db, "programs")); return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id < b.id ? -1 : 1); },
  async find(email) { const s = await getDocs(query(collection(db, "users"), where("email", "==", email))); return s.empty ? null : { id: s.docs[0].id, ...s.docs[0].data() }; },
  async grant(uid, email, pid, date, note) {
    const until = Timestamp.fromDate(new Date(date + "T23:59:59")), by = auth.currentUser.email;
    await updateDoc(doc(db, "users", uid), { [`access.${pid}`]: { until, activatedAt: serverTimestamp(), note, by } });
    await setDoc(doc(collection(db, "payments")), { uid, email, program: pid, until, note, by, at: serverTimestamp() });
    return until;
  },
  revoke(uid, pid) { return updateDoc(doc(db, "users", uid), { [`access.${pid}`]: deleteField() }); },
  saveProgram(id, name) { return setDoc(doc(db, "programs", id), { brand: id.startsWith("kaigo") ? "kaigolink" : "nihongolink", name }, { merge: true }); },
  async devices(uid) {
    const d = await getDocs(collection(db, "users", uid, "devices"));
    const l = await getDocs(collection(db, "users", uid, "deviceLog"));
    const week = Date.now() - 7 * 864e5;
    const recent = l.docs.filter(x => x.data().at && x.data().at.toMillis() > week).length;
    return { list: d.docs.map(x => ({ id: x.id, ...x.data() })), recent };
  },
  async clearDevices(uid) {
    const d = await getDocs(collection(db, "users", uid, "devices"));
    for (const x of d.docs) await deleteDoc(doc(db, "users", uid, "devices", x.id));
    return d.size;
  },
  async upload(obj) {
    let n = 0;
    for (const prog of Object.keys(obj)) for (const key of Object.keys(obj[prog])) {
      await setDoc(doc(db, "content", prog, "items", key), { data: JSON.stringify(obj[prog][key]), updatedAt: serverTimestamp(), by: auth.currentUser.email }); n++;
    }
    return n;
  }
};
// ===== Batas perangkat: 1 akun maksimal MAX_DEV perangkat aktif =====
const MAX_DEV = 2;
let devId = null; try { devId = localStorage.getItem("lk_dev"); } catch {}
if (!devId) { devId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); try { localStorage.setItem("lk_dev", devId); } catch {} }
const regKey = uid => "lk_reg_" + uid;
function deviceLabel() {
  const ua = navigator.userAgent || "";
  const os = /iPhone|iPad|iPod/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "Perangkat lain";
  const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
  return `${os} · ${br}`;
}
async function registerDevice(user) {
  const ref = doc(db, "users", user.uid, "devices", devId);
  const snap = await getDoc(ref);
  let registered = false; try { registered = localStorage.getItem(regKey(user.uid)) === devId; } catch {}
  if (!snap.exists() && registered) return false;           // perangkat ini sudah dikeluarkan oleh perangkat lain
  if (!snap.exists()) {
    await setDoc(ref, { label: deviceLabel(), createdAt: serverTimestamp(), lastSeen: serverTimestamp() });
    await setDoc(doc(collection(db, "users", user.uid, "deviceLog")), { label: deviceLabel(), at: serverTimestamp() });
    try { localStorage.setItem(regKey(user.uid), devId); } catch {}
  } else {
    await updateDoc(ref, { lastSeen: serverTimestamp() });
  }
  const all = await getDocs(collection(db, "users", user.uid, "devices"));
  const others = all.docs.filter(d => d.id !== devId)
    .map(d => ({ id: d.id, t: (d.data().lastSeen && d.data().lastSeen.toMillis) ? d.data().lastSeen.toMillis() : 0 }))
    .sort((a, b) => b.t - a.t);
  for (const d of others.slice(MAX_DEV - 1)) await deleteDoc(doc(db, "users", user.uid, "devices", d.id));
  return true;
}
async function checkDevice() {
  const u = auth.currentUser; if (!u) return true;
  try {
    const s = await T(getDoc(doc(db, "users", u.uid, "devices", devId)), 10000);
    if (s.exists()) return true;
    await kicked(); return false;
  } catch { return true; }
}
async function kicked() {
  const u = auth.currentUser;
  if (u) { try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  FB.kickedMsg = true;
  await signOut(auth);
  toast("Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.");
}
async function logoutAll() {
  const u = auth.currentUser;
  if (u) { try { await deleteDoc(doc(db, "users", u.uid, "devices", devId)); } catch {} try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  return signOut(auth);
}
setInterval(() => { if (auth.currentUser && !document.hidden) checkDevice(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && auth.currentUser) checkDevice(); });

async function content(prog, key) { const s = await T(getDoc(doc(db, "content", prog, "items", key)), 20000); return s.exists() ? s.data().data : null; }
async function pay(plan) {
  const fn = httpsCallable(getFunctions(fbApp, "asia-southeast1"), "createPayment");
  const r = await fn({ plan });
  location.href = r.data.redirect_url;
}
async function refresh() {
  const u = auth.currentUser; if (!u) return;
  const s = await getDoc(doc(db, "users", u.uid)); FB.access = (s.exists() && s.data().access) || {};
  for (const k in PAID) delete PAID[k];
  updNav(); route();
}
Object.assign(window.FB, { checkDevice, login, logout: logoutAll, err: e => errMap[e && e.code] || "Login gagal. Coba lagi.", inApp, adm, content, pay, refresh });

getRedirectResult(auth).catch(() => {});
// Kembali dari halaman pembayaran Midtrans: ?order_id=...&transaction_status=...
const qs = new URLSearchParams(location.search);
if (qs.get("order_id")) {
  const ok = ["settlement", "capture"].includes(qs.get("transaction_status"));
  history.replaceState(null, "", location.pathname + "#masuk");
  setTimeout(() => toast(ok ? "Pembayaran diterima! Paket aktif dalam beberapa detik." : "Pembayaran belum selesai. Kamu bisa coba lagi dari menu Harga."), 600);
  if (ok) { [4000, 10000, 20000].forEach(t => setTimeout(() => refresh().catch(() => {}), t)); }
}
onAuthStateChanged(auth, async user => {
  let profile = null;
  if (user) {
    try { profile = await T(ensureProfile(user)); } catch (e) { console.error(e); }
    try { if (!(await T(registerDevice(user)))) { await kicked(); return; } } catch (e) { console.error(e); }
  }
  for (const k in PAID) delete PAID[k];
  FB.ready = true; FB.failed = false; FB.user = user; FB.access = (profile && profile.access) || {};
  updNav();
  const r = (location.hash || "#home").slice(1);
  if (["masuk", "nihongo", "kaigo", "admin"].includes(r)) route();
});
</script>
