 ['content','logout','checkDevice','login','err','inApp'].forEach(k=>{if(F[k]!==undefined)NL[k]=F[k]});
 try{NL.acct&&NL.acct();NL.wm&&NL.wm()}catch(e){console.error(e)}
 if(NL._r){NL._r();NL._r=null;return}NL.onChange&&NL.onChange()};
NL.parse=v=>{let o=typeof v==='string'?JSON.parse(v):v;if(typeof o==='string')o=JSON.parse(o);if(!o||!Array.isArray(o.g))throw new Error('format materi tidak dikenali, unggah ulang file materi');return o};
NL.has=p=>{const a=NL.access||{},now=Date.now(),pre=p==='n'?'nihongo':'kaigo';return Object.keys(a).some(k=>k.startsWith(pre)&&a[k]&&a[k].until&&a[k].until.toDate&&a[k].until.toDate().getTime()>now)};
NL.esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

NL.tts={on:null,q:[],v:{}};
NL.pickVoices=()=>{try{const vs=speechSynthesis.getVoices();const f=l=>vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l)&&/google|natural|online|premium|enhanced/i.test(v.name))||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l));NL.tts.v={id:f('id'),ja:f('ja')}}catch(e){}};
if('speechSynthesis' in window){NL.pickVoices();speechSynthesis.onvoiceschanged=NL.pickVoices}
NL.split=t=>{const out=[];const re=/[぀-ヿ㐀-鿿０-ｚ々〜～ー・、。！？「」『』（）]+/g;let last=0,m;
 t=String(t||'').replace(/<[^>]+>/g,'');
 while((m=re.exec(t))){if(m.index>last)out.push({t:t.slice(last,m.index),l:'id'});out.push({t:m[0],l:'ja'});last=m.index+m[0].length}
 if(last<t.length)out.push({t:t.slice(last),l:'id'});
 return out.map(p=>({l:p.l,t:NL.clean(p.l,p.t)})).filter(p=>p.t&&/[\p{L}\p{N}]/u.test(p.t))};
NL.clean=(l,t)=>l==='ja'?String(t).replace(/[～〜「」『』（）—]/g,' ').trim():String(t).replace(/\s*\/\s*/g,' atau ').replace(/\s*=\s*/g,', artinya ').replace(/[~|→]/g,', ').replace(/\bV-/g,'kata kerja ').replace(/\bN(\d?)\b/g,'kata benda ').trim();
NL.stopSay=()=>{try{speechSynthesis.cancel()}catch(e){}if(NL.tts.au){NL.tts.au.pause();NL.tts.au=null}const b=NL.tts.on;NL.tts.on=null;if(b){b.classList.remove('on');const c=b.closest('.gc');if(c)c.classList.remove('speaking')}};
NL.say=(btn,parts,audio)=>{if(NL.tts.on===btn){NL.stopSay();return}NL.stopSay();
 const c=btn.closest('.gc');btn.classList.add('on');if(c)c.classList.add('speaking');NL.tts.on=btn;
 if(audio){const a=new Audio(audio);NL.tts.au=a;a.onended=a.onerror=()=>{if(NL.tts.on===btn)NL.stopSay()};a.play().catch(()=>NL.stopSay());return}
 if(!('speechSynthesis' in window)){NL.stopSay();alert('Browser ini belum mendukung suara. Coba buka di Chrome.');return}
 if(!NL.tts.v.ja&&!NL.tts.v.id)NL.pickVoices();
 const segs=parts.flatMap(p=>p.l?[{l:p.l,t:NL.clean(p.l,p.t),p:p.p}]:NL.split(p.t)).filter(p=>p.t);
 segs.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);const v=NL.tts.v[p.l];u.lang=p.l==='ja'?'ja-JP':'id-ID';if(v)u.voice=v;u.rate=p.l==='ja'?.85:1;if(p.p)u.pitch=p.p;
  if(i===segs.length-1)u.onend=()=>{if(NL.tts.on===btn)NL.stopSay()};speechSynthesis.speak(u)});
 if(!segs.length)NL.stopSay()};
addEventListener('hashchange',()=>NL.stopSay());

(()=>{let comp=false;document.addEventListener('compositionstart',()=>comp=true,true);
 document.addEventListener('input',e=>{if((e.isComposing||comp)&&e.target.matches&&e.target.matches('input[type=search]'))e.stopImmediatePropagation()},true);

/* ===== Motion seperti landing ===== */
NL.motion=()=>{const m=document.getElementById('main');if(!m)return;
 const h=m.querySelector('h1');if(h&&!h.dataset.hl){h.dataset.hl=1;const w=h.childNodes;for(const n of w){if(n.nodeType===3&&/N[1-5]/.test(n.nodeValue)){const t=n.nodeValue,i=t.search(/N[1-5]/),sp=document.createElement('span');sp.className='hlm';sp.textContent=t.substr(i,2);const rest=document.createTextNode(t.slice(i+2));n.nodeValue=t.slice(0,i);n.after(sp,rest);break}}}
 const els=[...m.querySelectorAll('.card,.gc,.vc,.act,.next,.stampwrap,.bab,.qcard,.route,.sotop')].filter(e=>!e.dataset.rv).slice(0,160);
 if(!els.length)return;const io=NL._io||(NL._io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');NL._io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'}):null);
 els.forEach((e,i)=>{e.dataset.rv=1;e.style.setProperty('--d',(i%8)*0.06+'s');e.classList.add('rv');if(io)io.observe(e);else e.classList.add('in')});
 setTimeout(()=>els.forEach(e=>e.classList.add('in')),2500)};
document.addEventListener('click',e=>{if(e.target.closest('.subtabs button,[data-c],[data-m],.lvp button,.sta'))setTimeout(NL.motion,0)});
(()=>{const b=document.createElement('div');b.id='nlbar';document.addEventListener('DOMContentLoaded',()=>document.body.prepend(b));
 addEventListener('scroll',()=>{const d=document.documentElement,mx=d.scrollHeight-innerHeight;b.style.width=(mx>0?scrollY/mx*100:0)+'%'},{passive:true})})();
NL.loginView=()=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=NL.failed?`<div class="card gate"><p class="lg">Login belum tersedia</p><p class="mut">Sistem login sedang bermasalah. Muat ulang halaman, atau kembali ke <a href="#home">situs NihongoLink</a>.</p></div>`:
  `<div class="card gate"><p class="lg">Masuk ke NihongoLink</p><p class="mut">Masuk dengan akun Google untuk mencoba preview materi N5–N1. Materi lengkap terbuka dengan paket NihongoLink.</p>${NL.kickedMsg?'<p class="mut" style="color:var(--red)">Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.</p>':''}${NL.inApp?`<p class="mut" style="border:2px dashed var(--gold);border-radius:14px;padding:10px;text-align:left"><b>Buka di Chrome atau Safari dulu.</b> Google tidak mengizinkan login dari browser Instagram/Facebook. Ketuk menu ⋯ lalu pilih "Buka di browser".</p>`:''}<button class="btn" id="nlg" style="margin-top:8px">Masuk dengan Google</button><p class="mut" id="nle"></p><p><a href="#home">← Kembali ke situs</a></p></div>`;
  const b=document.getElementById('nlg');if(b)b.onclick=async()=>{document.getElementById('nle').textContent='';try{await NL.login()}catch(e){document.getElementById('nle').textContent=NL.err?NL.err(e):'Login gagal.'}}};
NL.pvBar=d=>{const m=document.getElementById('main');if(!m)return;let e=document.getElementById('pvbar');
 if(!d||!d.preview){if(e)e.remove();return}
 if(!e){e=document.createElement('div');e.id='pvbar';m.parentNode.insertBefore(e,m)}
 const c=d.cnt||{};e.innerHTML=`<div><b>Mode preview ${NL.esc(d.lv)}</b><span>${d.empty?'Materi lengkap level ini belum diunggah.':`Contoh sebagian materi. Versi lengkap: ${c.g||'–'} pola bunpou, ${c.k||'–'} kanji, ${c.v||'–'} kosakata, ${c.q||'–'} soal.`}</span></div><a class="btn" href="#home" onclick="event.preventDefault();toHarga()">Buka semua materi</a>`};
NL.lockedView=d=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=`<div class="card gate"><div style="font-size:44px">🔒</div><p class="lg">Materi ${NL.esc(d.lv)}</p><p class="mut">${d.empty?'Materi level ini belum diunggah oleh admin.':d.error?'Materi belum bisa dimuat. Periksa koneksi lalu coba lagi.'+(d.msg?'<br><small style="opacity:.7">Detail: '+NL.esc(d.msg)+'</small>':''):d.kicked?'Akunmu baru saja dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan. Masuk lagi untuk melanjutkan.':'Level '+NL.esc(d.lv)+' terbuka dengan paket NihongoLink.'}</p>
  <div class="bar" style="justify-content:center">${d.empty||d.error||d.kicked?'<button class="btn" onclick="location.reload()">Coba lagi</button>':'<a class="btn" href="#home" onclick="event.preventDefault();toHarga()">Lihat paket</a>'}${d.lv!=='N5'?'<button class="btn o" id="ton5">Belajar N5</button>':'<a class="btn o" href="#home">Ke situs</a>'}</div></div>`;
  const b=document.getElementById('ton5');if(b)b.onclick=()=>{try{const S=JSON.parse(localStorage.getItem('nl_app_v1'))||{};S.lv='N5';localStorage.setItem('nl_app_v1',JSON.stringify(S))}catch(e){}location.hash='beranda';location.reload()}};
NL.wm=()=>{const el=document.getElementById('nlwm'),u=NL.user;if(!el)return;const on=!!u&&NL.has('n');el.classList.toggle('on',on);if(!on)return;
  const dark=matchMedia('(prefers-color-scheme: dark)').matches,c=dark?'rgba(255,255,255,.07)':'rgba(40,40,80,.08)',t=NL.esc((u.displayName?u.displayName+' · ':'')+u.email);
  el.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180"><text x="150" y="95" text-anchor="middle" transform="rotate(-24 150 90)" fill="${c}" font-family="sans-serif" font-size="13" font-weight="600">${t}</text></svg>`)}")`};
NL.acct=()=>{const b=document.getElementById('acc');if(!b)return;const u=NL.user;b.hidden=!u;if(u){b.textContent='Keluar';b.title='Masuk sebagai '+u.email}};
</script>
<script>const EMBED={"N5":{"lv":"N5","jp":"えぬご","cefr":"≈ A1","stats":[["±100","kanji"],["±800","kosakata"],["±80 pola","bunpou"],["3–4 bulan","lama belajar"]],"fokus":"Hiragana, katakana, kalimat です/ます, partikel dasar, bentuk て. Bisa membaca kalimat pendek tentang kehidupan sehari-hari.","tips":[["Pakai, jangan hanya hafal","Setiap pola bunpou baru wajib kamu pakai dalam 3 kalimat tentang hidupmu sendiri. Kalimat milikmu jauh lebih mudah diingat daripada contoh buku."],["Pengulangan berjarak (SRS)","Ulangi kosakata dan kanji tepat sebelum lupa: besok, 3 hari, 7 hari, 2 minggu. Pakai Anki atau tombol \"Sudah hafal\" di bagian kanji."],["Ingat aktif, bukan baca ulang","Tutup jawabannya lalu coba ingat. Usaha mengingat itulah yang menguatkan memori, bukan membaca berkali-kali."],["Kanji lewat kata","Belajar 食 bersama 食べます dan 食堂. Satu kanji, dua kata, satu kalimat. Bacaan on dan kun akan menempel dengan sendirinya."],["Shadowing setiap hari","Dengarkan audio pendek, tirukan dengan jeda setengah detik. Melatih telinga untuk choukai dan mulut untuk kaiwa sekaligus."],["Buku salah","Tulis setiap soal yang salah beserta alasannya. Sebelum ujian, buku inilah yang paling berharga, bukan buku teks."]],"weeks":[["Hiragana & katakana","Baca lancar 2×46 huruf, salam dasar."],["です & kata tunjuk","は/です/か, これ・この・ここ, の."],["Partikel & ます","を・に・で・へ・と, bentuk ます dan lampau."],["Ada & angka","あります/います, posisi, jam, harga."],["Kata sifat","い dan な, すき/じょうず, kalimat sifat lampau."],["Bentuk て (1)","てください, ています, てから."],["Bentuk て (2)","てもいい, てはいけない, ないでください, たり, から."],["Banding & tryout","より/いちばん, まえに/あとで, 2× tryout penuh."]],"sched":[["0–10","Ulang kartu SRS","Kanji dan kosakata yang jatuh tempo hari ini."],["10–25","1 pola bunpou baru","Baca rumus, tutup contoh, buat 3 kalimat sendiri."],["25–35","Shadowing","Audio 1–2 menit, ulangi 3 kali."],["35–50","10 soal latihan","Kerjakan dengan timer, catat yang salah di buku salah."],["50–60","Bicara 1 menit","Rekam dirimu memakai pola hari ini, dengarkan lagi."]],"g":[{"c":"Dasar","p":"～は～です","a":"A adalah B (kalimat sopan)","f":"N1 は N2 です","ex":"わたしは がくせいです。","rd":"watashi wa gakusei desu.","id":"Saya pelajar.","n":"Partikel は dibaca \"wa\", bukan \"ha\". Minna bab 1","x":"Pola paling dasar untuk memperkenalkan atau menjelaskan sesuatu: 「は」 menandai topik (yang dibicarakan), lalu 「です」 menutup kalimat dengan sopan, mirip \"adalah\".\nTopik bisa dihilangkan kalau sudah jelas dari konteks: 「がくせいです」 sudah berarti \"(saya) pelajar\". Ingat, です tidak dipakai untuk kata kerja.","m":"は = \"nah, soal ...\" (penunjuk topik), です = titik sopan di ujung. Topik は, isi です."},{"c":"Dasar","p":"～じゃありません","a":"bukan","f":"N じゃありません / ではありません","ex":"これは わたしの ほんじゃありません。","rd":"kore wa watashi no hon ja arimasen.","id":"Ini bukan buku saya.","n":"ではありません lebih formal; keduanya benar di soal. Minna bab 1","x":"Bentuk negatif dari です. 「じゃありません」 dipakai dalam percakapan, 「ではありません」 lebih formal dan sering muncul di tulisan.\nUntuk bentuk lampau negatif tambahkan でした: 「がくせいじゃありませんでした」 = \"dulu bukan pelajar\".","m":"じゃ ありません = \"jangan anggap begitu, bukan!\" Ujungnya ありません = tidak ada."},{"c":"Dasar","p":"～ですか","a":"kalimat tanya","f":"Kalimat + か","ex":"あなたは にほんじんですか。","rd":"anata wa nihonjin desu ka.","id":"Apakah Anda orang Jepang?","n":"Tidak perlu tanda tanya; か sudah membuat kalimat tanya. Minna bab 1","x":"Cukup tambahkan 「か」 di akhir kalimat sopan untuk mengubahnya jadi pertanyaan, dan nada suara dinaikkan di akhir.\nJawabannya: 「はい、そうです」 (ya, benar) atau 「いいえ、ちがいます」 (bukan). Untuk pertanyaan dengan kata tanya seperti なん atau だれ, jawab langsung isinya, bukan はい/いいえ.","m":"か = tanda tanya Jepang. Tinggal tempel か di belakang, nada naik."},{"c":"Partikel","p":"～の","a":"milik / keterangan benda","f":"N1 の N2","ex":"これは にほんごの ほんです。","rd":"kore wa nihongo no hon desu.","id":"Ini buku bahasa Jepang.","n":"Urutan terbalik dari bahasa Indonesia: \"buku bahasa Jepang\" = にほんご の ほん. Minna bab 1","x":"「の」 menghubungkan dua kata benda. Kata benda pertama menjelaskan yang kedua: pemilik, asal, bahan, atau jenis.\nUrutannya kebalikan bahasa Indonesia: 「わたしの かばん」 = \"tas saya\", 「にほんの くるま」 = \"mobil Jepang\". Kata benda kedua bisa dihilangkan kalau sudah jelas: 「これは わたしのです」 = \"ini punya saya\".","m":"の = \"punya\". Yang punya di depan, barangnya di belakang: わたし の ほん."},{"c":"Partikel","p":"～も","a":"juga","f":"N も","ex":"わたしも がくせいです。","rd":"watashi mo gakusei desu.","id":"Saya juga pelajar.","n":"も menggantikan は/が/を, jangan ditulis はも. Minna bab 1","x":"「も」 berarti \"juga\" dan menggantikan partikel は, が, atau を. Jadi jangan ditulis 「はも」 atau 「をも」.\nUntuk partikel lain, も ditaruh di belakangnya: 「にほんにも いきます」 = \"pergi ke Jepang juga\". Dalam kalimat negatif, も bisa berarti \"pun tidak\": 「なにも たべません」.","m":"も = \"mo juga\". Ganti は/が/を dengan も, jangan ditumpuk."},{"c":"Dasar","p":"これ・それ・あれ・どれ","a":"ini / itu / itu (jauh) / yang mana","f":"これ は N です","ex":"それは なんですか。","rd":"sore wa nan desu ka.","id":"Itu apa?","n":"これ berdiri sendiri; tidak boleh langsung diikuti kata benda. Minna bab 2","x":"Kata tunjuk yang berdiri sendiri sebagai kata benda. 「これ」 dekat pembicara, 「それ」 dekat lawan bicara, 「あれ」 jauh dari keduanya, 「どれ」 untuk bertanya \"yang mana\" (dari tiga pilihan atau lebih).\nKarena sudah berupa kata benda, これ langsung diikuti partikel: 「これは」, 「それを」.","m":"こ = dekat saya, そ = dekat kamu, あ = jauh dua-duanya, ど = tanya. Satu pola untuk semua kata tunjuk."}],"k":[{"k":"一","on":"イチ","kun":"ひと(つ)","m":"satu","w":"一つ","wr":"ひとつ","wm":"satu buah","c":"Angka & uang"},{"k":"七","on":"シチ","kun":"なな","m":"tujuh","w":"七時","wr":"しちじ","wm":"jam tujuh","c":"Angka & uang"},{"k":"万","on":"マン","kun":"-","m":"sepuluh ribu","w":"一万円","wr":"いちまんえん","wm":"10.000 yen","c":"Angka & uang"},{"k":"三","on":"サン","kun":"みっ(つ)","m":"tiga","w":"三月","wr":"さんがつ","wm":"Maret","c":"Angka & uang"},{"k":"上","on":"ジョウ","kun":"うえ","m":"atas","w":"上手","wr":"じょうず","wm":"pandai","c":"Arah & posisi"},{"k":"下","on":"カ・ゲ","kun":"した","m":"bawah","w":"下手","wr":"へた","wm":"tidak pandai","c":"Arah & posisi"},{"k":"中","on":"チュウ","kun":"なか","m":"tengah, dalam","w":"中国","wr":"ちゅうごく","wm":"Tiongkok","c":"Arah & posisi"},{"k":"九","on":"キュウ・ク","kun":"ここの(つ)","m":"sembilan","w":"九時","wr":"くじ","wm":"jam sembilan","c":"Angka & uang"},{"k":"二","on":"ニ","kun":"ふた(つ)","m":"dua","w":"二人","wr":"ふたり","wm":"dua orang","c":"Angka & uang"},{"k":"五","on":"ゴ","kun":"いつ(つ)","m":"lima","w":"五分","wr":"ごふん","wm":"lima menit","c":"Angka & uang"},{"k":"人","on":"ジン・ニン","kun":"ひと","m":"orang","w":"日本人","wr":"にほんじん","wm":"orang Jepang","c":"Orang & tubuh"},{"k":"今","on":"コン","kun":"いま","m":"sekarang","w":"今日","wr":"きょう","wm":"hari ini","c":"Hari & waktu"}],"v":{"Salam & ungkapan":[["おはようございます","","selamat pagi"],["こんにちは","","selamat siang"],["こんばんは","","selamat malam"],["ありがとうございます","","terima kasih"],["すみません","","maaf / permisi"],["いただきます","","(sebelum makan)"]],"Waktu":[["きょう","今日","hari ini"],["あした","明日","besok"],["きのう","昨日","kemarin"],["まいにち","毎日","setiap hari"],["あさ","朝","pagi"],["ひる","昼","siang"]]},"q":{"JLPT N5":[{"s":"Kosakata · bacaan kanji","q":"あしたは 雨です。","c":"Bagaimana cara membaca 雨?","o":["あめ","ゆき","かさ","くも"],"e":"雨 = あめ (hujan). ゆき = salju (雪), くも = awan (雲)."},{"s":"Kosakata · bacaan kanji","q":"毎日 にほんごを べんきょうします。","c":"Cara baca 毎日?","o":["まいにち","まいび","まいひ","めいにち"],"e":"毎日 = まいにち. Ingat juga 毎週 まいしゅう, 毎年 まいとし."},{"s":"Kosakata · penulisan","q":"この くるまは あたらしいです。","c":"Kanji untuk くるま?","o":["車","東","重","軍"],"e":"車 = くるま. 東 ひがし (timur), 重 berat, 軍 militer. Bentuknya mirip, perhatikan detail."}],"Mendengarkan N5":[{"s":"Tugas (transkrip)","q":"女：すみません、ジュースを 2本と パンを 1つ ください。\n男：はい。ジュースは 1本 120円、パンは 150円です。","c":"Berapa yang harus dibayar perempuan itu?","o":["390円","270円","240円","420円"],"e":"2 × 120 + 150 = 390 yen."},{"s":"Poin (transkrip)","q":"男：あした、何時に 会いましょうか。\n女：10時は どうですか。\n男：10時は ちょっと…。11時は どうですか。\n女：いいですよ。","c":"Jam berapa mereka bertemu besok?","o":["11時","10時","10時半","12時"],"e":"10時は ちょっと… = menolak ha ],["が","Objek すき・じょうず・わかる・ほしい・できる","わたしは うたが すきです。","Saya suka menyanyi."],["が","Subjek di dalam penjelas kata benda","ははが つくった りょうりです。","Ini masakan buatan ibu."],["が","Tetapi (penghubung kalimat)","この へやは ひろいですが、くらいです。","Kamar ini luas, tetapi gelap."]],"pq":[{"q":"きのう ともだち（　）えいがを みました。","o":["と","を","に","へ"],"e":"Bersama teman: と."},{"q":"わたしは まいばん 11じ（　）ねます。","o":["に","で","を","が"],"e":"Jam tertentu: に."},{"q":"この ペンは 100えん（　）かいました。","o":["で","に","を","と"],"e":"Harga/jumlah untuk membeli: で."}],"kaiwa":[["Perkenalan diri (じこしょうかい)","Wajib untuk wawancara kerja dan hari pertama di Jepang.",[["A","はじめまして。<u>アンディ</u>です。","hajimemashite. andi desu.","Senang berkenalan. Saya Andi."],["B","はじめまして。たなかです。","hajimemashite. tanaka desu.","Senang berkenalan. Saya Tanaka."],["A","<u>インドネシア</u>から きました。","indoneshia kara kimashita.","Saya datang dari Indonesia."],["B","そうですか。おしごとは？","sou desu ka. oshigoto wa?","Oh begitu. Pekerjaannya?"],["A","<u>かいご</u>の しごとを します。よろしく おねがいします。","kaigo no shigoto o shimasu. yoroshiku onegaishimasu.","Saya bekerja di bidang kaigo. Mohon bantuannya."]]]],"jft":{"ir":{"Starter (A1)":["","","名前国私","父母子日本"]},"jv":[["名前","なまえ","nama"],["氏名","しめい","nama lengkap"],["午前","ごぜん","pagi (a.m.)"],["国","くに","negara"],["国際交流","こくさいこうりゅう","pertukaran internasional"],["外国","がいこく","luar negeri"],["私","わたし","saya"],["父","ちち","ayah (sendiri)"],["お父さん","おとうさん","ayah (orang lain)"],["母","はは","ibu (sendiri)"],["お母さん","おかあさん","ibu (orang lain)"],["子ども","こども","anak"],["日本","にほん","Jepang"],["今日","きょう","hari ini"],["日本語","にほんご","bahasa Jepang"]],"hy":{"Salam harian":[["おはようございます","Selamat pagi","Sopan; kepada teman cukup おはよう."],["こんにちは","Selamat siang",""],["こんばんは","Selamat malam",""]],"Di tempat kerja":[["よろしくお願いします","Mohon bantuannya","Saat perkenalan atau meminta tolong."],["お疲れさまです","Salam sesama rekan kerja","Dipakai sepanjang hari kerja."],["お先に失礼します","Saya pulang duluan","Saat pulang lebih dulu dari rekan."]]},"pj":{"Bentuk kamus (V-る)":[["V-る と","kalau … (pasti)","このボタンを押すと、ドアが閉まります。","このボタンを おすと、ドアが しまります。","Kalau tombol ini ditekan, pintu tertutup."],["V-る つもりです","berencana","来年、日本へ行くつもりです。","らいねん、にほんへ いく つもりです。","Tahun depan saya berencana ke Jepang."],["V-る ことができます","bisa","日本語で電話をかけることができます。","にほんごで でんわを かける ことが できます。","Saya bisa menelepon dalam bahasa Jepang."]],"Bentuk ない":[["V-ない でください","tolong jangan","ここでたばこを吸わないでください。","ここで たばこを すわないで ください。","Tolong jangan merokok di sini."],["V-なければなりません","harus","毎日薬を飲まなければなりません。","まいにち くすりを のまなければ なりません。","Harus minum obat setiap hari. (informal: のまなきゃ)"],["V-なくてもいいです","tidak perlu","明日は来なくてもいいです。","あしたは こなくても いいです。","Besok tidak perlu datang."]]}},"ch":[{"t":"課題理解","i":"女の人と男の人が話しています。男の人はあした何を持っていきますか。","d":[["女","あしたのピクニック、お弁当はわたしが作りますね。"],["男","ありがとうございます。じゃあ、わたしは飲み物を持っていきます。"],["女","あ、飲み物は山田さんが持ってきますよ。"],["男","そうですか。じゃあ、くだものを持っていきます。"]],"q":"男の人はあした何を持っていきますか。","o":["くだもの","おべんとう","のみもの","おかし"],"e":"Awalnya mau bawa minuman, tapi Yamada yang bawa. Akhirnya buah (くだもの)."},{"t":"課題理解","i":"先生が学生に話しています。学生はあした何時までに教室に来ますか。","d":[["先生","あしたは8時半から試験です。でも、8時15分までに教室に来てください。遅れないでくださいね。"]],"q":"学生はあした何時までに教室に来ますか。","o":["8時15分","8時半","8時","8時45分"],"e":"Ujian mulai 8.30, tapi harus datang paling lambat 8.15 (までに)."}],"exam":[[["Kosakata",20],["Tata bahasa & membaca",40],["Mendengarkan",30]],80,"45"],"bk":[{"t":"1. Kenalan dulu dengan 3 golongan kata kerja","x":"Sebelum mengubah bentuk kata kerja, kamu perlu tahu dulu kata kerja itu masuk golongan mana. Anggap saja golongan itu seperti \"jenis kunci\": setiap golongan punya cara buka yang berbeda.\nKabar baiknya, cuma ada 3 golongan, dan golongan 3 isinya hanya 2 kata. Yang kamu lihat adalah bentuk kamus (bentuk dasar, selalu berakhiran bunyi -u).","rm":["Golongan 3: hanya する & くる (+ semua \"kata benda + する\")","Golongan 2: berakhiran る, dan bunyi sebelum る adalah -i atau -e (み・る, た・べ・る)","Golongan 1: semua sisanya"],"tb":[{"c":"Cara cepat menentukan golongan","h":["Langkah","Pertanyaan","Kalau ya →"],"r":[["1","Apakah kata kerjanya する atau くる?","Golongan 3"],["2","Apakah akhirnya bukan る? (う, く, ぐ, す, つ, ぬ, ぶ, む)","Golongan 1"],["3","Berakhiran る, tapi bunyi sebelumnya -a, -u, atau -o? (わかる, のる, とる)","Golongan 1"],["4","Berakhiran る dan bunyi sebelumnya -i atau -e? (みる, たべる)","Golongan 2 (cek dulu daftar \"si penyamar\" di bawah)"]]},{"c":"Contoh tiap golongan","h":["Golongan","Kata kerja","Romaji","Arti"],"r":[["1","かく","kaku","menulis"],["1","のむ","nomu","minum"],["1","かう","kau","membeli"],["1","まつ","matsu","menunggu"],["1","わかる","wakaru","mengerti"],["2","たべる","taberu","makan"],["2","みる","miru","melihat"],["2","おきる","okiru","bangun"],["2","ねる","neru","tidur"],["3","する","suru","melakukan"],["3","くる","kuru","datang"],["3","べんきょうする","benkyou suru","belajar"]]},{"c":"\"Si penyamar\": kelihatan golongan 2, ternyata golongan 1","h":["Kata kerja","Romaji","Arti","Bentuk ます (bukti golongan 1)"],"r":[["かえる (帰る)","kaeru","pulang","かえります"],["はいる (入る)","hairu","masuk","はいります"],["はしる (走る)","hashiru","berlari","はしります"],["しる (知る)","shiru","mengetahui","しります"],["きる (切る)","kiru","memotong","きります"],["いる (要る)","iru","perlu","いります"]]}],"n":"Hati-hati dengan kata yang bunyinya sama: きる (着る, memakai baju) itu golongan 2 → きます, tapi きる (切る, memotong) golongan 1 → きります. Begitu juga いる (ada) golongan 2, tapi いる (perlu) golongan 1."},{"t":"2. Rumus tangga あいうえお (kunci semua perubahan)","x":"Ini trik paling penting untuk golongan 1. Huruf terakhir kata kerja golongan 1 cukup \"naik-turun tangga\" di barisnya, dan setiap anak tangga dipakai untuk bentuk yang berbeda.\nContoh かく: huruf terakhirnya く, ada di baris か・き・く・け・こ. Mau bentuk ない? Turun ke か → かかない. Mau bentuk ます? Ke き → かきます. Gampang, kan?","rm":["あ → ない (tidak)","い → ます (sopan)","う → bentuk kamus","え → ば (kalau), potensial, perintah (dipelajari di N4)","お → う (ayo, dipelajari di N4)"],"tb":[{"c":"Satu kata kerja, lima anak tangga","h":["Anak tangga","かく","のむ","はなす","かう","Untuk bentuk"],"keep":true,"r":[["あ","かか","のま","はなさ","かわ ⚠","ない"],["い","かき","のみ","はなし","かい","ます"],["う","かく","のむ","はなす","かう","kamus"],["え","かけ","のめ","はなせ","かえ","ば・bisa・perintah"],["お","かこ","のも","はなそ","かお","ayo (〜う)"]]}],"n":"Kata kerja berakhiran う (かう, つかう, あう) di anak tangga あ berubah jadi わ, bukan あ: かわない, bukan かあない.\nGolongan 2 tidak perlu tangga: cukup buang る lalu tempel akhirannya (たべ + ない, たべ + ます)."}],"preview":true,"cnt":{"g":34,"k":80,"v":84,"q":56}},"N4":{"lv":"N4","jp":"えぬよん","cefr":"≈ A2","stats":[["±300","kanji"],["±1.500","kosakata"],["±130","pola bunpou"],["+5–6 bulan","setelah N5"]],"fokus":"Semua perubahan bentuk kata kerja (potensial, pasif, kausatif, bentuk maksud, bentuk ば), memberi-menerima, dugaan (そう・よう・らしい), dan dasar keigo. Target umum untuk Tokutei Ginou bersama JFT-Basic.","tips":[["Kuasai tabel bentuk dulu","80% kesalahan soal N4 berasal dari salah mengubah bentuk kata kerja. Latih tabel di bawah sampai bisa tanpa berpikir."],["Pisahkan pola yang mirip","そう (kelihatannya) vs そう (katanya), ために vs ように, ば vs たら vs と vs なら. Buat tabel perbandingan sendiri."],["Pasangan transitif-intransitif","開く/開ける, 消える/消す. Hafalkan berpasangan, karena soal ています vs てあります bergantung pada ini."],["Baca teks pendek setiap hari","Bacaan N4 berupa memo, email, dan pengumuman. Latih cari informasi: siapa, kapan, di mana, harus apa."],["Dengarkan percakapan kantor","Choukai N4 banyak situasi kerja dan toko. Dengarkan NHK Easy Japanese, lalu shadowing."],["Satu bab Minna II per 3 hari","Hari 1 kosakata dan pola, hari 2 latihan, hari 3 soal per bab di halaman ini."]],"weeks":[["Bab 26–30","んです, potensial, ながら, ています/てあります, ておきます"],["Bab 31–34","Bentuk maksud, つもり, でしょう/かもしれない, perintah, とおりに"],["Bab 35–38","Bentuk ば, なら, ように, pasif, のは/のが/のを"],["Bab 39–42","Sebab て/ので, か/かどうか, memberi-menerima sopan, ために"],["Bab 43–46","そう (kelihatannya), すぎる, やすい/にくい, 場合, ところ"],["Bab 47–50","そう (katanya), よう, kausatif, sonkeigo, kenjougo"],["Ulang & kanji","Ulangi semua pola yang salah, kejar 300 kanji"],["Tryout","2 kali tryout penuh dengan timer, analisis kesalahan"]],"g":[{"c":"Bentuk kata kerja","p":"Bentuk potensial","a":"bisa","f":"Gol I: く→ける / Gol II: る→られる / する→できる / くる→こられる","ex":"私は漢字が少し読めます。","rd":"わたしは かんじが すこし よめます。","id":"Saya bisa sedikit membaca kanji.","n":"Objek biasanya memakai が. Minna bab 27.","x":"Bentuk potensial menyatakan kemampuan atau kemungkinan: \"bisa ...\". Objek yang tadinya memakai を biasanya berubah menjadi 「が」: 「漢字が読めます」.\nUntuk する cukup pakai できる. Dalam percakapan santai, kelompok II sering disingkat jadi 「食べれる」 (ら抜き), tapi di ujian pakai bentuk baku 「食べられる」.","m":"Potensial = naik ke baris え: かく → かける. Gol II: tambah られる."},{"c":"Bentuk kata kerja","p":"見えます・聞こえます","a":"terlihat / terdengar (alami)","f":"N が 見えます / 聞こえます","ex":"窓から海が見えます。","rd":"まどから うみが みえます。","id":"Dari jendela terlihat laut.","n":"見られます = bisa melihat karena ada kesempatan. Bab 27.","x":"「見えます」 dan 「聞こえます」 berarti sesuatu terlihat atau terdengar dengan sendirinya, tanpa usaha. Yang terlihat ditandai が.\nBedakan dengan 「見られます」 = bisa melihat karena ada kesempatan atau fasilitas: 「この映画は家で見られます」.","m":"見える・聞こえる = terjadi sendiri, mata dan telinga yang \"menangkap\". Benda pakai が."},{"c":"Penjelasan","p":"～んです","a":"menjelaskan / menanyakan alasan","f":"Bentuk biasa + んです (N/Adj な + なんです)","ex":"どうしたんですか。—頭が痛いんです。","rd":"どうしたんですか。—あたまが いたいんです。","id":"Kenapa? —Kepala saya sakit.","n":"Jangan berlebihan, bisa terdengar menuntut. Bab 26.","x":"「んです」 dipakai untuk menjelaskan keadaan atau menanyakan alasan dengan nada ingin tahu: 「どうしたんですか」 = ada apa?\nSaat menjawab, んです memberi penjelasan latar belakang. Pola 「〜んですが、〜」 juga dipakai sebagai pembuka sebelum meminta tolong.","m":"んです = \"nah, begini ceritanya\". Penjelasan atau tanya alasan dengan rasa ingin tahu."},{"c":"Permintaan","p":"～ていただけませんか","a":"bisakah Anda … (sangat sopan)","f":"V-て いただけませんか","ex":"日本語を教えていただけませんか。","rd":"にほんごを おしえて いただけませんか。","id":"Bisakah Anda mengajari saya bahasa Jepang?","n":"Lebih sopan dari ～てください. Bab 26.","x":"Bentuk て + 「いただけませんか」 adalah cara meminta tolong yang sangat sopan, cocok untuk guru, atasan, atau orang yang belum dikenal.\nUrutan kesopanan: 〜てください < 〜てくださいませんか < 〜ていただけませんか.","m":"ていただけませんか = \"bisakah saya menerima bantuan Anda?\" Paling sopan untuk minta tolong."},{"c":"Permintaan","p":"～たらいいですか","a":"sebaiknya bagaimana","f":"Kata tanya + V-たら いいですか","ex":"どこで切符を買ったらいいですか。","rd":"どこで きっぷを かったら いいですか。","id":"Sebaiknya beli tiket di mana?","n":"Bab 26.","x":"Dipakai untuk meminta saran atau petunjuk: \"sebaiknya saya ... bagaimana / di mana / apa?\". Selalu diawali kata tanya.\nPola ini sering dipakai bersama 〜んですが: 「日本語を勉強したいんですが、どうしたらいいですか」.","m":"Kata tanya + たら いいですか = \"kalau saya ..., oke nggak?\" → minta saran."},{"c":"Waktu & urutan","p":"～ながら","a":"sambil","f":"V-ます + ながら","ex":"歌を歌いながら、料理を作ります。","rd":"うたを うたいながら、りょうりを つくります。","id":"Memasak sambil bernyanyi.","n":"Kegiatan utama di belakang. Bab 28.","x":"「ながら」 menyatakan dua kegiatan dilakukan bersamaan oleh orang yang sama. Kegiatan utama ditaruh di belakang, yang sampingan di depan.\nBisa juga untuk keadaan jangka panjang: 「働きながら、大学に通っています」 = kuliah sambil bekerja.","m":"ながら = \"sambil\". Yang utama di belakang (makan sambil nonton TV → nonton sampingan)."}],"k":[{"k":"不","on":"フ","kun":"-","m":"tidak","w":"不便","wr":"ふべん","wm":"tidak praktis"},{"k":"世","on":"セ","kun":"よ","m":"dunia","w":"世話","wr":"せわ","wm":"mengurus"},{"k":"主","on":"シュ","kun":"ぬし","m":"utama","w":"主人","wr":"しゅじん","wm":"suami"},{"k":"事","on":"ジ","kun":"こと","m":"hal","w":"食事","wr":"しょくじ","wm":"makan"},{"k":"京","on":"キョウ","kun":"-","m":"ibu kota","w":"東京","wr":"とうきょう","wm":"Tokyo"},{"k":"仕","on":"シ","kun":"つか(える)","m":"melayani","w":"仕事","wr":"しごと","wm":"pekerjaan"},{"k":"代","on":"ダイ","kun":"か(わる)","m":"ganti, biaya","w":"電気代","wr":"でんきだい","wm":"biaya listrik"},{"k":"以","on":"イ","kun":"-","m":"sejak, dengan","w":"以上","wr":"いじょう","wm":"… ke atas"},{"k":"会","on":"カイ","kun":"あ(う)","m":"bertemu","w":"会います","wr":"あいます","wm":"bertemu","c":"Tempat & benda"},{"k":"住","on":"ジュウ","kun":"す(む)","m":"tinggal","w":"住所","wr":"じゅうしょ","wm":"alamat"},{"k":"体","on":"タイ","kun":"からだ","m":"badan","w":"体","wr":"からだ","wm":"badan"},{"k":"作","on":"サク","kun":"つく(る)","m":"membuat","w":"作文","wr":"さくぶん","wm":"karangan"}],"v":{"Pasangan 自・他 (intransitif/transitif)":[["あく / あける","開く / 開ける","terbuka / membuka"],["しまる / しめる","閉まる / 閉める","tertutup / menutup"],["つく / つける","つく / つける","menyala / menyalakan"],["きえる / けす","消える / 消す","padam / mematikan"],["はじまる / はじめる","始まる / 始める","dimulai / memulai"],["とまる / とめる","止まる / 止める","berhenti / menghentikan"]],"Kerja & kantor":[["しゅっちょう","出張","dinas luar"],["かいぎ","会議","rapat"],["しりょう","資料","dokumen, bahan"],["ざんぎょう","残業","lembur"],["きゅうりょう","給料","gaji"],["ぶちょう","部長","kepala bagian"]]},"q":{"Mendengarkan (transkrip)":[{"s":"Tugas (課題理解)","q":"男：すみません、この荷物を送りたいんですが。\n女：はい、では、この紙に住所と名前を書いてください。それから、あちらの窓口でお金を払ってください。","c":"Apa yang pertama harus dilakukan pria itu?","o":["Menulis alamat dan nama di kertas","Membayar di loket","Menimbang barang","Menelepon penerima"],"e":"Urutannya: tulis dulu (書いてください), baru bayar (それから)."},{"s":"Poin (ポイント理解)","q":"女：田中さん、どうして昨日会社を休んだんですか。\n男：子どもが熱を出したんです。私は元気ですよ。","c":"Mengapa Tanaka tidak masuk kerja?","o":["Anaknya demam","Dia sendiri sakit","Ada urusan di bank","Kesiangan"],"e":"子どもが熱を出した. 私は元気 = dia sendiri sehat."},{"s":"Ungkapan (発話表現)","q":"Anda ingin meminjam pena teman.","c":"Apa yang Anda katakan?","o":["ペンを貸してもらえませんか","ペンを貸してあげましょうか","ペンを借りてください","ペンをどうぞ"],"e":"Meminjam: 貸してもらえませんか."}],"Kosakata":[{"s":"Bacaan kanji","q":"この 部屋は とても 明るいです。","c":"Cara baca 部屋?","o":["へや","ぶや","へいや","ぶおく"],"e":"部屋 = へや (bacaan khusus)."},{"s":"Bacaan kanji","q":"来週、大阪へ 出張します。","c":"Cara baca 出張?","o":["しゅっちょう","しゅつちょう","でちょう","しゅっぱり"],"e":"出張 = しゅっちょう, dinas luar kota."},{"s":"Bacaan kanji","q":"この 荷物は 重いです。","c":"Cara baca 重い?","o":["おもい","かるい","おおい","あつい"],"e":"重い = berat. 軽い (かるい) = ringan."}],"Tata bahasa":[{"s":"Bentuk","q":"日本語が 話せる（　）なりました。","c":"","o":["ように","ために","そうに","ことに"],"e":"Perubahan k tap paling gampang: buang る, lalu tempel akhirannya (たべ + られる / れば / ろ / よう / させる)."},{"t":"2. Bentuk potensial: \"bisa\"","x":"Dipakai untuk bilang kamu bisa atau mampu melakukan sesuatu, atau sesuatu bisa dilakukan di suatu tempat.\nSetelah berubah, hasilnya menjadi kata kerja golongan 2 baru. Jadi 書ける bisa diubah lagi jadi 書けます, 書けない, 書けた.","fn":["Kemampuan: 日本語が話せます (saya bisa bahasa Jepang)","Kemungkinan: ここで Wi-Fi が使えます (di sini bisa pakai Wi-Fi)"],"rm":["Golongan 1: naik ke anak tangga え + る","Golongan 2: buang る + られる","する → できる, 来る → 来られる (こられる)","Objek biasanya pindah dari を ke が"],"tb":[{"c":"Cara membuat bentuk potensial","h":["Kata kerja","Gol","Caranya","Hasil"],"r":[["書く (menulis)","1","く → け + る","書ける (kakeru)"],["飲む (minum)","1","む → め + る","飲める (nomeru)"],["話す (bicara)","1","す → せ + る","話せる (hanaseru)"],["買う (membeli)","1","う → え + る","買える (kaeru)"],["食べる (makan)","2","る → られる","食べられる (taberareru)"],["見る (melihat)","2","る → られる","見られる (mirareru)"],["する (melakukan)","3","hafalan","できる (dekiru)"],["来る (datang)","3","hafalan","来られる (korareru)"]]}],"ex":[["わたしは 漢字が 書けます。","watashi wa kanji ga kakemasu.","Saya bisa menulis kanji."],["あした 来られますか。","ashita koraremasu ka.","Besok bisa datang?"]],"n":"Dalam obrolan, orang Jepang sering bilang 食べれる atau 見れる (ら dibuang). Boleh dipahami, tapi di ujian pakai bentuk baku 食べられる."}],"kaiwa":[["Menelepon izin sakit","Menghubungi atasan sebelum jam kerja.",[["A","もしもし、<u>アンディ</u>です。おはようございます。","moshimoshi, andi desu. ohayou gozaimasu.","Halo, ini Andi. Selamat pagi."],["B","ああ、アンディさん。どうしたんですか。","aa, andi-san. doushita n desu ka.","Oh, Andi. Ada apa?"],["A","実は、<u>熱が38度</u>あるんです。","jitsu wa, netsu ga sanjuuhachi-do aru n desu.","Sebenarnya, saya demam 38 derajat."],["A","申し訳ありませんが、今日は休ませていただけませんか。","moushiwake arimasen ga, kyou wa yasumasete itadakemasen ka.","Mohon maaf, bolehkah saya izin libur hari ini?"],["B","わかりました。病院に行ったほうがいいですよ。","wakarimashita. byouin ni itta hou ga ii desu yo.","Baik. Sebaiknya pergi ke rumah sakit."],["A","はい、そうします。ご迷惑をおかけして、すみません。","hai, sou shimasu. gomeiwaku o okake shite, sumimasen.","Baik, akan saya lakukan. Maaf merepotkan."]]]],"preview":true,"cnt":{"g":67,"k":167,"v":90,"q":40}},"N3":{"lv":"N3","jp":"えぬさん","cefr":"≈ B1","stats":[["±650","kanji"],["±3.700","kosakata"],["±180","pola bunpou"],["+8–10 bulan","setelah N4"]],"fokus":"Jembatan dari bahasa buku ke bahasa asli: pola dugaan (はず・わけ・に違いない), sebab-akibat (おかげで・せいで), sudut pandang (にとって・によって), dan membaca teks yang lebih panjang. Skor membaca kini dinilai terpisah.","tips":[["Membaca adalah kunci","Mulai N3, membaca dinilai terpisah (minimal 19/60). Baca satu artikel pendek per hari, misalnya NHK News Web Easy."],["Kelompokkan pola yang mirip","はず / わけ / に違いない, おかげで / せいで, ことにする / ことになる. Buat tabel perbedaannya sendiri."],["Kosakata lewat kata majemuk","Soal N3 memakai kata seperti 確認, 報告, 担当. Pelajari kanji lewat kata, bukan kanji tunggal."],["Kata keterangan","Soal konteks sering memakai うっかり, すっかり, そろそろ, わざわざ. Hafalkan dengan contoh kalimat."],["Choukai: tangkap intinya","Ada soal inti cerita (概要理解). Latih merangkum audio 1 menit dalam satu kalimat bahasa Indonesia."],["Satu buku seri","Nihongo Sou Matome N3 (ada di Drive Anda): 6 minggu per buku, 1–2 halaman per hari."]],"weeks":[["Waktu & proses","うちに, 最中に, とたん, 次第, たびに, 一方だ, につれて"],["Sebab & dugaan","おかげで, せいで, はず, に違いない, わけだ, ような気がする"],["Syarat & penekanan","たとえ～ても, さえ～ば, ばかり, こそ, ほど～ない"],["Sudut pandang","について, に対して, にとって, によって, として, をもとに"],["Tindakan & keadaan","ことにする/なる, ふり, まま, っぱなし, かけ, きる"],["Kontras & kutipan","くせに, わりに, ながらも, というより, っけ, んだって"],["Membaca intensif","2 bacaan per hari, catat kosakata baru"],["Tryout","2 kali tryout penuh, analisis per bagian"]],"g":[{"c":"Waktu & proses","p":"～うちに","a":"selagi / sebelum keadaan berubah","f":"V-る・V-ている・V-ない / Adj / N の + うちに","ex":"若いうちに、いろいろな国へ行きたい。","rd":"わかい うちに、いろいろな くにへ いきたい。","id":"Selagi muda, saya ingin pergi ke banyak negara.","n":"Sering: 忘れないうちに, 暗くならないうちに.","x":"「うちに」 berarti melakukan sesuatu selagi keadaan masih ada, karena nanti akan sulit atau terlambat: selagi masih muda, selagi panas.\nDengan bentuk ない artinya \"sebelum ... (terjadi)\": 「暗くならないうちに帰りましょう」. Bisa juga berarti \"tanpa sadar, selama ...\": 「話しているうちに、仲良くなった」.","m":"うち = \"di dalam\" waktu: selagi masih di dalam keadaan itu, cepat lakukan."},{"c":"Waktu & proses","p":"～最中に","a":"tepat di tengah-tengah","f":"V-ている / N の + さいちゅうに","ex":"会議の最中に、電話が鳴った。","rd":"かいぎの さいちゅうに、でんわが なった。","id":"Di tengah rapat, telepon berbunyi.","n":"Biasanya ada gangguan yang terjadi.","x":"「最中に」 berarti tepat di tengah-tengah kegiatan, dan biasanya diikuti kejadian yang mengganggu atau tidak terduga.\nContoh: 「会議の最中に電話が鳴った」. Nuansanya lebih kuat daripada 〜ている間に.","m":"最中 = 最 (paling) + 中 (tengah): tepat di tengah-tengah, lalu ada gangguan."},{"c":"Waktu & proses","p":"～たとたん(に)","a":"begitu … langsung (tak terduga)","f":"V-た + とたん","ex":"窓を開けたとたん、強い風が入ってきた。","rd":"まどを あけた とたん、つよい かぜが はいって きた。","id":"Begitu jendela dibuka, angin kencang masuk.","n":"Kalimat belakang bukan kehendak pembicara.","x":"「たとたん」 berarti \"begitu A terjadi, langsung B\", dan B adalah kejadian tak terduga atau di luar kendali pembicara.\nKarena itu kalimat belakang tidak boleh berupa kehendak, ajakan, atau perintah. Untuk itu pakai 〜たらすぐ.","m":"とたん = \"tan!\" bunyi kaget. Begitu A, \"tan!\" langsung B tak terduga."},{"c":"Waktu & proses","p":"～次第","a":"segera setelah","f":"V-ます + しだい","ex":"家に着き次第、連絡します。","rd":"いえに つき しだい、れんらくします。","id":"Begitu sampai rumah, saya kabari.","n":"Juga: N 次第 = tergantung N (努力次第).","x":"「次第」 setelah bentuk ます berarti \"segera setelah ... selesai\", dipakai di situasi formal seperti bisnis.\nKalimat belakang biasanya rencana atau permintaan: 「わかり次第、連絡します」. Setelah kata benda, 次第 berarti \"tergantung\": 「天気次第」.","m":"次第 = \"urutan berikutnya\": selesai A, langsung urutan B (gaya bisnis)."},{"c":"Waktu & proses","p":"～たびに","a":"setiap kali","f":"V-る / N の + たびに","ex":"この歌を聞くたびに、国を思い出す。", alam 3 kalimat"],["Tryout","2 kali tryout penuh dengan timer ketat"]],"g":[{"c":"Waktu & proses","p":"～うえで","a":"setelah (sebagai dasar)","f":"V-た / N の + うえで","ex":"両親と相談したうえで、決めます。","rd":"りょうしんと そうだん した うえで、きめます。","id":"Saya akan memutuskan setelah berdiskusi dengan orang tua.","n":"V-る うえで = dalam hal ….","x":"「たうえで」 berarti \"setelah melakukan A (sebagai dasar), baru B\". A adalah langkah yang harus diselesaikan dulu sebelum mengambil keputusan.\nContoh: 「よく考えたうえで決めます」. Pola 「V-るうえで」 berarti \"dalam hal / untuk ...\": 「生活するうえで大切なこと」.","m":"上 = \"di atas\" dasar A, baru bangun keputusan B."},{"c":"Waktu & proses","p":"～際(に)","a":"pada saat (formal)","f":"V-る / V-た / N の + さいに","ex":"お降りの際は、お忘れ物のないようご注意ください。","rd":"おおりの さいは、おわすれものの ない よう ごちゅうい ください。","id":"Saat turun, mohon pastikan tidak ada barang tertinggal.","n":"Sering di pengumuman.","x":"「際に」 berarti \"pada saat\", lebih formal daripada 〜時に. Sering muncul di pengumuman, panduan, dan surat resmi.\nContoh: 「お降りの際は、足元にご注意ください」.","m":"際 = \"tepi, momen\" (際どい = mepet). Versi formal 時."},{"c":"Waktu & proses","p":"～かと思うと","a":"baru saja … langsung","f":"V-た + かと おもうと","ex":"空が暗くなったかと思うと、急に雨が降り出した。","rd":"そらが くらく なったかと おもうと、きゅうに あめが ふりだした。","id":"Baru saja langit gelap, tiba-tiba hujan turun.","n":"Untuk orang lain/kejadian, bukan diri sendiri.","x":"「かと思うと」 berarti \"baru saja A, langsung B\", untuk perubahan cepat yang mengejutkan.\nDipakai untuk orang lain atau kejadian, bukan perbuatan diri sendiri. Versi lain: 「〜かと思ったら」.","m":"かと思うと = \"baru saja kupikir A, eh sudah B\"."},{"c":"Waktu & proses","p":"～て以来","a":"sejak","f":"V-て + いらい","ex":"日本に来て以来、一度も国に帰っていない。","rd":"にほんに きて いらい、いちども くにに かえって いない。","id":"Sejak datang ke Jepang, saya belum sekali pun pulang.","n":"","x":"「て以来」 berarti \"sejak A, keadaan B terus berlanjut sampai sekarang\".\nKalimat belakang menyatakan keadaan yang berlangsung lama, bukan kejadian sekali. Contoh: 「日本に来て以来、ずっとこの町に住んでいる」.","m":"以来 = 以 (sejak) + 来 (datang): sejak itu sampai sekarang."},{"c":"Waktu & proses","p":"～に先立って","a":"sebelum (resmi)","f":"N / V-る + に さきだって","ex":"開会に先立って、社長があいさつした。","rd":"かいかいに さきだって、しゃちょうが あいさつした。","id":"Sebelum pembukaan, direktur memberi sambutan.","n":"","x":"「に先立って」 berarti \"sebelum\" sesuatu yang resmi atau penting, seperti upacara, rapat, atau peluncuran.\nKalimat belakang adalah persiapan untuk acara itu: 「開会に先立って、市長があいさつした」.","m":"先立つ = \"berdiri lebih dulu\" (先 = depan) sebelum acara resmi."},{"c":"Waktu & proses","p":"～をきっかけに","a":"berawal dari","f":"N + を きっかけに","ex":"留学をきっかけに、料理を始めた。","rd":"りゅうがくを きっかけに、りょうりを はじめた。","id":"Berawal dari kuliah di luar negeri, saya mulai memasak.","n":"","x":"「をきっかけに」 berarti \"berawal dari\" suatu kejadian yang menjadi pemicu perubahan.\nContoh: 「入院をきっかけに、介護の仕事に興味を持った」. Versi lain: 「をきっかけとして」.","m":"きっかけ = \"pemicu\": kejadian kecil yang menyalakan perubahan."}],"k":[{"k":"並","on":"ヘイ","kun":"なら(ぶ)、なみ","m":"berjajar, biasa","w":"並ぶ","wr":"ならぶ","wm":"berbaris"},{"k":"丸","on":"ガン","kun":"まる(い)","m":"bulat","w":"丸い","wr":"まるい","wm":"bundar"},{"k":"久","on":"キュウ、ク","kun":"ひさ(しい)","m":"lama","w":"久しぶり","wr":"ひさしぶり","wm":"lama tak jumpa"},{"k":"乱","on":"ラン","kun":"みだ(れる)","m":"kacau","w":"混乱","wr":"こんらん","wm":"kekacauan"},{"k":"乳","on":"ニュウ","kun":"ちち","m":"susu","w":"牛乳","wr":"ぎゅうにゅう","wm":"susu sapi"},{"k":"乾","on":"カン","kun":"かわ(く)","m":"kering","w":"乾く","wr":"かわく","wm":"mengering"},{"k":"了","on":"リョウ","kun":"-","m":"selesai","w":"終了","wr":"しゅうりょう","wm":"berakhir"},{"k":"介","on":"カイ","kun":"-","m":"perantara","w":"紹介","wr":"しょうかい","wm":"perkenalan"},{"k":"仏","on":"ブツ","kun":"ほとけ","m":"Buddha; Prancis","w":"仏教","wr":"ぶっきょう","wm":"agama Buddha"},{"k":"令","on":"レイ","kun":"-","m":"perintah","w":"命令","wr":"めいれい","wm":"perintah"},{"k":"仲","on":"チュウ","kun":"なか","m":"hubungan","w":"仲間","wr":"なかま","wm":"kawan"},{"k":"伸","on":"シン","kun":"の(びる)","m":"memanjang","w":"伸びる","wr":"のびる","wm":"tumbuh, memanjang"}],"v":{"Bisnis":[["うちあわせ","打ち合わせ","rapat koordinasi"],["みつもり","見積もり","penawaran harga"],["とりひきさき","取引先","mitra bisnis"],["のうき","納期","tenggat pengiriman"],["たんとうしゃ","担当者","penanggung jawab"],["けんとう","検討","pertimbangan"]],"Berita & masyarakat":[["しょうしこうれいか","少子高齢化","penurunan kelahiran & penuaan penduduk"],["けいき","景気","kondisi ekonomi"],["ぶっか","物価","harga barang"],["こよう","雇用","lapangan kerja"],["さいがい","災害","bencana"],["ひがい","被害","kerugian, korban"]]},"q":{"Mendengarkan (transkrip)":[{"s":"Tugas (課題理解)","q":"男：新商品のアンケート、集計は終わった？\n女：はい、終わりました。結果をグラフにして、部長にメールで送ればいいですか。\n男：いや、部長は明日まで出張だから、まず僕に見せて。それから会議用の資料にまとめよう。","c":"Apa yang harus dilakukan perempuan itu selanjutnya?","o":["Menunjukkan hasilnya kepada pria itu","Mengirim email ke manajer","Menyelesaikan rekap survei","Membuat bahan rapat sendiri"],"e":"まず僕に見せて = tunjukkan ke saya dulu."},{"s":"Poin (ポイント理解)","q":"女：最近、自転車通勤を始めたんですって？\n男：ええ。健康のためと思われがちなんですが、実は満員電車がどうしても苦手で。運動になるのはおまけみたいなものです。","c":"Apa alasan utama pria itu bersepeda ke kantor?","o":["Tidak tahan kereta yang penuh sesak","Demi kesehatan","Menghemat ongkos","Lebih cepat sampai"],"e":"実は = alasan sebenarnya. Kesehatan hanya \"bonus\"."},{"s":"Tanggapan cepat (即時応答)","q":"「お忙しいところ恐縮ですが、少々お時間よろしいでしょうか。」","c":"Jawaban yang tepat?","o":["ええ、どうぞ。何でしょうか","はい、忙しいところです","いいえ、恐縮しません","お時間をください"],"e":"Mempersilakan lawan bicara menyampaikan maksud."}],"Kosakata":[{"s":"Bacaan kanji","q":"新しい 取引先と 契約を 結んだ。","c":"Cara baca 契約?","o":["けいやく","けやく","けいあく","きやく"],"e":"契約 = kontrak."},{"s":"Bacaan kanji","q":"その 件は 社内で 検討します。","c":"Cara baca 検討?","o":["けんとう","けんど","けいとう","けんたう"],"e":"検討 = mempertimbangkan."},{"s":"Bacaan kanji","q":"まず 現状を 把握する ことが 大切だ。","c":"Cara baca 把握?","o":["はあく","はおく","ばあく","ひあく"],"e":"把握 = memahami situasi."}],"Tata bahasa":[{"s":"","q":"両親と 相談した（　）、決めます。","c":"","o":["うえで","あまり","ものの","ばかりに"],"e":"Setelah (sebagai dasar): V-た うえで."},{"s":"","q":"約束した（　）、守らなければ ならない。","c":"","o":["以上","反面","ものの","どころか"],"e":"Karena sudah: 以上."},{"s":"","q":"緊張の（　）、何も 話せなかった。","c":"","o":["あまり","うえで","ばかり","かぎり"],"e":"Karena terlalu: N の あまり."}],"Membaca":[{"s":"Email bisnis","q":"件名：打ち合わせ日程の変更について\n株式会社ABC 田中様\nいつもお世話になっております。NLシステムの佐藤です。\n来週15日（火）に予定しておりました打ち合わせですが、弊社の都合により、17日（木）の同じ時間に変更させていただけないでしょうか。\nご都合が悪い場合は、ご希望の日時をお知らせください。\nお手数をおかけしますが、よろしくお願いいたします。","c":"Apa tujuan email ini?","o":["Meminta jadwal rapat dipindah ke tanggal 17","Membatalkan rapat","Mengundang rapat baru","Meminta maaf karena terlambat"],"e":"変更させていただけないでしょうか = meminta izin mengubah jadwal."},{"s":"Email bisnis","q":"(email yang sama)\nJika Tanaka tidak bisa tanggal 17, apa yang diminta?","c":"","o":["Memberi tahu tanggal dan jam yang diinginkan","Tetap datang tanggal 15","Menelepon Sato","Membatalkan kontrak"],"e":"ご希望の日時をお知らせください."},{"s":"Opini","q":"最近、在宅勤務が広がっている。通勤時間がなくなり、自由な時間が増えるという利点がある反面、同僚と直接話す機会が減り、孤独を感じる人も少なくない。大切なのは、働き方を一つに決めることではなく、仕事の内容に応じて選べるようにすることだろう。","c":"Menurut penulis, yang penting adalah …","o":["bisa memilih cara kerja sesuai jenis pekerjaan","semua orang bekerja dari rumah","semua orang kembali ke kantor","mengurangi jam kerja"],"e":"仕事の内容に応じて選べるようにすること."}]},"ch":[{"t":"課題理解","i":"会社で女の人と男の人が話しています。男の人はこのあと何をしますか。","d":[["女","吉田さん、来週のプレゼンの資料、見せてもらったけど、内容はいいと思う。ただ、グラフが多すぎて、ポイントが伝わりにくいかな。"],["男","そうですか。じゃあ、グラフを減らします。"],["女","減らすっていうより、一番伝えたいデータを一つ選んで、大きく見せたらどう？あと、最後のまとめのページは今のままでいいよ。"],["男","わかりました。じゃあ、そこを直してから、もう一度見ていただけますか。"]],"q":"男の人はこのあと何をしますか。","o":["伝えたいデータを選んでグラフを大きくする","グラフを全部削除する","まとめのページを書き直す","プレゼンの練習をする"],"e":"減らすっていうより = bukan sekadar mengurangi, tapi pilih satu data dan tampilkan besar."},{"t":"課題理解","i":"大学で事務の人と学生が話しています。学生はこのあと何をしなければなりませんか。","d":[["学生","奨学金の申請をしたいんですが。"],["事務","申請書と成績証明書が必要です。それから、推薦状も要りますね。"],["学生","成績証明書は持ってきました。推薦状は先生にお願いしてあって、明日いただける予定です。"],["事務","では、申請書はこちらで書いていってください。推薦状は締め切りの金曜日までに出してもらえれば大丈夫です。"]],"q":"学生はこのあと何をしなければなりませんか。","o":["ここで申請書を書く","成績証明書を取りに行く","先生に推薦状をお願いする","金曜日にもう一度来て申請書を書く"],"e":"こちらで書いていって = tulis di sini sebelum pergi."}],"exam":[[["Kosakata, tata bahasa & membaca",105],["Mendengarkan",50]],90,"13"],"bk":[{"t":"1. Gaya tulisan である: membaca artikel tanpa kaget","x":"Bacaan N2 seperti artikel, opini, dan laporan memakai gaya tulis. Tidak ada です・ます, dan beberapa sambungan berubah wajah. Isinya sama saja, hanya \"bajunya\" lebih formal.\nKalau kamu hafal padanannya, membaca jadi jauh lebih cepat.","tb":[{"c":"Gaya ngobrol → gaya tulisan","h":["Ngobrol","Tulisan","Contoh"],"r":[["〜です / 〜だ","〜である","重要である (adalah penting)"],["〜ではありません","〜ではない","簡単ではない"],["〜でした","〜であった","問題であった"],["〜て、 (lalu)","ます-stem、","調べて、→ 調べ、"],["〜ていて、","〜ており、","増えており、"],["〜なくて / 〜ないで","〜ず、","わからず、"],["〜くて、","〜く、","高く、"],["〜けど","〜が","便利だが、高い"],["〜から / 〜ので","〜ため","雨のため中止"],["でも、","しかし、","しかし、問題もある"],["〜なければならない","〜ねばならない","守らねばならない"]]}],"ex":[["人口が減っており、対策が必要である。","じんこうがへっており、たいさくがひつようである。","Populasi menurun, sehingga dibutuhkan langkah penanganan."]],"rm":["です → である","て、→ ます-stem、","ない → ず、","から・ので → ため, けど → が","なければ → ねば"]},{"t":"2. Bentuk khusus: ざる, まい, べき, べく","x":"Pola N2 masih menyimpan \"fosil\" dari bahasa Jepang kuno. Bentuknya sedikit aneh, tapi aturannya sederhana. Yang paling sering menjebak adalah perubahan する.","tb":[{"c":"Rumus dan contoh","h":["Pola","Artinya","Rumus","行く","食べる","する"],"r":[["〜ざるを得ない","terpaksa","ない → ざる","行かざる","食べざる","せざる ⚠"],["〜まい","tidak akan","kamus + まい","行くまい","食べまい / 食べるまい","するまい / すまい"],["〜べきだ","seharusnya","kamus + べき","行くべき","食べるべき","するべき / すべき"],["〜べく","supaya","kamus + べく","行くべく","食べるべく","するべく / すべく"]]}],"ex":[["上司の命令なので、やらざるを得ない。","じょうしのめいれいなので、やらざるをえない。","Karena perintah atasan, terpaksa harus dilakukan."],["二度と遅刻するまい。","にどとちこくするまい。","Saya tidak akan terlambat lagi."]],"n":"Hafalan wajib: する → せざる, すべき, すまい. Ini jebakan favorit di soal.","rm":["ざる = ない → ざる (する → せざる)","まい / べき / べく = kamus + まい / べき / べく","する → すまい, すべき, すべく"]}],"kaiwa":[["Wawancara kerja","Menjawab pertanyaan pewawancara dengan sopan.",[["B","本日はお越しいただき、ありがとうございます。まず、志望動機をお聞かせください。","ほんじつはおこしいただき、ありがとうございます。まず、しぼうどうきをおきかせください。","Terima kasih sudah datang. Pertama, tolong sampaikan motivasi Anda melamar."],["A","はい。<u>祖母の介護</u>をした経験から、お年寄りの生活を支える仕事がしたいと考えるようになりました。","はい。そぼのかいごをしたけいけんから、おとしよりのせいかつをささえるしごとがしたいとかんがえるようになりました。","Ya. Dari pengalaman merawat nenek, saya jadi ingin bekerja menopang kehidupan lansia."],["B","日本語での記録業務は大丈夫ですか。","にほんごでのきろくぎょうむはだいじょうぶですか。","Untuk pekerjaan pencatatan dalam bahasa Jepang, apakah tidak masalah?"],["A","専門用語はまだ勉強中ですが、毎日<u>単語帳</u>を作って覚えるようにしております。","せんもんようごはまだべんきょうちゅうですが、まいにちたんごちょうをつくっておぼえるようにしております。","Istilah teknisnya masih saya pelajari, tapi setiap hari saya membuat buku kosakata untuk menghafalnya."],["B","夜勤もありますが、対応できますか。","やきんもありますが、たいおうできますか。","Ada juga shift malam, apakah bisa?"],["A","はい、問題ございません。","はい、もんだいございません。","Ya, tidak ada masalah."]]]],"preview":true,"cnt":{"g":101,"k":368,"v":52,"q":36}},"N1":{"lv":"N1","jp":"えぬいち","cefr":"≈ C1","stats":[["±2.000","kanji"],["±10.000","kosakata"],["±220","pola bunpou"],["+12–18 bulan","setelah N2"]],"fokus":"Teks abstrak dan opini, bahasa tulis formal, pola klasik (や否や・ゆえに・べく), ungkapan perasaan yang kuat (禁じ得ない・極まりない), idiom, dan kosakata akademik. Bacaan panjang dengan waktu ketat.","tips":[["Baca dalam jumlah besar","N1 menuntut kecepatan membaca teks abstrak. Targetkan 1 editorial koran (社説) atau esai per hari."],["Pelajari nuansa, bukan arti","や否や / なり / が早いか artinya mirip, bedanya di pemakaian. Catat contoh asli untuk setiap pola."],["Kosakata akademik","Kata seperti 懸念, 是正, 妥協 jarang dipakai lisan tapi sering di soal. Buat kartu SRS dari bacaan sendiri."],["Idiom dan onomatope","Soal kosakata N1 sering memakai idiom (顔が広い, 気が置けない). Pahami arti sebenarnya, banyak yang menjebak."],["Choukai panjang","Latih mendengarkan diskusi 3–4 menit: podcast berita, ceramah, debat. Catat poin setiap pembicara."],["Tryout lebih awal","Mulai tryout penuh 3 bulan sebelum ujian. Manajemen waktu bagian bahasa & membaca (110 menit) adalah kunci."]],"weeks":[["Waktu","や否や, が早いか, なり, そばから, を皮切りに"],["Batas & lingkup","に至るまで, をもって, ともなると, を限りに"],["Sebab","ゆえに, とあって, ばこそ, ではあるまいし"],["Penilaian","までもない, に足る, に堪えない, てやまない"],["Perasaan kuat","を禁じ得ない, 極まりない, の至り, ずにはおかない"],["Kontras","とはいえ, といえども, ものを, をよそに"],["Penekanan","はおろか, すら, たりとも, にもまして"],["Tujuan & cara","べく, んがため, かたがた, がてら"],["Kesan & kecenderungan","ずくめ, まみれ, きらいがある, といったらない"],["Kosakata akademik","100 kata abstrak + idiom"],["Membaca intensif","Editorial dan esai panjang setiap hari"],["Tryout","3 kali tryout penuh dengan timer"]],"g":[{"c":"Waktu","p":"～や否や","a":"begitu … langsung","f":"V-る + やいなや","ex":"ベルが鳴るや否や、生徒たちは教室を飛び出した。","rd":"","id":"Begitu bel berbunyi, para murid langsung berlarian keluar kelas.","n":"Bahasa tulis.","x":"「や否や」 berarti \"begitu A, langsung B\", untuk dua kejadian yang hampir bersamaan. Ini bahasa tulis dan formal.\nKalimat belakang tidak boleh berupa kehendak atau perintah. Versi singkat: 「〜や」.","m":"や否や = \"ya atau tidak?\" belum sempat dijawab, B sudah terjadi."},{"c":"Waktu","p":"～が早いか","a":"begitu … (secepat kilat)","f":"V-る / V-た + が はやいか","ex":"彼は家に着くが早いか、ベッドに倒れ込んだ。","rd":"","id":"Begitu sampai rumah, dia langsung menjatuhkan diri ke kasur.","n":"","x":"「が早いか」 berarti \"begitu A, secepat kilat B\". Menekankan kecepatan perbuatan seseorang.\nContoh: 「ベルが鳴るが早いか、生徒たちは教室を飛び出した」. Subjeknya biasanya orang ketiga.","m":"が早いか = \"mana yang lebih cepat?\" A dan B hampir bersamaan."},{"c":"Waktu","p":"～なり","a":"begitu … lalu (tak terduga)","f":"V-る + なり","ex":"母は私の顔を見るなり、泣き出した。","rd":"","id":"Begitu melihat wajah saya, ibu langsung menangis.","n":"Subjek orang ketiga.","x":"「なり」 berarti \"begitu A, lalu (tiba-tiba) B\", dan B adalah tindakan yang tak terduga.\nSubjek kedua kalimat sama dan biasanya orang ketiga. Contoh: 「彼は家に帰るなり、寝てしまった」.","m":"なり = \"begitu jadi A\", lalu tingkah tak terduga. Subjeknya orang lain."},{"c":"Waktu","p":"～そばから","a":"setiap kali … langsung (berulang)","f":"V-る / V-た + そばから","ex":"覚えたそばから忘れてしまう。","rd":"","id":"Setiap kali hafal, langsung lupa lagi.","n":"","x":"「そばから」 berarti \"setiap kali A, langsung B\", untuk hal yang berulang dan menjengkelkan.\nContoh: 「片付けるそばから、     for (const prog of Object.keys(obj)) for (const key of Object.keys(obj[prog])) {
      await setDoc(doc(db, "content", prog, "items", key), { data: typeof obj[prog][key] === "string" ? obj[prog][key] : JSON.stringify(obj[prog][key]), updatedAt: serverTimestamp(), by: auth.currentUser.email }); n++; names.push(prog + "/" + key);
    }
    return { n, names };
  }
};
// ===== Batas perangkat: 1 akun maksimal MAX_DEV perangkat aktif =====
const MAX_DEV = 2;
let devId = null; try { devId = localStorage.getItem("lk_dev"); } catch {}
if (!devId) { devId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); try { localStorage.setItem("lk_dev", devId); } catch {} }
const regKey = uid => "lk_reg_" + uid;
function deviceLabel() {
  const ua = navigator.userAgent || "";
  const os = /iPhone|iPad|iPod/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "Perangkat lain";
  const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
  return `${os} · ${br}`;
}
async function logDevice(user) {
  const lk = "lk_log_" + user.uid;
  let done = false; try { done = localStorage.getItem(lk) === devId; } catch {}
  if (done) return;
  try { await setDoc(doc(db, "users", user.uid, "deviceLog", devId), { label: deviceLabel(), at: serverTimestamp() }); } catch (e) { /* sudah tercatat sebelumnya */ }
  try { localStorage.setItem(lk, devId); } catch {}
}
async function registerDevice(user) {
  const ref = doc(db, "users", user.uid, "devices", devId);
  const snap = await getDoc(ref);
  let registered = false; try { registered = localStorage.getItem(regKey(user.uid)) === devId; } catch {}
  if (!snap.exists() && registered) return false;           // perangkat ini sudah dikeluarkan oleh perangkat lain
  if (!snap.exists()) {
    await setDoc(ref, { label: deviceLabel(), createdAt: serverTimestamp(), lastSeen: serverTimestamp() });
    await logDevice(user);
    try { localStorage.setItem(regKey(user.uid), devId); } catch {}
  } else {
    await updateDoc(ref, { lastSeen: serverTimestamp() });
  }
  const all = await getDocs(collection(db, "users", user.uid, "devices"));
  const others = all.docs.filter(d => d.id !== devId)
    .map(d => ({ id: d.id, t: (d.data().lastSeen && d.data().lastSeen.toMillis) ? d.data().lastSeen.toMillis() : 0 }))
    .sort((a, b) => b.t - a.t);
  for (const d of others.slice(MAX_DEV - 1)) await deleteDoc(doc(db, "users", user.uid, "devices", d.id));
  return true;
}
async function checkDevice() {
  const u = auth.currentUser; if (!u) return true;
  try {
    const s = await T(getDoc(doc(db, "users", u.uid, "devices", devId)), 10000);
    if (s.exists()) return true;
    await kicked(); return false;
  } catch { return true; }
}
async function kicked() {
  const u = auth.currentUser;
  if (u) { try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  FB.kickedMsg = true;
  await signOut(auth);
  toast("Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.");
}
async function logoutAll() {
  const u = auth.currentUser;
  if (u) { try { await deleteDoc(doc(db, "users", u.uid, "devices", devId)); } catch {} try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  return signOut(auth);
}
setInterval(() => { if (auth.currentUser && !document.hidden) checkDevice(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && auth.currentUser) checkDevice(); });

async function content(prog, key) { const s = await T(getDoc(doc(db, "content", prog, "items", key)), 20000); return s.exists() ? s.data().data : null; }
async function pay(plan) {
  const fn = httpsCallable(getFunctions(fbApp, "asia-southeast1"), "createPayment");
  const r = await fn({ plan });
  location.href = r.data.redirect_url;
}
async function refresh() {
  const u = auth.currentUser; if (!u) return;
  const s = await getDoc(doc(db, "users", u.uid)); FB.access = (s.exists() && s.data().access) || {};
  for (const k in PAID) delete PAID[k];
  updNav(); route();
}
Object.assign(window.FB, { checkDevice, login, logout: logoutAll, err: e => errMap[e && e.code] || "Login gagal. Coba lagi.", inApp, adm, content, pay, refresh });

getRedirectResult(auth).catch(() => {});
// Kembali dari halaman pembayaran Midtrans: ?order_id=...&transaction_status=...
const qs = new URLSearchParams(location.search);
if (qs.get("order_id")) {
  const ok = ["settlement", "capture"].includes(qs.get("transaction_status"));
  history.replaceState(null, "", location.pathname + "#masuk");
  setTimeout(() => toast(ok ? "Pembayaran diterima! Paket aktif dalam beberapa detik." : "Pembayaran belum selesai. Kamu bisa coba lagi dari menu Harga."), 600);
  if (ok) { [4000, 10000, 20000].forEach(t => setTimeout(() => refresh().catch(() => {}), t)); }
}
onAuthStateChanged(auth, async user => {
  let profile = null;
  if (user) {
    try { profile = await T(ensureProfile(user)); } catch (e) { console.error(e); }
    try { if (!(await T(registerDevice(user)))) { await kicked(); return; } } catch (e) { console.error(e); }
  }
  for (const k in PAID) delete PAID[k];
  FB.ready = true; FB.failed = false; FB.user = user; FB.access = (profile && profile.access) || {};
  updNav();
  try { window.NL && NL.sync && NL.sync(); } catch (e) { console.error(e); }
  const r = (location.hash || "#home").slice(1);
  if (["masuk", "nihongo", "kaigo", "admin"].includes(r)) route();
});
