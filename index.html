<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf4e6;--bg2:#f3e4c4;--card:#fffdf8;--tx:#1d2540;--mu:#6a6253;--bd:#e6d5ae;--r:#12337a;--g:#8a6528;--gold:#b8924a;--a:var(--r)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.hero{padding:26px 0 10px}.hero h1{font-size:28px;margin:0 0 6px}.hero p{color:var(--mu);margin:0}
.grid{display:grid;gap:12px;margin-top:16px}
@media(min-width:600px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px}.card p{margin:0 0 10px;color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.fc{text-align:center;padding:34px 16px;cursor:pointer;min-height:170px}
.fc .big{font-size:44px}.fc .sm{color:var(--mu)}

.kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
.hero2{position:relative;text-align:center;padding:34px 8px 20px;overflow:hidden;border-radius:24px}

.hero2>*{position:relative;z-index:1}.hero2 h1{font-size:clamp(28px,7vw,46px);line-height:1.15;color:var(--r);margin:10px 0}

.hl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.hl img{height:92px;border-radius:14px;background:#fff;padding:5px;box-shadow:0 8px 22px -12px var(--r)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d2540}

.tag{display:inline-block;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.step{font-size:30px;font-weight:800;color:var(--gold)}
.cdw{display:flex;gap:10px;justify-content:center;margin:12px 0}.cdw div{background:var(--r);color:#fff;border-radius:12px;padding:10px 14px;min-width:66px;text-align:center;font-size:12px}.cdw b{display:block;font-size:26px}

.bar{height:6px;background:var(--bd);border-radius:9px;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.sec{text-align:center;padding:48px 0 6px}.sec .card,.sec details{text-align:left}.sec h2{font-size:26px}.sec .lead{max-width:520px;margin:0 auto 18px}
.grid>.card{display:flex;flex-direction:column}.grid>.card .btn{margin-top:auto;align-self:flex-start}
.card{transition:transform .25s,box-shadow .25s}.grid>.card:hover{transform:translateY(-5px);box-shadow:0 14px 28px -14px var(--r)}
.btn,.chip,.tab,.opt,nav button,.ic{transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover,.chip:hover,.tab:hover,nav button:hover{transform:translateY(-2px)}
.btn:active,.chip:active,.tab:active,.opt:active,nav button:active,.fc:active{transform:scale(.94)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.hero2::before{transform:translateY(var(--py,0px))}
.fc{animation:pop .3s ease}@keyframes pop{from{transform:scale(.94);opacity:.5}}
.opt.ok{animation:pulse .45s}.opt.no{animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--r));z-index:30}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--r);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
.soc{display:flex;gap:10px;justify-content:center;margin-top:12px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);background:var(--card);color:var(--r)}

.hl{gap:16px;align-items:stretch}.pc{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:18px;padding:14px 18px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 24px -14px var(--r)}.pc img{box-shadow:none;padding:0}
.pl{flex-direction:column;align-items:center}

.gate{text-align:center;max-width:460px;margin:10px auto}.gate .btn{display:inline-block;text-decoration:none;margin:6px}.btn:disabled{opacity:.5;cursor:not-allowed}

.plan{position:relative;text-align:left}.plan.pop{border:2px solid var(--gold);transform:scale(1.02)}.plan .price{font-size:28px;font-weight:800;color:var(--r)}.plan .price small{font-size:13px;font-weight:400;color:var(--mu)}
.plan ul{list-style:none;padding:0;margin:12px 0;color:var(--tx);font-size:14px}.plan li{padding:4px 0 4px 22px;position:relative}.plan li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:800}
.rib{position:absolute;top:-12px;right:14px;background:var(--gold);color:#1d2540;font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px}
.lock{font-size:38px;text-align:center}
.sv{width:210px;max-width:100%;display:block;margin:6px auto;background:var(--bg);border:1px solid var(--bd);border-radius:12px}

.st{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.st svg{width:58px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}

#mb{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-content:center;gap:5px;cursor:pointer;padding:0}
#mb span{display:block;width:20px;height:2px;background:var(--r);border-radius:2px;transition:.3s}
#mb.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}#mb.open span:nth-child(2){opacity:0}#mb.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

nav#nv.open{transform:none}nav#nv button{text-align:left;border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.nh{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--r);font-size:18px;margin-bottom:8px}#nx{cursor:pointer;padding:4px 8px;color:var(--mu)}
.nf{margin-top:auto;text-align:center;padding-top:18px}.nf b{display:block;font-size:13px;color:var(--mu);margin-top:8px}
#nbd{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .3s;z-index:55}#nbd.on{opacity:1;pointer-events:auto}

.ann{display:block;text-align:center;font-size:13px;font-weight:600;background:var(--gold);color:#1d2540;border-radius:999px;padding:8px 14px;margin:6px auto 0;max-width:560px;text-decoration:none;cursor:pointer}.cmp{width:100%;border-collapse:collapse;font-size:14px}.cmp th,.cmp td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:center}.cmp th:first-child,.cmp td:first-child{text-align:left}.cmp th:last-child{color:var(--r)}.cmp .y{color:var(--g);font-weight:800}.cmp .n{color:var(--mu)}.tw{overflow-x:auto}.num{font-size:32px;font-weight:800;color:var(--r);line-height:1.1}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteField, serverTimestamp, arrayUnion, collection, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = getFirestore(fbApp);
const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
const inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Twitter|Snapchat/i.test(navigator.userAgent || "");
const errMap = { "auth/popup-closed-by-user": "Jendela login ditutup sebelum selesai.", "auth/network-request-failed": "Koneksi internet bermasalah. Coba lagi.", "auth/unauthorized-domain": "Domain ini belum didaftarkan di Firebase (Authentication → Settings → Authorized domains).", "permission-denied": "Akses ditolak." };

async function login() {
  try { return await signInWithPopup(auth, provider); }
  catch (e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider); throw e; }
}
async function ensureProfile(user) {
  const ref = doc(db, "users", user.uid), snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { name: user.displayName || "", email: user.email, photoURL: user.photoURL || "", brands: ["landing"], createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
    return (await getDoc(ref)).data();
  }
  await updateDoc(ref, { lastLogin: serverTimestamp(), brands: arrayUnion("landing") });
  return snap.data();
}
const adm = {
  async isAdmin() { try { await getDocs(query(collection(db, "payments"), where("x", "==", "cek"))); return true; } catch { return false; } },
  async programs() { const s = await getDocs(collection(db, "programs")); return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id < b.id ? -1 : 1); },
  async find(email) { const s = await getDocs(query(collection(db, "users"), where("email", "==", email))); return s.empty ? null : { id: s.docs[0].id, ...s.docs[0].data() }; },
  async grant(uid, email, pid, date, note) {
    const until = Timestamp.fromDate(new Date(date + "T23:59:59")), by = auth.currentUser.email;
    await updateDoc(doc(db, "users", uid), { [`access.${pid}`]: { until, activatedAt: serverTimestamp(), note, by } });
    await setDoc(doc(collection(db, "payments")), { uid, email, program: pid, until, note, by, at: serverTimestamp() });
    return until;
  },
  revoke(uid, pid) { return updateDoc(doc(db, "users", uid), { [`access.${pid}`]: deleteField() }); },
  saveProgram(id, name) { return setDoc(doc(db, "programs", id), { brand: id.startsWith("kaigo") ? "kaigolink" : "nihongolink", name }, { merge: true }); }
};
Object.assign(window.FB, { login, logout: () => signOut(auth), err: e => errMap[e && e.code] || "Login gagal. Coba lagi.", inApp, adm });

});
