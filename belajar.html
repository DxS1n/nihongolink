<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NihongoLink Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, playful and encouraging, never childish
   IDEA a Japanese station stamp rally (駅スタンプラリー): each level is a station on one line, every finished unit earns an ink stamp
   PICTURE the route line with a train at your current progress, a daily-goal ring, and a stamp book of round ink stamps
   COLOUR NihongoLink cream ground, navy line, gold, red stamp ink; blue/orange/green as category inks
   TYPE Zen Maru Gothic (display + Japanese) + Plus Jakarta Sans (text)
   LAYOUT app shell: top bar + level pills, bottom tab bar on phone; home = greeting, goal ring, next-step cards, route, stamps */
:root{color-scheme:light dark;--bg:light-dark(#fff8ec,#0e1630);--card:light-dark(#ffffff,#16224a);--ink:light-dark(#1f2340,#eef0fa);--mut:light-dark(#5b6080,#a9b0d0);--navy:light-dark(#1b3a8c,#8fb0ff);--navyf:#1b3a8c;--gold:light-dark(#b38a25,#e2c36a);--red:light-dark(#d23f3f,#ff8080);--blue:light-dark(#2f6fe4,#7aa8ff);--org:light-dark(#d9741a,#ffb066);--grn:light-dark(#1f9461,#5fd59e);--line:light-dark(#e8dcc4,#2a3768);--soft:light-dark(#fdf0d8,#1c2958)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);overflow-x:clip;padding-bottom:84px}
h1,h2,h3,.jp{font-family:var(--fh)}
h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 8px;color:var(--navy);text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px);line-height:1.15;margin:0 0 6px;color:var(--navy)}
h3{font-size:19px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 10px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.mut{color:var(--mut)}
.top{position:sticky;top:0;z-index:30;background:var(--navyf);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:6px;max-width:1320px}
main.wrap{padding-top:24px}
.logo{font:900 20px var(--fh);color:#fff;text-decoration:none;white-space:nowrap}
.logo b{color:#e2c36a}
.lvp{display:flex;gap:4px;background:#ffffff1a;border-radius:999px;padding:4px}
.lvp button{border:0;background:none;color:#dfe6ff;border-radius:999px;padding:6px 12px;min-height:36px;font-weight:800}
.lvp button[aria-pressed=true]{background:#e2c36a;color:#1b3a8c}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill i{font-style:normal}
.pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff1f;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill svg{width:16px;height:16px}
.tabs{display:flex;gap:4px}
.tabs a{color:#dfe6ff;text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.tabs a[aria-current]{background:#ffffff26;color:#fff}
.tabs svg{width:18px;height:18px}
@media(min-width:821px) and (max-width:1220px){.tabs a span{display:none}.tabs a{padding:8px 10px}}
@media(max-width:560px){.pill i{display:none}.top .wrap{gap:8px}.lvp button{padding:6px 10px}}
@media(max-width:820px){.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--navyf);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px #0003}.tabs a{flex-direction:column;font-size:11px;gap:2px;padding:6px 4px;flex:1;align-items:center}.tabs svg{width:22px;height:22px}}
main{padding-block:24px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:46px;font-weight:800;background:var(--navy);color:var(--bg)}
.btn.r{background:var(--red);color:#fff}.btn.g{background:var(--grn);color:#fff}.btn.o{background:transparent;color:var(--navy);border:2px solid var(--navy)}.btn.y{background:#e2c36a;color:#1b3a8c}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:42px;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
input[type=search]{font:inherit;font-size:16px;padding:10px 14px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(100%,340px)}
/* home */
.hello{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media(max-width:760px){.hello{grid-template-columns:minmax(0,1fr)}}
.goal{display:flex;gap:18px;align-items:center}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:900 28px var(--fh);color:var(--navy);text-align:center;line-height:1}
.ring b small{display:block;font:700 12px var(--fb);color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:900 24px var(--fh);color:var(--navy)}
.stat span{font-size:13px;color:var(--mut)}
.next{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;border-radius:18px;padding:18px;color:#fff;min-height:150px;position:relative;overflow:hidden}
.next h3{font-size:21px;color:#fff}
.next p{color:#ffffffd9;font-size:15px;margin:0}
.next .go{margin-top:auto;font-weight:800;display:flex;align-items:center;gap:6px}
.next::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:14px solid #ffffff22}
.n1{background:var(--navyf)}.n2{background:#d23f3f}.n3{background:#1f9461}.n4{background:#d9741a}
.route{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:10px}
.route::before{content:"";position:absolute;left:10%;right:10%;top:34px;height:10px;border-radius:5px;background:var(--line)}
.route .fill{position:absolute;left:10%;top:34px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--navy),var(--gold));transition:width .6s}
.sta{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.sta .o{width:78px;height:78px;border-radius:50%;background:var(--card);border:6px solid var(--navy);display:grid;place-items:center;font:900 24px var(--fh);color:var(--navy);box-shadow:0 4px 0 var(--line)}
.sta[aria-pressed=true] .o{background:var(--navy);color:var(--bg);border-color:var(--gold)}
.sta .pc{font-size:13px;font-weight:800;color:var(--mut)}
@media(max-width:560px){.route::before,.route .fill{top:24px;height:7px}.sta .o{width:54px;height:54px;font-size:17px;border-width:4px}}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.stamp.got{border:4px double currentColor;transform:rotate(var(--r));background:color-mix(in srgb,currentColor 8%,transparent)}
.stamp.no{border:3px dashed var(--line);color:var(--mut)}
.stamp .sk{font:900 30px var(--fh);line-height:1}
.stamp .sl{font-size:11px;font-weight:800;line-height:1.15;padding:0 8px}
.stampwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.stampwrap small{font-size:12px;color:var(--mut);text-align:center;line-height:1.2}
/* learn */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px}
.subtabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-height:44px;font-weight:800}
.subtabs button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),#7ed3a6);border-radius:5px;transition:width .4s}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--line)}
.gc.ok{border-left-color:var(--grn)}
.gc .pt{font:900 21px var(--fh);color:var(--navy)}
.gc .ct{font-size:12px;font-weight:800;color:var(--org)}
.gc .fx{font-family:var(--fh);background:var(--soft);border-radius:10px;padding:6px 10px;font-size:15px}
.ex .j{font:700 18px var(--fh)}
.ex .r{font-size:14px;color:var(--blue)}
.ex .i{font-size:15px;color:var(--mut)}
.nt{font-size:14px;color:var(--red)}
.mk{align-self:flex-start;border:2px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800;min-height:36px}
.gc.ok .mk{border-color:var(--grn);color:var(--grn)}
.hideR .ex .r{display:none}
/* flashcards */
.fcwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.fcwrap{grid-template-columns:minmax(0,1fr)}}
.flip{perspective:1200px;min-height:300px;cursor:pointer}
.fin{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:2px solid var(--line);background:var(--card)}
.face.b{transform:rotateY(180deg);background:var(--soft)}
.face .big{font:900 clamp(72px,14vw,120px)/1.05 var(--fh);color:var(--navy)}
.face .mid{font:900 clamp(32px,6vw,48px)/1.2 var(--fh);color:var(--navy)}
.face dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;margin:10px 0 0}
.face dt{font-size:13px;font-weight:800;color:var(--mut)}
.face dd{margin:0;font:700 17px var(--fh)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.kk{aspect-ratio:1;border:2px solid var(--line);background:var(--card);border-radius:12px;font:700 24px var(--fh)}
.kk.ok{background:color-mix(in srgb,var(--grn) 18%,var(--card));border-color:var(--grn)}
.kk.cur{box-shadow:0 0 0 3px var(--navy) inset}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.vc .w{font:700 19px var(--fh)}
.vc .kj{font-size:14px;color:var(--mut);font-family:var(--fh)}
/* activities */
.act{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.act .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.act .ic svg{width:26px;height:26px}
.act b{display:block;font-size:17px}
.act span{font-size:14px;color:var(--mut)}
.act .sc{margin-left:auto;text-align:right;font:900 18px var(--fh);color:var(--navy);white-space:nowrap}
.babs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bab{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-family:var(--fh);font-size:20px}
.bab small{font:700 11px var(--fb);color:var(--mut)}
.bab.ok{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 15%,var(--card))}
/* quiz player */
.qp{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .prog{flex:1;height:14px;border-radius:7px}
.x{border:0;background:var(--card);border:2px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px;flex:none}
.combo{font:900 15px var(--fh);color:var(--org);white-space:nowrap;min-width:64px;text-align:right}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px}
.qsec{font-size:13px;font-weight:800;color:var(--org);text-transform:none}
.qstem{font:700 clamp(19px,2.6vw,24px)/1.55 var(--fh);margin:8px 0 6px;white-space:pre-line}
.qstem.big{font-size:clamp(40px,8vw,64px);text-align:center;color:var(--navy)}
.qctx{color:var(--mut);margin-bottom:12px;white-space:pre-line}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.op{text-align:left;border:2px solid var(--line);border-bottom-width:5px;background:var(--bg);border-radius:14px;padding:12px 14px;min-height:56px;font:700 17px var(--fh);display:flex;gap:10px;align-items:center;transition:transform .08s}
.op:active{transform:translateY(2px)}
.op .n{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:800 14px var(--fb);flex:none}
.op.ok{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 16%,var(--card))}
.op.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card))}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:color-mix(in srgb,var(--grn) 16%,var(--card))}
.fb.no{background:color-mix(in srgb,var(--red) 12%,var(--card))}
.fb b{font:900 18px var(--fh)}
.fb .xp{margin-left:auto;font:900 16px var(--fh);color:var(--grn);white-space:nowrap}
.tr{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.tr p{margin:0 0 4px;font:500 16px/1.7 var(--fh)}
.tr b{color:var(--navy)}
.play{display:flex;gap:12px;align-items:center;margin:8px 0 14px}
.pbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #9a2a2a}
.pbtn svg{width:28px;height:28px}
.pbtn.on{background:var(--navyf);box-shadow:0 4px 0 #0e2257}
.sit{background:var(--soft);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.qnext{display:flex;justify-content:flex-end;margin-top:14px}
.end{text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.stars svg{width:54px;height:54px}
.pop{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--grn);color:#fff;font:900 18px var(--fh);padding:8px 18px;border-radius:999px;z-index:60;animation:pop 1.1s forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.newstamp{animation:stampin .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{0%{transform:scale(2.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(var(--r));opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--navyf);color:#fff}
td.n{text-align:right;white-space:nowrap}
.conj td{white-space:nowrap;font-family:var(--fh)}
.empty{padding:24px;text-align:center;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.load{padding:60px;text-align:center;color:var(--mut)}
/* ---- cara menulis kanji ---- */
.som{position:fixed;inset:0;z-index:80;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.som{align-items:center;padding:20px}}
.sob{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.sob{border-radius:24px}}
.soh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg);border-bottom:2px solid var(--line);z-index:1}
.soh b{font:900 20px var(--fh);color:var(--navy)}.soh .jp{font-size:26px}
.sox{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.sobody{padding:16px 18px 24px}.sobody h3{margin:18px 0 8px;font:900 17px var(--fh);color:var(--navy)}
.sotop{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
@media(max-width:420px){.sotop{grid-template-columns:1fr}.sotop .sobig{max-width:240px;margin:auto}}
.sobig{width:100%;aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:18px}
.sobig .sgh,.sopad .sgh{fill:none;stroke:var(--line);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.sobig .st{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.sobig text{font:8px sans-serif;fill:var(--red)}
.sg{fill:none;stroke:var(--line);stroke-width:.8;stroke-dasharray:3 3}
.sosteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sosteps figure{margin:0;text-align:center}.sosteps svg{width:100%;aspect-ratio:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px}
.sosteps path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.sosteps .done{stroke:var(--ink)}.sosteps .now{stroke:var(--red);stroke-width:6}.sosteps .sg{stroke-width:.8}
.sosteps figcaption{font-size:12px;font-weight:800;color:var(--mut)}
.sopad{position:relative;width:min(300px,100%);aspect-ratio:1;margin:auto;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;color:var(--ink)}
.sopad svg,.sopad canvas{position:absolute;inset:0;width:100%;height:100%}.sopad canvas{touch-action:none;cursor:crosshair}
.sopad.nog .sgh{display:none}
.socr{font-size:12px;color:var(--mut);margin-top:16px}
.wbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px}
/* ---- login & kunci ---- */
.gate{max-width:480px;margin:30px auto;text-align:center}
.gate .lg{font:900 28px var(--fh);color:var(--navy);margin:0 0 6px}
.wm{position:fixed;inset:0;z-index:70;pointer-events:none;background-repeat:repeat;display:none}.wm.on{display:block}
.pill.acc{cursor:pointer;border:0;font:inherit}
#pvbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px max(14px,calc((100% - 980px)/2)) 0;padding:12px 14px;border:2px dashed var(--gold,#c9a24d);border-radius:14px;background:rgba(201,162,77,.12);font-size:14px}#pvbar div{display:flex;flex-direction:column;gap:2px;flex:1 1 220px}#pvbar span{opacity:.8}#pvbar .btn{white-space:nowrap}

/* ===== Tema landing NihongoLink ===== */
:root{--fh:"Quicksand","Noto Sans JP",system-ui,sans-serif;--fb:"Plus Jakarta Sans","Noto Sans JP",system-ui,sans-serif;--fw:"Caveat",cursive;
--bg:light-dark(#fbf6ec,#0f1730);--card:light-dark(#fffdf8,#18223f);--ink:light-dark(#1b2442,#f4ead3);--mut:light-dark(#6b6455,#b6ab93);
--navy:light-dark(#12337a,#86a6f2);--navyf:#12337a;--gold:light-dark(#c99a45,#e0bb72);--gold2:light-dark(#a8792c,#c49a4b);
--line:light-dark(#e8dbbd,#2f3b63);--soft:light-dark(#f3e6c9,#1f2a4c);--ona:light-dark(#fff,#0f1730);--tk:light-dark(#1b2442,#f4ead3);
--sh:0 18px 40px -22px light-dark(rgba(18,51,122,.45),#000);--note1:#ffe59a;--note2:#d6ecff;--note3:#e7e1ff;--note4:#ffdfc9}
body{font-family:var(--fb);background:var(--bg)}
body::before{content:"";position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;background:radial-gradient(40vw 40vw at 85% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 70%),radial-gradient(45vw 45vw at 0% 35%,color-mix(in srgb,var(--navy) 12%,transparent),transparent 70%),radial-gradient(40vw 40vw at 100% 90%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%);animation:bgf 18s ease-in-out infinite alternate}
@keyframes bgf{to{transform:translate(3vw,-2vh) scale(1.05)}}
h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:-.01em}
h1{color:var(--ink)}h2{color:var(--ink)}
.hand{font-family:var(--fw);font-weight:700;color:var(--gold2)}
#nlbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--navy));z-index:90;transition:width .15s}
/* header kaca seperti landing */
.top{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));margin:10px auto 0;width:calc(100% - 20px);max-width:1180px;border-radius:28px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 10px 30px -18px rgba(0,0,0,.35);color:var(--ink)}
.top .wrap{padding:6px 10px 6px 18px}
.logo{font:700 19px var(--fh);color:var(--navy)}.logo b{color:var(--gold)}
.lvp{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.lvp button{color:var(--mut);transition:background .25s,color .25s,transform .2s}.lvp button:hover{transform:translateY(-1px);color:var(--ink)}
.lvp button[aria-pressed=true]{background:var(--navy);color:var(--ona);box-shadow:0 3px 0 color-mix(in srgb,var(--navy) 60%,#000)}
.pill{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
a.pill{text-decoration:none;color:var(--navy)}
.tabs a{color:var(--mut);border-radius:999px;transition:background .25s,color .25s}.tabs a:hover{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.tabs a[aria-current]{background:var(--navy);color:var(--ona)}
@media(max-width:820px){.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--card) 95%,transparent)}.tabs{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}.tabs a{border-radius:16px}body{padding-bottom:100px}}
/* tombol 3D */
.btn{border-radius:999px;background:var(--navy);color:var(--ona);box-shadow:0 4px 0 color-mix(in srgb,var(--navy) 60%,#000);transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--navy) 60%,#000)}
.btn.o{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.y{background:var(--gold);color:#1b2442;box-shadow:0 4px 0 var(--gold2)}
.btn.r{box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#000)}.btn.g{box-shadow:0 4px 0 color-mix(in srgb,var(--grn) 60%,#000)}
.chip,.subtabs button,.mk,.x{border-width:1.5px;transition:transform .2s,background .25s}
.chip:hover,.subtabs button:hover{transform:translateY(-2px)}
.chip[aria-pressed=true],.subtabs button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--ona)}
.subtabs button{border-radius:999px}
/* kartu */
.card,.qcard{border-radius:22px;box-shadow:var(--sh);border-color:var(--line)}
.gc,.vc,.act{border-radius:20px;box-shadow:0 12px 28px -22px light-dark(rgba(18,51,122,.5),#000);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.gc:hover,.act:hover{transform:translateY(-4px) rotate(-.3deg)}
.gc{border-left-width:1px;position:relative;padding-top:18px}
.gc::before{content:"";position:absolute;top:-8px;left:22px;width:62px;height:18px;transform:rotate(-3deg);background:color-mix(in srgb,var(--gold) 55%,#fff);opacity:.8;border-radius:2px}
.gc:nth-child(even)::before{background:color-mix(in srgb,var(--navy) 30%,#fff);transform:rotate(2deg)}
.gc.ok{border-color:var(--grn);box-shadow:0 0 0 2px color-mix(in srgb,var(--grn) 40%,transparent),0 12px 28px -22px rgba(0,0,0,.5)}
.gc .pt{font-weight:700;color:var(--navy)}
.gc .ct{color:var(--gold2);background:color-mix(in srgb,var(--gold) 20%,transparent);padding:2px 10px;border-radius:999px}
.gc .fx{background:color-mix(in srgb,var(--gold) 12%,var(--card));border:1px dashed var(--line)}
.next{border-radius:22px;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.next:hover{transform:translateY(-6px) rotate(-.4deg)}
.n1{background:var(--navyf)}.n2{background:#b8862f}.n3{background:#2f7a5c}.n4{background:#1b2442}
.sta .o{border-color:var(--navy);font-family:var(--fh)}
.sta[aria-pressed=true] .o{background:var(--navy);color:var(--ona);border-color:var(--gold);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.route .fill{background:linear-gradient(90deg,var(--gold),var(--navy))}
.prog i{background:linear-gradient(90deg,var(--gold),var(--navy))}
th{background:var(--navy);color:var(--ona)}
.op{border-radius:16px;transition:transform .15s}.op:hover{transform:translateX(3px)}
.op.ok{animation:pulse .45s}.op.no{animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.face{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--gold) 14%,var(--card)))}
.face.b{background:var(--note1);color:#1b2442}.face.b .mid,.face.b .big,.face.b dd{color:#1b2442}.face.b dt{color:#6b6455}
.stamp.got{color:var(--red)}
.gate .lg{font-family:var(--fh)}
#pvbar{border-radius:18px;background:color-mix(in srgb,var(--gold) 14%,var(--card));box-shadow:var(--sh)}
#pvbar b{font-family:var(--fw);font-size:24px;line-height:1;color:var(--gold2)}
.hlm{position:relative;white-space:nowrap;color:var(--navy);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--gold) 55%,transparent) 62%,color-mix(in srgb,var(--gold) 55%,transparent) 92%,transparent 92%) no-repeat 0 0/0% 100%;animation:hlm 1s .25s cubic-bezier(.6,0,.2,1) forwards}
@keyframes hlm{to{background-size:100% 100%}}
/* motion masuk (seperti landing) */
.rv{opacity:0;transform:translateY(26px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.gc.rv.in:hover,.act.rv.in:hover{transform:translateY(-4px) rotate(-.3deg)}
.next.rv.in:hover{transform:translateY(-6px) rotate(-.4deg)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}body::before{animation:none}.hlm{background-size:100% 100%}}

.top{max-width:1320px}
.pill.acc{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.gx{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.gx summary{cursor:pointer;font-weight:800;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gx summary::-webkit-details-marker{display:none}
.gx summary::after{content:"+";font-size:22px;line-height:1;color:var(--gold2);transition:transform .3s}.gx[open] summary::after{transform:rotate(45deg)}
.gx .xb{margin:8px 0 2px;font-size:15px;line-height:1.75;animation:xin .35s ease}
.gx .xb p{margin:0 0 8px}.gx .xb .jq{font-family:"Noto Sans JP",var(--fh);font-weight:700;color:var(--navy);background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:6px;padding:0 4px}
@keyframes xin{from{opacity:0;transform:translateY(-6px)}}
.gbt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.say{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card));color:var(--ink);border-radius:999px;padding:4px 14px;min-height:36px;font-weight:800;font-size:14px;transition:transform .2s}
.say:hover{transform:translateY(-2px)}
.say.on{background:var(--navy);border-color:var(--navy);color:var(--ona)}
.say .eq{display:none;gap:2px;align-items:flex-end;height:14px}.say.on .eq{display:inline-flex}.say.on .ic{display:none}
.say .eq i{width:3px;background:currentColor;border-radius:2px;animation:eq .8s ease-in-out infinite}.say .eq i:nth-child(2){animation-delay:-.3s}.say .eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.gc.speaking{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 60%,transparent),var(--sh)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="#beranda">Nihongo<b>Link</b></a>
<div class="lvp" id="lvp" role="group" aria-label="Pilih level"></div>
<nav class="tabs" id="tabs" aria-label="Menu"></nav>
<div class="chips"><span class="pill" id="streak" title="Hari beruntun"></span><span class="pill xp" id="xp" title="Total poin"></span><a class="pill" href="./" title="Kembali ke situs">Situs</a><button class="pill acc" id="acc" hidden onclick="NL.logout&&NL.logout()">Keluar</button></div>
</div></header>
<div class="wm" id="wm" aria-hidden="true"></div>
<main class="wrap" id="main"><div class="load">Memuat materi…</div></main>
<script>
/* ===== Penghubung login Firebase (diisi oleh modul di bawah) ===== */
window.NL={user:null,access:{},failed:false,_r:null,onChange:null};
NL.ready=new Promise(r=>NL._r=r);
setTimeout(()=>{if(NL._r){NL.failed=true;NL._r();NL._r=null}},25000);
NL.has=p=>{const a=NL.access||{},now=Date.now(),pre=p==='n'?'nihongo':'kaigo';return Object.keys(a).some(k=>k.startsWith(pre)&&a[k]&&a[k].until&&a[k].until.toDate&&a[k].until.toDate().getTime()>now)};
NL.esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


/* ===== Penjelasan lisan (suara) ===== */
NL.tts={on:null,q:[],v:{}};
NL.pickVoices=()=>{try{const vs=speechSynthesis.getVoices();const f=l=>vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l)&&/google|natural|online|premium|enhanced/i.test(v.name))||vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l));NL.tts.v={id:f('id'),ja:f('ja')}}catch(e){}};
if('speechSynthesis' in window){NL.pickVoices();speechSynthesis.onvoiceschanged=NL.pickVoices}
NL.split=t=>{const out=[];const re=/[぀-ヿ㐀-鿿０-ｚ々〜～ー・、。！？「」『』（）]+/g;let last=0,m;
 t=String(t||'').replace(/<[^>]+>/g,'');
 while((m=re.exec(t))){if(m.index>last)out.push({t:t.slice(last,m.index),l:'id'});out.push({t:m[0],l:'ja'});last=m.index+m[0].length}
 if(last<t.length)out.push({t:t.slice(last),l:'id'});
 return out.map(p=>({l:p.l,t:NL.clean(p.l,p.t)})).filter(p=>p.t&&/[\p{L}\p{N}]/u.test(p.t))};
NL.clean=(l,t)=>l==='ja'?String(t).replace(/[～〜「」『』（）—]/g,' ').trim():String(t).replace(/\s*\/\s*/g,' atau ').replace(/\s*=\s*/g,', artinya ').replace(/[~|→]/g,', ').replace(/\bV-/g,'kata kerja ').replace(/\bN(\d?)\b/g,'kata benda ').trim();
NL.stopSay=()=>{try{speechSynthesis.cancel()}catch(e){}if(NL.tts.au){NL.tts.au.pause();NL.tts.au=null}const b=NL.tts.on;NL.tts.on=null;if(b){b.classList.remove('on');const c=b.closest('.gc');if(c)c.classList.remove('speaking')}};
NL.say=(btn,parts,audio)=>{if(NL.tts.on===btn){NL.stopSay();return}NL.stopSay();
 const c=btn.closest('.gc');btn.classList.add('on');if(c)c.classList.add('speaking');NL.tts.on=btn;
 if(audio){const a=new Audio(audio);NL.tts.au=a;a.onended=a.onerror=()=>{if(NL.tts.on===btn)NL.stopSay()};a.play().catch(()=>NL.stopSay());return}
 if(!('speechSynthesis' in window)){NL.stopSay();alert('Browser ini belum mendukung suara. Coba buka di Chrome.');return}
 if(!NL.tts.v.ja&&!NL.tts.v.id)NL.pickVoices();
 const segs=parts.flatMap(p=>p.l?[{l:p.l,t:NL.clean(p.l,p.t)}]:NL.split(p.t)).filter(p=>p.t);
 segs.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);const v=NL.tts.v[p.l];u.lang=p.l==='ja'?'ja-JP':'id-ID';if(v)u.voice=v;u.rate=p.l==='ja'?.85:1;
  if(i===segs.length-1)u.onend=()=>{if(NL.tts.on===btn)NL.stopSay()};speechSynthesis.speak(u)});
 if(!segs.length)NL.stopSay()};
addEventListener('hashchange',()=>NL.stopSay());

/* ===== Ketik huruf Jepang (IME) di kotak cari ===== */
(()=>{let comp=false;document.addEventListener('compositionstart',()=>comp=true,true);
 document.addEventListener('input',e=>{if((e.isComposing||comp)&&e.target.matches&&e.target.matches('input[type=search]'))e.stopImmediatePropagation()},true);
 document.addEventListener('compositionend',e=>{comp=false;const t=e.target;if(t.matches&&t.matches('input[type=search]'))setTimeout(()=>t.dispatchEvent(new Event('input')),0)},true)})();
/* ===== Motion seperti landing ===== */
NL.motion=()=>{const m=document.getElementById('main');if(!m)return;
 const h=m.querySelector('h1');if(h&&!h.dataset.hl){h.dataset.hl=1;const w=h.childNodes;for(const n of w){if(n.nodeType===3&&/N[1-5]/.test(n.nodeValue)){const t=n.nodeValue,i=t.search(/N[1-5]/),sp=document.createElement('span');sp.className='hlm';sp.textContent=t.substr(i,2);const rest=document.createTextNode(t.slice(i+2));n.nodeValue=t.slice(0,i);n.after(sp,rest);break}}}
 const els=[...m.querySelectorAll('.card,.gc,.vc,.act,.next,.stampwrap,.bab,.qcard,.route,.sotop')].filter(e=>!e.dataset.rv).slice(0,160);
 if(!els.length)return;const io=NL._io||(NL._io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');NL._io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'}):null);
 els.forEach((e,i)=>{e.dataset.rv=1;e.style.setProperty('--d',(i%8)*0.06+'s');e.classList.add('rv');if(io)io.observe(e);else e.classList.add('in')});
 setTimeout(()=>els.forEach(e=>e.classList.add('in')),2500)};
document.addEventListener('click',e=>{if(e.target.closest('.subtabs button,[data-c],[data-m],.lvp button,.sta'))setTimeout(NL.motion,0)});
(()=>{const b=document.createElement('div');b.id='nlbar';document.addEventListener('DOMContentLoaded',()=>document.body.prepend(b));
 addEventListener('scroll',()=>{const d=document.documentElement,mx=d.scrollHeight-innerHeight;b.style.width=(mx>0?scrollY/mx*100:0)+'%'},{passive:true})})();
NL.loginView=()=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=NL.failed?`<div class="card gate"><p class="lg">Login belum tersedia</p><p class="mut">Sistem login sedang bermasalah. Muat ulang halaman, atau kembali ke <a href="./">situs NihongoLink</a>.</p></div>`:
  `<div class="card gate"><p class="lg">Masuk ke NihongoLink</p><p class="mut">Masuk dengan akun Google untuk mencoba preview materi N5–N1. Materi lengkap terbuka dengan paket NihongoLink.</p>${NL.kickedMsg?'<p class="mut" style="color:var(--red)">Akunmu dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan.</p>':''}${NL.inApp?`<p class="mut" style="border:2px dashed var(--gold);border-radius:14px;padding:10px;text-align:left"><b>Buka di Chrome atau Safari dulu.</b> Google tidak mengizinkan login dari browser Instagram/Facebook. Ketuk menu ⋯ lalu pilih "Buka di browser".</p>`:''}<button class="btn" id="nlg" style="margin-top:8px">Masuk dengan Google</button><p class="mut" id="nle"></p><p><a href="./">← Kembali ke situs</a></p></div>`;
  const b=document.getElementById('nlg');if(b)b.onclick=async()=>{document.getElementById('nle').textContent='';try{await NL.login()}catch(e){document.getElementById('nle').textContent=NL.err?NL.err(e):'Login gagal.'}}};
NL.pvBar=d=>{const m=document.getElementById('main');if(!m)return;let e=document.getElementById('pvbar');
 if(!d||!d.preview){if(e)e.remove();return}
 if(!e){e=document.createElement('div');e.id='pvbar';m.parentNode.insertBefore(e,m)}
 const c=d.cnt||{};e.innerHTML=`<div><b>Mode preview ${NL.esc(d.lv)}</b><span>${d.empty?'Materi lengkap level ini belum diunggah.':`Contoh sebagian materi. Versi lengkap: ${c.g||'–'} pola bunpou, ${c.k||'–'} kanji, ${c.v||'–'} kosakata, ${c.q||'–'} soal.`}</span></div><a class="btn" href="./#harga">Buka semua materi</a>`};
NL.lockedView=d=>{const m=document.getElementById('main');if(!m)return;
  m.innerHTML=`<div class="card gate"><div style="font-size:44px">🔒</div><p class="lg">Materi ${NL.esc(d.lv)}</p><p class="mut">${d.empty?'Materi level ini belum diunggah oleh admin.':d.error?'Materi belum bisa dimuat. Periksa koneksi lalu coba lagi.'+(d.msg?'<br><small style="opacity:.7">Detail: '+NL.esc(d.msg)+'</small>':''):d.kicked?'Akunmu baru saja dipakai masuk di perangkat lain, jadi perangkat ini dikeluarkan. Masuk lagi untuk melanjutkan.':'Level '+NL.esc(d.lv)+' terbuka dengan paket NihongoLink.'}</p>
  <div class="bar" style="justify-content:center">${d.empty||d.error||d.kicked?'<button class="btn" onclick="location.reload()">Coba lagi</button>':'<a class="btn" href="./#harga">Lihat paket</a>'}${d.lv!=='N5'?'<button class="btn o" id="ton5">Belajar N5</button>':'<a class="btn o" href="./">Ke situs</a>'}</div></div>`;
  const b=document.getElementById('ton5');if(b)b.onclick=()=>{try{const S=JSON.parse(localStorage.getItem('nl_app_v1'))||{};S.lv='N5';localStorage.setItem('nl_app_v1',JSON.stringify(S))}catch(e){}location.hash='beranda';location.reload()}};
NL.wm=()=>{const el=document.getElementById('wm'),u=NL.user;if(!el)return;const on=!!u&&NL.has('n');el.classList.toggle('on',on);if(!on)return;
  const dark=matchMedia('(prefers-color-scheme: dark)').matches,c=dark?'rgba(255,255,255,.07)':'rgba(40,40,80,.08)',t=NL.esc((u.displayName?u.displayName+' · ':'')+u.email);
  el.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180"><text x="150" y="95" text-anchor="middle" transform="rotate(-24 150 90)" fill="${c}" font-family="sans-serif" font-size="13" font-weight="600">${t}</text></svg>`)}")`};
NL.acct=()=>{const b=document.getElementById('acc');if(!b)return;const u=NL.user;b.hidden=!u;if(u){b.textContent='Keluar';b.title='Masuk sebagai '+u.email}};
</script>
<script>const EMBED={"N5":{"lv":"N5","jp":"えぬご","cefr":"≈ A1","stats":[["±100","kanji"],["±800","kosakata"],["±80 pola","bunpou"],["3–4 bulan","lama belajar"]],"fokus":"Hiragana, katakana, kalimat です/ます, partikel dasar, bentuk て. Bisa membaca kalimat pendek tentang kehidupan sehari-hari.","tips":[["Pakai, jangan hanya hafal","Setiap pola bunpou baru wajib kamu pakai dalam 3 kalimat tentang hidupmu sendiri. Kalimat milikmu jauh lebih mudah diingat daripada contoh buku."],["Pengulangan berjarak (SRS)","Ulangi kosakata dan kanji tepat sebelum lupa: besok, 3 hari, 7 hari, 2 minggu. Pakai Anki atau tombol \"Sudah hafal\" di bagian kanji."],["Ingat aktif, bukan baca ulang","Tutup jawabannya lalu coba ingat. Usaha mengingat itulah yang menguatkan memori, bukan membaca berkali-kali."],["Kanji lewat kata","Belajar 食 bersama 食べます dan 食堂. Satu kanji, dua kata, satu kalimat. Bacaan on dan kun akan menempel dengan sendirinya."],["Shadowing setiap hari","Dengarkan audio pendek, tirukan dengan jeda setengah detik. Melatih telinga untuk choukai dan mulut untuk kaiwa sekaligus."],["Buku salah","Tulis setiap soal yang salah beserta alasannya. Sebelum ujian, buku inilah yang paling berharga, bukan buku teks."]],"weeks":[["Hiragana & katakana","Baca lancar 2×46 huruf, salam dasar."],["です & kata tunjuk","は/です/か, これ・この・ここ, の."],["Partikel & ます","を・に・で・へ・と, bentuk ます dan lampau."],["Ada & angka","あります/います, posisi, jam, harga."],["Kata sifat","い dan な, すき/じょうず, kalimat sifat lampau."],["Bentuk て (1)","てください, ています, てから."],["Bentuk て (2)","てもいい, てはいけない, ないでください, たり, から."],["Banding & tryout","より/いちばん, まえに/あとで, 2× tryout penuh."]],"sched":[["0–10","Ulang kartu SRS","Kanji dan kosakata yang jatuh tempo hari ini."],["10–25","1 pola bunpou baru","Baca rumus, tutup contoh, buat 3 kalimat sendiri."],["25–35","Shadowing","Audio 1–2 menit, ulangi 3 kali."],["35–50","10 soal latihan","Kerjakan dengan timer, catat yang salah di buku salah."],["50–60","Bicara 1 menit","Rekam dirimu memakai pola hari ini, dengarkan lagi."]],"g":[{"c":"Dasar","p":"～は～です","a":"A adalah B (kalimat sopan)","f":"N1 は N2 です","ex":"わたしは がくせいです。","rd":"watashi wa gakusei desu.","id":"Saya pelajar.","n":"Partikel は dibaca \"wa\", bukan \"ha\". Minna bab 1","x":"Pola paling dasar untuk memperkenalkan atau menjelaskan sesuatu: 「は」 menandai topik (yang dibicarakan), lalu 「です」 menutup kalimat dengan sopan, mirip \"adalah\".\nTopik bisa dihilangkan kalau sudah jelas dari konteks: 「がくせいです」 sudah berarti \"(saya) pelajar\". Ingat, です tidak dipakai untuk kata kerja."},{"c":"Dasar","p":"～じゃありません","a":"bukan","f":"N じゃありません / ではありません","ex":"これは わたしの ほんじゃありません。","rd":"kore wa watashi no hon ja arimasen.","id":"Ini bukan buku saya.","n":"ではありません lebih formal; keduanya benar di soal. Minna bab 1","x":"Bentuk negatif dari です. 「じゃありません」 dipakai dalam percakapan, 「ではありません」 lebih formal dan sering muncul di tulisan.\nUntuk bentuk lampau negatif tambahkan でした: 「がくせいじゃありませんでした」 = \"dulu bukan pelajar\"."},{"c":"Dasar","p":"～ですか","a":"kalimat tanya","f":"Kalimat + か","ex":"あなたは にほんじんですか。","rd":"anata wa nihonjin desu ka.","id":"Apakah Anda orang Jepang?","n":"Tidak perlu tanda tanya; か sudah membuat kalimat tanya. Minna bab 1","x":"Cukup tambahkan 「か」 di akhir kalimat sopan untuk mengubahnya jadi pertanyaan, dan nada suara dinaikkan di akhir.\nJawabannya: 「はい、そうです」 (ya, benar) atau 「いいえ、ちがいます」 (bukan). Untuk pertanyaan dengan kata tanya seperti なん atau だれ, jawab langsung isinya, bukan はい/いいえ."},{"c":"Partikel","p":"～の","a":"milik / keterangan benda","f":"N1 の N2","ex":"これは にほんごの ほんです。","rd":"kore wa nihongo no hon desu.","id":"Ini buku bahasa Jepang.","n":"Urutan terbalik dari bahasa Indonesia: \"buku bahasa Jepang\" = にほんご の ほん. Minna bab 1","x":"「の」 menghubungkan dua kata benda. Kata benda pertama menjelaskan yang kedua: pemilik, asal, bahan, atau jenis.\nUrutannya kebalikan bahasa Indonesia: 「わたしの かばん」 = \"tas saya\", 「にほんの くるま」 = \"mobil Jepang\". Kata benda kedua bisa dihilangkan kalau sudah jelas: 「これは わたしのです」 = \"ini punya saya\"."},{"c":"Partikel","p":"～も","a":"juga","f":"N も","ex":"わたしも がくせいです。","rd":"watashi mo gakusei desu.","id":"Saya juga pelajar.","n":"も menggantikan は/が/を, jangan ditulis はも. Minna bab 1","x":"「も」 berarti \"juga\" dan menggantikan partikel は, が, atau を. Jadi jangan ditulis 「はも」 atau 「をも」.\nUntuk partikel lain, も ditaruh di belakangnya: 「にほんにも いきます」 = \"pergi ke Jepang juga\". Dalam kalimat negatif, も bisa berarti \"pun tidak\": 「なにも たべません」."},{"c":"Dasar","p":"これ・それ・あれ・どれ","a":"ini / itu / itu (jauh) / yang mana","f":"これ は N です","ex":"それは なんですか。","rd":"sore wa nan desu ka.","id":"Itu apa?","n":"これ berdiri sendiri; tidak boleh langsung diikuti kata benda. Minna bab 2","x":"Kata tunjuk yang berdiri sendiri sebagai kata benda. 「これ」 dekat pembicara, 「それ」 dekat lawan bicara, 「あれ」 jauh dari keduanya, 「どれ」 untuk bertanya \"yang mana\" (dari tiga pilihan atau lebih).\nKarena sudah berupa kata benda, これ langsung diikuti partikel: 「これは」, 「それを」."}],"k":[{"k":"一","on":"イチ","kun":"ひと(つ)","m":"satu","w":"一つ","wr":"ひとつ","wm":"satu buah","c":"Angka & uang"},{"k":"七","on":"シチ","kun":"なな","m":"tujuh","w":"七時","wr":"しちじ","wm":"jam tujuh","c":"Angka & uang"},{"k":"万","on":"マン","kun":"-","m":"sepuluh ribu","w":"一万円","wr":"いちまんえん","wm":"10.000 yen","c":"Angka & uang"},{"k":"三","on":"サン","kun":"みっ(つ)","m":"tiga","w":"三月","wr":"さんがつ","wm":"Maret","c":"Angka & uang"},{"k":"上","on":"ジョウ","kun":"うえ","m":"atas","w":"上手","wr":"じょうず","wm":"pandai","c":"Arah & posisi"},{"k":"下","on":"カ・ゲ","kun":"した","m":"bawah","w":"下手","wr":"へた","wm":"tidak pandai","c":"Arah & posisi"},{"k":"中","on":"チュウ","kun":"なか","m":"tengah, dalam","w":"中国","wr":"ちゅうごく","wm":"Tiongkok","c":"Arah & posisi"},{"k":"九","on":"キュウ・ク","kun":"ここの(つ)","m":"sembilan","w":"九時","wr":"くじ","wm":"jam sembilan","c":"Angka & uang"},{"k":"二","on":"ニ","kun":"ふた(つ)","m":"dua","w":"二人","wr":"ふたり","wm":"dua orang","c":"Angka & uang"},{"k":"五","on":"ゴ","kun":"いつ(つ)","m":"lima","w":"五分","wr":"ごふん","wm":"lima menit","c":"Angka & uang"},{"k":"人","on":"ジン・ニン","kun":"ひと","m":"orang","w":"日本人","wr":"にほんじん","wm":"orang Jepang","c":"Orang & tubuh"},{"k":"今","on":"コン","kun":"いま","m":"sekarang","w":"今日","wr":"きょう","wm":"hari ini","c":"Hari & waktu"}],"v":{"Salam & ungkapan":[["おはようございます","","selamat pagi"],["こんにちは","","selamat siang"],["こんばんは","","selamat malam"],["ありがとうございます","","terima kasih"],["すみません","","maaf / permisi"],["いただきます","","(sebelum makan)"]],"Waktu":[["きょう","今日","hari ini"],["あした","明日","besok"],["きのう","昨日","kemarin"],["まいにち","毎日","setiap hari"],["あさ","朝","pagi"],["ひる","昼","siang"]]},"q":{"JLPT N5":[{"s":"Kosakata · bacaan kanji","q":"あしたは 雨です。","c":"Bagaimana cara membaca 雨?","o":["あめ","ゆき","かさ","くも"],"e":"雨 = あめ (hujan). ゆき = salju (雪), くも = awan (雲)."},{"s":"Kosakata · bacaan kanji","q":"毎日 にほんごを べんきょうします。","c":"Cara baca 毎日?","o":["まいにち","まいび","まいひ","めいにち"],"e":"毎日 = まいにち. Ingat juga 毎週 まいしゅう, 毎年 まいとし."},{"s":"Kosakata · penulisan","q":"この くるまは あたらしいです。","c":"Kanji untuk くるま?","o":["車","東","重","軍"],"e":"車 = くるま. 東 ひがし (timur), 重 berat, 軍 militer. Bentuknya mirip, perhatikan detail."}],"Mendengarkan N5":[{"s":"Tugas (transkrip)","q":"女：すみません、ジュースを 2本と パンを 1つ ください。\n男：はい。ジュースは 1本 120円、パンは 150円です。","c":"Berapa yang harus dibayar perempuan itu?","o":["390円","270円","240円","420円"],"e":"2 × 120 + 150 = 390 yen."},{"s":"Poin (transkrip)","q":"男：あした、何時に 会いましょうか。\n女：10時は どうですか。\n男：10時は ちょっと…。11時は どうですか。\n女：いいですよ。","c":"Jam berapa mereka bertemu besok?","o":["11時","10時","10時半","12時"],"e":"10時は ちょっと… = menolak halus. Disepakati jam 11."},{"s":"Ungkapan (transkrip)","q":"Anda masuk ke rumah teman.","c":"Apa yang Anda katakan?","o":["おじゃまします","いってきます","ただいま","いただきます"],"e":"Masuk rumah orang lain: おじゃまします."}],"JFT-Basic":[{"s":"Huruf & kosakata","q":"入口","c":"Cara membacanya?","o":["いりぐち","でぐち","まどぐち","ひじょうぐち"],"e":"入口 いりぐち = pintu masuk. 出口 = pintu keluar, 窓口 = loket."},{"s":"Huruf & kosakata","q":"禁煙","c":"Arti papan ini?","o":["Dilarang merokok","Boleh merokok","Tempat merokok","Dilarang masuk"],"e":"禁 = larangan, 煙 = asap. 禁煙 きんえん."},{"s":"Huruf & kosakata","q":"無料","c":"Arti tulisan ini?","o":["Gratis","Mahal","Diskon","Tutup"],"e":"無料 むりょう = gratis. 料金 = tarif."}]},"mn":{"start":1,"b":[{"t":"Perkenalan","p":"は・です, じゃありません, か, も, の, ～さい","q":[{"q":"わたし（　）マイク・ミラーです。","o":["は","を","に","の"],"e":"は menandai topik kalimat dan dibaca \"wa\"."},{"q":"A「サントスさんは がくせいですか。」\nB「いいえ、がくせい（　）。」","o":["じゃありません","です","も","の"],"e":"Jawaban いいえ diikuti bentuk negatif じゃありません."},{"q":"わたしは IMC（　）しゃいんです。","o":["の","は","も","か"],"e":"の menghubungkan dua kata benda: karyawan (milik) IMC."},{"q":"ワンさんは いしゃです。リンさん（　）いしゃです。","o":["も","は","の","か"],"e":"も = juga, menggantikan は."},{"q":"Orang yang bekerja di rumah sakit dan memeriksa pasien adalah …","o":["いしゃ","きょうし","ぎんこういん","がくせい"],"e":"いしゃ = dokter. きょうし guru, ぎんこういん pegawai bank."},{"q":"A「テレサちゃんは（　）ですか。」\nB「9さいです。」","o":["なんさい","だれ","どこ","なん"],"e":"Menanyakan umur: なんさい (sopan: おいくつ)."},{"q":"Cara baca 「先生」?","o":["せんせい","せんせ","せいせん","さきせい"],"e":"先生 = せんせい. Jangan dipakai untuk menyebut profesi diri sendiri; pakai きょうし."},{"q":"Kalimat yang benar untuk \"Saya bukan guru.\"","o":["わたしは きょうしじゃありません。","わたしは じゃありません きょうし。","きょうしは わたし じゃありません。","わたしの きょうしじゃありません。"],"e":"Pola: N1 は N2 じゃありません."}]}]},"pt":[["は","Topik / pokok kalimat","わたしは インドネシアじんです。","Saya orang Indonesia."],["は","Kontras (sering dengan negatif)","にくは たべますが、さかなは たべません。","Daging saya makan, tapi ikan tidak."],["が","Subjek kata kerja & keberadaan","あめが ふって います。","Hujan sedang turun."],["が","Objek すき・じょうず・わかる・ほしい・できる","わたしは うたが すきです。","Saya suka menyanyi."],["が","Subjek di dalam penjelas kata benda","ははが つくった りょうりです。","Ini masakan buatan ibu."],["が","Tetapi (penghubung kalimat)","この へやは ひろいですが、くらいです。","Kamar ini luas, tetapi gelap."]],"pq":[{"q":"きのう ともだち（　）えいがを みました。","o":["と","を","に","へ"],"e":"Bersama teman: と."},{"q":"わたしは まいばん 11じ（　）ねます。","o":["に","で","を","が"],"e":"Jam tertentu: に."},{"q":"この ペンは 100えん（　）かいました。","o":["で","に","を","と"],"e":"Harga/jumlah untuk membeli: で."}],"kaiwa":[["Perkenalan diri (じこしょうかい)","Wajib untuk wawancara kerja dan hari pertama di Jepang.",[["A","はじめまして。<u>アンディ</u>です。","hajimemashite. andi desu.","Senang berkenalan. Saya Andi."],["B","はじめまして。たなかです。","hajimemashite. tanaka desu.","Senang berkenalan. Saya Tanaka."],["A","<u>インドネシア</u>から きました。","indoneshia kara kimashita.","Saya datang dari Indonesia."],["B","そうですか。おしごとは？","sou desu ka. oshigoto wa?","Oh begitu. Pekerjaannya?"],["A","<u>かいご</u>の しごとを します。よろしく おねがいします。","kaigo no shigoto o shimasu. yoroshiku onegaishimasu.","Saya bekerja di bidang kaigo. Mohon bantuannya."]]]],"jft":{"ir":{"Starter (A1)":["","","名前国私","父母子日本"]},"jv":[["名前","なまえ","nama"],["氏名","しめい","nama lengkap"],["午前","ごぜん","pagi (a.m.)"],["国","くに","negara"],["国際交流","こくさいこうりゅう","pertukaran internasional"],["外国","がいこく","luar negeri"],["私","わたし","saya"],["父","ちち","ayah (sendiri)"],["お父さん","おとうさん","ayah (orang lain)"],["母","はは","ibu (sendiri)"],["お母さん","おかあさん","ibu (orang lain)"],["子ども","こども","anak"],["日本","にほん","Jepang"],["今日","きょう","hari ini"],["日本語","にほんご","bahasa Jepang"]],"hy":{"Salam harian":[["おはようございます","Selamat pagi","Sopan; kepada teman cukup おはよう."],["こんにちは","Selamat siang",""],["こんばんは","Selamat malam",""]],"Di tempat kerja":[["よろしくお願いします","Mohon bantuannya","Saat perkenalan atau meminta tolong."],["お疲れさまです","Salam sesama rekan kerja","Dipakai sepanjang hari kerja."],["お先に失礼します","Saya pulang duluan","Saat pulang lebih dulu dari rekan."]]},"pj":{"Bentuk kamus (V-る)":[["V-る と","kalau … (pasti)","このボタンを押すと、ドアが閉まります。","このボタンを おすと、ドアが しまります。","Kalau tombol ini ditekan, pintu tertutup."],["V-る つもりです","berencana","来年、日本へ行くつもりです。","らいねん、にほんへ いく つもりです。","Tahun depan saya berencana ke Jepang."],["V-る ことができます","bisa","日本語で電話をかけることができます。","にほんごで でんわを かける ことが できます。","Saya bisa menelepon dalam bahasa Jepang."]],"Bentuk ない":[["V-ない でください","tolong jangan","ここでたばこを吸わないでください。","ここで たばこを すわないで ください。","Tolong jangan merokok di sini."],["V-なければなりません","harus","毎日薬を飲まなければなりません。","まいにち くすりを のまなければ なりません。","Harus minum obat setiap hari. (informal: のまなきゃ)"],["V-なくてもいいです","tidak perlu","明日は来なくてもいいです。","あしたは こなくても いいです。","Besok tidak perlu datang."]]}},"ch":[{"t":"課題理解","i":"女の人と男の人が話しています。男の人はあした何を持っていきますか。","d":[["女","あしたのピクニック、お弁当はわたしが作りますね。"],["男","ありがとうございます。じゃあ、わたしは飲み物を持っていきます。"],["女","あ、飲み物は山田さんが持ってきますよ。"],["男","そうですか。じゃあ、くだものを持っていきます。"]],"q":"男の人はあした何を持っていきますか。","o":["くだもの","おべんとう","のみもの","おかし"],"e":"Awalnya mau bawa minuman, tapi Yamada yang bawa. Akhirnya buah (くだもの)."},{"t":"課題理解","i":"先生が学生に話しています。学生はあした何時までに教室に来ますか。","d":[["先生","あしたは8時半から試験です。でも、8時15分までに教室に来てください。遅れないでくださいね。"]],"q":"学生はあした何時までに教室に来ますか。","o":["8時15分","8時半","8時","8時45分"],"e":"Ujian mulai 8.30, tapi harus datang paling lambat 8.15 (までに)."}],"exam":[[["Kosakata",20],["Tata bahasa & membaca",40],["Mendengarkan",30]],80,"45"],"preview":true,"cnt":{"g":34,"k":80,"v":84,"q":56}},"N4":{"lv":"N4","jp":"えぬよん","cefr":"≈ A2","stats":[["±300","kanji"],["±1.500","kosakata"],["±130","pola bunpou"],["+5–6 bulan","setelah N5"]],"fokus":"Semua perubahan bentuk kata kerja (potensial, pasif, kausatif, bentuk maksud, bentuk ば), memberi-menerima, dugaan (そう・よう・らしい), dan dasar keigo. Target umum untuk Tokutei Ginou bersama JFT-Basic.","tips":[["Kuasai tabel bentuk dulu","80% kesalahan soal N4 berasal dari salah mengubah bentuk kata kerja. Latih tabel di bawah sampai bisa tanpa berpikir."],["Pisahkan pola yang mirip","そう (kelihatannya) vs そう (katanya), ために vs ように, ば vs たら vs と vs なら. Buat tabel perbandingan sendiri."],["Pasangan transitif-intransitif","開く/開ける, 消える/消す. Hafalkan berpasangan, karena soal ています vs てあります bergantung pada ini."],["Baca teks pendek setiap hari","Bacaan N4 berupa memo, email, dan pengumuman. Latih cari informasi: siapa, kapan, di mana, harus apa."],["Dengarkan percakapan kantor","Choukai N4 banyak situasi kerja dan toko. Dengarkan NHK Easy Japanese, lalu shadowing."],["Satu bab Minna II per 3 hari","Hari 1 kosakata dan pola, hari 2 latihan, hari 3 soal per bab di halaman ini."]],"weeks":[["Bab 26–30","んです, potensial, ながら, ています/てあります, ておきます"],["Bab 31–34","Bentuk maksud, つもり, でしょう/かもしれない, perintah, とおりに"],["Bab 35–38","Bentuk ば, なら, ように, pasif, のは/のが/のを"],["Bab 39–42","Sebab て/ので, か/かどうか, memberi-menerima sopan, ために"],["Bab 43–46","そう (kelihatannya), すぎる, やすい/にくい, 場合, ところ"],["Bab 47–50","そう (katanya), よう, kausatif, sonkeigo, kenjougo"],["Ulang & kanji","Ulangi semua pola yang salah, kejar 300 kanji"],["Tryout","2 kali tryout penuh dengan timer, analisis kesalahan"]],"g":[{"c":"Bentuk kata kerja","p":"Bentuk potensial","a":"bisa","f":"Gol I: く→ける / Gol II: る→られる / する→できる / くる→こられる","ex":"私は漢字が少し読めます。","rd":"わたしは かんじが すこし よめます。","id":"Saya bisa sedikit membaca kanji.","n":"Objek biasanya memakai が. Minna bab 27.","x":"Bentuk potensial menyatakan kemampuan atau kemungkinan: \"bisa ...\". Objek yang tadinya memakai を biasanya berubah menjadi 「が」: 「漢字が読めます」.\nUntuk する cukup pakai できる. Dalam percakapan santai, kelompok II sering disingkat jadi 「食べれる」 (ら抜き), tapi di ujian pakai bentuk baku 「食べられる」."},{"c":"Bentuk kata kerja","p":"見えます・聞こえます","a":"terlihat / terdengar (alami)","f":"N が 見えます / 聞こえます","ex":"窓から海が見えます。","rd":"まどから うみが みえます。","id":"Dari jendela terlihat laut.","n":"見られます = bisa melihat karena ada kesempatan. Bab 27.","x":"「見えます」 dan 「聞こえます」 berarti sesuatu terlihat atau terdengar dengan sendirinya, tanpa usaha. Yang terlihat ditandai が.\nBedakan dengan 「見られます」 = bisa melihat karena ada kesempatan atau fasilitas: 「この映画は家で見られます」."},{"c":"Penjelasan","p":"～んです","a":"menjelaskan / menanyakan alasan","f":"Bentuk biasa + んです (N/Adj な + なんです)","ex":"どうしたんですか。—頭が痛いんです。","rd":"どうしたんですか。—あたまが いたいんです。","id":"Kenapa? —Kepala saya sakit.","n":"Jangan berlebihan, bisa terdengar menuntut. Bab 26.","x":"「んです」 dipakai untuk menjelaskan keadaan atau menanyakan alasan dengan nada ingin tahu: 「どうしたんですか」 = ada apa?\nSaat menjawab, んです memberi penjelasan latar belakang. Pola 「〜んですが、〜」 juga dipakai sebagai pembuka sebelum meminta tolong."},{"c":"Permintaan","p":"～ていただけませんか","a":"bisakah Anda … (sangat sopan)","f":"V-て いただけませんか","ex":"日本語を教えていただけませんか。","rd":"にほんごを おしえて いただけませんか。","id":"Bisakah Anda mengajari saya bahasa Jepang?","n":"Lebih sopan dari ～てください. Bab 26.","x":"Bentuk て + 「いただけませんか」 adalah cara meminta tolong yang sangat sopan, cocok untuk guru, atasan, atau orang yang belum dikenal.\nUrutan kesopanan: 〜てください < 〜てくださいませんか < 〜ていただけませんか."},{"c":"Permintaan","p":"～たらいいですか","a":"sebaiknya bagaimana","f":"Kata tanya + V-たら いいですか","ex":"どこで切符を買ったらいいですか。","rd":"どこで きっぷを かったら いいですか。","id":"Sebaiknya beli tiket di mana?","n":"Bab 26.","x":"Dipakai untuk meminta saran atau petunjuk: \"sebaiknya saya ... bagaimana / di mana / apa?\". Selalu diawali kata tanya.\nPola ini sering dipakai bersama 〜んですが: 「日本語を勉強したいんですが、どうしたらいいですか」."},{"c":"Waktu & urutan","p":"～ながら","a":"sambil","f":"V-ます + ながら","ex":"歌を歌いながら、料理を作ります。","rd":"うたを うたいながら、りょうりを つくります。","id":"Memasak sambil bernyanyi.","n":"Kegiatan utama di belakang. Bab 28.","x":"「ながら」 menyatakan dua kegiatan dilakukan bersamaan oleh orang yang sama. Kegiatan utama ditaruh di belakang, yang sampingan di depan.\nBisa juga untuk keadaan jangka panjang: 「働きながら、大学に通っています」 = kuliah sambil bekerja."}],"k":[{"k":"不","on":"フ","kun":"-","m":"tidak","w":"不便","wr":"ふべん","wm":"tidak praktis"},{"k":"世","on":"セ","kun":"よ","m":"dunia","w":"世話","wr":"せわ","wm":"mengurus"},{"k":"主","on":"シュ","kun":"ぬし","m":"utama","w":"主人","wr":"しゅじん","wm":"suami"},{"k":"事","on":"ジ","kun":"こと","m":"hal","w":"食事","wr":"しょくじ","wm":"makan"},{"k":"京","on":"キョウ","kun":"-","m":"ibu kota","w":"東京","wr":"とうきょう","wm":"Tokyo"},{"k":"仕","on":"シ","kun":"つか(える)","m":"melayani","w":"仕事","wr":"しごと","wm":"pekerjaan"},{"k":"代","on":"ダイ","kun":"か(わる)","m":"ganti, biaya","w":"電気代","wr":"でんきだい","wm":"biaya listrik"},{"k":"以","on":"イ","kun":"-","m":"sejak, dengan","w":"以上","wr":"いじょう","wm":"… ke atas"},{"k":"会","on":"カイ","kun":"あ(う)","m":"bertemu","w":"会います","wr":"あいます","wm":"bertemu","c":"Tempat & benda"},{"k":"住","on":"ジュウ", limat belakang bukan kehendak pembicara.","x":"「たとたん」 berarti \"begitu A terjadi, langsung B\", dan B adalah kejadian tak terduga atau di luar kendali pembicara.\nKarena itu kalimat belakang tidak boleh berupa kehendak, ajakan, atau perintah. Untuk itu pakai 〜たらすぐ."},{"c":"Waktu & proses","p":"～次第","a":"segera setelah","f":"V-ます + しだい","ex":"家に着き次第、連絡します。","rd":"いえに つき しだい、れんらくします。","id":"Begitu sampai rumah, saya kabari.","n":"Juga: N 次第 = tergantung N (努力次第).","x":"「次第」 setelah bentuk ます berarti \"segera setelah ... selesai\", dipakai di situasi formal seperti bisnis.\nKalimat belakang biasanya rencana atau permintaan: 「わかり次第、連絡します」. Setelah kata benda, 次第 berarti \"tergantung\": 「天気次第」."},{"c":"Waktu & proses","p":"～たびに","a":"setiap kali","f":"V-る / N の + たびに","ex":"この歌を聞くたびに、国を思い出す。","rd":"この うたを きく たびに、くにを おもいだす。","id":"Setiap mendengar lagu ini, saya teringat kampung halaman.","n":"","x":"「たびに」 berarti \"setiap kali A, pasti B\". Menyatakan kejadian yang berulang.\nNuansanya sedikit lebih kuat daripada 〜と. Dengan kata benda pakai の: 「旅行のたびに」."},{"c":"Waktu & proses","p":"～てからでないと","a":"kalau belum … tidak bisa","f":"V-て + からでないと + negatif","ex":"店長に聞いてからでないと、決められません。","rd":"てんちょうに きいて からでないと、きめられません。","id":"Kalau belum tanya manajer, saya tidak bisa memutuskan.","n":"","x":"「てからでないと」 berarti \"kalau belum A, tidak bisa B\". Kalimat belakang biasanya negatif atau sulit.\nVersi lain: 「〜てからでなければ」. Sering dipakai untuk aturan atau prosedur: 「手を洗ってからでないと、入れません」."}],"k":[{"k":"与","on":"ヨ","kun":"あた(える)","m":"memberi","w":"給与","wr":"きゅうよ","wm":"gaji"},{"k":"両","on":"リョウ","kun":"-","m":"kedua","w":"両親","wr":"りょうしん","wm":"orang tua"},{"k":"乗","on":"ジョウ","kun":"の(る)","m":"naik","w":"乗り物","wr":"のりもの","wm":"kendaraan"},{"k":"予","on":"ヨ","kun":"-","m":"sebelumnya","w":"予定","wr":"よてい","wm":"rencana"},{"k":"争","on":"ソウ","kun":"あらそ(う)","m":"bersaing","w":"戦争","wr":"せんそう","wm":"perang"},{"k":"互","on":"ゴ","kun":"たが(い)","m":"saling","w":"お互い","wr":"おたがい","wm":"satu sama lain"},{ ,"n":"V-る うえで = dalam hal ….","x":"「たうえで」 berarti \"setelah melakukan A (sebagai dasar), baru B\". A adalah langkah yang harus diselesaikan dulu sebelum mengambil keputusan.\nContoh: 「よく考えたうえで決めます」. Pola 「V-るうえで」 berarti \"dalam hal / untuk ...\": 「生活するうえで大切なこと」."},{"c":"Waktu & proses","p":"～際(に)","a":"pada saat (formal)","f":"V-る / V-た / N の + さいに","ex":"お降りの際は、お忘れ物のないようご注意ください。","rd":"おおりの さいは、おわすれものの ない よう ごちゅうい ください。","id":"Saat turun, mohon pastikan tidak ada barang tertinggal.","n":"Sering di pengumuman.","x":"「際に」 berarti \"pada saat\", lebih formal daripada 〜時に. Sering muncul di pengumuman, panduan, dan surat resmi.\nContoh: 「お降りの際は、足元にご注意ください」."},{"c":"Waktu & proses","p":"～かと思うと","a":"baru saja … langsung","f":"V-た + かと おもうと","ex":"空が暗くなったかと思うと、急に雨が降り出した。","rd":"そらが くらく なったかと おもうと、きゅうに あめが ふりだした。","id":"Baru saja langit gelap, tiba-tiba hujan turun.","n":"Untuk orang lain/kejadian, bukan diri sendiri.","x":"「かと思うと」 berarti \"baru saja A, langsung B\", untuk perubahan cepat yang mengejutkan.\nDipakai untuk orang lain atau kejadian, bukan perbuatan diri sendiri. Versi lain: 「〜かと思ったら」."},{"c":"Waktu & proses","p":"～て以来","a":"sejak","f":"V-て + いらい","ex":"日本に来て以来、一度も国に帰っていない。","rd":"にほんに きて いらい、いちども くにに かえって いない。","id":"Sejak datang ke Jepang, saya belum sekali pun pulang.","n":"","x":"「て以来」 berarti \"sejak A, keadaan B terus berlanjut sampai sekarang\".\nKalimat belakang menyatakan keadaan yang berlangsung lama, bukan kejadian sekali. Contoh: 「日本に来て以来、ずっとこの町に住んでいる」."},{"c":"Waktu & proses","p":"～に先立って","a":"sebelum (resmi)","f":"N / V-る + に さきだって","ex":"開会に先立って、社長があいさつした。","rd":"かいかいに さきだって、しゃちょうが あいさつした。","id":"Sebelum pembukaan, direktur memberi sambutan.","n":"","x":"「に先立って」 berarti \"sebelum\" sesuatu yang resmi atau penting, seperti upacara, rapat, atau peluncuran.\nKalimat belakang adalah persiapan untuk acara itu: 「開会に先立って、市長があいさつした」."},{"c":"Waktu & proses","p":"～をきっかけに","a":"berawal dari","f":"N + を きっかけに","ex":"留学をきっかけに、料理を始めた。","rd":"りゅうがくを きっかけに、り engirim email ke manajer","Menyelesaikan rekap survei","Membuat bahan rapat sendiri"],"e":"まず僕に見せて = tunjukkan ke saya dulu."},{"s":"Poin (ポイント理解)","q":"女：最近、自転車通勤を始めたんですって？\n男：ええ。健康のためと思われがちなんですが、実は満員電車がどうしても苦手で。運動になるのはおまけみたいなものです。","c":"Apa alasan utama pria itu bersepeda ke kantor?","o":["Tidak tahan kereta yang penuh sesak","Demi kesehatan","Menghemat ongkos","Lebih cepat sampai"],"e":"実は = alasan sebenarnya. Kesehatan hanya \"bonus\"."},{"s":"Tanggapan cepat (即時応答)","q":"「お忙しいところ恐縮ですが、少々お時間よろしいでしょうか。」","c":"Jawaban yang tepat?","o":["ええ、どうぞ。何でしょうか","はい、忙しいところです","いいえ、恐縮しません","お時間をください"],"e":"Mempersilakan lawan bicara menyampaikan maksud."}],"Kosakata":[{"s":"Bacaan kanji","q":"新しい 取引先と 契約を 結んだ。","c":"Cara baca 契約?","o":["けいやく","けやく","けいあく","きやく"],"e":"契約 = kontrak."},{"s":"Bacaan kanji","q":"その 件は 社内で 検討します。","c":"Cara baca 検討?","o":["けんとう","けんど","けいとう","けんたう"],"e":"検討 = mempertimbangkan."},{"s":"Bacaan kanji","q":"まず 現状を 把握する ことが 大切だ。","c":"Cara baca 把握?","o":["はあく","はおく","ばあく","ひあく"],"e":"把握 = memahami situasi."}],"Tata bahasa":[{"s":"","q":"両親と 相談した（　）、決めます。","c":"","o":["うえで","あまり","ものの","ばかりに"],"e":"Setelah (sebagai dasar): V-た うえで."},{"s":"","q":"約束した（　）、守らなければ ならない。","c":"","o":["以上","反面","ものの","どころか"],"e":"Karena sudah: 以上."},{"s":"","q":"緊張の（　）、何も 話せなかった。","c":"","o":["あまり","うえで","ばかり","かぎり"],"e":"Karena terlalu: N の あまり."}],"Membaca":[{"s":"Email bisnis","q":"件名：打ち合わせ日程の変更について\n株式会社ABC 田中様\nいつもお世話になっております。NLシステムの佐藤です。\n来週15日（火）に予定しておりました打ち合わせですが、弊社の都合により、17日（木）の同じ時間に変更させていただけないでしょうか。\nご都合が悪い場合は、ご希望の日時をお知らせください。\nお手数をおかけしますが、よろしくお願いいたします。","c":"Apa tujuan email ini?","o":["Meminta jadwal rapat dipindah ke tanggal 17","Membatalkan rapat","Mengundang rapat baru","Meminta maaf karena terlambat"],"e":"変更させていただけないでしょうか = meminta izin mengubah jadwal."},{"s":"Email bisnis","q":"(email yang sama)\nJika Tanaka tidak bisa tanggal 17, apa yang diminta?","c":"","o":["Memberi tahu tanggal dan jam yang diinginkan","Tetap datang tanggal 15","Menelepon Sato","Membatalkan kontrak"],"e":"ご希望の日時をお知らせください."},{"s":"Opini","q":"最近、在宅勤務が広がっている。通勤時間がなくなり、自由な時間が増えるという利点がある反面、同僚と直接話す機会が減り、孤独を感じる人も少なくない。大切なのは、働き方を一つに決めることではなく、仕事の内容に応じて選べるようにすることだろう。","c":"Menurut penulis, yang penting adalah …","o":["bisa memilih cara kerja sesuai jenis pekerjaan","semua orang bekerja dari rumah","semua orang kembali ke kantor","mengurangi jam kerja"],"e":"仕事の内容に応じて選べるようにすること."}]},"ch":[{"t":"課題理解","i":"会社で女の人と男の人が話しています。男の人はこのあと何をしますか。","d":[["女","吉田さん、来週のプレゼンの資料、見せてもらったけど、内容はいいと思う。ただ、グラフが多すぎて、ポイントが伝わりにくいかな。"],["男","そうですか。じゃあ、グラフを減らします。"],["女","減らすっていうより、一番伝えたいデータを一つ選んで、大きく見せたらどう？あと、最後のまとめのページは今のままでいいよ。"],["男","わかりました。じゃあ、そこを直してから、もう一度見ていただけますか。"]],"q":"男の人はこのあと何をしますか。","o":["伝えたいデータを選んでグラフを大きくする","グラフを全部削除する","まとめのページを書き直す","プレゼンの練習をする"],"e":"減らすっていうより = bukan sekadar mengurangi, tapi pilih satu data dan tampilkan besar."},{"t":"課題理解","i":"大学で事務の人と学生が話しています。学生はこのあと何をしなければなりませんか。","d":[["学生","奨学金の申請をしたいんですが。"],["事務","申請書と成績証明書が必要です。それから、推薦状も要りますね。"],["学生","成績証明書は持ってきました。推薦状は先生にお願いしてあって、明日いただける予定です。"],["事務","では、申請書はこちらで書いていってください。推薦状は締め切りの金曜日までに出してもらえれば大丈夫です。"]],"q":"学生はこのあと何をしなければなりませんか。","o":["ここで申請書を書く","成績証明書を取りに行く","先生に推薦状をお願いする","金曜日にもう一度来て申請書を書く"],"e":"こちらで書いていって = tulis di sini sebelum pergi."}],"exam":[[["Kosakata, tata bahasa & membaca",105],["Mendengarkan",50]],90,"13"],"preview":true,"cnt":{"g":101,"k":368,"v":52,"q":36}},"N1":{"lv":"N1","jp":"えぬいち","cefr":"≈ C1","stats":[["±2.000","kanji"],["±10.000","kosakata"],["±220","pola bunpou"],["+12–18 bulan","setelah N2"]],"fokus":"Teks abstrak dan opini, bahasa tulis formal, pola klasik (や否や・ゆえに・べく), ungkapan perasaan yang kuat (禁じ得ない・極まりない), idiom, dan kosakata akademik. Bacaan panjang dengan waktu ketat.","tips":[["Baca dalam jumlah besar","N1 menuntut kecepatan membaca teks abstrak. Targetkan 1 editorial koran (社説) atau esai per hari."],["Pelajari nuansa, bukan arti","や否や / なり / が早いか artinya mirip, bedanya di pemakaian. Catat contoh asli untuk setiap pola."],["Kosakata akademik","Kata seperti 懸念, 是正, 妥協 jarang dipakai lisan tapi sering di soal. Buat kartu SRS dari bacaan sendiri."],["Idiom dan onomatope","Soal kosakata N1 sering memakai idiom (顔が広い, 気が置けない). Pahami arti sebenarnya, banyak yang menjebak."],["Choukai panjang","Latih mendengarkan diskusi 3–4 menit: podcast berita, ceramah, debat. Catat poin setiap pembicara."],["Tryout lebih awal","Mulai tryout penuh 3 bulan sebelum ujian. Manajemen waktu bagian bahasa & membaca (110 menit) adalah kunci."]],"weeks":[["Waktu","や否や, が早いか, なり, そばから, を皮切りに"],["Batas & lingkup","に至るまで, をもって, ともなると, を限りに"],["Sebab","ゆえに, とあって, ばこそ, ではあるまいし"],["Penilaian","までもない, に足る, に堪えない, てやまない"],["Perasaan kuat","を禁じ得ない, 極まりない, の至り, ずにはおかない"],["Kontras","とはいえ, といえども, ものを, をよそに"],["Penekanan","はおろか, すら, たりとも, にもまして"],["Tujuan & cara","べく, んがため, かたがた, がてら"],["Kesan & kecenderungan","ずくめ, まみれ, きらいがある, といったらない"],["Kosakata akademik","100 kata abstrak + idiom"],["Membaca intensif","Editorial dan esai panjang setiap hari"],["Tryout","3 kali tryout penuh dengan timer"]],"g":[{"c":"Waktu","p":"～や否や","a":"begitu … langsung","f":"V-る + やいなや","ex":"ベルが鳴るや否や、生徒たちは教室を飛び出した。","rd":"","id":"Begitu bel berbunyi, para murid langsung berlarian keluar kelas.","n":"Bahasa tulis.","x":"「や否や」 berarti \"begitu A, langsung B\", untuk dua kejadian yang hampir bersamaan. Ini bahasa tulis dan formal.\nKalimat belakang tidak boleh berupa kehendak atau perintah. Versi singkat: 「〜や」."},{"c":"Waktu","p":"～が早いか","a":"begitu … (secepat kilat)","f":"V-る / V-た + が はやいか","ex":"彼は家に着くが早いか、ベッドに倒れ込んだ。","rd":"","id":"Begitu sampai rumah, dia langsung menjatuhkan diri ke kasur.","n":"","x":"「が早いか」 berarti \"begitu A, secepat kilat B\". Menekankan kecepatan perbuatan seseorang.\nContoh: 「ベルが鳴るが早いか、生徒たちは教室を飛び出した」. Subjeknya biasanya orang ketiga."},{"c":"Waktu","p":"～なり","a":"begitu … lalu (tak terduga)","f":"V-る + なり","ex":"母は私の顔を見るなり、泣き出した。","rd":"","id":"Begitu melihat wajah saya, ibu langsung menangis.","n":"Subjek orang ketiga.","x":"「なり」 berarti \"begitu A, lalu (t <script>
{

await NL.ready;if(!NL.user||!NL.has('n'))return EMBED[lv]?DATA[lv]=EMBED[lv]:{locked:true,lv};

<div class="gl">${L.map(g=>{const i=d.g.indexOf(g);return `<article class="gc${ok.has(i)?' ok':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="pt">${esc(g.p)}</span><span class="ct">${esc(g.c)}</span></div><b>${esc(g.a)}</b><div class="fx">${esc(g.f)}</div><div class="ex"><div class="j">${esc(g.ex)}</div>${g.rd?`<div class="r">${esc(g.rd)}</div>`:''}<div class="i">${esc(g.id)}</div></div>${g.n?`<div class="nt">${esc(g.n)}</div>`:''}${g.x?`<details class="gx" data-gx="${i}"><summary>📖 Penjelasan</summary><div class="xb">${xfmt(g.x)}</div></details>`:''}<div class="gbt"><button class="mk" data-i="${i}">${ok.has(i)?'✓ Paham':'Tandai paham'}</button><button class="say" data-say="${i}" aria-label="Dengarkan penjelasan"><span class="ic">🔊</span><span class="eq"><i></i><i></i><i></i></span> Dengar</button></div></article>`}).join('')||'<p class="empty">Pola tidak ditemukan.</p>'}</div>`;

function flash(d,type){const items=type==='k'?d.k.map(k=>({f:k.k,big:1,b:[['Arti',k.m],['On',k.on],['Kun',k.kun],['Kata',k.w+'（'+k.wr+'）'],['',k.wm]]})):Object.entries(d.v).flatMap(([t,a])=>a.map(v=>({f:v[1]||v[0],sub:v[1]?v[0]:'',b:[['Arti',v[2]],['Tema',t]]})));
const SK=type==='k'?'k2':type,PS=type==='k'?40:60,NP=Math.ceil(items.length/PS);
const known=kn(d.lv,SK);let pk=0,q='';const inPk=i=>NP<2||Math.floor(i/PS)===pk;
const firstOpen=()=>{for(let p=0;p<NP;p++){for(let i=p*PS;i<Math.min(items.length,(p+1)*PS);i++)if(!known.has(i))return p}return 0};pk=firstOpen();
const mkQ=()=>items.map((x,i)=>i).filter(i=>inPk(i)&&!known.has(i));let queue=mkQ(),cur=queue[0]??0,flipped=false,mode='kartu';
const pkDone=p=>{let n=0;for(let i=p*PS;i<Math.min(items.length,(p+1)*PS);i++)if(known.has(i))n++;return n};
const draw=()=>{const it=items[cur];const done=known.size;const lo=pk*PS,hi=Math.min(items.length,lo+PS);
const packs=NP>1?`<div style="margin-top:10px"><label class="note" for="pks" style="margin-right:6px">Paket</label><select id="pks" class="chip" style="padding:6px 10px">${Array.from({length:NP},(_,p)=>{const a=p*PS,b=Math.min(items.length,a+PS),dn=pkDone(p);return `<option value="${p}"${p===pk?' selected':''}>${p+1}. ${a+1}–${b}${dn===b-a?' ✓':dn?' ('+dn+'/'+(b-a)+')':''}</option>`}).join('')}</select> <span class="note">Paket ini: ${pkDone(pk)}/${hi-lo} hafal</span></div>`:'';
const list=items.map((x,i)=>[x,i]).filter(([x,i])=>q?(x.f.includes(q)||x.b.some(y=>String(y[1]).toLowerCase().includes(q.toLowerCase()))):inPk(i));
$('#lc').innerHTML=`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>Hafal ${done} dari ${items.length} ${type==='k'?'kanji':'kata'}</b><div class="bar" style="margin:0"><button class="chip" aria-pressed="${mode==='kartu'}" data-m="kartu">Mode kartu</button><button class="chip" aria-pressed="${mode==='daftar'}" data-m="daftar">Daftar</button>${type==='k'?`<button class="chip" aria-pressed="${mode==='tulis'}" data-m="tulis">✍ Cara menulis</button>`:''}</div></div><div class="prog" style="margin-top:8px"><i style="width:${done/items.length*100}%"></i></div>${packs}${type==='k'?`<div class="bar" style="margin-top:10px"><button class="btn" data-kz="1">Kuis paket ini (bacaan & arti)</button></div>`:''}</div>
${mode==='tulis'?`<div class="card"><p class="mut" style="margin:0 0 10px">Ketuk kanji untuk melihat urutan goresan dan latihan menulis.</p><div class="kgrid">${items.map((x,i)=>[x,i]).filter(([x,i])=>inPk(i)).map(([x])=>`<button class="kk" data-so="${esc(x.f)}" title="${esc(x.b[0][1])}">${esc(x.f)}</button>`).join('')}</div></div>`:mode==='kartu'?(queue.length?`<div class="fcwrap"><div><div class="flip${flipped?' on':''}" id="fl" role="button" tabindex="0" aria-label="Balik kartu"><div class="fin"><div class="face"><div class="${it.big?'big':'mid'}">${esc(it.f)}</div>${it.sub?`<div class="jp mut" style="font-size:20px">${esc(it.sub)}</div>`:''}<p class="note" style="margin-top:14px">Ingat artinya, lalu ketuk untuk membalik</p></div><div class="face b"><div class="mid" style="font-size:40px">${esc(it.f)}</div><dl>${it.b.filter(x=>x[1]&&x[1]!=='-').map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>${type==='k'?`<button class="btn wbtn" data-so="${esc(it.f)}">✍ Cara menulis</button>`:''}</div></div></div>
<div class="bar" style="justify-content:center;margin-top:14px"><button class="btn r" data-a="lagi">Ulangi nanti</button><button class="btn g" data-a="hafal">Sudah hafal</button></div><p class="note" style="text-align:center">Sisa ${queue.length} kartu di paket ini. Kartu "ulangi" muncul lagi setelah beberapa kartu.</p></div>
<div class="card"><h3>Cara belajar paling efektif</h3><ul style="padding-left:1.1em;margin:0;font-size:15px"><li>Satu paket (${PS}) per hari, jangan semua sekaligus.</li><li>Jawab dulu dalam hati, baru balik.</li><li>Jujur: kalau ragu, pilih "Ulangi nanti".</li><li>Hafalkan kanji lewat contoh katanya, bukan bacaannya saja.</li></ul></div></div>`:`<div class="card empty"><h3>Paket ini sudah hafal semua!</h3><p>${pk+1<NP?`<button class="btn" data-nx="1">Lanjut ke paket ${pk+2}</button>`:'Ulangi dari mode daftar atau pindah ke latihan.'}</p></div>`):
`<input id="fq" type="search" placeholder="Cari ${type==='k'?'kanji, bacaan, atau arti':'kata atau arti'}…" value="${esc(q)}" style="width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:inherit;font:inherit;margin-bottom:12px">
${q&&!list.length?'<p class="empty">Tidak ditemukan.</p>':''}<div class="${type==='k'?'kgrid':'vg'}">${list.map(([x,i])=>type==='k'?`<button class="kk${known.has(i)?' ok':''}" data-t="${i}" title="${esc(x.b[0][1])}">${esc(x.f)}</button>`:`<button class="vc" data-t="${i}" style="text-align:left;${known.has(i)?'border-color:var(--grn)':''}"><div class="w">${esc(x.f)}</div>${x.sub?`<div class="kj">${esc(x.sub)}</div>`:''}<div style="font-size:15px">${esc(x.b[0][1])}</div></button>`).join('')}</div>${type==='k'&&q&&list.length&&list.length<=12?`<div class="vg" style="margin-top:12px">${list.map(([x])=>`<div class="vc"><div class="w">${esc(x.f)} <span style="font-size:15px">${esc(x.b[0][1])}</span></div><div class="kj">${esc(x.b[1][1])} · ${esc(x.b[2][1])}</div><div style="font-size:15px">${esc(x.b[3][1])} = ${esc(x.b[4][1])}</div><button class="btn wbtn" data-so="${esc(x.f)}">✍ Cara menulis</button></div>`).join('')}</div>`:''}<p class="note">Ketuk untuk menandai hafal / belum.</p>`}`;

$('#lc').onclick=e=>{const m=e.target.closest('[data-m]');if(m){mode=m.dataset.m;draw();return}
if(e.target.closest('[data-kz]')){const ks=d.k.slice(pk*PS,pk*PS+PS),all=d.k;const mk=()=>pick(ks,Math.min(15,ks.length)).map((k,j)=>j%2?{s:'Arti kanji',q:k.k,big:1,c:'Apa arti kanji ini?',o:[k.m,...pick([...new Set(all.filter(x=>x.m!==k.m).map(x=>x.m))],3)],e:k.k+' = '+k.m+' · '+k.w+'（'+k.wr+'）'+k.wm}:{s:'Bacaan kanji',q:k.w,big:1,c:'Cara membacanya?',o:[k.wr,...pick([...new Set(all.filter(x=>x.wr!==k.wr).map(x=>x.wr))],3)],e:k.w+' = '+k.wr+' ('+k.wm+')'});startQuiz(d,mk(),d.lv+':kp:'+pk,'Kuis kanji '+d.lv+' paket '+(pk+1),'字',mk,false,true);return}

const t=e.target.closest('[data-t]');if(t){const i=+t.dataset.t;known.has(i)?known.delete(i):known.add(i);setKn(d.lv,SK,known);queue=mkQ();cur=queue[0];draw()}};

  const cv=m.querySelector('canvas'),ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1f2340';
  let down=false,last=null;const pt=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=ev=>{down=true;last=pt(ev);cv.setPointerCapture(ev.pointerId)};
  cv.onpointermove=ev=>{if(!down)return;const p=pt(ev);ctx.strokeStyle=getComputedStyle(cv).color||ink;ctx.lineWidth=26;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  m.querySelector('#soclr').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
