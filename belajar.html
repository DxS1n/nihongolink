<script type="module">
// === Firebase: sama dengan landing page (proyek nihongolinku) ===
const firebaseConfig = {
  apiKey: "AIzaSyCwybJW2-YuHgoXe0v24pZ-qBPQnd0X30E",
  authDomain: "nihongolinku.firebaseapp.com",
  projectId: "nihongolinku",
  storageBucket: "nihongolinku.firebasestorage.app",
  messagingSenderId: "678792923912",
  appId: "1:678792923912:web:9595de63e963dda468babd",
  measurementId: "G-HKQH0LHLLL"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, arrayUnion, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = initializeFirestore(fbApp, { experimentalForceLongPolling: true });
const T = (p, ms = 15000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout: koneksi database terlalu lama")), ms))]);

const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
const errMap = { "auth/popup-closed-by-user": "Jendela login ditutup sebelum selesai.", "auth/network-request-failed": "Koneksi internet bermasalah. Coba lagi.", "auth/unauthorized-domain": "Domain ini belum didaftarkan di Firebase (Authentication → Settings → Authorized domains)." };
NL.inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Twitter|Snapchat/i.test(navigator.userAgent || "");
NL.err = e => errMap[e && e.code] || "Login gagal. Coba lagi.";
NL.login = async () => {
  try { return await signInWithPopup(auth, provider); }
  catch (e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider); throw e; }
};

// ===== Batas 2 perangkat (sama dengan landing page) =====
const MAX_DEV = 2;
let devId = null; try { devId = localStorage.getItem("lk_dev"); } catch {}
if (!devId) { devId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); try { localStorage.setItem("lk_dev", devId); } catch {} }
const regKey = uid => "lk_reg_" + uid;
const label = () => { const ua = navigator.userAgent || ""; const os = /iPhone|iPad|iPod/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "Mac" : "Perangkat lain"; const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser"; return `${os} · ${br}`; };
async function registerDevice(user) {
  const ref = doc(db, "users", user.uid, "devices", devId), snap = await getDoc(ref);
  let reg = false; try { reg = localStorage.getItem(regKey(user.uid)) === devId; } catch {}
  if (!snap.exists() && reg) return false;
  if (!snap.exists()) {
    await setDoc(ref, { label: label(), createdAt: serverTimestamp(), lastSeen: serverTimestamp() });
    await setDoc(doc(collection(db, "users", user.uid, "deviceLog")), { label: label(), at: serverTimestamp() });
    try { localStorage.setItem(regKey(user.uid), devId); } catch {}
  } else await updateDoc(ref, { lastSeen: serverTimestamp() });
  const all = await getDocs(collection(db, "users", user.uid, "devices"));
  const others = all.docs.filter(d => d.id !== devId).map(d => ({ id: d.id, t: d.data().lastSeen && d.data().lastSeen.toMillis ? d.data().lastSeen.toMillis() : 0 })).sort((a, b) => b.t - a.t);
  for (const d of others.slice(MAX_DEV - 1)) await deleteDoc(doc(db, "users", user.uid, "devices", d.id));
  return true;
}
async function kicked() { const u = auth.currentUser; if (u) { try { localStorage.removeItem(regKey(u.uid)); } catch {} } await signOut(auth); }
NL.checkDevice = async () => {
  const u = auth.currentUser; if (!u) return true;
  try { const s = await T(getDoc(doc(db, "users", u.uid, "devices", devId)), 10000); if (s.exists()) return true; await kicked(); return false; } catch { return true; }
};
NL.logout = async () => {
  const u = auth.currentUser;
  if (u) { try { await deleteDoc(doc(db, "users", u.uid, "devices", devId)); } catch {} try { localStorage.removeItem(regKey(u.uid)); } catch {} }
  await signOut(auth);
};
NL.content = async (prog, key) => { const s = await T(getDoc(doc(db, "content", prog, "items", key)), 20000); return s.exists() ? s.data().data : null; };
setInterval(() => { if (auth.currentUser && !document.hidden) NL.checkDevice().then(ok => { if (!ok) location.reload(); }); }, 60000);

async function ensureProfile(user) {
  const ref = doc(db, "users", user.uid), snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { name: user.displayName || "", email: user.email, photoURL: user.photoURL || "", brands: ["belajar"], createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
    return (await getDoc(ref)).data();
  }
  await updateDoc(ref, { lastLogin: serverTimestamp(), brands: arrayUnion("belajar") });
  return snap.data();
}

getRedirectResult(auth).catch(() => {});
let first = true;
onAuthStateChanged(auth, async user => {
  let profile = null;
  if (user) {
    try { profile = await T(ensureProfile(user)); } catch (e) { console.error(e); }
    try { if (!(await T(registerDevice(user)))) { NL.kickedMsg = true; await kicked(); return; } } catch (e) { console.error(e); }
  }
  NL.user = user; NL.access = (profile && profile.access) || {}; NL.failed = false;
  NL.acct(); NL.wm();
  if (NL._r) { NL._r(); NL._r = null; }
  if (!first && NL.onChange) NL.onChange();
  first = false;
});
